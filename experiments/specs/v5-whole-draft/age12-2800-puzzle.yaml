narrative_family: puzzle_problem_solving
reading_mode: INDEPENDENT_READER
relative_length_class: STANDARD
protagonist: "Nora, age 12, methodical, imaginative, and willing to revise her ideas"
setting: "A local science museum preparing a public workshop, with exhibit rooms, a printed activity schedule, wall clocks, staff notes, and ordinary office supplies."
theme: "A good explanation must fit all the evidence, not just the first clue."
premise: "While helping prepare for a museum workshop, Nora notices that the printed activity schedule and the room clocks would send visitors to two demonstrations at the wrong times. She investigates whether the clocks, the schedule, or a recent room change caused the mismatch and develops a correction before the workshop opens."
constraints:
  - "Use age-appropriate vocabulary and reasoning for a capable 12-year-old without making Nora an implausible expert."
  - "No combat, supernatural powers, or dangerous crisis."
  - "The final solution must rely on at least three clues established earlier."
  - "Include at least one plausible hypothesis that is later rejected by evidence."
  - "Keep cause and effect explicit enough that a careful reader can reconstruct the solution."
  - "An adult may authorize the correction but must not discover the solution for Nora."
  - "Preserve continuity across the complete story and the Narrative Architect's chosen SceneGraph."
