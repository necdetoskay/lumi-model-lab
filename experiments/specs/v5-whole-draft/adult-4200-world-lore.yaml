title_hint: "The Archive of Tidal Marks"
age_min: 30
age_max: 45
language: en
target_words: 4200
narrative_family: world_lore_discovery
reading_mode: ADULT
relative_length_class: STANDARD
protagonist: "Ada, age 34, a civic archivist who is careful with evidence and skeptical of convenient explanations"
setting: "A coastal town archive, an old harbor district, public tide markers, maintenance logs, historic maps, and a municipal planning room."
theme: "Reliable history is built by reconciling records with the physical world."
premise: "Ada finds that a set of historic harbor maps, modern tide markers, and maintenance records disagree about when a narrow quay was raised. The discrepancy matters because a new public-history exhibit is about to present a simplified but possibly wrong account. Ada investigates the conflicting evidence and must decide what the exhibit can responsibly claim."
constraints:
  - "Use mature but clear prose and realistic institutional reasoning."
  - "No combat, supernatural explanation, or melodramatic danger."
  - "The resolution must reconcile multiple independent evidence sources rather than depend on one decisive document."
  - "Include at least two plausible competing interpretations and show why one is better supported without pretending uncertainty disappears completely."
  - "Do not make a supervisor or outside expert solve the central problem for Ada."
  - "Preserve a bounded unresolved historical uncertainty in the ending."
  - "Preserve continuity across the complete story and the Narrative Architect's chosen SceneGraph."
