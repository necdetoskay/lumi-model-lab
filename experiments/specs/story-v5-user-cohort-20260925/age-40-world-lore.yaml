title_hint: The Story Behind the Marker
age_min: 40
age_max: 40
language: en
target_words: 4200
narrative_family: world_lore_discovery
reading_mode: INDEPENDENT_READER
relative_length_class: STANDARD
protagonist: Deniz, age 40, whose judgment, independence, vocabulary, social context, and responsibilities must be plausible for that exact age
setting: A local archive, public landmark, oral-history collection, old map room, and present-day neighborhood connected to the same place.
theme: Understanding a world requires comparing evidence, memory, and incomplete stories.
premise: 'Deniz investigates why a familiar landmark is described differently in an old map, a recorded memory, and a present-day inscription. The sources partly agree and partly conflict. Deniz must distinguish observation from interpretation, build the most defensible account, and preserve what remains uncertain instead of forcing a single perfect answer.

  '
constraints:
- Match vocabulary, sentence structure, emotional intensity, exposition, pacing, and concept complexity to the exact target age and reading mode.
- Keep causality explicit enough for the target reader without becoming didactic.
- No combat; resolve tension through observation, communication, reasoning, exploration, or cooperation.
- Preserve continuity across all six scenes.
- Do not mention that the story is a benchmark or test.
- Use at least three distinct sources of lore or historical evidence.
- At least two sources must disagree in a meaningful but plausible way.
- The story must distinguish what is known, inferred, remembered, and still uncertain.
- Avoid an exposition dump or omniscient narrator resolving every ambiguity.
- The ending must open one evidence-based question for future exploration.
- The intended reader is exactly age 40; reading mode is INDEPENDENT_READER; do not write for a younger or older audience.
