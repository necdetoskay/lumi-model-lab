schema_version: model-runtime-profile.v1
provider: openrouter

generic:
  display_name: Generic OpenRouter Model
  source: generic
  expose_in_settings: false
  match:
    type: fallback
  transport:
    structured_output: strict_json_schema
    reasoning:
      mode: provider_default
    temperature:
      mode: send
    max_tokens:
      mode: send
    seed:
      mode: send

profiles:
  - model_id: aion-labs/aion-3.0-mini
    display_name: Aion 3.0 Mini
    source: verified_runtime
    expose_in_settings: true
    notes:
      - Reasoning is mandatory on the current OpenRouter endpoint and must remain provider-managed.
      - Structured JSON uses json_object rather than strict json_schema.
      - Large structured generations omit max_tokens so the provider/model technical limit is authoritative.
    transport:
      structured_output: json_object
      reasoning:
        mode: provider_managed_required
      temperature:
        mode: send
      max_tokens:
        mode: send
      seed:
        mode: omit
    request_overrides:
      structured_small:
        max_tokens:
          mode: send
          cap: 1200
      structured_large:
        max_tokens:
          mode: omit

  - model_id: aion-labs/aion-3.0
    display_name: Aion 3.0
    source: lab_verified
    expose_in_settings: true
    notes:
      - Historical Model Lab runs require reasoning enabled on OpenRouter.
    transport:
      structured_output: json_object
      reasoning:
        mode: provider_managed_required
        request:
          enabled: true
      temperature:
        mode: send
      max_tokens:
        mode: send
      seed:
        mode: omit

  - model_id: openai/gpt-5.6-luna
    display_name: GPT-5.6 Luna
    source: application_contract
    expose_in_settings: true
    transport:
      structured_output: strict_json_schema
      reasoning:
        mode: client_configurable
      temperature:
        mode: omit
      max_tokens:
        mode: send
      seed:
        mode: send
      provider_routing:
        order: [openai]
        allow_fallbacks: false
        require_parameters: true
        sort: latency

  - model_id: openai/gpt-5.6-luna-pro
    display_name: GPT-5.6 Luna Pro
    source: application_contract
    expose_in_settings: false
    transport:
      structured_output: strict_json_schema
      reasoning:
        mode: client_configurable
      temperature:
        mode: omit
      max_tokens:
        mode: send
      seed:
        mode: send
      provider_routing:
        order: [openai]
        allow_fallbacks: false
        require_parameters: true
        sort: latency

  - model_id: z-ai/glm-5.3-flash
    display_name: GLM 5.3 Flash
    source: lab_verified
    expose_in_settings: true
    notes:
      - Reasoning remains enabled with low effort so visible generation retains budget.
    transport:
      structured_output: strict_json_schema
      reasoning:
        mode: provider_managed_required
        request:
          enabled: true
          effort: low
          exclude: true
      temperature:
        mode: send
      max_tokens:
        mode: send
        value: 10000
      seed:
        mode: send

