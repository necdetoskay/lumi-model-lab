  - model_id: anthropic/claude-haiku-4.5
    display_name: Claude Haiku 4.5
    source: verified_runtime
    expose_in_settings: true
    judge:
      ready: true
      evidence: openrouter_model_page_and_api_docs
    metadata:
      verified_at: '2026-09-23'
      provider_model_slug: anthropic/claude-haiku-4.5
      release_date: '2025-10-15'
      context_tokens: 200000
      max_output_tokens: 64000
      modalities:
        input: [text, image]
        output: [text]
      pricing_usd_per_million_tokens:
        input: 1.0
        output: 5.0
        cache_read: 0.10
      capabilities:
        structured_output: true
        reasoning: true
      sources:
        - https://openrouter.ai/anthropic/claude-haiku-4.5
        - https://openrouter.ai/anthropic/claude-haiku-4.5/api
        - https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
    notes:
      - Judge workloads use non-reasoning mode; the rubric is explicit and deterministic scoring is preferred over extended thinking.
      - JSON object output is retained for compatibility with the canonical story_judge_v0.2 parser.
      - Standard OpenRouter routing remains enabled so healthy Anthropic-compatible providers can fail over.
    transport:
      structured_output: json_object
      reasoning:
        mode: provider_default
      temperature:
        mode: send
      max_tokens:
        mode: send
      seed:
        mode: omit
      stream:
        mode: omit
    request_overrides:
      judge:
        reasoning:
          mode: provider_managed_required
          request:
            effort: none
            exclude: true
        temperature:
          mode: send
        max_tokens:
          mode: send
          cap: 2500
        seed:
          mode: omit
        stream:
          mode: omit
      scene_plan_judge:
        reasoning:
          mode: provider_managed_required
          request:
            effort: none
            exclude: true
        structured_output: json_object
        temperature:
          mode: send
        max_tokens:
          mode: send
          cap: 1800
        seed:
          mode: omit
        stream:
          mode: omit

  - model_id: qwen/qwen3.8-flash
    display_name: Qwen 3.8 Flash
    source: verified_runtime
    expose_in_settings: true
    qualification:
      ready: true
      evidence: provider_and_upstream_docs
    metadata:
      verified_at: '2026-09-23'
      provider_model_slug: qwen/qwen3.8-flash
      upstream_service_model: qwen3.8-flash
      release_date: '2026-08-26'
      context_tokens: 1000000
      max_input_tokens: 991000
      max_output_tokens: 131072
      max_reasoning_tokens: 262144
      modalities:
        input: [text, image, video]
        output: [text]
      pricing_usd_per_million_tokens:
        input: 0.15
        output: 0.47
        cache_read: 0.016
        cache_create_5m: 0.20
      capabilities:
        structured_output: true
        tool_calling: true
        reasoning: true
      reasoning:
        default_effort: xhigh
        supported_effort: [low, medium, xhigh]
        low_budget_tokens: 4096
        medium_budget_tokens: 16384
      sources:
        - https://openrouter.ai/qwen/qwen3.8-flash
        - https://www.qwencloud.com/models/qwen3.8-flash
        - https://docs.qwencloud.com/api-reference/chat/openai-chat
    notes:
      - Thinking is enabled by default and xhigh is the provider default; never qualify this model with provider-default reasoning under an unbounded story workload.
      - OpenRouter exposes the canonical reasoning parameter for this model and documents effort=none as the cross-model way to disable thinking.
      - LUMI teacher-story generation disables reasoning, keeps a bounded visible-output budget, and streams the response so long stories do not depend on a single buffered completion.
      - Other request classes retain the model/provider defaults unless they define their own override.
      - OpenRouter exposes structured outputs and tool calling for this exact model slug.
    transport:
      structured_output: strict_json_schema
      reasoning:
        mode: provider_default
      temperature:
        mode: omit
      max_tokens:
        mode: omit
      seed:
        mode: omit
      stream:
        mode: omit
    request_overrides:
      teacher_story:
        reasoning:
          mode: provider_managed_required
          request:
            effort: none
            exclude: true
        temperature:
          mode: send
        max_tokens:
          mode: send
          cap: 7000
        seed:
          mode: send
        stream:
          mode: send
          value: true
      story_plan:
        reasoning:
          mode: provider_managed_required
          request:
            effort: none
            exclude: true
        structured_output: json_object
        temperature:
          mode: send
        max_tokens:
          mode: send
          cap: 5000
        seed:
          mode: send
        stream:
          mode: omit
      scene_story:
        reasoning:
          mode: provider_managed_required
          request:
            effort: none
            exclude: true
        structured_output: json_object
        temperature:
          mode: send
        max_tokens:
          mode: send
          cap: 2200
        seed:
          mode: send
        stream:
          mode: omit
      scene_repair:
        reasoning:
          mode: provider_managed_required
          request:
            effort: none
            exclude: true
        structured_output: json_object
        temperature:
          mode: send
        max_tokens:
          mode: send
          cap: 2200
        seed:
          mode: send
        stream:
          mode: omit

