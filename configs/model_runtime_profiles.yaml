schema_version: model-runtime-profile.v2
provider: openrouter

generic:
  display_name: Generic OpenRouter Model
  source: generic
  expose_in_settings: false
  match:
    type: fallback
  transport:
    structured_output: strict_json_schema
    reasoning:
      mode: provider_default
    temperature:
      mode: send
    max_tokens:
      mode: send
    seed:
      mode: send

profiles:
  - model_id: aion-labs/aion-3.0-mini
    display_name: Aion 3.0 Mini
    source: verified_runtime
    expose_in_settings: true
    notes:
      - Reasoning is mandatory on the current OpenRouter endpoint and must remain provider-managed.
      - Structured JSON uses json_object rather than strict json_schema.
      - Large structured generations omit max_tokens so the provider/model technical limit is authoritative.
    transport:
      structured_output: json_object
      reasoning:
        mode: provider_managed_required
      temperature:
        mode: send
      max_tokens:
        mode: send
      seed:
        mode: omit
    production_policy:
      request_classes:
        structured_small:
          max_tokens:
            mode: send
            cap: 1200
        structured_large:
          max_tokens:
            mode: omit

  - model_id: aion-labs/aion-3.0
    display_name: Aion 3.0
    source: verified_runtime
    expose_in_settings: true
    qualification:
      ready: true
      evidence: openrouter_model_and_endpoint_metadata_plus_historical_lab_runs
    metadata:
      verified_at: '2026-09-23'
      provider_model_slug: aion-labs/aion-3.0
      release_date: '2026-07-07'
      context_tokens: 131072
      max_output_tokens: 32768
      modalities:
        input: [text]
        output: [text]
      pricing_usd_per_million_tokens:
        input: 3.00
        output: 6.00
        cache_read: 0.75
      capabilities:
        structured_output: json_object
        tool_calling: true
        reasoning: true
      supported_parameters:
        - reasoning
        - include_reasoning
        - max_tokens
        - temperature
        - top_p
        - response_format
        - tools
        - tool_choice
      sources:
        - https://openrouter.ai/aion-labs/aion-3.0
        - https://openrouter.ai/api/v1/models/aion-labs/aion-3.0/endpoints
    notes:
      - Historical LUMI Model Lab runs require reasoning enabled for this model on OpenRouter.
      - OpenRouter currently exposes json_object response formatting rather than JSON-schema enforcement for Aion 3.0.
      - The current endpoint does not advertise seed support; seed must be omitted.
      - English scene generators omit client max_tokens so local scene targets and deterministic gates control narrative length.
    transport:
      structured_output: json_object
      reasoning:
        mode: provider_managed_required
        request:
          enabled: true
          exclude: true
      temperature:
        mode: send
      max_tokens:
        mode: send
      seed:
        mode: omit
      stream:
        mode: omit
    production_policy:
      request_classes:
        story_plan:
          structured_output: json_object
          reasoning:
            mode: provider_managed_required
            request:
              enabled: true
              exclude: true
          temperature:
            mode: send
          max_tokens:
            mode: omit
          seed:
            mode: omit
          stream:
            mode: omit
        scene_story:
          structured_output: json_object
          reasoning:
            mode: provider_managed_required
            request:
              enabled: true
              exclude: true
          temperature:
            mode: send
          max_tokens:
            mode: omit
          seed:
            mode: omit
          stream:
            mode: omit
        scene_repair:
          structured_output: json_object
          reasoning:
            mode: provider_managed_required
            request:
