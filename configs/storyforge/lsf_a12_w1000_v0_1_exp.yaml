schema_version: lumi-storyforge-profile.v1
profile_id: LSF-A12-W1000-v0.1-exp
status: experimental_age12_cost_quality_probe
risk_class: L2_MODEL_LAB_ONLY

qualification_scope:
  exact_age: 12
  target_words: 1000
  preferred_word_range: [900, 1100]
  hard_word_range: [750, 1250]
  generation_language: en
  delivery_language: tr
  experimental_story_families:
    - problem_solving_small_adventure

context_builder:
  profile_id: LSF-A12-W1000-context-builder-v0.1-exp
  decision_engine:
    model: typesafe/jev-1.13
    auto_select_threshold: 0.45
    review_threshold: 0.30
    review_sent_to_planner: false
  policies:
    cross_world_isolation: deterministic
    privacy_internal_metadata_filter: deterministic
    knowledge_boundary_guard: deterministic
    unrelated_relationship_expansion: review_only

spine_planner:
  model: aion-labs/aion-3.5-mini
  output:
    premise: required
    beats: 8
    density_labels: [brief, develop, anchor]
    fact_references: required
    assumptions: required
    proposed_story_outcome: required
  rules:
    prewritten_solution_supplied: false
    prewritten_spine_supplied: false
    durable_canon_invention: forbidden
    state_commit_authority: none
  validator:
    model: anthropic/claude-sonnet-5
    deterministic_schema_gate: true
    semantic_serious_critical_gate: true

writer:
  model: aion-labs/aion-3.5-mini
  authority: validated_spine_only
  creative_freedom:
    transient_dialogue: allowed
    playful_sounds: allowed
    gestures: allowed
    temporary_sensory_detail: allowed
    temporary_drawings_or_play: allowed
  forbidden_without_context_authority:
    durable_object_attributes: true
    durable_relationship_history: true
    new_owned_inventory: true
    new_family_canon: true
    new_world_facts: true

semantic_qa:
  primary:
    model: anthropic/claude-sonnet-5
  secondary:
    model: openai/gpt-5.6-sol
  blocker_severity: [serious, critical]
  accepted_severity_aliases:
    major: serious
  severity_alias_evidence: raw_and_normalized_required
  defect_protocol:
    - locate_exact_span
    - classify_local_structural_replan
    - bounded_minimal_repair
    - same_defect_recheck
    - full_regression_recheck
  clean_story_rewrite_allowed: false

repair:
  policy: bounded_only
  default_model: openai/gpt-5.6-sol
  whole_story_rewrite_for_local_defect: false

translation:
  model: google/gemini-3.8-flash
  source_authority: accepted_english_master
  creative_rewrite: forbidden

translation_fidelity:
  model: openai/gpt-5.6-luna
  scope: narrow_en_tr_semantic_fidelity
  broad_story_quality_authority: false

output_contract:
  story_artifact:
    accepted_english_master: required
    turkish_delivery_story: required
    provenance: required
    cost_latency_evidence: required

promotion_limits:
  production_ready: false
  reason:
    - age12 profile is experimental only
    - no age12 qualification cohort exists yet
    - this run measures cost, length adherence, and narrative-level shift only
