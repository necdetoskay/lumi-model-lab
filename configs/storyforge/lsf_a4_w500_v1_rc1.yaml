schema_version: lumi-storyforge-profile.v1
profile_id: LSF-A4-W500-v1.0-rc1
status: release_candidate
risk_class: L2_MODEL_LAB_ONLY

qualification_scope:
  exact_age: 4
  target_words: 500
  preferred_word_range: [475, 525]
  hard_word_range: [375, 625]
  generation_language: en
  delivery_language: tr
  qualified_story_families:
    - discovery_curiosity
    - friendship_emotional_social
    - everyday_fantastical_discovery
    - problem_solving_small_adventure
    - exploration_mystery

input_contract:
  required:
    - canon_snapshot
    - character_story_state_snapshot
    - story_intent
    - generation_profile
  mutable_inputs: false
  direct_state_mutation_allowed: false

context_builder:
  profile_id: LSF-A4-W500-context-builder-v0.1
  architecture:
    always_required: deterministic
    story_intent_direct_fact_refs: deterministic
    hard_guards: deterministic
    forbidden_filter: deterministic_pre_jev
    soft_enrichment: jev_probability_with_policy
  decision_engine:
    model: typesafe/jev-1.13
    auto_select_threshold: 0.45
    review_threshold: 0.30
    review_sent_to_planner: false
  policies:
    cross_world_isolation: deterministic
    privacy_internal_metadata_filter: deterministic
    knowledge_boundary_guard: deterministic
    unrelated_relationship_expansion: review_only
  evidence_runs:
    - 36265275665

spine_planner:
  model: aion-labs/aion-3.5-mini
  output:
    premise: required
    beats: 8
    density_labels: [brief, develop, anchor]
    fact_references: required
    assumptions: required
    proposed_story_outcome: required
  rules:
    prewritten_solution_supplied: false
    prewritten_spine_supplied: false
    durable_canon_invention: forbidden
    state_commit_authority: none
  validator:
    model: anthropic/claude-sonnet-5
    deterministic_schema_gate: true
    semantic_serious_critical_gate: true
  qualification_runs:
    problem_solving:
      initial: 36265511557
      bounded_repair_continuation: 36265828541
      verdict: PASS
    exploration_mystery:
      run: 36266444475
      verdict: PASS
    friendship_social:
      run: 36267204822
      verdict: PASS

writer:
  model: aion-labs/aion-3.5-mini
  authority: validated_spine_only
  creative_freedom:
    transient_dialogue: allowed
    playful_sounds: allowed
    gestures: allowed
    temporary_sensory_detail: allowed
    temporary_drawings_or_play: allowed
  forbidden_without_context_authority:
    durable_object_attributes: true
    durable_relationship_history: true
    new_owned_inventory: true
    new_family_canon: true
    new_world_facts: true

semantic_qa:
  primary:
    model: anthropic/claude-sonnet-5
  secondary:
    model: openai/gpt-5.6-sol
  blocker_severity: [serious, critical]
  defect_protocol:
    - locate_exact_span
    - classify_local_structural_replan
    - bounded_minimal_repair
    - same_defect_recheck
    - full_regression_recheck
  clean_story_rewrite_allowed: false

repair:
  policy: bounded_only
  default_model: openai/gpt-5.6-sol
  whole_story_rewrite_for_local_defect: false

translation:
  model: google/gemini-3.8-flash
  source_authority: accepted_english_master
  creative_rewrite: forbidden

translation_fidelity:
  model: openai/gpt-5.6-luna
  scope: narrow_en_tr_semantic_fidelity
  broad_story_quality_authority: false

output_contract:
  story_artifact:
    accepted_english_master: required
    turkish_delivery_story: required
    provenance: required
    cost_latency_evidence: required
  proposed_story_outcome:
    status: proposal_only
    commit_authority: external_lumi_services

promotion_evidence:
  context_builder:
    - 36265275665
  planner:
    - 36265511557
    - 36265828541
    - 36266444475
    - 36267204822
  writer_family_qualification:
    - 36261732338
    - 36262206452
    - 36263169905
  known_human_review:
    discovery_curiosity: strong
    friendship_emotional_social: strong
    everyday_fantastical_discovery: strong_with_minor_readaloud_surface_note
    problem_solving_small_adventure: strong
    planner_problem_solving_final: strong

promotion_limits:
  production_ready: false
  reason:
    - release_candidate packaging not yet exercised as one single callable agent entrypoint
    - Project_LUMI runtime integration requires separate L3 change
    - state commit remains outside StoryForge
