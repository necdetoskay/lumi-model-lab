name: model_qualification_v1
registry_path: runs/model_registry/registry.json
leaderboard_path: runs/model_registry/leaderboard.json
qualification_root: runs/qualifications

benchmark_config: configs/teacher_benchmark.yaml
generation_config: configs/generation.yaml
evaluation_config: configs/evaluation.yaml
source_dataset_config: configs/source_dataset.yaml
extraction_config: configs/extraction.yaml
curation_config: configs/curation.yaml
prepare_training_config: configs/prepare_training.yaml

screen_gates:
  min_technical_pass_rate: 0.80
  min_judge_accept_rate: 0.80
  min_average_judge_score: 4.00
  max_critical_failures: 0

full_gates:
  required_accepted_source_stories: 5
  required_ready_examples: 55
  require_zero_review: true
  require_zero_reject: true

fingerprint_files:
  - prompts/story_teacher.md
  - prompts/story_judge.md
  - prompts/example_extractor.md
  - configs/teacher_benchmark.yaml
  - configs/generation.yaml
  - configs/evaluation.yaml
  - configs/source_dataset.yaml
  - configs/extraction.yaml
  - configs/curation.yaml
  - configs/prepare_training.yaml
