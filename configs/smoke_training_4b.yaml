name: qwen35_4b_4060_smoke
model: Qwen/Qwen3.5-4B
dataset_path: data/processed/milestone1_train.jsonl
dataset_manifest: runs/training_dataset/manifest.json

seed: 42
max_seq_length: 6144
load_in_4bit: true

max_examples: 1
exclude_example_types: []

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_steps: 1
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  warmup_steps: 0
  logging_steps: 1
  optim: adamw_8bit
  weight_decay: 0.01
  lr_scheduler_type: linear
  report_to: none

output_dir: adapters/qwen35_4b_4060_smoke
run_manifest: runs/smoke_training/qwen35_4b_4060.json
