schema_version: qualification-wave.v2
status: ACTIVE
wave_id: age-relative-standard-v3-all-families

description: >
  Full fixture-backed age-relative STANDARD qualification wave covering every
  canonical NarrativeAgeTier and all ten canonical NarrativeFamilies. The
  original three v2 family fixtures remain semantically unchanged so historical
  evidence continues to map to the same governed cells.

generator_model: openai/gpt-5.6-luna
continuity_evaluator_model: typesafe/jev-1.13
semantic_judge_model: anthropic/claude-haiku-4.5
language: en
max_parallel: 4

age_cases:
  EARLY_CHILD:
    exact_age: 4
    reading_mode: READ_ALOUD
    relative_length_class: STANDARD
    target_words: 500
  CHILD:
    exact_age: 7
    reading_mode: EARLY_READER
    relative_length_class: STANDARD
    target_words: 1500
  MIDDLE_CHILD:
    exact_age: 10
    reading_mode: INDEPENDENT_READER
    relative_length_class: STANDARD
    target_words: 2800
  TEEN:
    exact_age: 15
    reading_mode: INDEPENDENT_READER
    relative_length_class: STANDARD
    target_words: 3800
  YOUNG_ADULT:
    exact_age: 21
    reading_mode: INDEPENDENT_READER
    relative_length_class: STANDARD
    target_words: 4200
  ADULT:
    exact_age: 32
    reading_mode: INDEPENDENT_READER
    relative_length_class: STANDARD
    target_words: 4200
  MATURE_ADULT:
    exact_age: 50
    reading_mode: INDEPENDENT_READER
    relative_length_class: STANDARD
    target_words: 4200
  SENIOR:
    exact_age: 70
    reading_mode: INDEPENDENT_READER
    relative_length_class: STANDARD
    target_words: 4200

global_constraints:
  - Match vocabulary, sentence structure, emotional intensity, exposition, pacing, and concept complexity to the exact target age and reading mode.
  - Keep causality explicit enough for the target reader without becoming didactic.
  - No combat; resolve tension through observation, communication, reasoning, exploration, or cooperation.
  - Preserve continuity across all six scenes.
  - Do not mention that the story is a benchmark or test.

families:
  exploration_mystery:
    title_hint: The Quiet Signal
    setting: A contemporary coastal town with a library, public garden, workshop, and old observation point.
    theme: Careful observation can turn uncertainty into understanding.
    premise: >
      Deniz notices a repeating signal in an ordinary place. Each clue changes
      what the signal might mean. Deniz must test assumptions, connect evidence,
      and make a careful final choice without a convenient coincidence.
    constraints:
      - The central mystery must remain open until the later scenes.
      - Every important clue must be observable before it is used.
      - The ending must explain the signal through evidence rather than luck.

  friendship_social_problem:
    title_hint: The Shared Plan
    setting: A community center, neighborhood notice board, small workshop, and nearby public square.
    theme: Good friendship requires listening, perspective-taking, and concrete collaboration.
    premise: >
      Deniz and a friend are preparing a shared community project, but each
      interprets the same situation differently and begins changing the plan
      without fully understanding the other's reasons. Deniz must notice the
      mismatch, gather context, listen carefully, and build a revised plan that
      uses both people's contributions.
    constraints:
      - Neither character may be framed as the villain or as simply wrong.
      - The disagreement must have believable evidence on both sides.
      - Resolution must require a concrete shared action beyond apologizing.
      - At least one decision must change because Deniz genuinely understands the other perspective.
      - Do not end with a direct moral lesson.

  puzzle_problem_solving:
    title_hint: The Missing Pattern
    setting: A public learning space containing maps, objects, schedules, labels, and ordinary tools.
    theme: Good solutions come from testing patterns instead of guessing.
    premise: >
      Deniz encounters a layered practical puzzle with several plausible
      explanations. Each solved step reveals information needed for the next
      one, and the final answer changes what Deniz chooses to do.
    constraints:
      - No clue may depend on information the reader has not yet been given.
      - Include at least one reasonable false hypothesis that is later rejected by evidence.
      - The final solution must use multiple earlier clues.

  nature_environment:
    title_hint: The Change by the Water
    setting: A neighborhood wetland and community garden with paths, shallow water, plants, insects, birds, and a small observation shelter.
    theme: Environmental understanding grows from repeated observation and low-impact stewardship.
    premise: >
      Deniz notices that a familiar part of the wetland is changing. Several
      possible causes seem plausible, including weather, water flow, human
      activity, and seasonal change. Deniz must compare observations over time,
      separate correlation from cause, and choose a careful action that helps
      without disturbing the ecosystem.
    constraints:
      - Do not reduce the environmental change to one obvious cause immediately.
      - Use at least three observable ecological clues before the conclusion.
      - The final action must be low-impact and proportionate to the evidence.
      - Avoid catastrophe, fear-based environmental messaging, and simplistic slogans.
      - Nature must not behave as if it exists only to teach the protagonist a lesson.

  scientific_curiosity:
    title_hint: The Unexpected Result
    setting: A public science room with simple instruments, a weather station, a makerspace bench, and safe materials for observation.
    theme: Scientific understanding improves when hypotheses are tested and revised.
    premise: >
      Deniz observes a repeatable result that does not fit the first
      explanation. Deniz must form more than one hypothesis, design safe tests,
      compare the results, notice a confounding factor, and revise the
      explanation without treating uncertainty as failure.
    constraints:
      - The phenomenon must have a non-magical mechanism that can be reasoned about from evidence.
      - Include at least two plausible hypotheses and one controlled comparison.
      - Deniz must revise or reject an initial explanation after new evidence.
      - The final explanation must match the target reader's age without becoming technically false.
      - Do not use an expert character to simply reveal the answer.

  adventure_journey:
    title_hint: Beyond the Cloud Bridge
    setting: A chain of floating islands, windmills, sheltered stations, and cloud bridges that appear only under predictable conditions.
    theme: Courage works best with preparation, observation, and flexible planning.
    premise: >
      Deniz needs to deliver a message capsule to a neighboring island. The
      route depends on bridge timing, changing wind, limited supplies, and a
      choice between two plausible paths. Deniz must prepare, adapt when one
      assumption changes, and finish the journey without ignoring risk.
    constraints:
      - Fantasy elements must follow stable internal rules.
      - Deniz must not rush into danger without thinking.
      - At least one plan must change for an understandable, previously signaled reason.
      - The problem must not be solved by one powerful spell or sudden rescue.
      - The ending must leave a new point of curiosity about the wider world.

  emotional_development:
    title_hint: The Space Between Words
    setting: A contemporary community space where Deniz regularly meets people they know well.
    theme: Feelings become easier to handle when they are named, tested against evidence, and communicated clearly.
    premise: >
      A small misunderstanding changes how Deniz interprets another person's
      behavior. Deniz must notice their own reaction, gather context, communicate
      without accusation, and repair trust in a way appropriate to the target age.
    constraints:
      - Avoid a simplistic moral lecture.
      - The misunderstanding must have believable evidence on both sides.
      - Emotional resolution must require a concrete conversation or action.

  cooperation_teamwork:
    title_hint: The Project with Missing Pieces
    setting: A shared workshop and community event space with limited materials, schedules, roles, and several interdependent tasks.
    theme: Strong teamwork depends on coordination, complementary strengths, and visible shared responsibility.
    premise: >
      Deniz joins a small team building something useful for a community event.
      The first plan fails because tasks were assigned without noticing key
      dependencies. The team must identify what each person knows, reorganize
      responsibilities, communicate progress, and finish through coordinated
      work rather than one person's rescue.
    constraints:
      - No single character may solve the whole problem alone.
      - At least three task dependencies must matter to the final solution.
      - The team must revise roles after discovering why the first coordination plan failed.
      - Disagreement must be resolved through communication and evidence, not authority.
      - The ending must show shared ownership of the result.

  everyday_fantastical_discovery:
    title_hint: The Ordinary Door That Wasn't
    setting: An otherwise ordinary neighborhood with a shop, transit stop, courtyard, and one subtle fantastical feature that follows consistent rules.
    theme: Wonder becomes meaningful when ordinary choices still matter.
    premise: >
      Deniz notices a small impossible detail in an everyday routine. The
      fantastical effect appears only under specific repeatable conditions and
      cannot directly solve Deniz's ordinary problem. By testing the rules and
      deciding how much to reveal, Deniz must balance curiosity with a normal
      social responsibility.
    constraints:
      - The fantastical element must obey a stable, discoverable rule.
      - Magic must not erase consequences or solve the ordinary problem automatically.
      - At least two ordinary details must become relevant to understanding the fantastical rule.
      - The emotional or social decision must still require human judgment.
      - Preserve a sense of wonder without turning the ending into a deus ex machina.

  world_lore_discovery:
    title_hint: The Story Behind the Marker
    setting: A local archive, public landmark, oral-history collection, old map room, and present-day neighborhood connected to the same place.
    theme: Understanding a world requires comparing evidence, memory, and incomplete stories.
    premise: >
      Deniz investigates why a familiar landmark is described differently in
      an old map, a recorded memory, and a present-day inscription. The sources
      partly agree and partly conflict. Deniz must distinguish observation from
      interpretation, build the most defensible account, and preserve what
      remains uncertain instead of forcing a single perfect answer.
    constraints:
      - Use at least three distinct sources of lore or historical evidence.
      - At least two sources must disagree in a meaningful but plausible way.
      - The story must distinguish what is known, inferred, remembered, and still uncertain.
      - Avoid an exposition dump or omniscient narrator resolving every ambiguity.
      - The ending must open one evidence-based question for future exploration.
