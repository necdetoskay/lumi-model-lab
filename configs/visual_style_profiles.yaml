schema_version: visual-style-registry.v1
profiles:
  - schema: visual-style-profile.v1
    id: lumi-storybook-soft
    version: 1.0.0
    display_name: Soft Storybook
    status: ACTIVE
    base_style_directives:
      - high-quality children's book illustration
      - soft detailed rendering
      - warm approachable shapes
      - rich but readable environmental detail
      - coherent recurring character design
    color_policy: {saturation: MODERATE, contrast: SOFT, temperature: WARM}
    lighting_policy:
      preferred: [soft daylight, gentle golden light, soft volumetric light]
      avoid: [harsh horror lighting, aggressive neon lighting]
    global_negative_directives:
      - hyper-realistic skin texture
      - horror atmosphere
      - cyberpunk neon palette
      - gratuitous visual clutter
    category_overrides:
      CHARACTER_PORTRAIT: [clean readable silhouette, gentle facial rendering]
      CHARACTER_SCENE: [clear narrative action, readable foreground-midground-background]
      INVENTORY_CARD: [storybook object rendering, minimal decorative texture]
      MAP_ART: [hand-illustrated storybook cartography]

  - schema: visual-style-profile.v1
    id: lumi-cinematic-adventure
    version: 1.0.0
    display_name: Cinematic Adventure
    status: ACTIVE
    base_style_directives:
      - cinematic animated adventure illustration
      - strong depth and environmental storytelling
      - expressive but natural character acting
      - polished feature-animation visual language
    color_policy: {saturation: MODERATE, contrast: MEDIUM, temperature: WARM}
    lighting_policy:
      preferred: [cinematic key light, natural rim light, atmospheric depth]
      avoid: [flat front lighting, horror chiaroscuro]
    global_negative_directives:
      - grimdark horror mood
      - photographic skin pores
      - random lens effects
      - oversaturated neon
    category_overrides:
      CHARACTER_SCENE: [cinematic blocking, clear action focal point]
      WORLD_KEY_ART: [epic scale cues, layered atmospheric perspective]
      COVER_ART: [strong hero composition, title-safe negative space]

  - schema: visual-style-profile.v1
    id: lumi-painted-fantasy
    version: 1.0.0
    display_name: Painted Fantasy
    status: ACTIVE
    base_style_directives:
      - painterly fantasy illustration
      - visible controlled brushwork
      - story-rich materials and surfaces
      - elegant natural color transitions
    color_policy: {saturation: MODERATE, contrast: SOFT, temperature: WARM}
    lighting_policy:
      preferred: [painted ambient light, soft directional light]
      avoid: [plastic 3D shine, hard photographic flash]
    global_negative_directives:
      - plastic toy surface
      - sterile vector look
      - photographic camera artifacts
    category_overrides:
      ENVIRONMENT: [landscape-painting depth, atmospheric edges]
      WORLD_KEY_ART: [grand painterly panorama]
      ITEM: [painted material study]

  - schema: visual-style-profile.v1
    id: lumi-soft-3d
    version: 1.0.0
    display_name: Soft 3D
    status: ACTIVE
    base_style_directives:
      - premium soft 3D animated-film rendering
      - stylized proportions
      - tactile materials
      - soft global illumination
      - consistent character model
    color_policy: {saturation: MODERATE, contrast: SOFT, temperature: WARM}
    lighting_policy:
      preferred: [soft studio bounce, warm environmental light]
      avoid: [uncanny photorealism, harsh specular clipping]
    global_negative_directives:
      - uncanny realistic skin
      - waxy face
      - cheap plastic material
      - extreme depth-of-field blur
    category_overrides:
      CHARACTER_PORTRAIT: [clean character-model presentation]
      INVENTORY_CARD: [single-object soft 3D asset render]

  - schema: visual-style-profile.v1
    id: lumi-watercolor
    version: 1.0.0
    display_name: Watercolor
    status: ACTIVE
    base_style_directives:
      - refined watercolor children's illustration
      - translucent pigment washes
      - subtle paper texture
      - controlled soft edges
      - expressive economical detail
    color_policy: {saturation: SOFT, contrast: SOFT, temperature: WARM}
    lighting_policy:
      preferred: [suggested natural light, luminous paper whites]
      avoid: [hard CGI light, glossy reflections]
    global_negative_directives:
      - digital plastic rendering
      - photorealistic texture
      - muddy uncontrolled colors
    category_overrides:
      CHARACTER_PORTRAIT: [delicate facial washes, crisp identity accents]
      ENVIRONMENT: [layered atmospheric washes]
      MAP_ART: [watercolor map symbols, readable ink accents]
