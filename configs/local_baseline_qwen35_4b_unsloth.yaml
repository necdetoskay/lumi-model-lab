name: qwen35_4b_unsloth_prefinetune_baseline_v1
model: unsloth/Qwen3.5-4B
benchmark_config: configs/teacher_benchmark.yaml
output_dir: runs/model_baseline/pre_finetune_qwen35_4b_unsloth
prompt_version: local_story_benchmark_v0.1
generation_version: local_unsloth_generation_v0.3
load_in_4bit: true
max_seq_length: 4096
max_new_tokens: 5200
generation:
  enable_thinking: false
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
seed: 42
technical_gate:
  min_word_ratio: 0.80
  max_word_ratio: 1.20
