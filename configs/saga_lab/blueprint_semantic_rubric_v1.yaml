rubric_id: saga_blueprint_semantic_rubric_v1
rubric_version: "1"
risk_class: L2
purpose: >
  Reference semantic evaluation for blueprints that have already passed the
  deterministic static validator. Semantic scoring cannot override a hard finding.
hard_gate_precondition:
  allowed_static_status:
    - PASS
    - NEEDS_REVIEW
  forbidden_static_status:
    - FAIL
  semantic_cannot_override_hard_failure: true
score_scale:
  min: 0
  max: 4
  levels:
    "0": materially broken or contradicts the dimension
    "1": weak, narrow, or repeatedly artificial
    "2": mixed/usable with significant repair
    "3": strong with minor limitations
    "4": exceptional and robust across plausible future paths
dimensions:
  - id: origin_coherence
    question: Does Origin form a coherent past without covertly pre-writing the future?
    critical: false
  - id: identity_depth
    question: Do drives, tensions, fears and identity anchors create durable character pressure without forcing choices?
    critical: false
  - id: thread_diversity
    question: Do Saga threads provide meaningfully different long-horizon possibilities rather than paraphrased variants?
    critical: false
  - id: seed_diversity
    question: Do breadcrumbs use varied and plausible world entry points rather than one repeated mechanism?
    critical: false
  - id: branch_optionality
    question: Can the character ignore, defer, redirect, or approach threads through multiple valid paths?
    critical: true
  - id: world_integration_quality
    question: Do Saga elements feel native to the world and compatible with reuse-first binding?
    critical: false
  - id: reveal_ceiling_clarity
    question: Are reveal ceilings precise enough to prevent premature secret disclosure in downstream stories?
    critical: true
  - id: dormancy_recovery_potential
    question: Can threads remain dormant for many stories and later reconnect naturally without retcon or exposition dumps?
    critical: true
  - id: long_horizon_potential
    question: Does the blueprint provide durable narrative potential without behaving like a fixed quest chain?
    critical: true
reference_policy:
  primary: strong_llm_judge
  blind_sample: true
  final_truth: human_reference_when_available
  no_single_aggregate_score_as_authority: true
promotion_rule:
  hard_validator_must_not_be_fail: true
  semantic_result_is_evidence_not_commit_authority: true
