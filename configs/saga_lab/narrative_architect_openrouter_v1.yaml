profile_path: configs/saga_lab/narrative_architect_v1.yaml
fixture_manifest_path: data/specifications/saga_lab/character_world_fixtures_v1.json
prompt_path: prompts/saga_narrative_architect_v1.md
output_root: runs/saga_lab/narrative_architect

provider:
  type: openrouter
  identity:
    provider_runtime: openrouter
  model_env: SAGA_ARCHITECT_MODEL

request:
  temperature: 0.35
  max_tokens: 16000
  timeout_seconds: 240
  max_retries: 1
  seed: 17
  reasoning:
    enabled: true
    effort: high
    exclude: true
  response_format_json_object: false
