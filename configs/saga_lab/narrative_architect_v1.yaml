role_id: narrative-architect
profile_version: "1"
risk_class: L2
purpose: >
  Generate a long-horizon Character Narrative Blueprint at character-creation time
  without pre-writing future story order or committing future character choices.
non_goals:
  - normal_story_generation
  - saga_runtime_state_mutation
  - production_canon_commit
  - world_entity_creation
  - jev_authority
input_fixture_manifest: data/specifications/saga_lab/character_world_fixtures_v1.json
output_schema: data/specifications/saga_lab/character_narrative_blueprint_v1.schema.json
prompt_contract: character_narrative_blueprint_generation@1
quick_fixture_ids:
  - young_child_forest_explorer
  - young_adult_orbital_engineer
  - mature_adult_dormant_archivist
full_fixture_ids:
  - young_child_forest_explorer
  - older_child_coastal_mystery
  - teen_urban_relationship
  - young_adult_orbital_engineer
  - mature_adult_field_archaeologist
  - adult_small_town_relationship
  - adult_high_fantasy_cartographer
  - adult_robot_world_linguist
  - child_dinosaur_discovery
  - teen_historical_low_magic
  - adult_cross_region_medic
  - mature_adult_dormant_archivist
deterministic_gates:
  - strict_schema
  - unique_stable_keys
  - valid_cross_references
  - no_fixed_story_sequence
  - no_mandatory_future_choice
  - reveal_policy_present
  - reuse_first_world_binding
  - fixture_profile_integrity
semantic_metrics:
  - origin_coherence
  - identity_depth
  - thread_diversity
  - seed_diversity
  - branch_optionality
  - world_integration_quality
  - reveal_ceiling_clarity
  - dormancy_recovery_potential
  - long_horizon_potential
reference_policy:
  deterministic_first: true
  semantic_reference: strong_llm_judge
  blind_review_sample: true
fingerprint_inputs:
  - role_id
  - profile_version
  - prompt_contract
  - output_schema_sha256
  - fixture_manifest_sha256
  - candidate_model_provider_identity
  - generation_options
  - reference_policy
cost_latency_capture:
  - input_tokens
  - output_tokens
  - total_tokens
  - provider_cost_usd
  - latency_ms
  - retries
  - provider_errors
