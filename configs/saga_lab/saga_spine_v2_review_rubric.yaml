schema_version: saga-spine-v2-review-rubric.v1
purpose: human_and_assistant_creative_qualification
verdicts:
  - APPROVE
  - REVISE
  - REJECT

principles:
  - exact_age_fit_is_not_vocabulary_difficulty
  - premise_quality_precedes_prose_quality
  - roleplay_and_world_immersion_are_product_requirements
  - long_horizon_structure_must_not_be_a_disguised_episode_list
  - user_future_choices_must_remain_open
  - ordinary_daily_life_is_allowed_when_intentional_but_must_not_be_the_default_ceiling
  - darker_or_more_violent_content_is_not_required_for_maturity
  - complexity_should_come_from_world_story_choices_and_consequences_not_jargon

dimensions:
  premise_maturity:
    question: Is the core Saga premise substantively appropriate and compelling for the exact age, independent of vocabulary?
    inspect:
      - central_goal
      - central_mystery
      - conflict_or_pressure
      - conceptual_depth
      - childishness_risk
  imaginative_reward:
    question: Does the Saga offer experiences, places, discoveries or possibilities that feel larger than ordinary daily life?
    inspect:
      - wonder
      - novelty
      - exploration
      - discovery
      - memorable_images_or_concepts
  roleplay_immersion:
    question: Can the reader inhabit the character and world rather than merely observe events?
    inspect:
      - meaningful_character_role
      - actionable_identity
      - world_reactivity
      - persistent_relationship_potential
  agency:
    question: Are important future choices genuinely open, with more than one credible route?
    inspect:
      - alternative_routes
      - no_forced_choice
      - no_fixed_episode_sequence
      - optional_side_arcs
      - saga_dormancy
  stakes_and_consequences:
    question: Do actions and discoveries matter without relying on artificial danger?
    inspect:
      - personal_stakes
      - relationship_stakes
      - world_stakes
      - consequence_variety
      - escalation_room
  mystery_and_reveal:
    question: Is there enough unanswered structure to sustain curiosity without pre-solving the living universe?
    inspect:
      - central_mystery
      - fixed_hidden_truths
      - unresolved_by_design_truths
      - reveal_ladder
      - reveal_ceiling
  milestone_quality:
    question: Are milestones meaningful state changes rather than scenes, errands or renamed repetitions?
    inspect:
      - state_change_value
      - route_flexibility
      - narrative_significance
      - milestone_distinctness
      - filler_risk
  progression_shape:
    question: Does the graph create meaningful progression without becoming linear?
    inspect:
      - anchor_distinctness
      - alternative_routes
      - convergence
      - reachability
      - resolution_path
  world_integration:
    question: Does the Saga grow naturally from the supplied world instead of feeling pasted onto it?
    inspect:
      - use_of_existing_locations
      - social_context
      - world_pressures
      - world_rules
      - creative_permission_envelope
  generated_continuity_potential:
    question: Can early discoveries, places, NPCs, artifacts and decisions pay off much later?
    inspect:
      - callback_hooks
      - dormant_threads
      - side_saga_intersections
      - consequence_memory
      - reweave_potential
  long_horizon_capacity:
    question: Could the structure support many satisfying Episodes without exhausting the Main Saga quickly?
    inspect:
      - episode_independence
      - saga_free_episode_support
      - thread_variety
      - pacing_headroom
      - resolution_not_rushed
  repetition_risk:
    question: Are too many milestones variations of the same discovery, clue, travel or retrieval pattern?
    inspect:
      - milestone_type_distribution
      - entry_vector_distribution
      - consequence_variety
      - relationship_and_decision_content
  age_12_specific_fit:
    applies_when_exact_age: 12
    question: Would a typical interested 12-year-old plausibly find the premise itself engaging rather than merely understand the language?
    inspect:
      - avoids_preschool_play_premise_by_default
      - supports_multi_step_inference
      - supports_real_choice_or_strategy
      - supports_mystery_or_discovery
      - respects_reader_without_adultifying
      - language_can_be_clear_even_when_story_is_complex

hard_reject_signals:
  - central_premise_is_trivial_and_only_vocabulary_makes_it_seem_older
  - main_saga_is_a_fixed_episode_or_chapter_sequence
  - future_user_choice_is_committed_as_fact
  - hidden_truth_is_leaked_before_reveal_eligibility
  - milestones_are_mostly_filler_or_rephrasings
  - no_materially_different_route_exists
  - resolution_is_effectively_prewritten_as_a_scene
  - world_can_be_swapped_without_materially_changing_the_saga
  - character_is_mostly_a_spectator
  - main_saga_would_be_exhausted_in_only_a_few_ordinary_episodes

review_output:
  assistant:
    required:
      - strengths
      - weaknesses
      - age_fit
      - roleplay_and_immersion
      - wonder_and_discovery
      - agency_and_stakes
      - saga_coherence
      - long_horizon_potential
      - repetition_risk
      - verdict
      - revision_requests_if_any
  human:
    required:
      - verdict
      - comments
      - must_change_items
