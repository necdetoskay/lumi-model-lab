seed: 42

benchmark:
  path: data/benchmark/story_eval.jsonl
  language: tr

metrics:
  - instruction_following
  - coherence
  - character_consistency
  - age_appropriateness
  - creativity
  - style_quality

judge:
  provider: openrouter
  model_env: JUDGE_MODEL
  temperature: 0.0
  max_tokens: 2500
  reasoning:
    effort: low
    exclude: true
  response_format:
    type: json_object
  prompt_version: story_judge_v0.2
  output_dir: runs/judgments
  acceptance_threshold: 4.0
  minimum_criterion_score: 3

comparison:
  baseline_label: base
  finetuned_label: qlora
