schema_version: visual-qualification.v1
name: visual-live-screen-v1
provider_mode: openrouter
evaluator_mode: openrouter
evaluator_model: openai/gpt-5.6-luna

# Screening wave: common capability intersection across all current candidates.
# This does NOT promote a model because runs_per_cell=1 < min_runs=3.
# Use it to detect transport/profile/prompt failures before paying for a full matrix.
models:
  - google/gemini-3.1-flash-image
  - google/gemini-3.1-flash-lite-image
  - bytedance-seed/seedream-4.5
  - openai/gpt-image-2.5-sunburst
  - meta/muse-image

styles:
  - lumi-storybook-soft
  - lumi-cinematic-adventure
  - lumi-painted-fantasy
  - lumi-soft-3d
  - lumi-watercolor

categories:
  - CHARACTER_PORTRAIT
  - CHARACTER_SCENE
  - ENVIRONMENT
  - COVER_ART

runs_per_cell: 1
quality_tier: STANDARD
aspect_ratio: "3:4"

thresholds:
  min_runs: 3
  min_success_rate: 0.95
  min_validation_pass_rate: 0.90
  min_identity_consistency: 0.80
  min_style_consistency: 0.80

fixture:
  character:
    schema: character-visual-profile.v1
    character_id: elara
    version: 1.0.0
    apparent_age: 11
    skin: light wheat
    eyes: amber brown
    hair:
      color: dark chestnut
      length: shoulder length
      texture: slightly wavy
    signature_features:
      - left braid with turquoise bead
      - light freckles
    signature_clothing:
      - moss green explorer jacket
      - off-white linen shirt
      - brown explorer boots
    signature_accessories:
      - brass compass necklace
      - turquoise friendship bracelet
      - canvas backpack with turquoise patch
    must_keep:
      - amber brown eyes
      - dark chestnut slightly wavy hair
      - left braid with turquoise bead
      - moss green explorer jacket
      - brass compass necklace
    soft_flexible:
      - pose
      - minor hair movement
      - lighting

  world:
    schema: world-visual-profile.v1
    world_id: forest-habitat
    version: 1.0.0
    biome: temperate forest
    architecture: weathered stone and timber
    technology_level: low fantasy
    dominant_materials: [stone, wood, brass, linen]
    palette: [moss green, warm earth, aged brass, cream]
    recurring_motifs: [narrow forest paths, moss-covered stones]
    forbidden_visuals: [cars, neon signs, skyscrapers]

  intents:
    CHARACTER_PORTRAIT:
      subject: Elara
      pose: relaxed three-quarter standing pose
      expression: warm, observant, gently curious
      composition: full-body character portrait
      lighting: soft morning light

    CHARACTER_SCENE:
      subject: Elara
      scene_summary: Elara finds a small silver key beside a moss-covered stone
      action: crouching to examine the key without picking it up yet
      environment: quiet forest clearing
      mood: curious and safe
      lighting: soft late-afternoon light after rain
      composition: clear character and clue focal relationship
      required_objects: [small silver key]

    ENVIRONMENT:
      subject: forest commons
      environment: temperate forest clearing with moss-covered stones and a narrow path
      mood: inviting and quietly mysterious
      lighting: warm filtered daylight
      composition: environment establishing shot

    COVER_ART:
      subject: Elara and the silver-key mystery
      scene_summary: Elara notices a silver key near a moss-covered stone
      environment: forest clearing
      mood: curious adventure
      lighting: warm cinematic light
      composition: strong story-cover focal composition
      required_objects: [small silver key]
