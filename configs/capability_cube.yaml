schema_version: capability-cube.v1

# Project_LUMI canonical narrative age tiers. Exact age remains in every run.
narrative_age_tiers:
  EARLY_CHILD: {min_age: 3, max_age: 5}
  CHILD: {min_age: 6, max_age: 8}
  MIDDLE_CHILD: {min_age: 9, max_age: 12}
  TEEN: {min_age: 13, max_age: 17}
  YOUNG_ADULT: {min_age: 18, max_age: 24}
  ADULT: {min_age: 25, max_age: 39}
  MATURE_ADULT: {min_age: 40, max_age: 59}
  SENIOR: {min_age: 60, max_age: 120}

# Qualification grouping only. Exact target_words is always preserved.
length_bands:
  SHORT: {min_words: 300, max_words: 1499}
  STANDARD: {min_words: 1500, max_words: 2499}
  LONG: {min_words: 2500, max_words: 3999}
  EXTENDED: {min_words: 4000, max_words: 5000}

# Reuses the canonical Project_LUMI story-corpus narrative family taxonomy.
narrative_families:
  - exploration_mystery
  - friendship_social_problem
  - puzzle_problem_solving
  - nature_environment
  - scientific_curiosity
  - adventure_journey
  - emotional_development
  - cooperation_teamwork
  - everyday_fantastical_discovery
  - world_lore_discovery

coverage:
  thin_max_runs: 1
  provisional_max_runs: 4
  established_min_runs: 5
