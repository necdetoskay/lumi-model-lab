seed: 42

base_model: Qwen/Qwen3.5-4B
method: qlora
quantization: 4bit
framework: unsloth

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto

training:
  epochs: 2
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 4096
  gradient_checkpointing: true

hardware_target:
  gpu: RTX 4060 Laptop
  vram_gb: 8
