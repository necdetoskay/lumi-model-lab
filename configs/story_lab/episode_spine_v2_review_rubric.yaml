schema_version: episode-spine-v2-review-rubric.v1
purpose: human_and_assistant_pre_writer_gate
verdicts:
  - APPROVE
  - REVISE
  - REJECT

hard_principles:
  - weak_spine_means_replan_not_prose_repair
  - writer_must_not_invent_core_story_logic
  - future_character_choice_remains_open
  - climax_must_use_previously_established_evidence
  - local_payoff_is_required_even_when_saga_continues
  - milestone_completion_is_not_canon_until_story_outcome_commit
  - hidden_truth_and_locked_location_ceilings_are_authoritative
  - age_maturity_is_not_vocabulary_difficulty

dimensions:
  age_maturity:
    inspect:
      - premise_substance
      - causal_depth
      - inference_demand
      - avoids_young_child_structure
  causal_coherence:
    inspect:
      - every_non_opening_beat_has_cause
      - no_future_dependency
      - state_changes_drive_next_beats
      - climax_is_earned
  escalation:
    inspect:
      - pressure_changes_materially
      - attempts_are_not_repetitions
      - constraints_narrow_or_transform_options
      - problem_deepens_before_resolution
  agency:
    inspect:
      - protagonist_actions_matter
      - decision_has_two_or_more_credible_options
      - outcome_not_precommitted
      - adults_do_not_solve_core_problem
  reversal:
    inspect:
      - reinterprets_prior_evidence
      - supported_by_prior_beats
      - changes_strategy_or_understanding
      - not_random_surprise
  climax_payoff:
    inspect:
      - uses_prior_evidence
      - uses_character_skill
      - resolves_local_uncertainty
      - produces_earned_state_change
  world_immersion:
    inspect:
      - world_specific_problem
      - world_rules_matter
      - approved_locations_only
      - role_in_world_is_meaningful
  saga_alignment:
    inspect:
      - intended_milestones_only
      - completion_evidence_explicit
      - no_hidden_truth_leak
      - no_premature_saga_commit
  local_satisfaction:
    inspect:
      - episode_has_own_arc
      - payoff_not_only_forward_hook
      - achievement_or_consequence_is_visible
  writer_executability:
    inspect:
      - central_problem_fixed
      - reversal_fixed
      - decision_pressure_fixed
      - climax_logic_fixed
      - local_payoff_fixed
      - writer_has_room_for_prose_not_core_plot_invention
  repetition_safety:
    inspect:
      - problem_shape_distinct
      - activity_pattern_distinct
      - climax_shape_distinct
      - recent_episode_signature_considered

hard_reject_or_replan_signals:
  - writer_would_need_to_invent_the_reversal
  - writer_would_need_to_invent_the_climax_solution
  - chronology_without_causality
  - repeated_try_fail_try_fail_structure
  - adult_or_npc_solves_the_core_problem
  - decision_is_fake_or_predecided
  - payoff_is_only_a_teaser_for_next_episode
  - hidden_truth_or_locked_location_leak
  - milestone_is_claimed_complete_before_story_outcome
  - premise_is_simplified_below_reader_profile
