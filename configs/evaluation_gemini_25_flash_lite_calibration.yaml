seed: 42

benchmark:
  path: data/benchmark/story_eval.jsonl
  language: tr

metrics:
  - instruction_following
  - coherence
  - character_consistency
  - age_appropriateness
  - creativity
  - style_quality

judge:
  provider: openrouter
  model_env: JUDGE_MODEL
  temperature: 0.0
  max_tokens: 1800
  prompt_version: story_judge_v0.1
  output_dir: runs/judgments/gemini_25_flash_lite_calibration
  acceptance_threshold: 4.0
  minimum_criterion_score: 3

comparison:
  baseline_label: base
  finetuned_label: qlora
