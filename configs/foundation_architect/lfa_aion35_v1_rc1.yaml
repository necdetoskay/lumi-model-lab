schema_version: lumi-foundation-architect-profile.v1
profile_id: LFA-AION35-v1.0-rc1
status: release_candidate
risk_class: L2_MODEL_LAB_ONLY

role:
  name: LUMI Foundation Architect
  purpose: >
    Produce candidate-only Rich Origin, reveal-safe Saga, and downstream
    Pre-Story Life materialization seeds from authoritative onboarding/world input.
  model: aion-labs/aion-3.5

authority:
  can_propose:
    - rich_origin
    - reveal_safe_saga
    - inventory_seed_candidates
    - social_ecology_role_candidates
    - memory_candidates
    - origin_thread_candidates
    - current_situation_candidate_goals_and_concerns
    - opportunity_source_signals
  cannot:
    - assign_database_ids
    - assign_canonical_entity_ids
    - emit_fake_fingerprints
    - commit_foundation
    - commit_saga
    - materialize_inventory
    - materialize_npcs_or_relationships
    - materialize_memories
    - materialize_threads
    - set_prestory_readiness
    - generate_actual_opportunities
    - create_story_intent
    - create_story_contract
    - generate_story_prose
    - mutate_state

provenance:
  every_semantic_candidate_requires:
    - proposal_key
    - exact_source_refs
    - candidate_only_true
  proposal_key:
    canonical: false
    uuid_like: forbidden
  current_situation:
    grounded_now:
      rule: direct_authoritative_input_only
    invented_recent_chronology: forbidden
    candidate_goals: allowed
    candidate_concerns: allowed

knowledge:
  rumored_semantics:
    definition: hearsay_level_awareness_only
    allowed:
      - character_has_heard_of_subject
      - character_wonders_about_subject
      - memory_of_hearing_subject_mentioned
      - rumor_safe_belief_or_question
    forbidden:
      - visited
      - observed_interior_detail
      - confirmed_route
      - confirmed_contents
      - automatic_upgrade_to_discovered_or_explored

saga:
  hidden_or_deep_truth:
    when_not_supplied: must_remain_empty
  reveal_constraints: required
  open_threads:
    must_be_questions_or_tensions: true
    fixed_quest_generation: forbidden

social:
  unnamed_role_candidates: allowed
  invented_person_identity: forbidden
  caregiver_role:
    may_exist_if_supplied: true
    invented_name_or_family_history: forbidden
  npc_reuse_preference: reuse_compatible_existing_npc

opportunity_boundary:
  architect_output: source_signals_only
  actual_opportunity_generation_owner: A4_INITIAL_OPPORTUNITY_V2
  plot_hook_generation: forbidden
  solution_generation: forbidden

lifecycle_depth:
  exact_age_required: true
  child:
    expected:
      - caregiver_and_home_scale
      - age_appropriate_play
      - short_child_scale_memories
      - ordinary_inventory_candidates
      - small_questions_and_observations
  adult:
    expected:
      - multi_stage_lived_history
      - prior_roles_and_responsibilities
      - adult_relationship_role_candidates
      - long_horizon_commitments
      - profession_or_role_provenance_inventory
      - formative_events_with_adult_consequence

qualification:
  age4:
    raw_v1_run:
      run: 36270628613
      result: PASS_WITH_LESSON
      lesson: >
        Human review found unsupported recent/current-state embellishment
        such as invented yesterday/recently/weather/NPC actions even though
        automated validators passed. This behavior is forbidden in RC1.
    provenance_closed_v2_run:
      run: 36270973255
      deterministic_errors: 0
      provenance_validator: PASS
      disputed_boundary_validator: FAIL
      dispute_class: RUMORED_SEMANTICS
    rumored_adjudication:
      run: 36271309161
      result: PASS
      overturned_findings: 3
      canonical_interpretation: >
        RUMORED is hearsay-level Character awareness; hearing of, wondering
        about, or remembering mention of the subject does not itself upgrade
        the knowledge state.
    final_verdict: PASS
  age45_contrast:
    run: 36271498965
    deterministic_errors: 0
    boundary_validation: PASS
    adult_depth_validation: PASS
    final_verdict: PASS

cost_evidence_usd:
  age4_v1_total: 0.1254215
  age4_v2_total: 0.1107215
  rumored_adjudication: 0.010114
  age45_contrast_total: 0.1214335

promotion_limits:
  production_ready: false
  reasons:
    - Project_LUMI A1.5 contracts/materializers are not yet implemented
    - model output remains candidate evidence only
    - age/role coverage is currently bounded to age-4 child and age-45 adult contrast
    - Project_LUMI B5-style route qualification has not authorized production use
    - P12.9 runtime integration gate remains separate
