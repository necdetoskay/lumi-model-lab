workload_profile:
  profile_id: execution-routing-smoke
  profile_version: "1"
  input_schema_version: "1"
  question_set_version: "1"
  risk_class: L2
  deterministic_preconditions:
    - allowed_actions_are_explicit
    - no_production_mutation
  abstention_options:
    - INSUFFICIENT_EVIDENCE
    - ESCALATE

dataset_path: data/specifications/decision_engine_smoke_v1.json

engine:
  type: fixture
  identity:
    engine_family: fixture
    provider_runtime: local-fixture
    model_id: fixture/reference-v1
    model_revision: "1"
    artifact_hash: fixture-v1
    quantization: null
    serving_stack: python-fixture
    hardware: cpu
    language_variant: native
  fixture_path: data/specifications/decision_engine_fixture_outputs_v1.json

output_root: runs/decision_engine
