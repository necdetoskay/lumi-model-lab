language: tr
age_min: 6
age_max: 9
target_words: 2000
title_hint: Bulut Atölyesinin Son Parçası
protagonist: Arda, yaratıcı ve sabırlı bir çocuk
setting: Gökyüzüne uzanan asma köprülerle bağlı küçük bulut adaları ve eski bir rüzgâr atölyesi
theme: Deneme, düzeltme ve tamamlanmış bir işin sorumluluğu
premise: Arda, durmuş bir rüzgâr atölyesini yeniden çalıştırmak için eksik parçayı arar. Birkaç başarısız denemeden sonra doğru parçanın atölyenin kendisinde gizli olduğunu fark eder ve sistemi güvenli biçimde tamamlar.
constraints:
  - Başarısız denemeler birbirinden farklı olsun ve aynı konuşma ya da eylem tekrarlanmasın.
  - Her bölüm yeni bir bilgi, karar veya sonuç eklesin.
  - Son yüzde 25 içinde ana problem çözülmeli ve yeni büyük görev açılmamalı.
  - Son sahne atölyenin çalışması ve Arda'nın eve dönmesiyle net biçimde kapansın.
  - Çatışma yerine merak ve problem çözmeye odaklan.
