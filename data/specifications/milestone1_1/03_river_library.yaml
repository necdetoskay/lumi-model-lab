language: tr
age_min: 6
age_max: 9
target_words: 2000
title_hint: Nehrin Altındaki Kütüphane
protagonist: Mina, sakin ve ayrıntıları fark eden bir çocuk
setting: Taş köprüler, sığ su kanalları ve eski bir değirmenin bulunduğu nehir vadisi
theme: Sabır, bilgi paylaşımı ve merakı sonuca götürmek
premise: Mina, nehir kıyısında su yükselince ortaya çıkan işaretlerin eski bir okuma odasına yön verdiğini fark eder. İşaretleri sırasıyla çözer ve unutulmuş kitapların güvenli biçimde yeniden kullanılmasını sağlar.
constraints:
  - İpuçları aşamalı ilerlesin ve her biri bir sonrakine bağlansın.
  - Aynı keşfi farklı cümlelerle tekrar etme.
  - Son yüzde 25 içinde çözüm tamamlanmalı; kapanıştan sonra yeni gizem açılmamalı.
  - Hikâye sonunda Mina'nın keşfinin topluluğa nasıl yarar sağladığı açık olsun.
  - Tehlikeli su sahnelerinden kaçın; yetişkin gözetimi gerektiğinde belirt.
