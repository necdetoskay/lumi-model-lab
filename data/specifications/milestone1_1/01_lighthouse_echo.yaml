language: tr
age_min: 6
age_max: 9
target_words: 2000
title_hint: Fenerdeki Son Yankı
protagonist: Ada, meraklı ve sabırlı bir çocuk
setting: Sisli bir kıyı kasabasındaki eski deniz feneri ve gelgit mağaraları
theme: Merak, sabır ve bir işi tamamlamanın verdiği güven
premise: Ada, her akşam deniz fenerinden gelen fazladan bir yankının kaynağını araştırır. İpuçlarını toplar, yanlış varsayımlarını düzeltir ve gizemi somut bir keşifle çözer.
constraints:
  - Hikâye tek bir ana gizem etrafında ilerlesin ve son bölümde açıkça çözülsün.
  - Aynı gözlem veya düşünceyi tekrar tekrar anlatma; her sahne yeni bilgi veya sonuç eklesin.
  - Son yüzde 25 içinde yeni büyük gizem açma.
  - Kapanışta Ada'nın ne öğrendiği ve ertesi gün ne yaptığı net olsun.
  - Korkutucu veya tehlikeli çözüm kullanma; yaşa uygun kal.
