language: tr
age_min: 6
age_max: 9
target_words: 2000
title_hint: Taş Bahçenin Son Tohumu
protagonist: Duru, sakin, dikkatli ve vazgeçmeyen bir çocuk
setting: Rüzgârlı tepelerdeki taş teraslar, küçük bir sera ve eski sulama kanalları
theme: Sabır, bakım ve başladığını tamamlamak
premise: Duru, yıllardır filizlenmeyen son tohumu yaşatmak için taş bahçenin eski sulama düzenini inceler. Gereksiz tekrarlar yerine her denemeden bir şey öğrenir ve sonunda doğru su-zaman dengesini bulur.
constraints:
  - Denemeler ilerlemeli; aynı çözümü veya aynı gözlemi tekrarlama.
  - Hikâyenin son yüzde 25'i çözüm, sonuç ve sakin kapanışa ayrılmalı.
  - Yeni gizem ya da büyük görev açarak bitirme.
  - Son sahnede tohumun durumu, Duru'nun öğrendiği şey ve ertesi günkü planı açık olsun.
  - Yaşa uygun, umutlu ve güvenli bir ton kullan.
