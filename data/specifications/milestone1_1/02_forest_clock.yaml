language: tr
age_min: 6
age_max: 9
target_words: 2000
title_hint: Ormanın Unuttuğu Saat
protagonist: Efe, dikkatli ve çözüm üretmeyi seven bir çocuk
setting: Eski bir gözlem kulesi bulunan sessiz bir orman yolu
theme: İşbirliği, gözlem ve başladığını bitirmek
premise: Efe, ormandaki kuş seslerinin her gün aynı saatte aniden kesildiğini fark eder. Küçük ipuçlarını birleştirerek nedenini bulur ve ormandaki eski saat düzeneğini yeniden çalıştırır.
constraints:
  - Her yeni sahne çözümü ilerletsin; aynı ipucuna dönüp durma.
  - Yanlış tahminler kısa olsun ve yeni kanıtla hemen güncellensin.
  - Çözüm son çeyrekte netleşsin ve hikâye yeni yan olay açmadan kapansın.
  - Son sahnede Efe ve arkadaşlarının yaptığı somut bir kapanış eylemi olsun.
  - Yaşa uygun, güvenli ve sıcak bir ton kullan.
