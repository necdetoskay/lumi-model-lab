title_hint: Beyond the Cloud Bridge
age_min: 6
age_max: 8
language: en
target_words: 2000
protagonist: Selin, an imaginative and brave young traveler who does not dismiss danger
setting: floating islands, windmills, and cloud bridges that form only at certain hours in the LUMI universe
theme: courage, preparation, and exploration
premise: Selin wants to recover a message capsule lost on a neighboring island. During the journey, she must carefully account for changing winds, the times when the bridge forms, and which items she chooses to carry.
constraints:
  - Fantasy elements must follow their own internal rules.
  - Selin must not rush into danger without thinking.
  - At least one plan must change because of an unexpected but understandable reason.
  - The problem must not be solved by one powerful spell.
  - The adventure must be completed while leaving a new point of curiosity about the world.
