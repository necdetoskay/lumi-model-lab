corpus:
  id: lumi_story_corpus_v1
  version: "1.0"
  language: tr
  teacher_model: openai/gpt-5.6-luna
  total_stories: 100
  unique_specs: 80
  alternate_generations: 20
  generation_batches: 4
  stories_per_batch: 25

length_distribution:
  - target_words: 1500
    count: 10
  - target_words: 1800
    count: 15
  - target_words: 2000
    count: 50
  - target_words: 2200
    count: 15
  - target_words: 2500
    count: 10

age_distribution:
  - age_min: 4
    age_max: 5
    age_band: "4-5"
    count: 10
  - age_min: 6
    age_max: 8
    age_band: "6-8"
    count: 60
  - age_min: 9
    age_max: 10
    age_band: "9-10"
    count: 25
  - age_min: 11
    age_max: 12
    age_band: "11-12"
    count: 5

story_family_distribution:
  - family: exploration_mystery
    count: 12
  - family: friendship_social
    count: 12
  - family: puzzle_problem_solving
    count: 12
  - family: nature_environment
    count: 10
  - family: scientific_curiosity
    count: 10
  - family: adventure_journey
    count: 10
  - family: emotional_growth
    count: 10
  - family: teamwork_collaboration
    count: 8
  - family: everyday_fantastical_discovery
    count: 8
  - family: world_lore_discovery
    count: 8

coverage_targets:
  wrong_hypothesis_corrected_by_evidence: 30
  combine_two_or_more_clues: 25
  plan_attempt_failure_correction: 20
  constructive_character_disagreement: 20
  emotional_misunderstanding: 15
  multiple_solution_alternatives: 20
  quiet_observational_narrative: 10
  dialogue_forward: 15
  explicit_world_lore_discovery: 10

split_targets:
  train: 80
  validation: 10
  holdout: 10

batch_policy:
  paid_generation_starts_only_after:
    - story_spec_v2_schema_available
    - corpus_metadata_schema_available
    - safety_result_schema_available
    - scoped_quality_judge_config_available
    - frozen_benchmark_leakage_check_available
  review_after_each_batch:
    - technical_pass_rate
    - word_count_deviation
    - eos_completion_rate
    - repetition_metrics
    - safety_failures
    - quality_distribution
    - age_band_failures
    - motif_duplication
    - setting_duplication
    - narrative_structure_duplication
    - generation_cost

canonical_statuses:
  - SPEC_CREATED
  - GENERATED
  - TECHNICAL_PASS
  - TECHNICAL_FAIL
  - SAFETY_PASS
  - SAFETY_FAIL
  - JUDGED
  - ACCEPTED
  - REJECTED
  - CURATED
  - SPLIT_ASSIGNED
  - EXPORTED

alternate_generation_policy:
  description: >-
    20 of the 80 unique specifications will receive one additional generation.
    The alternate keeps the same spec_id and gets a distinct story_id, request metadata,
    generation seed/provider evidence, and content fingerprint.
  prevent_split_leakage: true

frozen_benchmark_policy:
  must_remain_outside_corpus: true
  allow_prompt_or_story_leakage: false

next_artifact:
  id: corpus_v1_story_slots
  path: data/specifications/corpus_v1/story_slots.yaml
  requirement: >-
    Materialize exactly 100 generation slots: 80 unique specs plus 20 alternate generations,
    while satisfying the distributions and diversity constraints in this file.