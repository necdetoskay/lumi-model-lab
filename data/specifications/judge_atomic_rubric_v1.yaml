rubric_id: lumi-story-atomic-judge
rubric_version: "1"
status: FROZEN_STRUCTURE_CALIBRATION_PENDING
score_direction: higher_is_better
score_range: [0, 4]
aggregate_story_verdict: forbidden_in_p3

language_variants:
  - id: TR_NATIVE
    source_language: tr
    representation: native
    rubric_language: tr
  - id: EN_REFERENCE
    source_language: en
    representation: independently_frozen_english
    rubric_language: en
  - id: CONTROLLED_EN_PROJECTION
    source_language: tr
    representation: controlled_en_projection_v1
    rubric_language: en

dimensions:
  - id: contract_alignment
    owner_candidate: decision_engine
    critical_capable: true
    legacy_mapping: [instruction_following]
    question:
      type: score
      tr: Aday hikâye verilen anlatı sözleşmesi, premis, zorunlu olaylar ve açık kısıtlarla ne kadar uyumlu?
      en: How well does the candidate story satisfy the supplied narrative contract, premise, required events, and explicit constraints?
    levels:
      tr:
        - Açık ve önemli sözleşme ihlali veya zorunlu unsur eksik.
        - Birden fazla önemli şart bozulmuş ya da ciddi biçimde değiştirilmiş.
        - Ana sözleşme kısmen karşılanıyor; önemli bir şart zayıf veya belirsiz.
        - Sözleşme iyi karşılanıyor; yalnız küçük bir sapma var.
        - Tüm anlamlı sözleşme şartları temiz ve doğal biçimde karşılanıyor.
      en:
        - Clear major contract violation or required element missing.
        - Multiple important requirements are broken or materially altered.
        - Core contract is partly satisfied but one important requirement is weak or ambiguous.
        - Contract is satisfied well with only a minor deviation.
        - All meaningful contract requirements are satisfied cleanly and naturally.
    anchors:
      bad: Akıcı düzyazı olsa bile zorunlu olay veya açık kısıt bozulmuştur.
      borderline: Ana premis korunur fakat bir önemli şart yalnız yüzeysel karşılanır.
      good: Zorunlu olaylar ve kısıtlar hikâyeye doğal biçimde yerleşmiştir.

  - id: character_consistency
    owner_candidate: decision_engine
    critical_capable: false
    legacy_mapping: [character_consistency]
    question:
      type: score
      tr: Karakterin davranışları, hedefleri, duyguları ve önceki seçimleri tanımlanan karakter durumuyla ne kadar tutarlı?
      en: How consistent are the character's actions, goals, emotions, and choices with the supplied character state?
    levels:
      tr:
        - Karakter temel özellikleriyle açıkça çelişiyor.
        - Büyük veya tekrarlanan açıklamasız davranış sapmaları var.
        - Bir belirgin tutarsızlık ya da zayıf motivasyon var.
        - Genel olarak tutarlı; küçük bir kolaycılık var.
        - Davranış ve tepkiler verilen karakter durumuyla güçlü biçimde tutarlı.
      en:
        - Character clearly contradicts core supplied traits or goals.
        - Major or repeated unexplained behavioral shifts occur.
        - One noticeable inconsistency or weak motivation exists.
        - Mostly consistent with a minor convenience.
        - Actions and reactions strongly fit the supplied character state.
    anchors:
      bad: Tedbirli tanımlanan karakter gerekçe olmadan tehlikeye atılır.
      borderline: Davranış doğru yöndedir fakat motivasyon metinde zayıf kurulmuştur.
      good: Seçim, duygu ve öğrenme önceki özelliklerden doğal olarak çıkar.

  - id: world_state_consistency
    owner_candidate: decision_engine
    critical_capable: true
    legacy_mapping: [coherence]
    question:
      type: score
      tr: Hikâyedeki dünya, konum, zaman ve durum iddiaları verilen dünya durumu ile ne kadar tutarlı?
      en: How consistent are the story's world, location, time, and state claims with the supplied world state?
    levels:
      tr:
        - Açık kritik durum/konum/zaman çelişkisi var.
        - Birden fazla önemli dünya durumu çelişkisi var.
        - Belirsiz veya küçük bir durum uyumsuzluğu var.
        - Genel olarak tutarlı; önemsiz bir açıklık problemi var.
        - Dünya ve durum iddiaları verilen state ile tamamen uyumlu.
      en:
        - Clear critical state, location, or chronology contradiction.
        - Multiple important world-state contradictions.
        - One ambiguous or minor state mismatch.
        - Mostly consistent with only a minor clarity issue.
        - World and state claims cleanly match the supplied state.
    anchors:
      bad: Kapalı/ulaşılamaz konum hikâyede açıklamasız erişilebilir kabul edilir.
      borderline: Zaman veya konum geçişi mümkün fakat yeterince açıklanmamıştır.
      good: Mekân, zaman ve durum değişimleri verilen state ile izlenebilir.

  - id: opportunity_relevance
    owner_candidate: decision_engine
    critical_capable: false
    legacy_mapping: [instruction_following, coherence]
    question:
      type: score
      tr: Hikâye seçilen fırsat/çağrı ile ne kadar doğrudan ve anlamlı biçimde ilerliyor?
      en: How directly and meaningfully does the story develop the selected opportunity or hook?
    levels:
      tr:
        - Fırsat yok sayılmış veya başka bir konuya dönülmüş.
        - Fırsat yalnız isim olarak var; olayları taşımıyor.
        - Fırsat kısmen kullanılıyor fakat merkezî değil.
        - Fırsat olayları iyi yönlendiriyor; küçük sapmalar var.
        - Fırsat hikâyenin doğal ve belirgin itici gücü.
      en:
        - Opportunity is ignored or replaced by another premise.
        - Opportunity is only mentioned and does not drive events.
        - Opportunity matters partially but is not central.
        - Opportunity drives events well with minor drift.
        - Opportunity is the clear natural driver of the story.
    anchors:
      bad: Başlangıç hook'u geçer, hikâye ilgisiz başka probleme dönüşür.
      borderline: Fırsat görünürdür fakat kararları sınırlı etkiler.
      good: Karakter seçimleri ve olaylar doğrudan fırsattan doğar.

  - id: character_agency
    owner_candidate: decision_engine
    critical_capable: false
    legacy_mapping: [coherence, character_consistency]
    question:
      type: score
      tr: Sonuçlar karakterin anlamlı seçimleri ve eylemleriyle ne kadar şekilleniyor?
      en: To what extent are outcomes shaped by meaningful character choices and actions?
    levels:
      tr:
        - Karakter pasif; çözüm dışarıdan veya tesadüfen gelir.
        - Karakterin eylemleri sonucu çok az etkiler.
        - Bazı anlamlı seçimler var ancak ana çözüm kısmen dışsaldır.
        - Karakter çoğu önemli gelişmeyi kendi seçimleriyle etkiler.
        - Hikâyenin ilerleyişi ve sonuçları güçlü biçimde karakter ajansından doğar.
      en:
        - Character is passive and resolution arrives externally or by accident.
        - Character actions have little effect on outcome.
        - Some meaningful choices exist but resolution is partly external.
        - Character choices shape most important developments.
        - Progression and outcome strongly arise from character agency.
    anchors:
      bad: Bir yetişkin/mucize gelip temel sorunu çözer.
      borderline: Karakter seçim yapar fakat sonucu asıl başka güç belirler.
      good: Karakterin kararları olayların yönünü görünür biçimde değiştirir.

  - id: semantic_repetition
    owner_candidate: decision_engine
    critical_capable: false
    legacy_mapping: [coherence, style_quality]
    question:
      type: score
      tr: Metin gereksiz anlamsal tekrar ve döngülerden ne kadar arınmış?
      en: How free is the text from unnecessary semantic repetition and looping?
    levels:
      tr:
        - Ağır döngü/tekrar metni kullanılamaz hâle getiriyor.
        - Sık tekrar akışı ciddi biçimde bozuyor.
        - Fark edilir fakat sınırlı tekrar var.
        - Küçük tekrarlar dışında temiz.
        - Anlamsal tekrar yok denecek kadar az ve ilerleme sürekli.
      en:
        - Severe looping/repetition makes the text unusable.
        - Frequent repetition materially harms progression.
        - Noticeable but limited repetition exists.
        - Clean except for minor repetition.
        - Essentially free of unnecessary semantic repetition with continuous progression.
    anchors:
      bad: Aynı olay/cümle anlamlı ilerleme olmadan tekrar tekrar dönüyor.
      borderline: Bir fikir birkaç kez gereksiz biçimde yeniden açıklanıyor.
      good: Her bölüm yeni bilgi, seçim veya sonuç ekliyor.

  - id: age_fit
    owner_candidate: decision_engine
    critical_capable: true
    legacy_mapping: [age_appropriateness]
    question:
      type: score
      tr: Dil, kavram, duygusal yoğunluk ve tehlike düzeyi hedef yaş için ne kadar uygun?
      en: How appropriate are language, concepts, emotional intensity, and danger level for the target age?
    levels:
      tr:
        - Hedef yaş için açıkça uygunsuz veya güvensiz.
        - Belirgin ve tekrarlanan yaş uyumsuzluğu var.
        - Kullanılabilir ama bazı bölümler fazla karmaşık/basit/yoğun.
        - Genel olarak yaşa uygun; küçük ayar ihtiyacı var.
        - Dil, kavram ve duygusal yük hedef yaşa çok iyi kalibre.
      en:
        - Clearly inappropriate or unsafe for the target age.
        - Material repeated age mismatch.
        - Usable but some content is too complex, simple, or intense.
        - Mostly age-appropriate with minor adjustment needed.
        - Language, concepts, and emotional load are very well calibrated.
    anchors:
      bad: Hedef yaş için ciddi korku/şiddet veya anlaşılmaz yetişkin soyutlaması içerir.
      borderline: Genel ton uygun ama birkaç bölüm bilişsel/duygusal olarak ağırdır.
      good: Dil ve gerilim hedef yaşın anlayabileceği ve tolere edebileceği düzeydedir.

  - id: relationship_consistency
    owner_candidate: decision_engine
    critical_capable: true
    legacy_mapping: [character_consistency, coherence]
    question:
      type: score
      tr: Karakterler arası ilişki, güven, rol ve geçmiş iddiaları verilen ilişki durumuyla ne kadar tutarlı?
      en: How consistent are relationship, trust, role, and shared-history claims with the supplied relationship state?
    levels:
      tr:
        - Açık kritik ilişki/rol çelişkisi var.
        - Birden fazla önemli ilişki durumu hatası var.
        - Bir belirgin ama sınırlı uyumsuzluk var.
        - Genel olarak tutarlı; küçük bir açıklık sorunu var.
        - İlişki davranışları ve iddiaları state ile güçlü biçimde tutarlı.
      en:
        - Clear critical relationship or role contradiction.
        - Multiple important relationship-state errors.
        - One noticeable but limited mismatch.
        - Mostly consistent with a minor clarity issue.
        - Relationship behavior and claims strongly match supplied state.
    anchors:
      bad: Birbirini hiç tanımayan iki kişi ortak geçmişi varmış gibi davranır.
      borderline: Güven düzeyi biraz hızlı değişir fakat açıklanabilir.
      good: Hitap, güven ve davranışlar önceki ilişki durumundan doğal çıkar.

  - id: knowledge_consistency
    owner_candidate: decision_engine
    critical_capable: true
    legacy_mapping: [character_consistency, coherence]
    question:
      type: score
      tr: Karakterin bildiği/bilmediği bilgiler verilen bilgi durumu ile ne kadar tutarlı?
      en: How consistent is what the character knows or does not know with the supplied knowledge state?
    levels:
      tr:
        - Kritik bilgi sızıntısı veya imkânsız bilgi edinimi var.
        - Birden fazla önemli knowledge-state ihlali var.
        - Bir belirsiz veya sınırlı bilgi sıçraması var.
        - Genel olarak tutarlı; küçük bir açıklama eksik.
        - Bilgi edinimi ve belirsizlik verilen knowledge state ile tamamen uyumlu.
      en:
        - Critical knowledge leak or impossible knowledge acquisition.
        - Multiple important knowledge-state violations.
        - One ambiguous or limited knowledge jump.
        - Mostly consistent with a minor explanation gap.
        - Knowledge acquisition and uncertainty fully match the supplied knowledge state.
    anchors:
      bad: Karakter hiç öğrenmediği gizli konumu doğrudan biliyormuş gibi kullanır.
      borderline: Doğru bilgiye ulaşır fakat öğrenme adımı zayıf gösterilir.
      good: Karakter yalnız gördüğü, duyduğu veya çıkarabildiği bilgiyi kullanır.

  - id: narrative_progression
    owner_candidate: hybrid
    critical_capable: false
    legacy_mapping: [coherence]
    question:
      type: score
      tr: Hikâye kurulumdan gelişmeye ve sonuca anlamlı ilerleme gösteriyor mu?
      en: Does the story show meaningful progression from setup through development to outcome?
    levels:
      tr:
        - İlerleme yok; metin döngüsel veya dağınık.
        - Olaylar var fakat neden-sonuç zinciri zayıf.
        - Temel ilerleme anlaşılır ama payoff/transition sorunları var.
        - İyi ilerliyor; küçük pacing veya payoff zayıflığı var.
        - Kurulum, seçimler, sonuçlar ve payoff güçlü bir ilerleme oluşturuyor.
      en:
        - No meaningful progression; text is looping or fragmented.
        - Events occur but causal progression is weak.
        - Basic progression is understandable with payoff/transition issues.
        - Good progression with minor pacing or payoff weakness.
        - Setup, choices, consequences, and payoff form strong progression.
    anchors:
      bad: Olaylar tekrar eder ve başlangıç durumundan anlamlı uzaklaşmaz.
      borderline: Hikâye ilerler fakat önemli bir kurulum sonuçsuz kalır.
      good: Her ana bölüm öncekinin sonucundan doğar ve sona doğru birikir.

  - id: ending_quality
    owner_candidate: hybrid
    critical_capable: false
    legacy_mapping: [instruction_following, coherence]
    question:
      type: score
      tr: Son, mevcut çatışmayı ve açık sözleşme gereksinimlerini ne kadar doğal biçimde tamamlıyor?
      en: How naturally does the ending resolve the current conflict and satisfy explicit ending requirements?
    levels:
      tr:
        - Son yok, ani kesiliyor veya açıkça sözleşmeye aykırı.
        - Son büyük ölçüde kazanılmamış/ilgisiz.
        - İşlevsel ama zayıf, hızlı veya kısmen tatminsiz.
        - Doğal ve yeterli; küçük payoff zayıflığı var.
        - Güçlü, kazanılmış ve açık ending şartlarıyla tam uyumlu.
      en:
        - Ending is absent, abruptly cut, or clearly violates the contract.
        - Ending is largely unearned or unrelated.
        - Functional but weak, rushed, or partly unsatisfying.
        - Natural and sufficient with a minor payoff weakness.
        - Strong, earned, and fully aligned with explicit ending requirements.
    anchors:
      bad: Yeni bir dış güç aniden her şeyi çözer veya zorunlu açık uç kapatılır.
      borderline: Ana sorun kapanır fakat payoff hızlıdır.
      good: Son, karakter seçimlerinin sonucu olarak gelir ve gerekli açıklığı korur.

llm_retained_dimensions:
  - id: creativity
    reason: Distinctiveness and novelty remain too holistic for v1 bounded ownership.
  - id: literary_style_quality
    reason: Natural prose, rhythm, imagery, read-aloud quality, and subtlety remain strong-LLM owned.
  - id: deep_holistic_coherence
    reason: Multi-hop narrative interpretation beyond atomic checks remains strong-LLM owned.

calibration:
  anchor_source: dedicated_synthetic_descriptions
  final_holdout_examples_allowed_as_anchors: false
  thresholds_frozen: false
  status: PENDING_HUMAN_CALIBRATION
