title_hint: Paylaşılan Harita
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Ege, fikir üretmeyi seven ama bazen arkadaşlarının katkısını yeterince dinlemeyen genç bir haritacı
setting: LUMI evrenindeki küçük bir pazar kasabası ve çevresindeki renkli bahçeler
theme: arkadaşlık, dinleme ve birlikte çözüm üretme
premise: Ege ve arkadaşı Lina, yaklaşan Bahçe Günü için çocukların kullanacağı bir keşif haritası hazırlamak ister. Fakat farklı fikirleri yüzünden planları sürekli çatışır ve ikisinin de tek başına fark etmediği bir ihtiyacı birlikte keşfetmeleri gerekir.
constraints:
  - Çatışma fiziksel tehlikeye dayanmamalı.
  - Hiçbir karakter kötü veya alaycı olarak etiketlenmemeli.
  - Ege en az bir kez Lina'yı gerçekten dinleyerek fikrini değiştirmeli.
  - Çözüm özür dilemenin ötesinde somut bir ortak çalışma içermeli.
  - Hikâye doğrudan ahlak dersi veren bir kapanışla bitmemeli.
