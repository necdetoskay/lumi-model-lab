title_hint: Sis İçindeki İşaret
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Ada, meraklı, dikkatli ve kanıt görmeden karar vermemeye çalışan genç bir kaşif
setting: LUMI evreninde sisle kaplanan kıyı kayalıkları, gelgit mağaraları ve eski yön taşları
theme: merak, gözlem ve sabırlı keşif
premise: Ada, her akşam kıyıda yalnızca birkaç dakika görünen sıra dışı bir ışık işareti fark eder. Kaynağına ulaşmak için gelgitleri, taş işaretlerini ve çevresindeki küçük değişimleri dikkatle değerlendirmelidir.
constraints:
  - Hikâye korkutucu olmamalı.
  - Ada en az bir yanlış varsayım yapmalı ve bunu somut gözlemle düzeltmeli.
  - Gizem tek bir tesadüf veya mucizeyle çözülmemeli.
  - Çözüm en az iki farklı ipucunun birleştirilmesine dayanmalı.
  - Final yeni bir keşif ihtimaline küçük bir kapı bırakmalı.
