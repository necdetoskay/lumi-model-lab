title_hint: Saat Kulesinin Üç Sesi
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Deniz, desenleri fark etmeyi seven ama ilk bulduğu cevaba fazla çabuk güvenebilen genç bir problem çözücü
setting: LUMI evrenindeki eski saat kulesi, küçük meydan ve mekanik oyuncak dükkânı
theme: problem çözme, deneme ve kanıtla doğrulama
premise: Kasabanın saat kulesi yanlış zamanlarda üç farklı ses çıkarmaya başlar. Deniz bunun nedenini bulmak için seslerin sırasını, kuledeki mekanizmaları ve meydandaki günlük hareketleri karşılaştırmalıdır.
constraints:
  - Problem sihirli bir müdahaleyle çözülmemeli.
  - Deniz ilk çözüm tahmininde yanılmalı.
  - Doğru çözüm en az üç gözlem veya ipucunun ilişkilendirilmesine dayanmalı.
  - Çözüm çocuk okuyucunun takip edebileceği kadar açık anlatılmalı.
  - Finalde küçük ama mantıklı bir yeni soru bırakılmalı.
