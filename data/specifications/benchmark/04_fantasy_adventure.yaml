title_hint: Bulut Köprüsünün Ötesi
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Selin, hayal gücü güçlü, cesur ama tehlikeyi küçümsemeyen genç bir yolcu
setting: LUMI evrenindeki yüzen adalar, rüzgâr değirmenleri ve yalnızca belirli saatlerde oluşan bulut köprüleri
theme: cesaret, hazırlık ve keşif
premise: Selin, komşu adada kaybolan bir haber kapsülünü bulmak ister. Yolculuk sırasında değişen rüzgârları, köprünün oluşma zamanını ve taşıdığı eşyaları dikkatli seçmek zorundadır.
constraints:
  - Fantastik unsurlar kendi iç kurallarına uymalı.
  - Selin düşünmeden tehlikeye atılmamalı.
  - En az bir plan beklenmedik bir nedenle değişmek zorunda kalmalı.
  - Sorun tek bir güçlü büyüyle çözülmemeli.
  - Macera tamamlanmalı ama dünya hakkında yeni bir merak unsuru bırakmalı.
