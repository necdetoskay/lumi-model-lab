title_hint: Sessiz Bahçedeki Bank
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Elif, duygularını hemen anlatmakta zorlanan ama çevresini dikkatle gözlemleyen genç bir çocuk
setting: LUMI evrenindeki göl kenarı mahallesi, küçük topluluk bahçesi ve kuş gözlem alanı
theme: duyguları fark etme, güven ve sakin iletişim
premise: Elif'in çok sevdiği komşusu başka bir bölgeye taşınacağını açıklar. Elif bunu duyunca içine kapanır; gün boyunca bahçede geçirdiği küçük karşılaşmalar ve yaptığı bir hazırlık sayesinde duygusunu kendi hızında ifade etmeye yaklaşır.
constraints:
  - Hikâye ağır veya korkutucu olmamalı.
  - Elif'in duygusu tek bir konuşmayla aniden çözülmemeli.
  - Yetişkinler Elif'in yerine sorunu çözmemeli.
  - Duygusal ilerleme küçük davranışlar ve gözlemler üzerinden gösterilmeli.
  - Final sıcak ama aşırı öğretici veya slogan gibi olmamalı.
