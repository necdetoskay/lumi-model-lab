title_hint: The Unexpected Result
age_min: 32
age_max: 32
language: en
target_words: 4200
narrative_family: scientific_curiosity
reading_mode: INDEPENDENT_READER
relative_length_class: STANDARD
protagonist: Deniz, age 32, whose judgment, independence, vocabulary, social context, and responsibilities must be plausible for that exact age
setting: A public science room with simple instruments, a weather station, a makerspace bench, and safe materials for observation.
theme: Scientific understanding improves when hypotheses are tested and revised.
premise: 'Deniz observes a repeatable result that does not fit the first explanation. Deniz must form more than one hypothesis, design safe tests, compare the results, notice a confounding factor, and revise the explanation without treating uncertainty as failure.

  '
constraints:
- Match vocabulary, sentence structure, emotional intensity, exposition, pacing, and concept complexity to the exact target age and reading mode.
- Keep causality explicit enough for the target reader without becoming didactic.
- No combat; resolve tension through observation, communication, reasoning, exploration, or cooperation.
- Preserve continuity across all six scenes.
- Do not mention that the story is a benchmark or test.
- The phenomenon must have a non-magical mechanism that can be reasoned about from evidence.
- Include at least two plausible hypotheses and one controlled comparison.
- Deniz must revise or reject an initial explanation after new evidence.
- The final explanation must match the target reader's age without becoming technically false.
- Do not use an expert character to simply reveal the answer.
- The intended reader is exactly age 32; reading mode is INDEPENDENT_READER; do not write for a younger or older audience.
