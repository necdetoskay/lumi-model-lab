premise: 'Deniz and a friend are preparing a shared community project, but each interprets the same situation differently and begins changing the plan without fully understanding the other''s reasons. Deniz must notice the mismatch, gather context, listen carefully, and build a revised plan that uses both people''s contributions.

  '
