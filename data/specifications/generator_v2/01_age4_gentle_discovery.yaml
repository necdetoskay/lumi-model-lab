title_hint: Minik Işığın Yolu
age_min: 4
age_max: 4
language: tr
target_words: 500
protagonist: Mino, meraklı ama acele etmeyen küçük bir tavşan
setting: LUMI evreninde çiçekli bir bahçe, küçük bir dere ve güvenli patikalar
theme: merak, dikkat ve küçük keşifler
premise: Mino akşamüstü yaprakların arasında parlayan küçük ışık noktalarını fark eder ve onların nereden geldiğini anlamaya çalışır.
constraints:
  - Cümleler ve olay örgüsü 4 yaş için kolay takip edilir olmalı.
  - Hikâye korkutucu, tehditkâr veya yoğun gerilimli olmamalı.
  - Sorun şiddet veya kavga ile çözülmemeli.
  - En fazla üç önemli karakter kullanılmalı.
  - Son açık, sıcak ve güven verici biçimde tamamlanmalı.
