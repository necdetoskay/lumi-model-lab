title_hint: Fener Kulesinin Dört Kuralı
age_min: 7
age_max: 8
language: tr
target_words: 1000
protagonist: Lina, dikkatli plan yapan ve arkadaşlarının güçlü yanlarını fark eden genç bir kâşif
setting: LUMI evreninde deniz kıyısındaki eski ama güvenli bir fener kulesi, taş patikalar ve küçük araştırma istasyonu
theme: planlama, sorumluluk ve birlikte çözüm üretme
premise: Lina ve iki arkadaşı, fener kulesindeki eski gözlem düzenini yeniden çalıştırmak için bir dizi işareti doğru sırada anlamlandırmalıdır.
constraints:
  - Hikâyede yalnız Lina, Bora ve Mira adlı üç ana çocuk karakter bulunmalı.
  - Bora yön bulmada iyi, Mira mekanik düzenekleri anlamada iyi olmalı; bu özellikler bölüm boyunca değişmemeli.
  - Lina tek başına çözüm bulmamalı; çözüm üç karakterin farklı katkılarını gerektirmeli.
  - "Dört aşamalı çözüm sırası korunmalı: gözlem, rota belirleme, mekanizmayı anlama, birlikte çalıştırma."
  - Fener kulesi terk edilmiş veya tehlikeli bir yer gibi sunulmamalı; araştırma için güvenli ve izinli bir alan olmalı.
  - Finalde düzenek çalışmalı fakat yeni bir dünya/canon gerçeği keyfî biçimde icat edilmemeli.
