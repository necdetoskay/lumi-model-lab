title_hint: İki Farklı Uçurtma
age_min: 4
age_max: 5
language: tr
target_words: 600
protagonist: Ece, paylaşmayı seven ama bazen kendi fikrinde ısrar eden küçük bir çocuk
setting: LUMI evreninde rüzgârlı bir tepe, renkli uçurtmalar ve küçük bir piknik alanı
theme: arkadaşlık, dinleme ve iş birliği
premise: Ece ile yeni tanıştığı arkadaşının uçurtmaları aynı anda uçmayınca ikisi farklı fikirlerini birleştirerek çözüm bulmaya çalışır.
constraints:
  - Çatışma küçük ve günlük olmalı; kötü karakter olmamalı.
  - Ece en az bir kez arkadaşını dinleyerek fikrini değiştirmeli.
  - Çözüm iki karakterin katkısını da gerektirmeli.
  - Dil 4-5 yaş için somut ve anlaşılır olmalı.
  - Hikâye açık bir uzlaşma ve sıcak kapanışla bitmeli.
