title_hint: Köprünün Üç Taşı
age_min: 5
age_max: 6
language: tr
target_words: 700
protagonist: Arda, sabırlı olmayı yeni öğrenen meraklı bir çocuk
setting: LUMI evreninde sığ bir dere, yuvarlak taşlar ve orman içindeki güvenli keşif yolu
theme: deneme, gözlem ve problem çözme
premise: Arda, oyuncağını derenin karşı tarafına ulaştırmak için güvenli bir geçiş yolu tasarlamaya çalışır.
constraints:
  - Arda ilk çözüm denemesinde küçük ve güvenli bir hata yapmalı.
  - Hatasını gözlemleyip neden çalışmadığını anlamalı.
  - Nihai çözüm en az iki gözleme dayanmalı.
  - Yetişkin bir karakter problemi onun yerine çözmemeli.
  - Problem fiziksel tehlike yaratmadan tamamlanmalı.
