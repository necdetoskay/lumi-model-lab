title_hint: Sessiz Günün Haritası
age_min: 7
age_max: 8
language: tr
target_words: 900
protagonist: Deniz, yeni şeyler denemeyi seven ama başarısız olduğunda içine kapanabilen bir çocuk
setting: LUMI evreninde küçük bir göl kasabası, gözlem iskelesi ve topluluk bahçesi
theme: hayal kırıklığı, öz farkındalık, sabır ve yeniden deneme
premise: Deniz, kasaba için hazırladığı küçük gözlem haritasının işe yaramadığını görünce vazgeçmek ister; gün boyunca yaşadıkları ona hatasını anlaması ve planını kendi isteğiyle düzeltmesi için fırsat verir.
constraints:
  - Deniz'in duygusu doğrudan ders veren yetişkin konuşmalarıyla çözülmemeli.
  - En az bir sahnede Deniz'in davranışı ile iç duygusu arasında anlaşılır bağ kurulmalı.
  - Yeniden deneme kararı Deniz'in kendi çıkarımından doğmalı.
  - Başarı kusursuz olmamalı; küçük bir eksik veya gelecek geliştirme alanı kalmalı.
  - Hikâye didaktik bir ahlak cümlesiyle bitmemeli.
