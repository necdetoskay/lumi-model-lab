title_hint: Kaybolan Renklerin İzi
age_min: 6
age_max: 7
language: tr
target_words: 800
protagonist: Ada, meraklı, dikkatli ve kanıt görmeden karar vermemeye çalışan genç bir kaşif
setting: LUMI evreninde renkli taşlarla işaretlenmiş kıyı yolu, küçük mağaralar ve gelgit havuzları
theme: merak, gözlem ve yanlış varsayımı düzeltme
premise: Ada, kıyı yolundaki bazı renkli işaretlerin her gün farklı sırada göründüğünü fark eder ve bunun nedenini araştırır.
constraints:
  - Ada en az bir yanlış varsayım yapmalı ve bunu somut bir gözlemle düzeltmeli.
  - Gizem tek bir tesadüf veya mucizeyle çözülmemeli.
  - Çözüm en az iki farklı ipucunun birleştirilmesine dayanmalı.
  - Hikâye korkutucu olmamalı.
  - Final küçük bir yeni keşif ihtimaline kapı bırakmalı ama ana gizemi çözmeli.
