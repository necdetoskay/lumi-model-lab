title_hint: Rüzgâr Bahçesinin Sessiz Günü
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Ada, ayrıntıları fark etmeyi seven ama ilk fikrine bazen fazla çabuk bağlanan genç bir bahçe gözlemcisi
setting: LUMI evrenindeki Rüzgâr Bahçesi; ses çıkaran yapraklar, yön değiştiren çiçekler ve küçük su kanalları
theme: merak, gözlem ve sabırlı problem çözme
premise: Bahçedeki rüzgâr çanları bir sabah tamamen susar. Ada önce rüzgârın kaybolduğunu düşünür, fakat çevredeki küçük işaretleri izledikçe asıl nedenin farklı olduğunu keşfeder.
constraints:
  - Hikâye korkutucu olmamalı.
  - Ada en az bir yanlış varsayım yapmalı ve bunu gözlemle düzeltmeli.
  - Sorun tek bir mucizevi olayla çözülmemeli.
  - En az iki duyusal çevre detayı olay örgüsüne katkı sağlamalı.
  - Final küçük bir yeni keşif ihtimali bırakmalı.
