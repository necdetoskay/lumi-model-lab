title_hint: Fenerler Sokağındaki İki Plan
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Deniz, iyi fikirler üretmeyi seven ama heyecanlandığında başkalarının planını yarıda kesebilen genç bir tasarımcı
setting: LUMI evrenindeki Fenerler Sokağı; akşamları renkli lambalarla aydınlanan küçük dükkânlar ve ortak bir meydan
 theme: arkadaşlık, dinleme ve birlikte üretme
premise: Deniz ve arkadaşı Mina, akşam şenliği için çocukların kullanacağı ışıklı bir yol hazırlamak ister. Farklı fikirleri yüzünden planları çatışınca, iki fikrin de tek başına çözemediği bir sorunu birlikte çözmeleri gerekir.
constraints:
  - Çatışma fiziksel tehlikeye dayanmamalı.
  - Hiçbir karakter kötü, bencil veya alaycı olarak etiketlenmemeli.
  - Deniz en az bir kez gerçekten dinleyerek fikrini değiştirmeli.
  - Çözüm somut bir ortak çalışma içermeli.
  - Kapanış doğrudan ahlak dersi vermemeli.
