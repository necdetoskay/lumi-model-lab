title_hint: Sessiz Tohumun Beklediği Gün
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Elif, sevdiği şeyler değiştiğinde üzülse de duygularını anlamaya çalışan sakin ve meraklı bir çocuk
setting: LUMI evrenindeki küçük bir tepe evi ve çevresindeki mevsim bahçesi
theme: değişim, sabır ve duyguları anlamlandırma
premise: Elif'in uzun süredir büyüttüğü özel bir bitki bir sabah çiçeklerini kapatır. Elif önce bitkinin artık onu sevmediğini düşünür, fakat zaman ve gözlem ona değişimin başka nedenleri olabileceğini gösterir.
constraints:
  - Hikâye yoğun korku, kayıp veya travma içermemeli.
  - Duygular küçümsenmeden ama aşırı dramatize edilmeden anlatılmalı.
  - Elif'in ilk yorumu gözlem ve konuşma yoluyla değişmeli.
  - Çözüm anında gerçekleşmemeli; zaman ve sabır önemli olmalı.
  - Final sakin ve umutlu olmalı, doğrudan ders vermemeli.
