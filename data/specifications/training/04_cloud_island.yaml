title_hint: Bulut Adasının Ters Akan Şelalesi
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Selin, yeni yerleri keşfetmeyi seven ama risk almadan önce çevresini dikkatle inceleyen genç bir gezgin
setting: LUMI evrenindeki Bulut Adası; sis köprüleri, hafifçe süzülen kayalar ve gökyüzüne doğru akan ince su yolları
theme: keşif, dikkatli cesaret ve merak
premise: Selin, adanın kıyısında gökyüzüne doğru akan küçük bir şelale görür ve bunun kaynağını araştırmak ister. Yol boyunca gördüğü tuhaflıkların tek bir nedenden kaynaklanmadığını fark eder.
constraints:
  - Fantastik öğeler kendi içinde tutarlı kurallara sahip olmalı.
  - Selin düşünmeden tehlikeye atılmamalı.
  - En az iki gözlem daha önceki bir varsayımı değiştirmeli.
  - Sorun tek bir mucizevi çözümle bitmemeli.
  - Final yeni ama doğal bir keşif olasılığı bırakmalı.
