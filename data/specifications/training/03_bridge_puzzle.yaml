title_hint: Üç Taşlı Köprü
age_min: 6
age_max: 8
language: tr
target_words: 2000
protagonist: Aras, örüntü bulmayı seven ama bazen ilk çözümü doğru sanan dikkatli bir bulmaca meraklısı
setting: LUMI evrenindeki Kamış Vadisi; küçük akarsular, taş köprüler ve sembollerle işaretlenmiş yürüyüş yolları
theme: mantık, deneme-yanılma ve dikkatli düşünme
premise: Aras ve yol arkadaşı Lale, kapanmış bir geçidi açmak için köprü üzerindeki taşların sırasını çözmeye çalışır. İlk çözüm işe yaramayınca çevredeki ipuçlarını yeniden yorumlamaları gerekir.
constraints:
  - Bulmacanın çözümü hikâye içinde anlaşılabilir olmalı.
  - En az bir yanlış çözüm denemesi olmalı ve bunun neden yanlış olduğu gösterilmeli.
  - Çözüm rastlantı veya sihirli yardım yoluyla gelmemeli.
  - Aras ve Lale çözümün farklı parçalarına katkı sağlamalı.
  - Hikâye korku veya cezalandırma üzerinden ilerlememeli.
