title_hint: The Mixed-Up Stations
age_min: 10
age_max: 10
language: en
target_words: 2800
narrative_family: puzzle_problem_solving
reading_mode: INDEPENDENT_READER
relative_length_class: STANDARD
protagonist: Deniz, age 10, whose judgment, independence, vocabulary, social context, and responsibilities must be plausible for that exact age
setting: A children's science center preparing three hands-on demonstration stations, with room schedules, rolling equipment carts, colored transfer tags, simple check-out cards, and ordinary classroom tools.
theme: Good solutions come from testing patterns instead of guessing.
premise: >
  Deniz notices that three demonstration stations are being assembled in an
  order that makes each station seem to be missing the tool it needs. A room
  schedule, colored transfer tags, and check-out times all appear reasonable
  on their own, but they point to different explanations when compared. Deniz
  must test a believable idea that one cart was sent to the wrong room, reject
  it using an earlier clue, reconstruct the actual sequence in which the carts
  were prepared, and use several clues together to decide how the stations
  should be rearranged before the visitors arrive.
constraints:
- Match vocabulary, sentence structure, emotional intensity, exposition, pacing, and concept complexity to the exact target age and reading mode.
- Keep causality explicit enough for the target reader without becoming didactic.
- No combat; resolve tension through observation, communication, reasoning, exploration, or cooperation.
- Preserve continuity across all six scenes.
- Do not mention that the story is a benchmark or test.
- No clue may depend on information the reader has not yet been given.
- Include at least one reasonable false hypothesis that is later rejected by evidence.
- The final solution must use multiple earlier clues.
- The intended reader is exactly age 10; reading mode is INDEPENDENT_READER; do not write for a younger or older audience.
