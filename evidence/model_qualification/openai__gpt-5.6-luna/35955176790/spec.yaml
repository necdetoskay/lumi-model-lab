title_hint: The Bench in the Quiet Garden
age_min: 6
age_max: 8
language: en
target_words: 2000
protagonist: Elif, a young child who finds it difficult to talk about feelings right away but pays close attention to the world around her
setting: a lakeside neighborhood, a small community garden, and a birdwatching area in the LUMI universe
theme: noticing feelings, trust, and calm communication
premise: Elif learns that a neighbor she cares about very much will be moving to another district. She becomes quiet after hearing the news; through small encounters in the garden and a preparation she makes during the day, she gradually moves toward expressing her feelings at her own pace.
constraints:
  - The story must not become heavy or frightening.
  - Elif's feelings must not be suddenly resolved by a single conversation.
  - Adults must not solve the problem for Elif.
  - Emotional progress must be shown through small actions and observations.
  - The ending must feel warm without becoming overly instructional or slogan-like.
