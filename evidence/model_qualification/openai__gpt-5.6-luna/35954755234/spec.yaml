title_hint: The Signal in the Mist
age_min: 6
age_max: 8
language: en
target_words: 2000
protagonist: Ada, a curious and careful young explorer who tries not to decide before seeing evidence
setting: mist-covered coastal cliffs, tidal caves, and old waystones in the LUMI universe
theme: curiosity, observation, and patient exploration
premise: Ada notices an unusual light signal that appears on the coast for only a few minutes each evening. To reach its source, she must carefully evaluate the tides, stone markings, and small changes in her surroundings.
constraints:
  - The story must not be frightening.
  - Ada must make at least one incorrect assumption and correct it through a concrete observation.
  - The mystery must not be solved by a single coincidence or miracle.
  - The solution must depend on combining at least two different clues.
  - The ending must leave a small opening for a future discovery.
