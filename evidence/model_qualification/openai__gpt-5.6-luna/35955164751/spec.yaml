title_hint: The Three Sounds of the Clock Tower
age_min: 6
age_max: 8
language: en
target_words: 2000
protagonist: Deniz, a young problem solver who loves noticing patterns but can trust the first answer too quickly
setting: an old clock tower, a small town square, and a mechanical toy shop in the LUMI universe
theme: problem solving, testing ideas, and verifying with evidence
premise: The town clock tower begins making three different sounds at the wrong times. To discover why, Deniz must compare the order of the sounds, the mechanisms inside the tower, and the daily movements in the square.
constraints:
  - The problem must not be solved by magical intervention.
  - Deniz must be wrong about the first proposed solution.
  - The correct solution must depend on connecting at least three observations or clues.
  - The solution must be explained clearly enough for a child reader to follow.
  - The ending must leave a small but logical new question.
