title_hint: The Shared Map
age_min: 6
age_max: 8
language: en
target_words: 2000
protagonist: Ege, a young mapmaker who loves generating ideas but sometimes does not listen closely enough to his friends' contributions
setting: a small market town and the colorful gardens around it in the LUMI universe
theme: friendship, listening, and solving problems together
premise: Ege and his friend Lina want to prepare an exploration map for children to use during the upcoming Garden Day. Their different ideas keep clashing, and they need to discover together a need that neither of them noticed alone.
constraints:
  - The conflict must not depend on physical danger.
  - No character may be labeled as bad or mocking.
  - Ege must genuinely listen to Lina at least once and change his idea because of what he hears.
  - The solution must include concrete collaboration beyond simply apologizing.
  - The story must not end with a direct moral lesson.
