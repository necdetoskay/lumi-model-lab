name: SpineForge v12 Mechanical Normalization Zero-Cost Replay

on:
  push:
    branches:
      - experiment/spineforge-v12-deterministic-mechanical-normalization
    paths:
      - 'tests/test_spineforge_v11_attempt1_offline_replay.py'
      - '.github/workflows/spineforge-v12-offline-replay.yml'

jobs:
  replay:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Replay exact v11 Attempt 1 evidence without model calls
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q tests/test_spineforge_v11_attempt1_offline_replay.py
