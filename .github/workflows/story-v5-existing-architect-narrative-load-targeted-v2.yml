name: Story v5 Existing Architect Narrative Load Targeted V2

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - .github/workflows/story-v5-existing-architect-narrative-load-targeted-v2.yml
      - experiments/prototypes/story_v5_existing_architect_narrative_load_targeted_v2_20260926.py
      - experiments/fixtures/story_v5_existing_architect_baseline_cohort_b_v1.json
      - experiments/triggers/story-v5-existing-architect-narrative-load-targeted-v2.txt
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile targeted integration probe
        run: python -m py_compile experiments/prototypes/story_v5_existing_architect_narrative_load_targeted_v2_20260926.py
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json
      - name: Run targeted frozen-baseline A/B
        run: PYTHONPATH=. python experiments/prototypes/story_v5_existing_architect_narrative_load_targeted_v2_20260926.py
      - name: Archive evidence
        if: always()
        shell: bash
        run: |
          test -s runs/story-v5-existing-architect-narrative-load-targeted/result.json
          DEST="experiments/results/story-v5-existing-architect-narrative-load-targeted-v2/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-v5-existing-architect-narrative-load-targeted/* "$DEST/"
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "story-v5-existing-architect-narrative-load-targeted-v2",
            "baseline_source_run": 36227676063,
            "extra_planner_model_hop": false,
            "target_families": ["emotional_development", "everyday_fantastical_discovery"],
            "architect_max_tokens": 8192,
            "writer_max_tokens": 16384,
            "judge_max_tokens": 8192
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): targeted architect narrative load ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-existing-architect-narrative-load-targeted-v2-${GITHUB_RUN_ID}"
