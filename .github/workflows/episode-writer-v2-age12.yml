name: Episode Writer V2 Age12 Approved Spine

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/episode-writer-v2-age12.txt'

permissions:
  contents: write

jobs:
  write:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write approved Episode Spine with Aion 3.5 Mini
        run: >-
          PYTHONPATH=. python -m src.episode_writer_v2_generate
          --approved data/specifications/story_lab/age12_episode1_spine_revision_05_approved.json
          --out runs/episode-writer-v2-age12/result.json
          --story-out runs/episode-writer-v2-age12/story.txt

      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/episode-writer-v2-age12/result.json
          TMP="$(mktemp -d)"
          cp runs/episode-writer-v2-age12/result.json "$TMP/result.json"
          if test -s runs/episode-writer-v2-age12/story.txt; then cp runs/episode-writer-v2-age12/story.txt "$TMP/story.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/episode-writer-v2-age12-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/episode-writer-v2-age12/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          if test -s "$TMP/story.txt"; then cp "$TMP/story.txt" "$DEST/story.txt"; fi
          git add "$DEST"
          git commit -m "evidence(story): archive approved Episode Writer v2 ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
