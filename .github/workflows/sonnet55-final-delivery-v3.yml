name: Sonnet 5.5 Final Turkish Delivery V3

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-final-delivery-v3.txt'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply notation patch and run final fidelity V3
        run: >-
          PYTHONPATH=. python -m src.sonnet55_final_delivery_v3_notation_recovery
          --source data/specifications/story_lab/sonnet55_final_delivery_v2_run_36580391689.json
          --out runs/sonnet55-final-delivery-v3/result.json
          --en-out runs/sonnet55-final-delivery-v3/final_en.txt
          --tr-out runs/sonnet55-final-delivery-v3/final_tr.txt
      - name: Archive final V3 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-final-delivery-v3/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-final-delivery-v3/result.json "$TMP/result.json"
          test -s runs/sonnet55-final-delivery-v3/final_en.txt && cp runs/sonnet55-final-delivery-v3/final_en.txt "$TMP/final_en.txt" || true
          test -s runs/sonnet55-final-delivery-v3/final_tr.txt && cp runs/sonnet55-final-delivery-v3/final_tr.txt "$TMP/final_tr.txt" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-final-delivery-v3-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-final-delivery-v3/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          test -s "$TMP/final_en.txt" && cp "$TMP/final_en.txt" "$DEST/final_en.txt" || true
          test -s "$TMP/final_tr.txt" && cp "$TMP/final_tr.txt" "$DEST/final_tr.txt" || true
          git add "$DEST"
          git commit -m "evidence(qual): archive final Turkish delivery V3 ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
