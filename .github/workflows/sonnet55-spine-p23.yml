name: Sonnet 5.5 Spine P2.3 Role Qualification

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-spine-p23.txt'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EPISODE_SPINE_ARCHITECT_MODEL: "anthropic/claude-sonnet-5.5"
      EPISODE_SPINE_GATE_MODEL: "openai/gpt-5.6-luna"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run P2.3 Main Saga role revision
        run: >-
          PYTHONPATH=. python -m src.episode_spine_v2_generate
          --revision-feedback data/specifications/story_lab/sonnet55_p23_spine_revision_feedback.json
          --out runs/sonnet55-spine-p23/result.json
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-spine-p23/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-spine-p23/result.json "$TMP/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-spine-p23-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-spine-p23/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          git add "$DEST/result.json"
          git commit -m "evidence(qual): archive Sonnet 5.5 spine P2.3 ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
