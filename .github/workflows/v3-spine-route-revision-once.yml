# INSTALL ONLY after owner review in:
# .github/workflows/v3-spine-route-revision-once.yml
# on branch experiment/v3-spine-route-revision-20261015.
# Adding this workflow file alone DOES NOT run a paid test.
# A later explicit push of the grant with commit marker is required.
name: Final V3 Strict-Gate Single Attempt

on:
  push:
    branches:
      - experiment/v3-spine-route-revision-20261015
    paths:
      - experiments/triggers/v3-spine-route-f2-once-20261015.json
      - experiments/triggers/v3-spine-route-f2-offline-20261015.json

permissions:
  contents: read

concurrency:
  group: lumi-final-v3-single-spine-paid-20261015
  cancel-in-progress: false

jobs:
  offline-qualification:
    if: >-
      contains(github.event.head_commit.message, '[V3-SPINE-OFFLINE-CHECK]') &&
      github.ref == 'refs/heads/experiment/v3-spine-route-revision-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65da68a13e8874597b6f36a439a379083142b231
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Zero-provider frozen Spine replay and regression
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q             tests/test_v3_single_attempt_guard.py             tests/test_age18_frozen_lane_v1.py             tests/test_frozen_lane_generic_spine_runtime.py             tests/test_age18_lane_stabilization_matrix.py             tests/test_sonnet55_cross_age_matrix.py             tests/test_story_lane_qualification_policy.py             tests/test_frozen_lane_authority_gate.py             tests/test_frozen_lane_repair_runtime.py             tests/test_frozen_lane_translation_runtime.py
      - name: Verify read-only GitHub repository claim access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/experiments/v3_single_attempt_spine_probe.py?ref=experiment/v3-spine-route-revision-20261015" --jq .sha >/dev/null
          echo "GITHUB_READONLY_CLAIM_ENDPOINT_PASS"
  single-spine:
    if: >-
      github.ref == 'refs/heads/experiment/v3-spine-route-revision-20261015' &&
      contains(github.event.head_commit.message, '[V3-SPINE-PAID-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate grant and freeze exact known guard commit
        shell: bash
        env:
          APPROVED_GUARD_SHA: 65da68a13e8874597b6f36a439a379083142b231
          GRANT_PATH: experiments/triggers/v3-spine-route-f2-once-20261015.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3-spine-one"
          export GRANT_COPY="$RUNNER_TEMP/v3-spine-one/grant.json"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          source=pathlib.Path(os.environ["GRANT_PATH"])
          grant=json.loads(source.read_text(encoding="utf-8"))
          required={
              "schema": "lumi.v3-single-attempt-paid-grant.v2",
              "authorized": True,
              "stage": "SPINE",
              "case_id": "age18.forbidden-cartographer.fantasy.frozen-01",
              "frozen_runtime_sha": "63e1e3ce82c244bc5bb02b0463a9a1a6715c941b",
              "models": ["anthropic/claude-sonnet-5.5","openai/gpt-5.6-luna"],
              "guard_commit_sha": os.environ["APPROVED_GUARD_SHA"],
              "max_total_usd": "0.35",
          }
          if any(grant.get(k)!=v for k,v in required.items()):
              raise SystemExit("UNAUTHORIZED_OR_MISMATCHED_GRANT")
          feedback=grant.get("revision_feedback") or {}
          if feedback.get("source_architect_run_id")!=38697673557:
              raise SystemExit("F2_SOURCE_RUN_FEEDBACK_MISSING")
          if feedback.get("required_chronological_route")!=["vellum_hall","greyfen","ashen_gate","greyfen","vellum_hall"]:
              raise SystemExit("F2_ROUTE_FEEDBACK_MISSING")
          if feedback.get("must_not_autocorrect_past_output") is not True:
              raise SystemExit("F2_SILENT_AUTOCORRECT_FORBIDDEN")
          if not isinstance(grant.get("human_approval_reference"),str):
              raise SystemExit("HUMAN_APPROVAL_REFERENCE_REQUIRED")
          import re
          gid=grant.get("grant_id")
          if not isinstance(gid,str) or re.fullmatch("[A-Za-z0-9][A-Za-z0-9_-]{7,79}",gid) is None:
              raise SystemExit("INVALID_GRANT_ID")
          shutil.copyfile(source,os.environ["GRANT_COPY"])
          os.chmod(os.environ["GRANT_COPY"],0o600)
          print("GRANT_PREFLIGHT_PASS_NO_PROVIDER_CALL")
          PY
          git cat-file -e "${APPROVED_GUARD_SHA}^{commit}"
          git checkout --detach "$APPROVED_GUARD_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_GUARD_SHA"
          test -z "$(git status --porcelain)"
          echo "FROZEN_GUARD_SHA=$APPROVED_GUARD_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify frozen code and retry guard without provider access
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify \
            --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q \
            tests/test_v3_single_attempt_guard.py \
            tests/test_age18_frozen_lane_v1.py \
            tests/test_frozen_lane_generic_spine_runtime.py

      - name: Verify operator-bound global one-use claim (read only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GRANT_COPY: ${{ runner.temp }}/v3-spine-one/grant.json
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "::error::REPLAY_BLOCKED_RUN_ATTEMPT_NOT_ONE"
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os, subprocess, time
          grant=json.load(open(os.environ["GRANT_COPY"], encoding="utf-8"))
          gid=grant["grant_id"]
          ref="evidence/v3-paid-claim-"+gid
          api_path="repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/claims/"+gid+".json?ref="+ref
          expected={
              "schema":"lumi.v3-global-run-claim.v1",
              "grant_id":gid,
              "stage":"SPINE",
              "case_id":"age18.forbidden-cartographer.fantasy.frozen-01",
              "source_commit":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "guard_commit_sha":"65da68a13e8874597b6f36a439a379083142b231",
              "authorized":True,
          }
          for check in range(30):
              result=subprocess.run(["gh","api",api_path], capture_output=True,text=True)
              if result.returncode:
                  if "HTTP 404" in result.stderr:
                      time.sleep(2)
                      continue
                  raise SystemExit("GLOBAL_CLAIM_READ_DENIED_NO_PROVIDER_CALL")
              try:
                  response=json.loads(result.stdout)
                  decoded=base64.b64decode(response["content"])
                  claim=json.loads(decoded)
              except (KeyError,ValueError,TypeError) as exc:
                  raise SystemExit("GLOBAL_CLAIM_FORMAT_INVALID_NO_PROVIDER_CALL") from exc
              if any(claim.get(key)!=value for key,value in expected.items()):
                  raise SystemExit("GLOBAL_CLAIM_RUN_OR_SOURCE_MISMATCH_NO_PROVIDER_CALL")
              print("GLOBAL_CLAIM_EXACT_RUN_BOUND_AND_VERIFIED")
              break
          else:
              raise SystemExit("GLOBAL_CLAIM_NOT_AUTHORIZED_NO_PROVIDER_CALL")
          PY

      - name: Execute one authorized Spine (Sonnet, then Luna only if eligible)
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GRANT_COPY: ${{ runner.temp }}/v3-spine-one/grant.json
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::GitHub Actions OpenRouter secret missing in this job"
            exit 1
          fi
          PYTHONPATH=. python -B -m experiments.v3_single_attempt_spine_probe \
            --grant "$GRANT_COPY" \
            --claim-dir "$RUNNER_WORKSPACE/../_lumi_v3_claims" \
            --evidence-dir "$RUNNER_TEMP/v3-spine-one/evidence"
          echo "NO_WRITER_DISPATCHED"

      - name: Archive evidence even when the model fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-final-v3-spine-single-attempt-${{ github.run_id }}
          path: ${{ runner.temp }}/v3-spine-one/evidence/
          if-no-files-found: warn
          retention-days: 90
