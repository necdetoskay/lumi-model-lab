name: Story Harness P4.34 B03 Sealed Pilot English Master

on:
  push:
    branches:
      - experiment/story-harness-control-plane-v1
    paths:
      - src/story_harness_p434_b03_master.py
      - tests/test_story_harness_p434_b03_master.py
      - evidence/story_harness_p433/b03-r06-original-independent-quality-accept.json

permissions:
  contents: read

concurrency:
  group: lumi-p434-b03-sealed-english-master
  cancel-in-progress: false

jobs:
  seal-original-b03-pilot-master:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/experiment/story-harness-control-plane-v1' && github.run_attempt == 1 }}
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: ${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove original audit receipt, source and negative tests without providers
        run: |
          python -m unittest discover -s tests -p 'test_story_harness_p434_b03_master.py' -v
          python -m src.story_harness_p434_b03_master
      - name: Reverify already-sealed original B03 English Master read-only (NO inference)
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          from src.story_harness_p435_b03_q25 import load_b03_bundle
          from src.story_harness_p434_b03_master import MASTER_DIR
          root=Path(os.environ['RUNNER_WORKSPACE'])
          bundle=load_b03_bundle('.',
              root/'_lumi_p431_b03_story_claims',
              root/'_lumi_p433_b03_quality_claims',
              root/'_lumi_p434_b03_master_claims')
          f=root/'_lumi_p434_b03_master_claims'/MASTER_DIR
          raw=(f/'ENGLISH_MASTER.txt').read_bytes()
          manifest=bundle['master']
          assert hashlib.sha256(raw).hexdigest()=='80fa8224c78c494b13bc347ecabdfff75fd5c9e1638ad88ee9ba47c6986643f9'
          assert manifest['source_story_sha256']==bundle['source']['story']['story_sha256']
          assert manifest['independent_initial_audit_verdict']=='ACCEPT'
          assert manifest['reader_score']==4
          assert manifest['production_state_write_authorized'] is False
          print('P434_B03_ENGLISH_MASTER_ORIGINAL_BYTES_GREEN')
          print('P434_B03_MASTER_SHA='+manifest['accepted_story_sha256'])
          print('P434_B03_NEW_MODEL_CALLS=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumi-p434-b03-original-accepted-pilot-master
          path: ${{ runner.workspace }}/_lumi_p434_b03_master_claims/b03-80fa8224c78c494b/
          if-no-files-found: warn
          retention-days: 30
