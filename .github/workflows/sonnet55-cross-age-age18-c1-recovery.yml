name: Sonnet 5.5 Cross-Age Age18 C1 Luna Recovery

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-cross-age-age18-c1-recovery.txt'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Normalize existing age18 spine and run Luna gate only
        run: >-
          PYTHONPATH=. python -m src.cross_age_age18_c1_gate_recovery
          --source data/specifications/story_lab/sonnet55_cross_age_age18_c1_recovery_source_36608347735.json
          --prompt prompts/episode_spine_gate_v2.md
          --out runs/sonnet55-cross-age-age18-c1-recovery/result.json
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-cross-age-age18-c1-recovery/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-cross-age-age18-c1-recovery/result.json "$TMP/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-cross-age-age18-c1-recovery-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-cross-age-age18-c1-recovery/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          git add "$DEST/result.json"
          git commit -m "evidence(qual): archive age18 C1 Luna recovery ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
