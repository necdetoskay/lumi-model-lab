name: Editor Length Preservation
permissions:
  contents: write
on:
  push:
    paths:
      - experiments/triggers/editor-length-preservation.txt
      - experiments/prototypes/editor_length_preservation_20260926.py
      - experiments/fixtures/story_editor_length_preservation_source_36220448569.json
  workflow_dispatch:
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python experiments/prototypes/editor_length_preservation_20260926.py
      - name: Archive evidence
        run: |
          test -s runs/editor-length-preservation/result.json
          test -s runs/editor-length-preservation/final.txt
          DEST="experiments/results/editor-length-preservation/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/editor-length-preservation/result.json "$DEST/result.json"
          cp runs/editor-length-preservation/final.txt "$DEST/final.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): editor length preservation ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/editor-length-preservation-${GITHUB_RUN_ID}"
