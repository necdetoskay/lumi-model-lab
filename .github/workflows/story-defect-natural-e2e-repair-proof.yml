name: Story Defect Natural E2E Repair Proof

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-defect-natural-e2e-repair-proof.txt

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NATURAL_PROOF_DIAGNOSTIC_ADJUDICATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Contract test
        run: PYTHONPATH=. python -m unittest -v tests.test_story_defect_natural_e2e_repair_proof
      - name: Compile proof
        run: python -m py_compile experiments/prototypes/story_defect_natural_e2e_repair_proof_20260926.py
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.50
      - name: Run selected detector repair recheck regression chain
        run: |
          PROOF_ID="$(awk -F= '$1=="proof_id" {print $2}' experiments/triggers/story-defect-natural-e2e-repair-proof.txt | tail -1)"
          if [ -n "$PROOF_ID" ] && [ "$PROOF_ID" != "ALL" ]; then
            export NATURAL_PROOF_IDS="$PROOF_ID"
          else
            unset NATURAL_PROOF_IDS
          fi
          PYTHONPATH=. python experiments/prototypes/story_defect_natural_e2e_repair_proof_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/story-defect-natural-e2e-repair-proof/result.json
          DEST="experiments/results/story-defect-natural-e2e-repair-proof/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-defect-natural-e2e-repair-proof/result.json "$DEST/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): natural N1 repair proof ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-defect-natural-e2e-repair-proof-${GITHUB_RUN_ID}"
