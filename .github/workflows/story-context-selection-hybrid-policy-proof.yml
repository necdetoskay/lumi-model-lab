name: Story Context Selection Hybrid Policy Proof

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-context-selection-hybrid-policy-proof.txt

jobs:
  proof:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic hybrid policy proof
        run: PYTHONPATH=. python experiments/prototypes/story_context_selection_hybrid_policy_proof_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/story-context-selection-hybrid-policy-proof/result.json
          DEST="experiments/results/story-context-selection-hybrid-policy-proof/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-context-selection-hybrid-policy-proof/result.json "$DEST/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): hybrid context policy proof ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-context-selection-hybrid-policy-proof-${GITHUB_RUN_ID}"
