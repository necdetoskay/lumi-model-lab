name: Age18 Forbidden Cartographer F1 Recovery Gate

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/age18-forbidden-cartographer-f1-recovery.txt'

permissions:
  contents: write

jobs:
  gate:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Leyra F1 Luna gate only
        run: >-
          PYTHONPATH=. python -m src.forbidden_cartographer_f1_gate_recovery
          --source data/specifications/story_lab/age18_forbidden_cartographer_f1_recovery_source_36656865491.json
          --prompt prompts/episode_spine_gate_v2.md
          --out runs/age18-forbidden-cartographer-f1-recovery/result.json
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/age18-forbidden-cartographer-f1-recovery/result.json
          TMP="$(mktemp -d)"
          cp runs/age18-forbidden-cartographer-f1-recovery/result.json "$TMP/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/age18-forbidden-cartographer-f1-recovery-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/age18-forbidden-cartographer-f1-recovery/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          git add "$DEST/result.json"
          git commit -m "evidence(qual): archive Leyra F1 recovery ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
