name: SpineForge v17 Audit-Only Frozen Attempt

on:
  push:
    branches:
      - experiment/spineforge-v17-audit-only-recovery
    paths:
      - experiments/triggers/spineforge-v17.json

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen v17 runtime and run one authorized audit attempt
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf runs/spineforge-v17
          PYTHONPATH=. python -m src.spineforge_v17_stage \
            --trigger experiments/triggers/spineforge-v17.json \
            --out-dir runs/spineforge-v17
      - name: Emit compact immutable evidence summary
        if: always()
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m src.spineforge_v17_evidence_summary \
            --result runs/spineforge-v17/result.json \
            --out runs/spineforge-v17/evidence_summary.json
          exit 0
      - name: Persist full evidence to qualification branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d runs/spineforge-v17 ]; then
            echo "No v17 run directory exists; refusing durable evidence."
            exit 1
          fi
          target="experiments/results/spineforge-v17/${GITHUB_RUN_ID}"
          mkdir -p "${target}"
          cp -a runs/spineforge-v17/. "${target}/"
          cp experiments/triggers/spineforge-v17.json "${target}/trigger.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target}"
          git commit -m "evidence(spineforge-v17): persist run ${GITHUB_RUN_ID}"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Upload artifact best-effort
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: spineforge-v17-${{ github.run_id }}
          path: |
            runs/spineforge-v17
            experiments/triggers/spineforge-v17.json
          if-no-files-found: warn
          retention-days: 30
