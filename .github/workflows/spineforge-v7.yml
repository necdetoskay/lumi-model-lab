name: SpineForge v7 Partitioned Strict Compiler Frozen Attempt

on:
  push:
    branches:
      - experiment/spineforge-v7-partitioned-strict-compiler
    paths:
      - experiments/triggers/spineforge-v7.json

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen v7 runtime and run one authorized attempt
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf runs/spineforge-v7
          PYTHONPATH=. python -m src.spineforge_v7_stage \
            --trigger experiments/triggers/spineforge-v7.json \
            --out-dir runs/spineforge-v7
      - name: Upload immutable attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spineforge-v7-${{ github.run_id }}
          path: |
            runs/spineforge-v7
            experiments/triggers/spineforge-v7.json
          if-no-files-found: warn
          retention-days: 30
