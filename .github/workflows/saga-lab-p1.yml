name: Saga Lab Contract and Generator

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/saga-lab-p1.yml'
      - 'configs/saga_lab/**'
      - 'data/specifications/saga_lab/**'
      - 'src/saga_blueprint_contract.py'
      - 'src/saga_blueprint_generate.py'
      - 'prompts/saga_narrative_architect_v1.md'
      - 'tests/test_saga_blueprint_contract.py'
      - 'tests/test_saga_blueprint_generate.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Saga Lab profile and frozen fixtures
        run: >-
          python -m src.saga_blueprint_contract
          --profile configs/saga_lab/narrative_architect_v1.yaml
          --fixtures data/specifications/saga_lab/character_world_fixtures_v1.json

      - name: Run Saga Lab contract and generator tests
        run: >-
          python -m unittest
          tests.test_saga_blueprint_contract
          tests.test_saga_blueprint_generate
          -v

      - name: Run no-cost Narrative Architect fixture smoke
        run: >-
          python -m src.saga_blueprint_generate
          --config configs/saga_lab/narrative_architect_fixture_v1.yaml
          --fixture-id mature_adult_dormant_archivist
