name: SFR v1 Q6C Prop Guard
# Q6C paid probe trigger: single-use claim guards inference.
# Q6C active qualification lane

on:
  pull_request:
    paths:
      - 'src/spineforge_relay_v1_q6c_prop_guard.py'
      - 'tests/test_spineforge_relay_v1_q6c_prop_guard.py'
      - 'tests/fixtures/spineforge_relay_v1/q6c_prop_probe.json'
      - 'prompts/spineforge_relay_v1_q6c_guard.md'
      - 'evidence/spineforge-relay/SFR-V1-Q6C-PROP-GUARD-PREFLIGHT-20261007/**'
      - '.github/workflows/spineforge-relay-v1-q6c-prop-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q6c-zero-cost-gate:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Bootstrap Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip --version >/dev/null 2>&1 || {
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
            python3 /tmp/get-pip.py --user --break-system-packages
          }
          python3 -m pip install --user --break-system-packages -r requirements.txt pytest

      - name: Run Relay qualification tests
        run: python3 -m pytest -q tests/test_spineforge_relay_v1_*.py

      - name: Verify frozen Q6C preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from src.spineforge_relay_v1_q6c_prop_guard import prepare, AUTH_SCOPE, MAX_COST_USD
          base = Path("evidence/spineforge-relay/SFR-V1-Q6C-PROP-GUARD-PREFLIGHT-20261007")
          p = json.loads((base / "preflight.json").read_text())
          a = json.loads((base / "authorization.json").read_text())
          assert p == prepare(base)
          assert a["status"] == "AUTHORIZED"
          assert a["paid_execution_authorized"] is True
          assert a["scope"] == AUTH_SCOPE
          assert a["preflight_sha256"] == p["artifact_sha256"]
          assert a["max_cost_usd"] == MAX_COST_USD
          assert a["max_guard_calls"] == 1
          assert a["automatic_retry"] is False
          assert a["state_application_authorized"] is False
          print(p["artifact_sha256"])
          PY

  q6c-paid-prop-guard:
    needs: q6c-zero-cost-gate
    if: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && needs.q6c-zero-cost-gate.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Bootstrap Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip --version >/dev/null 2>&1 || {
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
            python3 /tmp/get-pip.py --user --break-system-packages
          }
          python3 -m pip install --user --break-system-packages -r requirements.txt pytest

      - name: Verify credential and exact Q6C authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo '::error::OPENROUTER_API_KEY missing'; exit 1; }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from src.spineforge_relay_v1_q6c_prop_guard import verify
          base = Path("evidence/spineforge-relay/SFR-V1-Q6C-PROP-GUARD-PREFLIGHT-20261007")
          p = verify(base / "preflight.json", base / "guard-input.json")
          a = json.loads((base / "authorization.json").read_text())
          assert a["preflight_sha256"] == p["artifact_sha256"]
          print("preflight_sha=" + p["artifact_sha256"])
          PY

      - name: Claim Q6C authorization before inference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, requests
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          sha = "${{ steps.auth.outputs.preflight_sha }}"
          path = f"evidence/spineforge-relay/claims/q6c-{sha[:16]}.json"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          existing = requests.get(url, headers=headers, params={"ref": "experiment/spineforge-relay-v1"}, timeout=30)
          if existing.status_code == 200:
              raise SystemExit("Q6C authorization already claimed")
          if existing.status_code != 404:
              raise SystemExit(f"Cannot verify Q6C claim state: HTTP {existing.status_code}")
          claim = {
              "preflight_sha256": sha,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "job": os.environ["GITHUB_JOB"],
              "status": "CLAIMED_BEFORE_INFERENCE",
          }
          body = {
              "message": "claim(sfr-v1): reserve Q6C prop guard authorization",
              "content": base64.b64encode((json.dumps(claim, separators=(",", ":")) + "\n").encode()).decode(),
              "branch": "experiment/spineforge-relay-v1",
          }
          created = requests.put(url, headers=headers, json=body, timeout=30)
          if created.status_code not in (200, 201):
              raise SystemExit(f"Failed Q6C claim: HTTP {created.status_code} " + created.text[:500])
          print(path)
          PY

      - name: Execute exactly one Q6C prop guard call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from src.spineforge_relay_v1_q6c_prop_guard import execute_once
          base = Path("evidence/spineforge-relay/SFR-V1-Q6C-PROP-GUARD-PREFLIGHT-20261007")
          a = json.loads((base / "authorization.json").read_text())
          out = execute_once(
              api_key=os.environ["OPENROUTER_API_KEY"],
              run_id="github-" + os.environ["GITHUB_RUN_ID"],
              authorization=a,
              preflight_path=base / "preflight.json",
              input_path=base / "guard-input.json",
              output_root=Path("q6c-live"),
          )
          Path("q6c-summary.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(out, ensure_ascii=False, indent=2))
          if out["status"] != "PROP_GUARD_QUALIFIED":
              raise SystemExit(2)
          PY

      - name: Upload Q6C evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sfr-v1-q6c-${{ github.run_id }}
          path: |
            q6c-summary.json
            q6c-live/
          if-no-files-found: warn
          retention-days: 30
