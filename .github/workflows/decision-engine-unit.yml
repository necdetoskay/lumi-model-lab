name: Decision Engine Unit Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/decision-engine-unit.yml'
      - 'src/decision_engine.py'
      - 'src/decision_engine_runner.py'
      - 'src/judge_gold_corpus.py'
      - 'src/judge_atomic_rubric.py'
      - 'tests/test_decision_engine.py'
      - 'tests/test_judge_gold_corpus.py'
      - 'tests/test_judge_atomic_rubric.py'
      - 'data/specifications/judge_gold_corpus_v2.json'
      - 'data/specifications/judge_atomic_rubric_v1.yaml'
      - 'configs/decision_engine_*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate decision-engine and judge qualification contracts
        run: >-
          python -m unittest
          tests.test_decision_engine
          tests.test_judge_gold_corpus
          tests.test_judge_atomic_rubric
          -v

      - name: Validate frozen gold-corpus structure
        run: python -m src.judge_gold_corpus

      - name: Validate atomic rubric structure
        run: python -m src.judge_atomic_rubric
