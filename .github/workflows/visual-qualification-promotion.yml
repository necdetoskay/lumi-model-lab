name: Visual Model Promotion Qualification

on:
  workflow_dispatch:
    inputs:
      screen_run_id:
        description: GitHub Actions run id of the completed visual live screen
        required: true
        type: string
      confirm_paid_run:
        description: Type I_UNDERSTAND_THIS_RUN_IS_PAID to authorize promotion calls
        required: true
        default: "NO"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-live-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Resolve paid-run authorization
        id: authorize
        shell: bash
        run: |
          if [ "${{ inputs.confirm_paid_run }}" = "I_UNDERSTAND_THIS_RUN_IS_PAID" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "Paid promotion was not authorized; all paid steps will be skipped."
          fi

      - uses: actions/checkout@v4
        if: steps.authorize.outputs.authorized == 'true'

      - uses: actions/setup-python@v5
        if: steps.authorize.outputs.authorized == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies
        if: steps.authorize.outputs.authorized == 'true'
        run: python -m pip install -r requirements.txt

      - name: Download screen evidence
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/download-artifact@v4
        with:
          name: visual-live-screen-v1-${{ inputs.screen_run_id }}
          path: runs/visual_qualification/live-screen-v1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.screen_run_id }}

      - name: Validate promotion evidence
        if: steps.authorize.outputs.authorized == 'true'
        shell: bash
        run: |
          test -s runs/visual_qualification/live-screen-v1/qualification_report.json
          test -s runs/visual_qualification/live-screen-v1/promotion_shortlist.json
          test -s runs/visual_qualification/live-screen-v1/promotion_config.yaml

      - name: Print promotion plan before provider access
        if: steps.authorize.outputs.authorized == 'true'
        run: >-
          python -m src.visual_qualification_runner
          --config runs/visual_qualification/live-screen-v1/promotion_config.yaml
          --plan-only

      - name: Fail closed when provider key is unavailable
        if: steps.authorize.outputs.authorized == 'true'
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY repository secret is required." >&2
            exit 2
          fi

      - name: Run paid promotion qualification
        if: steps.authorize.outputs.authorized == 'true'
        run: >-
          python -m src.visual_qualification_runner
          --config runs/visual_qualification/live-screen-v1/promotion_config.yaml
          --evidence-dir runs/visual_qualification/live-promotion-v1
          --authorize-paid

      - name: Upload promotion evidence
        if: steps.authorize.outputs.authorized == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-live-promotion-v1-${{ github.run_id }}
          path: |
            runs/visual_qualification/live-screen-v1/promotion_shortlist.json
            runs/visual_qualification/live-screen-v1/promotion_config.yaml
            runs/visual_qualification/live-promotion-v1/
          if-no-files-found: warn
          retention-days: 30
