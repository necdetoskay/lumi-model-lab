name: Visual Model Promotion Qualification

on:
  workflow_dispatch:
    inputs:
      screen_run_id:
        description: GitHub Actions run id of the completed visual live screen
        required: true
        type: string
      confirm_paid_run:
        description: Type I_UNDERSTAND_THIS_RUN_IS_PAID to authorize promotion calls
        required: true
        default: "NO"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-live-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Resolve paid-run authorization
        id: authorize
        shell: bash
        run: |
          if ! [[ "${{ inputs.screen_run_id }}" =~ ^[0-9]+$ ]]; then
            echo "screen_run_id must be a numeric GitHub Actions run id." >&2
            exit 2
          fi
          if [ "${{ inputs.confirm_paid_run }}" = "I_UNDERSTAND_THIS_RUN_IS_PAID" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "Paid promotion was not authorized; all paid steps will be skipped."
          fi

      - uses: actions/checkout@v4
        if: steps.authorize.outputs.authorized == 'true'

      - uses: actions/setup-python@v5
        if: steps.authorize.outputs.authorized == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies
        if: steps.authorize.outputs.authorized == 'true'
        run: python -m pip install -r requirements.txt

      - name: Download screen evidence
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/download-artifact@v4
        with:
          name: visual-live-screen-v1-${{ inputs.screen_run_id }}
          path: runs/visual_qualification/live-screen-v1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.screen_run_id }}

      - name: Validate promotion evidence
        if: steps.authorize.outputs.authorized == 'true'
        shell: bash
        run: |
          test -s runs/visual_qualification/live-screen-v1/qualification_report.json
          test -s runs/visual_qualification/live-screen-v1/promotion_shortlist.json
          test -s runs/visual_qualification/live-screen-v1/promotion_config.yaml
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path("runs/visual_qualification/live-screen-v1")
          report = json.loads((root / "qualification_report.json").read_text())
          shortlist = json.loads((root / "promotion_shortlist.json").read_text())
          config = yaml.safe_load((root / "promotion_config.yaml").read_text()) or {}

          if report.get("schema") != "visual-qualification-report.v1":
              raise SystemExit("unexpected source qualification report schema")
          if report.get("name") != "visual-live-screen-v1":
              raise SystemExit("promotion source must be the canonical live screen")
          if report.get("provider_mode") != "openrouter":
              raise SystemExit("screen provider_mode must be openrouter")
          if report.get("evaluator_mode") != "openrouter":
              raise SystemExit("screen evaluator_mode must be openrouter")

          if shortlist.get("schema") != "visual-screening-shortlist.v1":
              raise SystemExit("unexpected promotion shortlist schema")
          if shortlist.get("source_report") != report.get("name"):
              raise SystemExit("shortlist source does not match screen report")

          if config.get("schema_version") != "visual-qualification.v1":
              raise SystemExit("unexpected promotion config schema")
          if config.get("provider_mode") != "openrouter":
              raise SystemExit("promotion provider_mode must be openrouter")
          if config.get("evaluator_mode") != "openrouter":
              raise SystemExit("promotion evaluator_mode must be openrouter")

          seed = "runs/visual_qualification/live-screen-v1/qualification_report.json"
          if config.get("seed_reports") != [seed]:
              raise SystemExit("promotion config must seed exactly the downloaded screen report")

          config_cells = {
              (item["model_id"], item["style_id"], item["category"])
              for item in (config.get("cells") or [])
          }
          shortlist_cells = {
              (item["model_id"], item["style_id"], item["category"])
              for item in (shortlist.get("selected_cells") or [])
          }
          if not config_cells:
              raise SystemExit("promotion config contains no cells")
          if config_cells != shortlist_cells:
              raise SystemExit("promotion cells do not exactly match the shortlist")

          promotion_source = config.get("promotion_source") or {}
          if promotion_source.get("source_report") != report.get("name"):
              raise SystemExit("promotion_source does not match the screen report")
          if promotion_source.get("seed_report_path") != seed:
              raise SystemExit("promotion_source seed path mismatch")

          if int(config.get("runs_per_cell") or 0) < 1:
              raise SystemExit("promotion requires at least one additional run")
          PY

      - name: Print promotion plan before provider access
        if: steps.authorize.outputs.authorized == 'true'
        run: >-
          python -m src.visual_qualification_runner
          --config runs/visual_qualification/live-screen-v1/promotion_config.yaml
          --plan-only

      - name: Fail closed when provider key is unavailable
        if: steps.authorize.outputs.authorized == 'true'
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY repository secret is required." >&2
            exit 2
          fi

      - name: Run paid promotion qualification
        if: steps.authorize.outputs.authorized == 'true'
        run: >-
          python -m src.visual_qualification_runner
          --config runs/visual_qualification/live-screen-v1/promotion_config.yaml
          --evidence-dir runs/visual_qualification/live-promotion-v1
          --authorize-paid

      - name: Build immutable production routing evidence
        if: steps.authorize.outputs.authorized == 'true'
        run: >-
          python -m src.visual_routing_evidence
          --report runs/visual_qualification/live-promotion-v1/qualification_report.json
          --output runs/visual_qualification/live-promotion-v1/routing_evidence.json
          --require-production-authorized

      - name: Upload promotion evidence
        if: steps.authorize.outputs.authorized == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-live-promotion-v1-${{ github.run_id }}
          path: |
            runs/visual_qualification/live-screen-v1/promotion_shortlist.json
            runs/visual_qualification/live-screen-v1/promotion_config.yaml
            runs/visual_qualification/live-promotion-v1/
          if-no-files-found: warn
          retention-days: 30
