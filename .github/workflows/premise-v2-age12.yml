name: Premise Architect V2 Age12 Qualification

on:
  workflow_dispatch:
    inputs:
      architect_model:
        description: "OpenRouter model id for Premise Architect"
        required: false
        default: "anthropic/claude-sonnet-5"
      gate_model:
        description: "OpenRouter model id for Premise Gate"
        required: false
        default: "openai/gpt-5.6-luna"
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/premise-v2-age12.txt'

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PREMISE_ARCHITECT_MODEL: ${{ inputs.architect_model || 'anthropic/claude-sonnet-5' }}
      PREMISE_GATE_MODEL: ${{ inputs.gate_model || 'openai/gpt-5.6-luna' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and gate age12 premises
        run: >-
          PYTHONPATH=. python -m src.premise_architect_v2_generate
          --out runs/premise-v2-age12/result.json

      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/premise-v2-age12/result.json

          TMP="$(mktemp -d)"
          cp runs/premise-v2-age12/result.json "$TMP/result.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          EVIDENCE_BRANCH="evidence/premise-v2-age12-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true

          DEST="experiments/results/premise-v2-age12/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"

          git add "$DEST/result.json"
          git commit -m "evidence(premise): archive age12 premise run ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
