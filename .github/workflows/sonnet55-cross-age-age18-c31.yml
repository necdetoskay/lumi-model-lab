name: Sonnet 5.5 Cross-Age Age18 C3.1 Typed Authority V2

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-cross-age-age18-c31.txt'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run age18 C3.1 Luna typed-authority-v2 gate only
        run: >-
          PYTHONPATH=. python -m src.compact_authority_v2_qualification
          --source data/specifications/story_lab/age18_cross_age_c2_postprocess_source_36612862926.json
          --approved data/specifications/story_lab/age18_cross_age_c11_approved.json
          --gold data/specifications/story_lab/age18_cross_age_c2_confirmed_authority_gold.json
          --prompt prompts/story_compact_authority_gate_v3.md
          --out runs/sonnet55-cross-age-age18-c31/result.json
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-cross-age-age18-c31/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-cross-age-age18-c31/result.json "$TMP/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-cross-age-age18-c31-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-cross-age-age18-c31/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          git add "$DEST/result.json"
          git commit -m "evidence(qual): archive age18 C3.1 typed authority ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
