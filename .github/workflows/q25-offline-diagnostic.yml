name: Q25 Offline Diagnostic
on:
  workflow_dispatch:
    inputs:
      execute_paid:
        description: 'Paid pilot one-time authorization (requires manual dispatch)'
        type: boolean
        default: false
        required: true
      case:
        description: 'Immutable trial case, model request excludes reference labels'
        type: choice
        required: true
        default: q24
        options:
          - q24
          - kite-01
      model:
        description: 'Pinned qualified OpenRouter model'
        type: choice
        required: true
        default: anthropic/claude-sonnet-5.5
        options:
          - anthropic/claude-sonnet-5.5
          - google/gemini-2.5-flash
  pull_request:
    paths:
      - src/q25_offline_diagnostic.py
      - src/q25_entity_candidates.py
      - src/q25_state_admission.py
      - src/q25_story_evidence.py
      - src/q25_state_coverage.py
      - src/q25_terminal_properties.py
      - src/q25_extractor_adapter.py
      - src/q25_openrouter_pilot.py
      - src/q25_model_metadata.py
      - src/q25_paid_response_diagnostic.py
      - src/q25_semantic_review.py
      - src/q25_review_worklist.py
      - src/q25_provisional_review.py
      - src/q25_terminal_reconciler.py
      - src/q25_extraction_benchmark.py
      - src/q25_raw_reconciliation.py
      - src/q25_withheld_trial.py
      - tests/test_q25_*.py
      - evidence/q25/**
      - .github/workflows/q25-offline-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: q25-offline-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline:
    # Dedicated unprivileged host identity, no Docker/sudo, private-network deny.
    # Repo-specific label prevents workload migration onto other LUMI runners.
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install "pydantic>=2.8,<3" pytest
      - name: Run citation, authority and frozen baseline tests
        run: python -m pytest -q tests/test_q25_offline_diagnostic.py tests/test_q25_frozen_baseline.py tests/test_q25_entity_candidates.py tests/test_q25_entity_frozen_case.py tests/test_q25_state_admission.py tests/test_q25_admission_frozen_case.py tests/test_q25_story_evidence.py tests/test_q25_state_coverage.py tests/test_q25_terminal_properties.py tests/test_q25_extractor_adapter.py tests/test_q25_openrouter_pilot.py tests/test_q25_semantic_review.py tests/test_q25_review_worklist.py tests/test_q25_provisional_review.py tests/test_q25_terminal_reconciler.py tests/test_q25_extraction_benchmark.py tests/test_q25_raw_reconciliation.py tests/test_q25_withheld_trial.py tests/test_q25_model_metadata.py tests/test_q25_paid_response_diagnostic.py tests/test_q25_successful_extractor_03.py

  paid-extractor-pilot:
    # Never starts from PRs, pushes, or CI retries. The run is manually
    # approved through workflow_dispatch. No fallback, retry or production.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_paid == true && github.run_attempt == 1 }}
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded pilot dependencies
        run: python -m pip install 'pydantic>=2.8,<3'
      - name: Single charged request (fail-closed)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          Q25_PAID_PILOT_APPROVED: '1'
          Q25_MODEL: ${{ inputs.model }}
          Q25_TRIAL_CASE: ${{ inputs.case }}
        run: |
          case "$Q25_TRIAL_CASE" in
            q24)
              inputs=(
                --seed evidence/q25/Q25-P0-P4-OFFLINE-20261012/frozen-evidence/Q24/seed-input.json
                --prose-record evidence/q25/Q25-P0-P4-OFFLINE-20261012/frozen-evidence/Q24/writer-2-text.json
                --policy evidence/q25/Q25-ADMISSION-DRAFT-20261012/policy.json
              )
              ;;
            kite-01)
              inputs=(--request-package evidence/q25/Q25-WITHHELD-TRIAL-20261012/request.json)
              ;;
            *) echo "Unknown trial case"; exit 2;;
          esac
          python -m src.q25_openrouter_pilot \
            "${inputs[@]}" \
            --model "$Q25_MODEL" \
            --max-tokens 3500 \
            --max-cost-usd 0.20 \
            --execute-paid-once \
            --archive-dir "$RUNNER_TEMP/q25-paid-${{ github.run_id }}"
      - name: Freeze evidence (private 7-day retention, including a failed pilot)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: q25-paid-extractor-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/q25-paid-${{ github.run_id }}/
          retention-days: 7
          if-no-files-found: warn
