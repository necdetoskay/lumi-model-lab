name: Q25 Offline Diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/q25_offline_diagnostic.py
      - src/q25_entity_candidates.py
      - src/q25_state_admission.py
      - src/q25_story_evidence.py
      - src/q25_state_coverage.py
      - src/q25_terminal_properties.py
      - src/q25_extractor_adapter.py
      - tests/test_q25_*.py
      - evidence/q25/**
      - .github/workflows/q25-offline-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: q25-offline-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  offline:
    # Dedicated unprivileged host identity, no Docker/sudo, private-network deny.
    # Repo-specific label prevents workload migration onto other LUMI runners.
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install "pydantic>=2.8,<3" pytest
      - name: Run citation, authority and frozen baseline tests
        run: python -m pytest -q tests/test_q25_offline_diagnostic.py tests/test_q25_frozen_baseline.py tests/test_q25_entity_candidates.py tests/test_q25_entity_frozen_case.py tests/test_q25_state_admission.py tests/test_q25_admission_frozen_case.py tests/test_q25_story_evidence.py tests/test_q25_state_coverage.py tests/test_q25_terminal_properties.py tests/test_q25_extractor_adapter.py
