name: Q25 Offline Diagnostic
on:
  push:
    branches: [experiment/q25-narrative-memory-intent]
    paths:
      - src/q25_offline_diagnostic.py
      - src/q25_entity_candidates.py
      - src/q25_state_admission.py
      - tests/test_q25_*.py
      - evidence/q25/**
      - .github/workflows/q25-offline-diagnostic.yml
  pull_request:
    paths:
      - src/q25_offline_diagnostic.py
      - src/q25_entity_candidates.py
      - src/q25_state_admission.py
      - tests/test_q25_*.py
      - evidence/q25/**
      - .github/workflows/q25-offline-diagnostic.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install "pydantic>=2.8,<3" pytest
      - name: Run citation, authority and frozen baseline tests
        run: python -m pytest -q tests/test_q25_offline_diagnostic.py tests/test_q25_frozen_baseline.py tests/test_q25_entity_candidates.py tests/test_q25_entity_frozen_case.py tests/test_q25_state_admission.py tests/test_q25_admission_frozen_case.py
