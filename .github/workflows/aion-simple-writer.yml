name: Aion Simple Writer
permissions:
  contents: write
on:
  push:
    paths:
      - experiments/triggers/aion-simple-writer.txt
      - experiments/prototypes/aion_simple_writer_20260926.py
  workflow_dispatch:
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python experiments/prototypes/aion_simple_writer_20260926.py
      - name: Archive evidence
        run: |
          test -s runs/aion-simple-writer/result.json
          test -s runs/aion-simple-writer/story.txt
          DEST="experiments/results/aion-simple-writer/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/aion-simple-writer/result.json "$DEST/result.json"
          cp runs/aion-simple-writer/story.txt "$DEST/story.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): Aion simple writer ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/aion-simple-writer-${GITHUB_RUN_ID}"
