name: Lighthouse Isolated Source Adjudication
on:
  push:
    branches: [experiment/spineforge-v21-bounded-scene-quality]
    paths: ['evidence/lighthouse-editorial/source-adjudication-hosted-authorization.json']
permissions:
  contents: read
  actions: write
jobs:
  qualify-and-repair:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[LIGHTHOUSE-SOURCE-ADJUDICATION-HOSTED-01]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cancel only the superseded queued experiment before any model call
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.cancel_queued_experiment
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_lighthouse_*.py tests/test_plan_audit_contract.py tests/test_story_delivery.py tests/test_audit_citation_projection.py tests/test_cancel_queued_experiment.py tests/test_spineforge_v21_*.py
      - name: Qualify controls and run bounded repair inside original total budget
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.lighthouse_source_adjudication_hosted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-source-adjudication-hosted-${{ github.run_id }}
          path: |
            evidence/lighthouse-source-audit/LIGHTHOUSE-SOURCE-ADJUDICATION-HOSTED-01-20261005/
            evidence/lighthouse-source-audit/LIGHTHOUSE-SOURCE-ADJUDICATION-HOSTED-01-20261005-cancellation.json
