name: SpineForge v5 Zero-Cost Qualification Prep

on:
  push:
    branches:
      - experiment/spineforge-v5-contract-tolerance

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: v5 focused regression
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spineforge_v5_context_runtime.py
          tests/test_spineforge_v5_stage.py
          tests/test_spineforge_v5_frozen.py
          tests/test_spine_context_pack_v1.py
          tests/test_spineforge_v3_context_runtime.py
          tests/test_spineforge_v4_context_runtime.py
