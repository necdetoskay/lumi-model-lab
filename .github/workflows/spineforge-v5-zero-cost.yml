name: SpineForge v5 Zero-Cost Boundary Proof

on:
  push:
    branches:
      - experiment/spineforge-v5-creative-structural-split
    paths:
      - 'src/spineforge_v5_contract.py'
      - 'src/openrouter_json_schema.py'
      - 'prompts/spineforge_*v5*.md'
      - 'docs/canonical/SPINEFORGE_V5_CREATIVE_STRUCTURAL_SPLIT.md'
      - 'tests/test_spineforge_v5_contract_boundary.py'
      - 'tests/test_openrouter_json_schema.py'
      - 'data/specifications/story_lab/spineforge_v5_replay_v4_attempt*_raw.json'
      - '.github/workflows/spineforge-v5-zero-cost.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: v5 boundary proof
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_openrouter_json_schema.py
          tests/test_spineforge_v5_contract_boundary.py
      - name: v4 safety regression
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spine_context_pack_v1.py
          tests/test_spineforge_v3_context_runtime.py
          tests/test_spineforge_v4_context_runtime.py
          tests/test_spineforge_v4_stage.py
          -k "not starts_zero_spend_and_without_paid_trigger"
