name: SpineForge v5 Creative Blueprint Zero-Cost

on:
  push:
    branches:
      - experiment/spineforge-v5-creative-blueprint-boundary

permissions:
  contents: read

jobs:
  contract-proof:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: v5 contract proof
        run: PYTHONPATH=. python -m pytest -q tests/test_spineforge_v5_contract.py
      - name: v1-v4 active regression
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spine_context_pack_v1.py
          tests/test_spineforge_v2_context_runtime.py
          tests/test_spineforge_v2_stage.py
          tests/test_spineforge_v2_frozen.py
          tests/test_spineforge_v3_context_runtime.py
          tests/test_spineforge_v3_stage.py
          tests/test_spineforge_v3_frozen.py
          tests/test_spineforge_v4_context_runtime.py
          tests/test_spineforge_v4_stage.py
          tests/test_spineforge_v4_frozen.py
          -k "not starts_zero_spend_and_without_paid_trigger"
