name: Saga Spine V2 Age12 Qualification

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model id for the Saga Architect"
        required: false
        default: "anthropic/claude-sonnet-5"
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/saga-spine-v2-age12.txt'

permissions:
  contents: write

jobs:
  generate:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SAGA_SPINE_V2_MODEL: ${{ inputs.model || 'anthropic/claude-sonnet-5' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate age12 Saga Spine v2
        run: >-
          PYTHONPATH=. python -m src.saga_spine_v2_generate
          --out runs/saga-spine-v2-age12/result.json

      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/saga-spine-v2-age12/result.json
          DEST="experiments/results/saga-spine-v2-age12/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/saga-spine-v2-age12/result.json "$DEST/result.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "evidence/saga-spine-v2-age12-${GITHUB_RUN_ID}"
          git add "$DEST/result.json"
          git commit -m "evidence(saga): archive age12 Saga Spine v2 run ${GITHUB_RUN_ID}"
          git push --force origin "evidence/saga-spine-v2-age12-${GITHUB_RUN_ID}"
