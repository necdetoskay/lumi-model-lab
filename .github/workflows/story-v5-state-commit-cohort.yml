name: Story v5 State Commit Cohort

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-v5-state-commit-cohort.txt

permissions:
  contents: write

jobs:
  commit_cohort:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile simulator
        run: python -m py_compile experiments/prototypes/state_commit_simulator_v1.py

      - name: Apply and replay all three cohort outcomes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/story_v5_commit_cohort

          run_case() {
            CASE="$1"
            STATE="$2"
            AUTHORITY="$3"
            OUTCOME="$4"
            KEY="$5"

            mkdir -p "runs/story_v5_commit_cohort/$CASE"

            PYTHONPATH=. python experiments/prototypes/state_commit_simulator_v1.py               --state "$STATE"               --authority "$AUTHORITY"               --outcome "$OUTCOME"               --idempotency-key "$KEY"               --output-state "runs/story_v5_commit_cohort/$CASE/committed-state.json"               --output-result "runs/story_v5_commit_cohort/$CASE/first-result.json"

            PYTHONPATH=. python experiments/prototypes/state_commit_simulator_v1.py               --state "runs/story_v5_commit_cohort/$CASE/committed-state.json"               --authority "$AUTHORITY"               --outcome "$OUTCOME"               --idempotency-key "$KEY"               --output-state "runs/story_v5_commit_cohort/$CASE/replayed-state.json"               --output-result "runs/story_v5_commit_cohort/$CASE/replay-result.json"
          }

          run_case             "ece"             "experiments/state_commit/v1/cohort-ece-initial-state.json"             "experiments/state_authority/cohort-ece-chalk-arrow.json"             "experiments/state_commit/v1/cohort-ece-900-friendship-outcome.json"             "story:cohort-ece:1"

          run_case             "arda"             "experiments/state_commit/v1/cohort-arda-initial-state.json"             "experiments/state_authority/cohort-arda-clock-cards.json"             "experiments/state_commit/v1/cohort-arda-2300-puzzle-outcome.json"             "story:cohort-arda:1"

          run_case             "ada"             "experiments/state_commit/v1/cohort-ada-initial-state.json"             "experiments/state_authority/cohort-ada-flood-lines.json"             "experiments/state_commit/v1/cohort-ada-3600-world-lore-outcome.json"             "story:cohort-ada:1"

      - name: Assert atomic/idempotent cohort semantics
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path

          root = Path("runs/story_v5_commit_cohort")
          checks = {
              "ece": ("local_area.GLASS_PASSAGE.status", "RUMORED", 12, 6, 5, 4),
              "arda": ("local_area.ARCHIVE_STAIR.status", "RUMORED", 29, 18, 13, 7),
              "ada": ("local_area.SEALED_SURVEY_ROOM.status", "RUMORED", 64, 42, 19, 15),
          }

          for case, (boundary_key, boundary_value, world_rev, char_rev, saga_rev, opp_rev) in checks.items():
              first = json.loads((root / case / "first-result.json").read_text())
              replay = json.loads((root / case / "replay-result.json").read_text())
              committed = json.loads((root / case / "committed-state.json").read_text())
              replayed = json.loads((root / case / "replayed-state.json").read_text())

              assert first["status"] == "COMMITTED", (case, first)
              assert replay["status"] == "IDEMPOTENT_REPLAY", (case, replay)
              assert committed == replayed, f"{case}: replay mutated state"
              assert committed["entities"]["WORLD:CURRENT"]["values"][boundary_key] == boundary_value
              assert committed["entities"]["WORLD:CURRENT"]["revision"] == world_rev
              assert committed["entities"]["CHARACTER:PROTAGONIST"]["revision"] == char_rev
              assert committed["entities"]["SAGA:CURRENT"]["revision"] == saga_rev
              assert committed["entities"]["OPPORTUNITY:CURRENT"]["revision"] == opp_rev
              assert committed["entities"]["OPPORTUNITY:CURRENT"]["values"]["status"] == "CONSUMED"

          print("STATE_COMMIT_COHORT_PASS")
          PY

      - name: Archive commit cohort evidence
        shell: bash
        run: |
          DEST="experiments/results/story-v5-state-commit-cohort/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -R runs/story_v5_commit_cohort/. "$DEST/"
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "state-commit-simulator.v1",
            "cases": ["ece", "arda", "ada"]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): v5 state commit cohort ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-state-commit-cohort-${GITHUB_RUN_ID}"
