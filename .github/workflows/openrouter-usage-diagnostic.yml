name: OpenRouter Usage Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Query OpenRouter usage metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          key = os.environ["OPENROUTER_API_KEY"]

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {key}", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {"error": raw[:500]}
                  return e.code, body

          status, activity = get("https://openrouter.ai/api/v1/activity?date=2026-09-29")
          print("ACTIVITY_STATUS", status)
          if status == 200:
              rows = activity.get("data", activity if isinstance(activity, list) else [])
              if not isinstance(rows, list):
                  rows = []
              matches = []
              for row in rows:
                  blob = json.dumps(row, ensure_ascii=False).lower()
                  if "aion-3.5-mini" in blob:
                      allowed = {
                          k: row.get(k)
                          for k in (
                              "date","model","model_id","endpoint","endpoint_id","requests",
                              "prompt_tokens","completion_tokens","reasoning_tokens",
                              "tokens_prompt","tokens_completion","tokens_reasoning",
                              "usage","cost","total_cost"
                          )
                          if k in row
                      }
                      matches.append(allowed)
              print("AION35_MINI_ACTIVITY", json.dumps(matches, ensure_ascii=False))
          else:
              msg = activity.get("error") if isinstance(activity, dict) else activity
              print("ACTIVITY_ERROR", json.dumps(msg, ensure_ascii=False)[:1000])

          key_status, key_info = get("https://openrouter.ai/api/v1/key")
          print("KEY_STATUS", key_status)
          if key_status == 200 and isinstance(key_info, dict):
              data = key_info.get("data") or {}
              safe = {
                  k: data.get(k)
                  for k in (
                      "usage","usage_daily","usage_weekly","usage_monthly",
                      "limit","limit_remaining","is_free_tier"
                  )
                  if k in data
              }
              print("KEY_USAGE_SAFE", json.dumps(safe, ensure_ascii=False))
          PY
