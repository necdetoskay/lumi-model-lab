name: Story v5 Length Pressure Family Pairwise

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - .github/workflows/story-v5-length-pressure-family-pairwise.yml
      - experiments/prototypes/story_v5_length_pressure_family_pairwise_20260926.py
      - experiments/triggers/story-v5-length-pressure-family-pairwise.txt
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile probe
        run: python -m py_compile experiments/prototypes/story_v5_length_pressure_family_pairwise_20260926.py

      - name: Provider preflight
        run: python -m src.openrouter_preflight --json

      - name: Run family 500-vs-700 pairwise probe
        run: PYTHONPATH=. python experiments/prototypes/story_v5_length_pressure_family_pairwise_20260926.py

      - name: Archive evidence
        if: always()
        shell: bash
        run: |
          test -s runs/story-v5-length-pressure-family-pairwise/result.json
          DEST="experiments/results/story-v5-length-pressure-family-pairwise/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-v5-length-pressure-family-pairwise/result.json "$DEST/result.json"
          cp runs/story-v5-length-pressure-family-pairwise/*.txt "$DEST/"
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "story-v5-length-pressure-family-pairwise-v1",
            "exact_age": 4,
            "targets": [500, 700],
            "families": [
              "exploration_mystery",
              "friendship_social_problem",
              "emotional_development",
              "everyday_fantastical_discovery",
              "nature_environment"
            ],
            "writer": "anthropic/claude-sonnet-5",
            "judge": "openai/gpt-5.6-sol",
            "reasoning": "medium",
            "order_swapped": true
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): family length pressure pairwise ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-length-pressure-family-pairwise-${GITHUB_RUN_ID}"
