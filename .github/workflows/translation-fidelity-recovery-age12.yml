name: Translation Fidelity Recovery Age12

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/translation-fidelity-recovery-age12.txt'

permissions:
  contents: write

jobs:
  recover:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Adjudicate and, only if required, repair Turkish fidelity
        run: >-
          PYTHONPATH=. python -m src.translation_fidelity_recovery
          --source data/specifications/story_lab/age12_episode1_translation_recovery_36528435261.json
          --out runs/translation-fidelity-recovery-age12/result.json
          --tr-out runs/translation-fidelity-recovery-age12/final_tr.txt
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/translation-fidelity-recovery-age12/result.json
          TMP="$(mktemp -d)"
          cp runs/translation-fidelity-recovery-age12/result.json "$TMP/result.json"
          if test -s runs/translation-fidelity-recovery-age12/final_tr.txt; then cp runs/translation-fidelity-recovery-age12/final_tr.txt "$TMP/final_tr.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/translation-fidelity-recovery-age12-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/translation-fidelity-recovery-age12/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          if test -s "$TMP/final_tr.txt"; then cp "$TMP/final_tr.txt" "$DEST/final_tr.txt"; fi
          git add "$DEST"
          git commit -m "evidence(story): archive translation fidelity recovery ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
