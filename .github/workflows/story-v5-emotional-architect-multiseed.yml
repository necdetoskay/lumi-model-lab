name: Story v5 Emotional Architect Multi-Seed

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - .github/workflows/story-v5-emotional-architect-multiseed.yml
      - experiments/prototypes/story_v5_emotional_architect_multiseed_20260926.py
      - experiments/triggers/story-v5-emotional-architect-multiseed.txt
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile probe
        run: python -m py_compile experiments/prototypes/story_v5_emotional_architect_multiseed_20260926.py
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json
      - name: Run emotional multi-seed gate
        run: PYTHONPATH=. python experiments/prototypes/story_v5_emotional_architect_multiseed_20260926.py
      - name: Archive evidence
        if: always()
        shell: bash
        run: |
          test -s runs/story-v5-emotional-architect-multiseed/result.json
          DEST="experiments/results/story-v5-emotional-architect-multiseed/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-v5-emotional-architect-multiseed/* "$DEST/"
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "story-v5-emotional-architect-multiseed-v1",
            "prior_targeted_run": 36228645350,
            "baseline_source_run": 36227676063,
            "family": "emotional_development",
            "new_seeds": [2026093810, 2026094810],
            "extra_planner_model_hop": false,
            "architect_max_tokens": 8192,
            "writer_max_tokens": 16384,
            "judge_max_tokens": 8192
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): emotional architect multiseed ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-emotional-architect-multiseed-${GITHUB_RUN_ID}"
