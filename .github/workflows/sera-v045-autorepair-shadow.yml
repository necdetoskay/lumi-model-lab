name: SERA v0.45 SceneTrace Autonomous Shadow Repair — No Billing
on:
  push:
    branches:
      - experiment/sera-scene-state-v0-1-20261015
    paths:
      - experiments/sera/scene_trace_autorepair_v045.py
      - experiments/sera/scene_trace_real_challenge_smoke_v045.py
      - experiments/sera/tests/test_scene_trace_autorepair_v045.py
      - .github/workflows/sera-v045-autorepair-shadow.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine-risk-offline-auto-repair:
    runs-on: [self-hosted, linux]
    timeout-minutes: 12
    defaults:
      run:
        working-directory: sera-v045-source
    steps:
      - uses: actions/checkout@v4
        with:
          path: sera-v045-source
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce model policy and run ALL Python scene tests
        run: |
          set -euo pipefail
          python -m experiments.sera.request_policy
          python -m unittest discover -s experiments/sera/tests -q
      - name: Retrieve existing real Gemini and Haiku receipts WITHOUT provider key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sera-v045/bench" "$RUNNER_TEMP/sera-v045/pencil"
          gh run download 38936451931 --repo "$GITHUB_REPOSITORY" \
            --name sera-v040-real-blind-once-38936451931 \
            --dir "$RUNNER_TEMP/sera-v045/bench"
          gh run download 38938438488 --repo "$GITHUB_REPOSITORY" \
            --name sera-v041-real-pencil-once-38938438488 \
            --dir "$RUNNER_TEMP/sera-v045/pencil"
      - name: Real Mara source-risk cards undergo two-step synthetic auto-repair
        run: |
          set -euo pipefail
          python -m experiments.sera.scene_trace_real_challenge_smoke_v045 \
            --bench-receipt-dir "$RUNNER_TEMP/sera-v045/bench" \
            --pencil-receipt-dir "$RUNNER_TEMP/sera-v045/pencil" \
            --output-root "$RUNNER_TEMP/sera-v045/lab"
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"sera-v045/lab"
          proof=json.loads((root/"summary.json").read_text(encoding="utf-8"))
          worker=proof["synthetic_worker_result"]
          assert proof["status"]=="REAL_CHALLENGES_SYNTHETIC_REPAIR_VERIFIED_NONCANONICAL"
          assert worker["status"]=="SOURCE_BOUND_REPAIR_ADVISORIES_ONLY"
          assert worker["simulated_new_reply_count"]==3
          assert len(worker["source_bound_advisories"])==2
          assert any(x["status"]=="AUTO_REEXTRACTION_REQUIRED"
                     for x in worker["attempts"])
          assert worker["paid_provider_calls"]==0
          assert worker["auto_reextraction_performed_for_real_scene"] is False
          assert worker["independent_semantic_qualification"] is False
          assert worker["source_recall_improvement_proven"] is False
          assert worker["canonical_commit_authorized"] is False
          assert proof["production_db_writes"]==0
          assert proof["sqlite_lab_writes"]==0
          print("SERA_V045_REAL_CHALLENGES_OFFLINE_AUTOREPAIR_NONCANONICAL_PASS")
          PY
      - name: Archive synthetic provider receipts and source-only noncanonical proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-v045-real-risk-offline-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sera-v045/lab/summary.json
            ${{ runner.temp }}/sera-v045/lab/durable-worker/
          retention-days: 90
          if-no-files-found: warn
