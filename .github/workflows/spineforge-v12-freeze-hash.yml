name: SpineForge v12 Freeze Builder

on:
  push:
    branches:
      - experiment/spineforge-v12-deterministic-mechanical-normalization
    paths:
      - experiments/freeze/spineforge-v12.request

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build v12 freeze profile from exact checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          paths = [
              ".github/workflows/spineforge-v12.yml",
              "requirements.txt",
              "configs/model_runtime_profiles.yaml",
              "src/spine_context_pack_v1.py",
              "src/spineforge_freeze_verify.py",
              "src/spineforge_v12.py",
              "src/spineforge_v12_normalizer.py",
              "src/spineforge_v11_contract.py",
              "src/spineforge_v12_case_manifest.py",
              "src/spineforge_v12_stage.py",
              "src/spineforge_v12_evidence_summary.py",
              "prompts/spineforge_single_owner_architect_v11.md",
              "prompts/spineforge_single_owner_auditor_v11.md",
              "src/episode_spine_v3_contract.py",
              "src/premise_architect_v2_contract.py",
              "src/reader_profile_v2.py",
              "src/saga_blueprint_contract.py",
              "src/saga_spine_v2_contract.py",
              "src/english_story_pipeline.py",
              "src/generate.py",
              "src/schemas.py",
              "src/model_registry.py",
              "src/model_usage_rollup.py",
          ]

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          profile = {
              "schema_version": "spineforge-runtime-profile.v1",
              "runtime_id": "spineforge.contextpack.v12",
              "status": "FROZEN_QUALIFICATION_CANDIDATE",
              "purpose": "Single-owner Sonnet roleplay-first Episode Spine generation with deterministic mechanical route normalization before validation and aggressive Sonnet red-team audit.",
              "runtime": {
                  "generation_runtime": "src/spineforge_v12.py",
                  "mechanical_normalizer": "src/spineforge_v12_normalizer.py",
                  "spine_architect_model": "anthropic/claude-sonnet-5.5",
                  "architect_prompt": "prompts/spineforge_single_owner_architect_v11.md",
                  "spine_auditor_model": "anthropic/claude-sonnet-5.5",
                  "audit_prompt": "prompts/spineforge_single_owner_auditor_v11.md",
                  "architect_request_class": "saga_architect",
                  "audit_request_class": "editorial_audit",
                  "architect_max_tokens": 11000,
                  "audit_max_tokens": 4500,
                  "max_calls_per_attempt": 2,
                  "parse_retry_per_model_call": 0,
                  "automatic_semantic_repair_enabled": False,
                  "human_review_required_before_story_writer": True
              },
              "mechanical_normalization_policy": {
                  "allowed_paths": ["logistics_plan.location_sequence"],
                  "source_of_truth": "ordered beat.location_ref transitions",
                  "semantic_change_forbidden": True,
                  "idempotence_required": True
              },
              "story_quality_policy": {
                  "roleplay_first": True,
                  "active_protagonist_required": True,
                  "sceneable_beats_required": True,
                  "world_specific_story_mechanics_required": True,
                  "causal_escalation_required": True,
                  "evidence_grounded_reversal_required": True,
                  "consequential_decision_required": True,
                  "earned_climax_required": True,
                  "local_payoff_required": True,
                  "age_maturity_protected": True
              },
              "transport_policy": {
                  "provider_strict_json_schema": False,
                  "json_object_transport": True,
                  "local_episode_spine_validation_after_normalization": True,
                  "local_audit_contract_validation": True,
                  "provider_grammar_size_not_used": True
              },
              "evidence_policy": {
                  "full_repo_evidence_required": True,
                  "repo_evidence_path": "experiments/results/spineforge-v12/<run_id>",
                  "artifact_upload": "best_effort_only",
                  "artifact_quota_may_not_destroy_primary_evidence": True,
                  "exact_token_cost_latency_required": True,
                  "normalization_report_required": True
              },
              "paid_boundary_policy": {
                  "explicit_authorization_required_for_attempt_1": True,
                  "no_automatic_paid_retry": True,
                  "no_automatic_semantic_repair": True,
                  "no_writer_call_inside_spineforge": True
              },
              "no_code_change_qualification_rule": {
                  "enabled": True,
                  "first_paid_case_starts_only_after_runtime_freeze": True,
                  "runtime_hash_mismatch_invalidates_active_case": True,
                  "runtime_or_prompt_change_requires_new_spineforge_revision": True,
                  "scenario_specific_runtime_patch_counts_as_case_failure": True
              },
              "runtime_freeze": {
                  "enabled": True,
                  "runtime_revision": "SPINEFORGE-DETERMINISTIC-NORMALIZATION-FROZEN-v12",
                  "runtime_source_commit": os.environ["GITHUB_SHA"],
                  "files": [{"path": p, "sha256": sha256(p)} for p in paths]
              }
          }

          out = Path("data/specifications/story_lab/spineforge_runtime_profile_v12_deterministic_normalization_frozen.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(profile, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "runtime_revision": profile["runtime_freeze"]["runtime_revision"],
              "runtime_source_commit": profile["runtime_freeze"]["runtime_source_commit"],
              "frozen_files": len(paths)
          }, indent=2))
          PY
      - name: Commit freeze profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/specifications/story_lab/spineforge_runtime_profile_v12_deterministic_normalization_frozen.json
          git commit -m "canon(spineforge-v12): freeze deterministic normalization runtime"
          git push origin HEAD:experiment/spineforge-v12-deterministic-mechanical-normalization
