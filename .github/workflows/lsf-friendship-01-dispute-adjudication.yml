name: LSF Friendship 01 Dispute Adjudication

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/lsf-friendship-01-dispute-adjudication.txt

jobs:
  adjudication:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.25
      - name: Run adjudication
        run: PYTHONPATH=. python experiments/prototypes/lsf_friendship_01_dispute_adjudication_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/lsf-friendship-01-dispute-adjudication/result.json
          DEST="experiments/results/lsf-friendship-01-dispute-adjudication/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/lsf-friendship-01-dispute-adjudication/result.json "$DEST/result.json"
          if test -s runs/lsf-friendship-01-dispute-adjudication/turkish.txt; then cp runs/lsf-friendship-01-dispute-adjudication/turkish.txt "$DEST/turkish.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): friendship verifier dispute adjudication ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/lsf-friendship-01-dispute-adjudication-${GITHUB_RUN_ID}"
