name: Episode Postprocess V2 Age12

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/episode-postprocess-v2-age12.txt'

permissions:
  contents: write

jobs:
  postprocess:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run semantic QA, bounded repair, translation and fidelity
        run: >-
          PYTHONPATH=. python -m src.episode_postprocess_v2
          --source data/specifications/story_lab/age12_episode1_writer_run_36526379349.json
          --approved-spine data/specifications/story_lab/age12_episode1_spine_revision_05_approved.json
          --out runs/episode-postprocess-v2-age12/result.json
          --en-out runs/episode-postprocess-v2-age12/accepted_en.txt
          --tr-out runs/episode-postprocess-v2-age12/delivery_tr.txt

      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/episode-postprocess-v2-age12/result.json
          TMP="$(mktemp -d)"
          cp runs/episode-postprocess-v2-age12/result.json "$TMP/result.json"
          if test -s runs/episode-postprocess-v2-age12/accepted_en.txt; then cp runs/episode-postprocess-v2-age12/accepted_en.txt "$TMP/accepted_en.txt"; fi
          if test -s runs/episode-postprocess-v2-age12/delivery_tr.txt; then cp runs/episode-postprocess-v2-age12/delivery_tr.txt "$TMP/delivery_tr.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/episode-postprocess-v2-age12-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/episode-postprocess-v2-age12/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          if test -s "$TMP/accepted_en.txt"; then cp "$TMP/accepted_en.txt" "$DEST/accepted_en.txt"; fi
          if test -s "$TMP/delivery_tr.txt"; then cp "$TMP/delivery_tr.txt" "$DEST/delivery_tr.txt"; fi
          git add "$DEST"
          git commit -m "evidence(story): archive age12 postprocess ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
