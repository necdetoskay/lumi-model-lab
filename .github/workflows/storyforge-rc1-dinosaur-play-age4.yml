name: StoryForge RC1 Dinosaur Play Age4

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/storyforge-rc1-dinosaur-play-age4.txt

jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.25
      - name: Run StoryForge RC1 dinosaur-play story
        run: PYTHONPATH=. python experiments/prototypes/storyforge_rc1_dinosaur_play_age4_20260927.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/storyforge-rc1-dinosaur-play-age4/result.json
          DEST="experiments/results/storyforge-rc1-dinosaur-play-age4/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/storyforge-rc1-dinosaur-play-age4/result.json "$DEST/result.json"
          if test -s runs/storyforge-rc1-dinosaur-play-age4/english.txt; then cp runs/storyforge-rc1-dinosaur-play-age4/english.txt "$DEST/english.txt"; fi
          if test -s runs/storyforge-rc1-dinosaur-play-age4/turkish.txt; then cp runs/storyforge-rc1-dinosaur-play-age4/turkish.txt "$DEST/turkish.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(storyforge): dinosaur-play age4 ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/storyforge-rc1-dinosaur-play-age4-${GITHUB_RUN_ID}"
