name: Story Defect Locator Regression

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/prototypes/story_defect_locator_regression_20260925.py"
      - "experiments/fixtures/story_defect_locator_regression.tr-age4.v0.1.json"
      - "experiments/fixtures/story_defect_locator_stories/**"
      - "experiments/triggers/story-defect-locator-regression.txt"

jobs:
  regression:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run frozen locator regression
        run: PYTHONPATH=.:experiments/prototypes python experiments/prototypes/story_defect_locator_regression_20260925.py
      - name: Archive evidence
        run: |
          test -s runs/story_defect_locator_regression/result.json
          DEST="experiments/results/story-defect-locator/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story_defect_locator_regression/result.json "$DEST/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): locator regression ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-defect-locator-${GITHUB_RUN_ID}"
