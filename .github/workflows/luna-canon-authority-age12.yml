name: Targeted Luna Canon Authority Qualification

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/luna-canon-authority-age12.txt'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run blind Luna canon/state authority gate only
        run: >-
          PYTHONPATH=. python -m src.story_canon_authority_qualification
          --source data/specifications/story_lab/age12_episode1_sonnet55_postprocess_source_36552606045.json
          --approved data/specifications/story_lab/age12_episode1_sonnet55_p27_approved.json
          --gold data/specifications/story_lab/sonnet55_writer_36552606045_confirmed_canon_gold.json
          --prompt prompts/story_canon_authority_gate_v1.md
          --out runs/story-canon-authority-qualification/result.json
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/story-canon-authority-qualification/result.json
          TMP="$(mktemp -d)"
          cp runs/story-canon-authority-qualification/result.json "$TMP/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/story-canon-authority-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/story-canon-authority/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          git add "$DEST/result.json"
          git commit -m "evidence(qual): archive targeted Luna canon authority ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
