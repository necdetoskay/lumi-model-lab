name: SpineForge v21 Zero-Cost Qualification

on:
  push:
    branches:
      - experiment/spineforge-v21-bounded-scene-quality
    paths:
      - 'src/spineforge_v21_*.py'
      - 'prompts/spineforge_v21_*.md'
      - 'data/specifications/story_lab/spineforge_v21_*.json'
      - 'data/specifications/story_lab/spineforge_runtime_profile_v21_*.json'
      - 'evidence/spineforge-v21-zero-cost/**'
      - 'tests/test_spineforge_v21_*.py'
      - 'docs/experiments/spineforge-v21-bounded-quality.md'
      - '.github/workflows/spineforge-v21-zero-cost.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-cost test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify v21 freeze and run offline qualification
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m src.spineforge_v21_freeze
          PYTHONPATH=. python -m pytest -q tests/test_spineforge_v21_*.py
          PYTHONPATH=. python -m src.spineforge_v21_zero_cost_qualification > /tmp/v21-regression.json
          PYTHONPATH=. python -m src.spineforge_v21_simulation
      - name: Upload zero-cost evidence
        uses: actions/upload-artifact@v4
        with:
          name: spineforge-v21-zero-cost-${{ github.run_id }}
          path: evidence/spineforge-v21-zero-cost/
          if-no-files-found: error

  paid-v21-bounded-quality:
    needs: qualify
    concurrency:
      group: spineforge-v21-paid-quality
      cancel-in-progress: false
    if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[PAID-V21-BOUNDED-QUALITY-E2E]')
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen v21 runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m src.spineforge_v21_freeze
      - name: Run bounded v21 quality E2E
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          PYTHONPATH=. python src/spineforge_v21_paid_quality_once.py
      - name: Upload paid v21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spineforge-v21-paid-quality-${{ github.run_id }}
          path: evidence/spineforge-v21-paid-quality/${{ github.run_id }}
          if-no-files-found: error
