name: SpineForge v21 Zero-Cost Qualification

on:
  push:
    branches:
      - experiment/spineforge-v21-bounded-scene-quality
    paths:
      - 'src/spineforge_v21_*.py'
      - 'prompts/spineforge_v21_*.md'
      - 'data/specifications/story_lab/spineforge_v21_*.json'
      - 'tests/test_spineforge_v21_*.py'
      - 'docs/experiments/spineforge-v21-bounded-quality.md'
      - '.github/workflows/spineforge-v21-zero-cost.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-cost test dependencies
        run: python -m pip install pytest
      - name: Run v21 bounded-quality tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/test_spineforge_v21_bounded_quality.py \
            tests/test_spineforge_v21_quality_runtime.py
      - name: Build zero-cost bridge regression evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python src/spineforge_v21_zero_cost_qualification.py
      - name: Upload zero-cost evidence
        uses: actions/upload-artifact@v4
        with:
          name: spineforge-v21-zero-cost-${{ github.run_id }}
          path: evidence/spineforge-v21-zero-cost/bridge-regression-qualification.json
          if-no-files-found: error
