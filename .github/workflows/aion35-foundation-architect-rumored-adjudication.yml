name: Aion 3.5 Foundation Architect RUMORED Adjudication
permissions:
  contents: write
on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/aion35-foundation-architect-rumored-adjudication.txt
jobs:
  adjudicate:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run adjudication
        run: PYTHONPATH=. python experiments/prototypes/aion35_foundation_architect_rumored_adjudication_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/aion35-foundation-architect-rumored-adjudication/result.json
          DEST="experiments/results/aion35-foundation-architect-rumored-adjudication/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/aion35-foundation-architect-rumored-adjudication/result.json "$DEST/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(foundation): RUMORED adjudication ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/aion35-foundation-architect-rumored-adjudication-${GITHUB_RUN_ID}"
