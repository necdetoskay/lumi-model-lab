name: SpineForge Relay v1 Q5 Paid Single Scene

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Exact approval gate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  q5-paid-single-scene:
    if: ${{ inputs.approval == 'APPROVED_SFR_V1_Q5_ONE_CALL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify frozen Q5 preflight and credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Repository secret OPENROUTER_API_KEY is not configured.'
            exit 1
          fi
          python -m src.spineforge_relay_v1_q5

      - name: Execute exactly one paid Q5 writer call
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.spineforge_relay_v1_q5 import MAX_COST_USD, execute_once, verify

          report = verify()
          authorization = {
              "paid_execution_authorized": True,
              "scope": "SFR_V1_Q5_SINGLE_SCENE_ONE_CALL",
              "preflight_sha256": report["artifact_sha256"],
              "max_cost_usd": MAX_COST_USD,
              "max_writer_calls": 1,
              "automatic_retry": False,
              "production_write": False,
              "state_application_authorized": False,
              "explicit_user_message": (
                  "User explicitly approved the Q5 paid single-scene call on "
                  "2026-10-06 and allowed a broader experiment budget up to USD 5; "
                  "this authorization remains intentionally bounded to one call "
                  "and the frozen Q5 ceiling."
              ),
          }
          out = execute_once(
              api_key=os.environ["OPENROUTER_API_KEY"],
              run_id="github-" + os.environ["GITHUB_RUN_ID"],
              authorization=authorization,
          )
          summary = {
              "status": out.get("status"),
              "api_calls": out.get("api_calls"),
              "usage": out.get("usage"),
              "automatic_retry_executed": out.get("automatic_retry_executed"),
              "state_application_authorized": out.get("state_application_authorized"),
              "failure_type": out.get("failure_type"),
              "failure_message": out.get("failure_message"),
          }
          Path("q5-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2))
          if out.get("status") != "WRITER_GENERATED_PENDING_SCENE_REVIEW":
              raise SystemExit(2)
          PY

      - name: Upload immutable Q5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfr-v1-q5-${{ github.run_id }}
          path: |
            q5-summary.json
            evidence/spineforge-relay/q5-runs/github-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
