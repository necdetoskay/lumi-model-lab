name: Model Qualification

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenRouter model id'
        required: true
        type: string
      screen_only:
        description: 'Run benchmark + judge screen only'
        required: true
        default: true
        type: boolean
      rerun:
        description: 'Allow intentional rerun of same fingerprint'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  qualify:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify OpenRouter credential
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Repository secret OPENROUTER_API_KEY is not configured.'
            exit 1
          fi
      - name: Run qualification
        shell: bash
        env:
          MODEL_ID: ${{ inputs.model }}
          SCREEN_ONLY: ${{ inputs.screen_only }}
          RERUN: ${{ inputs.rerun }}
        run: |
          args=(--model "$MODEL_ID")
          if [ "$SCREEN_ONLY" = "true" ]; then args+=(--screen); fi
          if [ "$RERUN" = "true" ]; then args+=(--rerun); fi
          python -m src.model_qualify "${args[@]}"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-qualification-${{ github.run_id }}
          path: |
            runs/qualifications/
            runs/model_registry/
          if-no-files-found: warn
          retention-days: 14
