name: Model Qualification

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenRouter model id'
        required: true
        type: string
      judge_model:
        description: 'Exact OpenRouter judge model id'
        required: true
        default: 'anthropic/claude-haiku-4.5'
        type: string
      screen_only:
        description: 'Run benchmark + judge screen only'
        required: true
        default: true
        type: boolean
      rerun:
        description: 'Allow intentional rerun of same fingerprint'
        required: true
        default: false
        type: boolean
      qualification_config:
        description: 'Qualification config path or exact Relay Q5 sentinel'
        required: true
        default: 'configs/qualification.yaml'
        type: string

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ inputs.qualification_config == 'SFR_V1_Q5_SINGLE_SCENE' && inputs.model == 'aion-labs/aion-3.5-mini' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/spineforge-relay-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify exact frozen authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Repository secret OPENROUTER_API_KEY is not configured.'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          from src.spineforge_relay_v1_q5 import MAX_COST_USD, verify

          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5-PREFLIGHT-20261006/authorization-template.json"
          ).read_text())
          report = verify()
          checks = {
              "status": auth.get("status") == "AUTHORIZED",
              "paid": auth.get("paid_execution_authorized") is True,
              "scope": auth.get("scope") == "SFR_V1_Q5_SINGLE_SCENE_ONE_CALL",
              "preflight": auth.get("preflight_sha256") == report["artifact_sha256"],
              "cost": auth.get("max_cost_usd") == MAX_COST_USD,
              "calls": auth.get("max_writer_calls") == 1,
              "retry": auth.get("automatic_retry") is False,
              "production": auth.get("production_write") is False,
              "state": auth.get("state_application_authorized") is False,
              "message": bool(auth.get("explicit_user_message")),
          }
          if not all(checks.values()):
              raise SystemExit("Q5 authorization check failed: " + str(checks))
          print("Q5 authorization verified for preflight " + report["artifact_sha256"])
          PY

      - name: Claim exact preflight before paid inference
        shell: bash
        run: |
          set -euo pipefail
          PREFLIGHT_SHA="$(python - <<'PY'
          import json
          print(json.load(open("evidence/spineforge-relay/SFR-V1-Q5-PREFLIGHT-20261006/preflight.json"))["artifact_sha256"])
          PY
          )"
          TAG="sfr-v1-q5-paid-$(printf '%s' "$PREFLIGHT_SHA" | cut -c1-16)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Q5 authorization already claimed by $TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Claim SFR-v1 Q5 paid authorization $PREFLIGHT_SHA"
          git push origin "refs/tags/$TAG"

      - name: Execute one paid scene writer call
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.spineforge_relay_v1_q5 import execute_once

          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5-PREFLIGHT-20261006/authorization-template.json"
          ).read_text())
          out = execute_once(
              api_key=os.environ["OPENROUTER_API_KEY"],
              run_id="github-" + os.environ["GITHUB_RUN_ID"],
              authorization=auth,
          )
          summary = {
              "status": out.get("status"),
              "api_calls": out.get("api_calls"),
              "usage": out.get("usage"),
              "automatic_retry_executed": out.get("automatic_retry_executed"),
              "state_application_authorized": out.get("state_application_authorized"),
              "failure_type": out.get("failure_type"),
              "failure_message": out.get("failure_message"),
          }
          Path("q5-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          if out.get("status") != "WRITER_GENERATED_PENDING_SCENE_REVIEW":
              raise SystemExit(2)
          PY

      - name: Upload Q5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfr-v1-q5-${{ github.run_id }}
          path: |
            q5-summary.json
            evidence/spineforge-relay/q5-runs/github-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
