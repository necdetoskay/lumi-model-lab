name: SFR-v1 Q5 Paid Single Scene

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Exact paid approval gate'
        required: true
        default: 'APPROVED_SFR_V1_Q5_ONE_CALL'
        type: string

permissions:
  contents: write

jobs:
  q5:
    if: ${{ inputs.approval == 'APPROVED_SFR_V1_Q5_ONE_CALL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/spineforge-relay-q5-live
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify frozen Q5 authorization and credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Repository secret OPENROUTER_API_KEY is not configured.'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          from src.spineforge_relay_v1_q5 import MAX_COST_USD, verify

          report = verify()
          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5-PREFLIGHT-20261006/authorization-template.json"
          ).read_text())
          assert auth["status"] == "AUTHORIZED"
          assert auth["paid_execution_authorized"] is True
          assert auth["scope"] == "SFR_V1_Q5_SINGLE_SCENE_ONE_CALL"
          assert auth["preflight_sha256"] == report["artifact_sha256"]
          assert auth["max_cost_usd"] == MAX_COST_USD == 0.01
          assert auth["max_writer_calls"] == 1
          assert auth["automatic_retry"] is False
          assert auth["production_write"] is False
          assert auth["state_application_authorized"] is False
          assert auth["explicit_user_message"]
          print(json.dumps({
              "preflight_sha256": report["artifact_sha256"],
              "planned_cost_usd": report["planned_uncached_cost_usd"],
              "max_cost_usd": MAX_COST_USD
          }, indent=2))
          PY

      - name: Claim authorization before inference
        shell: bash
        run: |
          set -euo pipefail
          SHA="cc7245e49a5290d1375522bf71069fbf99242e6dc3d73e73a6603d1a4122006d"
          TAG="sfr-v1-q5-paid-${SHA:0:16}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Authorization already claimed: $TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Claim SFR-v1 Q5 paid authorization $SHA"
          git push origin "refs/tags/$TAG"

      - name: Execute exactly one paid scene call
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.spineforge_relay_v1_q5 import execute_once

          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5-PREFLIGHT-20261006/authorization-template.json"
          ).read_text())
          out = execute_once(
              api_key=os.environ["OPENROUTER_API_KEY"],
              run_id="github-" + os.environ["GITHUB_RUN_ID"],
              authorization=auth,
          )
          summary = {
              "status": out.get("status"),
              "api_calls": out.get("api_calls"),
              "usage": out.get("usage"),
              "automatic_retry_executed": out.get("automatic_retry_executed"),
              "state_application_authorized": out.get("state_application_authorized"),
              "failure_type": out.get("failure_type"),
              "failure_message": out.get("failure_message"),
          }
          Path("q5-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          if out.get("status") != "WRITER_GENERATED_PENDING_SCENE_REVIEW":
              raise SystemExit(2)
          PY

      - name: Upload Q5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfr-v1-q5-${{ github.run_id }}
          path: |
            q5-summary.json
            evidence/spineforge-relay/q5-runs/github-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
