name: Model Qualification

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenRouter model id'
        required: true
        type: string
      judge_model:
        description: 'Exact OpenRouter judge model id'
        required: true
        default: 'anthropic/claude-haiku-4.5'
        type: string
      screen_only:
        description: 'Run benchmark + judge screen only'
        required: true
        default: true
        type: boolean
      rerun:
        description: 'Allow intentional rerun of same fingerprint'
        required: true
        default: false
        type: boolean
      qualification_config:
        description: 'Qualification config path (use configs/qualification_smoke.yaml for one-case preflight)'
        required: true
        default: 'configs/qualification.yaml'
        type: string

permissions:
  contents: read

jobs:
  qualify:
    if: ${{ inputs.qualification_config != 'LUMI_EXISTING_KEY_READONLY_V1' && inputs.qualification_config != 'LUMI_COHORT_BASELINE_PAID_V1' }}
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify qualification credentials and models
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Repository secret OPENROUTER_API_KEY is not configured.'
            exit 1
          fi
          if [ -z "$JUDGE_MODEL" ]; then
            echo '::error::judge_model input is required.'
            exit 1
          fi
      - name: Run qualification
        shell: bash
        env:
          MODEL_ID: ${{ inputs.model }}
          SCREEN_ONLY: ${{ inputs.screen_only }}
          RERUN: ${{ inputs.rerun }}
          QUALIFICATION_CONFIG: ${{ inputs.qualification_config }}
        run: |
          args=(--model "$MODEL_ID" --config "$QUALIFICATION_CONFIG")
          if [ "$SCREEN_ONLY" = "true" ]; then args+=(--screen); fi
          if [ "$RERUN" = "true" ]; then args+=(--rerun); fi
          python -m src.model_qualify "${args[@]}"
      - name: Upload qualification evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model-qualification-${{ github.run_id }}
          path: |
            runs/qualifications/
            runs/qualifications_smoke/
            runs/model_registry/
          if-no-files-found: warn
          retention-days: 14

  lumi-cohort-existing-key-readonly:
    name: Cohort shared key metadata GET ONLY (no checkout, no POST)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_config == 'LUMI_EXISTING_KEY_READONLY_V1' && github.ref == 'refs/heads/experiment/story-harness-control-plane-v1' && github.sha == inputs.model }}
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 4
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Authenticated provider key GET + public route GET, redacted evidence only
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from decimal import Decimal, InvalidOperation
          from datetime import datetime,timezone
          KEY_URL="https://openrouter.ai/api/v1/key"
          ROUTE_URL="https://openrouter.ai/api/v1/models/anthropic/claude-sonnet-5.5/endpoints"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("redirect rejected")
          opener=urllib.request.build_opener(NoRedirect())
          def get_once(url, bearer=None):
              headers={"Accept":"application/json"}
              if bearer is not None:headers["Authorization"]="Bearer "+bearer
              request=urllib.request.Request(url,headers=headers,method="GET")
              try:
                  with opener.open(request,timeout=12) as r:
                      if r.status != 200 or r.geturl()!=url:
                          raise ValueError("bad HTTP status or redirect")
                      raw=r.read(65537)
                  if len(raw)>65536: raise ValueError("GET too large")
                  body=json.loads(raw)
                  if not isinstance(body,dict) or not isinstance(body.get("data"),dict):
                      raise ValueError("invalid provider JSON")
                  return body["data"]
              except Exception:
                  raise SystemExit("SAFE_GET_FAILED_NO_MODEL_POST") from None
          def money(value):
              if isinstance(value,bool) or value is None:
                  return None
              try:v=Decimal(str(value))
              except (InvalidOperation,ValueError,TypeError):return None
              return v if v.is_finite() and v>=0 else None
          key=os.environ.get("OPENROUTER_API_KEY","")
          if not (key.startswith("sk-or-") and 10<=len(key)<=256 and
                  not any(x.isspace() for x in key)):
              raise SystemExit("SHARED_KEY_NOT_CONFIGURED")
          data=get_once(KEY_URL,key)
          limit=money(data.get("limit"))
          remaining=money(data.get("limit_remaining"))
          used=money(data.get("usage"))
          byok=money(data.get("byok_usage"))
          finite_nonresetting=(limit is not None and 0<limit<=Decimal("20")
                               and "limit_reset" in data and data["limit_reset"] is None)
          sufficient=(remaining is not None and limit is not None
                      and Decimal("4.40")<=remaining<=limit)
          known_usage=(used is not None and byok is not None)
          billing_policy=data.get("include_byok_in_limit") is True
          eligible_type=(data.get("is_management_key") is False
                         and data.get("is_provisioning_key") is False
                         and data.get("is_free_tier") is False)
          print("OPENROUTER_SHARED_KEY_AUTHENTICATED_GET=TRUE")
          print("KEY_LIMIT_FINITE_NONRESETTING_WITHIN_20="+str(finite_nonresetting))
          print("KEY_LIMIT_PRESENT="+str(limit is not None))
          print("KEY_LIMIT_WITHIN_20="+str(limit is not None and Decimal("0")<limit<=Decimal("20")))
          print("KEY_LIMIT_NEVER_RESETS="+str("limit_reset" in data and data["limit_reset"] is None))
          print("KEY_PREVIOUS_USAGE_LE_15_60="+str(used is not None and used<=Decimal("15.60")))
          print("KEY_REMAINING_GE_4_40="+str(sufficient))
          print("KEY_USAGE_FIELDS_VALID="+str(known_usage))
          print("KEY_BYOK_INCLUDED="+str(billing_policy))
          print("KEY_ELIGIBLE_TYPE_EXPLICITLY_CONFIRMED="+str(eligible_type))
          print("KEY_RAW_SECRET_OR_PROVIDER_LABEL_RECORDED=FALSE")
          route=get_once(ROUTE_URL)
          endpoints=route.get("endpoints")
          routes=[x for x in endpoints if isinstance(x,dict)
                  and x.get("provider_name")=="Anthropic"
                  and x.get("tag")=="anthropic"] if isinstance(endpoints,list) else []
          acceptable=(route.get("id")=="anthropic/claude-sonnet-5.5"
                      and len(routes)==1 and routes[0].get("status")==0)
          if acceptable:
              p=routes[0].get("pricing",{})
              try:
                  acceptable=(Decimal(str(p.get("prompt")))<=Decimal("0.000002")
                              and Decimal(str(p.get("completion")))<=Decimal("0.00001"))
              except Exception:acceptable=False
          print("SONNET_55_ANTHROPIC_ROUTE_OK="+str(acceptable))
          print("PROTECTED_PREFLIGHT_RUN_ID="+os.environ.get("GITHUB_RUN_ID",""))
          print("PREFLIGHT_UTC="+datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
          print("MODEL_POSTS=0")
          print("COHORT_DISPATCH_AUTHORIZED=FALSE")
          if not all((finite_nonresetting,sufficient,known_usage,
                      billing_policy,eligible_type,acceptable)):
              raise SystemExit("EXISTING_KEY_POLICY_STOP_NO_PROVIDER_POST")
          print("EXISTING_KEY_METADATA_PREFLIGHT_GREEN_NOT_PAID_AUTHORIZATION")
          PY

  lumi-cohort-ten-real-baseline:
    name: Frozen B01-B10 existing-key baseline
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'necdetoskay' && github.ref == 'refs/heads/experiment/story-harness-control-plane-v1' && github.sha == inputs.model && inputs.qualification_config == 'LUMI_COHORT_BASELINE_PAID_V1' && inputs.screen_only == true && inputs.rerun == false }}
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 110
    permissions:
      contents: read
    concurrency:
      group: lumi-cohort-one-frozen-real-baseline
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact expected immutable SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 1
      - name: Execute ten original inputs with no retries
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LUMI_TEN_PAID_CONFIRMATION: AUTHORIZE_LUMI_TEN_NO_RETRY_4_40_RESERVE_20_TOTAL
        run: |
          set -euo pipefail
          repo="$(pwd)"
          evidence="$RUNNER_WORKSPACE/_lumi_story_frozen_ten_v1"
          test ! -L "$evidence"
          mkdir -p "$evidence"
          chmod 700 "$evidence"
          python3 -m src.story_harness_cohort_batch_runner_v1 --paid-ten --repo-root "$repo" --claims-parent "$evidence" --historic-hold-usd 3.249558
      - name: Preserve complete evidence even on an incomplete batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-frozen-ten-inference-evidence
          path: ${{ runner.workspace }}/_lumi_story_frozen_ten_v1/baseline-v1
          if-no-files-found: warn
          retention-days: 90
