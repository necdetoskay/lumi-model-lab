name: SpineForge v8 Freeze Builder

on:
  push:
    branches:
      - experiment/spineforge-v8-durable-evidence
    paths:
      - experiments/freeze/spineforge-v8.request

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build v8 freeze profile from exact checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          paths = [
              ".github/workflows/spineforge-v8.yml",
              "requirements.txt",
              "configs/model_runtime_profiles.yaml",
              "src/spine_context_pack_v1.py",
              "src/spineforge_freeze_verify.py",
              "src/spineforge_v5_contract.py",
              "src/spineforge_v7.py",
              "src/spineforge_v7_contract.py",
              "src/spineforge_v7_structured_call.py",
              "src/spineforge_v7_human_approval.py",
              "src/spineforge_v8_case_manifest.py",
              "src/spineforge_v8_stage.py",
              "src/spineforge_v8_evidence_summary.py",
              "src/spineforge_v6_strict_call.py",
              "src/spineforge_v6_json_schema.py",
              "prompts/spineforge_creative_architect_v5_blueprint.md",
              "prompts/spineforge_structural_compiler_v7_partitioned.md",
              "prompts/spineforge_product_gate_v2_context.md",
              "src/spineforge_v3_contract.py",
              "src/episode_spine_v3_contract.py",
              "src/premise_architect_v2_contract.py",
              "src/reader_profile_v2.py",
              "src/saga_blueprint_contract.py",
              "src/saga_spine_v2_contract.py",
              "src/english_story_pipeline.py",
              "src/generate.py",
              "src/schemas.py",
              "src/model_registry.py",
              "src/model_usage_rollup.py",
          ]

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          profile = {
              "schema_version": "spineforge-runtime-profile.v1",
              "runtime_id": "spineforge.contextpack.v8",
              "status": "FROZEN_QUALIFICATION_CANDIDATE",
              "purpose": "Reuse the frozen v7 generation topology unchanged while removing GitHub Actions artifact quota as a single point of qualification evidence loss.",
              "context_contract": {
                  "schema": "spine-context-pack.v1",
                  "qualification_source": "mock-lumi-canonical-state.v1",
                  "production_source_target": "LUMI_CANONICAL_STATE",
                  "same_pack_for_all_models": True,
                  "stale_revision_rejected": True,
                  "stale_human_approval_rejected": True,
              },
              "runtime": {
                  "generation_runtime": "src/spineforge_v7.py",
                  "generation_topology_identical_to_v7": True,
                  "creative_architect_model": "aion-labs/aion-3.5-mini",
                  "creative_prompt": "prompts/spineforge_creative_architect_v5_blueprint.md",
                  "structural_compiler_model": "anthropic/claude-sonnet-5.5",
                  "structural_prompt": "prompts/spineforge_structural_compiler_v7_partitioned.md",
                  "structural_sections": [
                      "spineforge-structural-frame.v1",
                      "spineforge-structural-beats.v1",
                      "spineforge-structural-resolution.v1",
                  ],
                  "product_gate_model": "openai/gpt-5.6-luna",
                  "product_gate_prompt": "prompts/spineforge_product_gate_v2_context.md",
                  "product_schema": "spineforge-product.v7",
                  "max_attempts": 3,
                  "max_calls_per_attempt": 5,
                  "parse_retry_per_model_call": 0,
                  "durable_checkpoint_after_every_completed_call": True,
                  "human_review_required_before_story_writer": True,
              },
              "evidence_policy": {
                  "compact_actions_log_summary_required": True,
                  "compact_log_excludes_raw_creative_payloads": True,
                  "full_repo_evidence_required": True,
                  "repo_evidence_path": "experiments/results/spineforge-v8/<run_id>",
                  "artifact_upload": "best_effort_only",
                  "artifact_quota_may_not_destroy_primary_evidence": True,
                  "evidence_persist_failure_makes_workflow_fail": True,
              },
              "ownership_boundary": {
                  "aion_owns": "creative identity and Creative Blueprint",
                  "sonnet_owns": "partitioned strict structural compilation across frame, beats and resolution",
                  "luna_owns": "independent Spine Product quality gate",
                  "application_owns": "ContextPack authority, assembly, full validation, checkpoints, durable evidence and human approval",
              },
              "paid_boundary_policy": {
                  "explicit_authorization_required_for_each_attempt": True,
                  "no_automatic_paid_retry": True,
                  "no_writer_call_inside_spineforge": True,
              },
              "no_code_change_qualification_rule": {
                  "enabled": True,
                  "first_paid_case_starts_only_after_runtime_freeze": True,
                  "case_variation_is_data_only": True,
                  "revision_feedback_is_data_only": True,
                  "runtime_hash_mismatch_invalidates_active_case": True,
                  "runtime_or_prompt_change_requires_new_spineforge_revision": True,
                  "scenario_specific_runtime_patch_counts_as_case_failure": True,
              },
              "runtime_freeze": {
                  "enabled": True,
                  "runtime_revision": "SPINEFORGE-CONTEXTPACK-FROZEN-v8",
                  "runtime_source_commit": os.environ["GITHUB_SHA"],
                  "files": [{"path": p, "sha256": sha256(p)} for p in paths],
              },
          }
          out = Path("data/specifications/story_lab/spineforge_runtime_profile_v8_durable_evidence_frozen.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(profile, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "runtime_revision": profile["runtime_freeze"]["runtime_revision"],
              "runtime_source_commit": profile["runtime_freeze"]["runtime_source_commit"],
              "frozen_files": len(paths),
          }, indent=2))
          PY
      - name: Commit freeze profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/specifications/story_lab/spineforge_runtime_profile_v8_durable_evidence_frozen.json
          git commit -m "canon(spineforge-v8): freeze durable-evidence runtime"
          git push origin HEAD:experiment/spineforge-v8-durable-evidence
