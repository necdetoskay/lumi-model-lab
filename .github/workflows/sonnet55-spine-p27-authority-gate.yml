name: Sonnet 5.5 Spine P2.7 Authority-aware Luna Recovery

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-spine-p27-authority-gate.txt'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Revision-05 authority-aware Luna gate only
        run: >-
          PYTHONPATH=. python -m src.sonnet55_spine_p27_authority_gate
          --source data/specifications/story_lab/sonnet55_p25_recovery_source_36541988910.json
          --authority data/specifications/story_lab/sonnet55_revision05_qualification_authority.json
          --gate-prompt prompts/episode_spine_gate_sonnet55_qualification.md
          --out runs/sonnet55-spine-p27-authority-gate/result.json
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-spine-p27-authority-gate/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-spine-p27-authority-gate/result.json "$TMP/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-spine-p27-authority-gate-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-spine-p27-authority-gate/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          git add "$DEST/result.json"
          git commit -m "evidence(qual): archive Sonnet 5.5 P2.7 authority gate ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
