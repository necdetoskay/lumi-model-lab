name: SpineForge v19 Qualification

on:
  push:
    branches:
      - experiment/spineforge-v19-narrative-spine-single-owner
    paths:
      - 'src/narrative_spine_v1_contract.py'
      - 'src/spineforge_v19*.py'
      - 'prompts/spineforge_v19_*.md'
      - 'data/specifications/story_lab/spineforge_v19_qualification_cases_v1.json'
      - 'tests/test_narrative_spine_v1_contract.py'
      - 'tests/test_spineforge_v19_*.py'
      - '.github/workflows/spineforge-v19-zero-cost.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: v19 contract and architecture
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_narrative_spine_v1_contract.py \
            tests/test_spineforge_v19_obligations.py \
            tests/test_spineforge_v19_qualification_fixtures.py \
            tests/test_spineforge_v19_architecture.py \
            tests/test_spineforge_v19_transport.py \
            tests/test_spineforge_v19_frozen.py
      - name: v19 authority runtime and human boundary
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_spineforge_v19_runtime_mock.py \
            tests/test_spineforge_v19_human_review.py
      - name: ContextPack reveal-safety regression
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q tests/test_spine_context_pack_v1.py

  paid-age12-attempt1:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[PAID-V19-AGE12-ATTEMPT1]')
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python src/spineforge_freeze_verify.py \
            --profile data/specifications/story_lab/spineforge_runtime_profile_v19_narrative_spine_frozen.json
      - name: Run one paid age12 Adventure Exploration qualification
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          PYTHONPATH=. python - <<'PY'
          import json
          import os
          from pathlib import Path

          from src.spine_context_pack_v1 import SpineContextPackV1
          from src.spineforge_freeze_verify import verify_spineforge_runtime
          from src.spineforge_v19 import run
          from src.spineforge_v19_obligations import load_qualification_cases

          case_id = "spineforge.v19.age12.adventure-exploration.01"
          profile_path = Path("data/specifications/story_lab/spineforge_runtime_profile_v19_narrative_spine_frozen.json")
          freeze = verify_spineforge_runtime(profile_path)
          case_set = load_qualification_cases()
          case = next(row for row in case_set.cases if row.case_id == case_id)
          if case.context_fixture_status != "FROZEN" or not case.context_fixture_ref:
              raise RuntimeError("Age12 qualification fixture is not frozen.")

          pack_path = Path(case.context_fixture_ref)
          pack = SpineContextPackV1.model_validate_json(pack_path.read_text(encoding="utf-8"))
          if int(pack.reader_profile["exact_age"]) != 12:
              raise RuntimeError("Age12 fixture exact_age mismatch.")

          result = run(
              context_pack=pack,
              obligations=case.obligations,
              api_key=os.environ["OPENROUTER_API_KEY"],
          )

          out_dir = Path("evidence/spineforge-v19-paid") / os.environ["GITHUB_RUN_ID"]
          out_dir.mkdir(parents=True, exist_ok=True)
          result_path = out_dir / "age12-adventure-attempt1-result.json"
          envelope_path = out_dir / "age12-adventure-attempt1-envelope.json"

          result_path.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          envelope = {
              "schema": "spineforge-v19-paid-attempt-envelope.v1",
              "case_id": case_id,
              "attempt_index": 1,
              "explicit_paid_authorization": True,
              "authorization_marker": "PAID-V19-AGE12-ATTEMPT1",
              "runtime_revision": freeze["runtime_revision"],
              "runtime_verified_files": freeze["verified_files"],
              "context_pack_id": pack.context_pack_id,
              "context_fingerprint": pack.context_fingerprint,
              "result_status": result.get("status"),
              "writer_authorized": False,
              "automatic_retry_executed": False,
              "automatic_repair_executed": False,
              "result_path": str(result_path),
              "pipeline_usage_rollup": result.get("pipeline_usage_rollup"),
          }
          envelope_path.write_text(
              json.dumps(envelope, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print("===SPINEFORGE_V19_PAID_ENVELOPE===")
          print(json.dumps(envelope, ensure_ascii=False, indent=2))
          print("===SPINEFORGE_V19_PAID_RESULT===")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Upload paid qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spineforge-v19-age12-attempt1-${{ github.run_id }}
          path: evidence/spineforge-v19-paid/${{ github.run_id }}
          if-no-files-found: warn

  diagnose-attempt1-usage:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[DIAG-V19-ATTEMPT1-USAGE]')
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Query safe OpenRouter activity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          key = os.environ["OPENROUTER_API_KEY"]

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {key}", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  try:
                      return e.code, json.loads(raw)
                  except Exception:
                      return e.code, {"error": raw[:1000]}

          status, activity = get("https://openrouter.ai/api/v1/activity?date=2026-10-01")
          print("ACTIVITY_STATUS", status)
          if status == 200:
              rows = activity.get("data", [])
              wanted = []
              for row in rows if isinstance(rows, list) else []:
                  model = str(row.get("model") or "").lower()
                  if "claude-sonnet-5.5" in model or "gpt-5.6-luna" in model:
                      wanted.append({
                          k: row.get(k)
                          for k in (
                              "date","model","model_permaslug","provider_name","requests",
                              "prompt_tokens","completion_tokens","reasoning_tokens","usage",
                              "byok_usage_inference","endpoint_id"
                          )
                          if k in row
                      })
              print("V19_MODELS_ACTIVITY", json.dumps(wanted, ensure_ascii=False))
          else:
              print("ACTIVITY_ERROR", json.dumps(activity, ensure_ascii=False)[:1500])

          kstatus, keyinfo = get("https://openrouter.ai/api/v1/key")
          print("KEY_STATUS", kstatus)
          if kstatus == 200:
              data = keyinfo.get("data") or {}
              safe = {
                  k: data.get(k)
                  for k in ("usage","usage_daily","usage_weekly","usage_monthly","limit","limit_remaining","is_free_tier")
                  if k in data
              }
              print("KEY_USAGE_SAFE", json.dumps(safe, ensure_ascii=False))
          PY
