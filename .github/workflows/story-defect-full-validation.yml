name: Story Defect Full Corpus Validation

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-defect-full-validation.txt

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compile full validator
        run: python -m py_compile experiments/prototypes/story_defect_full_validation_20260926.py
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 2.00
      - name: Validate full 210-case corpus
        run: PYTHONPATH=. python experiments/prototypes/story_defect_full_validation_20260926.py
      - name: Archive evidence
        run: |
          test -s runs/story-defect-full-validation/result.json
          DEST="experiments/results/story-defect-full-validation/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-defect-full-validation/result.json "$DEST/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): full defect corpus validation ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-defect-full-validation-${GITHUB_RUN_ID}"
