name: SpineForge v14 Repair Freeze Builder

on:
  push:
    branches:
      - experiment/spineforge-v14-targeted-semantic-repair
    paths:
      - experiments/freeze/spineforge-v14.request

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build v14 repair freeze profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          paths = [
              ".github/workflows/spineforge-v14.yml",
              "requirements.txt",
              "configs/model_runtime_profiles.yaml",
              "src/spineforge_freeze_verify.py",
              "src/spineforge_v14.py",
              "src/spineforge_v14_case_manifest.py",
              "src/spineforge_v14_stage.py",
              "src/spineforge_v14_evidence_summary.py",
              "data/specifications/story_lab/spineforge_v14_age18_forbidden_cartographer_case_v1.json",
              "prompts/spineforge_targeted_semantic_repair_v14.md",
              "prompts/spineforge_single_owner_auditor_v11.md",
              "experiments/results/spineforge-v12/36752663853/result.json",
              "src/spineforge_v13_audit_normalizer.py",
              "src/spineforge_v12_normalizer.py",
              "src/spineforge_v11.py",
              "src/spineforge_v11_contract.py",
              "src/spine_context_pack_v1.py",
              "src/episode_spine_v3_contract.py",
              "src/premise_architect_v2_contract.py",
              "src/reader_profile_v2.py",
              "src/saga_blueprint_contract.py",
              "src/saga_spine_v2_contract.py",
              "src/english_story_pipeline.py",
              "src/generate.py",
              "src/schemas.py",
              "src/model_registry.py",
              "src/model_usage_rollup.py",
          ]

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          profile = {
              "schema_version": "spineforge-runtime-profile.v1",
              "runtime_id": "spineforge.contextpack.v14.repair",
              "status": "FROZEN_QUALIFICATION_CANDIDATE",
              "purpose": "Targeted Sonnet semantic repair of the validated v12 Spine using the typed v13 REPAIR audit, followed by deterministic validation and aggressive Sonnet re-audit.",
              "runtime": {
                  "generation_runtime": "src/spineforge_v14.py",
                  "repair_model": "anthropic/claude-sonnet-5.5",
                  "repair_prompt": "prompts/spineforge_targeted_semantic_repair_v14.md",
                  "reaudit_model": "anthropic/claude-sonnet-5.5",
                  "audit_prompt": "prompts/spineforge_single_owner_auditor_v11.md",
                  "source_evidence": "experiments/results/spineforge-v12/36752663853/result.json",
                  "repair_max_tokens": 10000,
                  "reaudit_max_tokens": 4500,
                  "max_calls_per_attempt": 2,
                  "architect_recall": False,
                  "automatic_repair_loop_enabled": False,
                  "writer_authorized": False
              },
              "repair_policy": {
                  "typed_repair_audit_required": True,
                  "exact_blockers_targets_preserve_forwarded": True,
                  "targeted_not_regenerative": True,
                  "hidden_saga_truth_forbidden": True,
                  "mechanical_route_normalization_allowed": True,
                  "semantic_repair_by_application_forbidden": True,
                  "reaudit_required": True
              },
              "evidence_policy": {
                  "full_repo_evidence_required": True,
                  "repo_evidence_path": "experiments/results/spineforge-v14/<run_id>",
                  "artifact_upload": "best_effort_only",
                  "exact_token_cost_latency_required": True
              },
              "paid_boundary_policy": {
                  "explicit_authorization_required_for_attempt_1": True,
                  "no_automatic_paid_retry": True,
                  "no_automatic_repair_loop": True,
                  "no_writer_call_inside_spineforge": True
              },
              "runtime_freeze": {
                  "enabled": True,
                  "runtime_revision": "SPINEFORGE-TARGETED-REPAIR-FROZEN-v14",
                  "runtime_source_commit": os.environ["GITHUB_SHA"],
                  "files": [{"path": p, "sha256": sha256(p)} for p in paths]
              }
          }

          out = Path("data/specifications/story_lab/spineforge_runtime_profile_v14_targeted_semantic_repair_frozen.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(profile, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "runtime_revision": profile["runtime_freeze"]["runtime_revision"],
              "runtime_source_commit": profile["runtime_freeze"]["runtime_source_commit"],
              "frozen_files": len(paths)
          }, indent=2))
          PY
      - name: Commit freeze profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/specifications/story_lab/spineforge_runtime_profile_v14_targeted_semantic_repair_frozen.json
          git commit -m "canon(spineforge-v14): freeze targeted semantic repair runtime"
          git push origin HEAD:experiment/spineforge-v14-targeted-semantic-repair
