name: SpineForge v13 Audit Alias Zero-Cost Qualification

on:
  push:
    branches:
      - experiment/spineforge-v13-audit-contract-normalization
    paths:
      - 'src/spineforge_v13.py'
      - 'src/spineforge_v13_audit_normalizer.py'
      - 'tests/test_spineforge_v13_*.py'
      - '.github/workflows/spineforge-v13-zero-cost.yml'

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Exact v12 evidence replay and v13 runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_spineforge_v13_audit_normalizer.py \
            tests/test_spineforge_v13_runtime_mock.py
      - name: v12 normalization regression
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_spineforge_v12_normalizer.py \
            tests/test_spineforge_v12_runtime_mock.py
      - name: Audit contract regression
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q tests/test_spineforge_v11_contract.py
