name: Sonnet 5.5 Primary Audit Qualification

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-primary-audit-age12.txt'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run blind Sonnet 5.5 primary audit only
        run: >-
          PYTHONPATH=. python -m src.sonnet55_primary_audit_qualification
          --source data/specifications/story_lab/age12_episode1_sonnet55_postprocess_source_36552606045.json
          --approved data/specifications/story_lab/age12_episode1_sonnet55_p27_approved.json
          --gold data/specifications/story_lab/sonnet55_writer_36552606045_human_preaudit.json
          --out runs/sonnet55-primary-audit-age12/result.json
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-primary-audit-age12/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-primary-audit-age12/result.json "$TMP/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-primary-audit-age12-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-primary-audit-age12/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          git add "$DEST/result.json"
          git commit -m "evidence(qual): archive Sonnet 5.5 primary audit ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
