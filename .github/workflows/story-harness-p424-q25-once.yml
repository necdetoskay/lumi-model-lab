name: Story Harness P4.24 Real Q25 Evidence Once

on:
  pull_request:
    paths:
      - configs/story_harness_p424_q25_trigger.json

permissions:
  contents: read

concurrency:
  group: lumi-p424-b01-r06-evidence-once
  cancel-in-progress: false

jobs:
  actual-q25-evidence:
    if: ${{ github.event.pull_request.number == 275 && github.event.pull_request.head.repo.full_name == 'necdetoskay/lumi-model-lab' && github.head_ref == 'experiment/story-harness-control-plane-v1' }}
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Deny every trigger except a single reviewed Q25 manifest commit
        run: |
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(
              ['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],
              text=True).splitlines()
          assert paths==['configs/story_harness_p424_q25_trigger.json'], (
              'Not the approved one-file Q25 event: no key or model access')
          print('P424_SINGLE_TRIGGER_COMMIT_GREEN')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source-bound Master, initial audit, and 10 dollar authorization
        run: |
          python -m unittest discover -s tests -p 'test_story_harness_p423_master.py' -q
          python -m unittest discover -s tests -p 'test_story_harness_p424_q25_evidence.py' -q
          python - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import json
          import os
          from src.story_harness_p424_q25_evidence import load_pilot_source
          manifest=json.loads(Path('configs/story_harness_p424_q25_trigger.json').read_text())
          assert manifest=={
              'schema':'lumi.story-harness-p424-one-real-b01-q25.v1',
              'case_id':'B01',
              'writer_run_variant':'r06',
              'source_pack_sha256':'91854710f46db13ee2599d567ca2fcbbcd945af50515a779ddee58211ee050dc',
              'spine_sha256':'daafc25a6701a8369be994000e71669722c1cb56364bce3559f5fb8ca944f7a9',
              'pilot_english_master_sha256':'cbbf3ba8cb3a9ec5d19ed51238bc3b9a0259237cdb7896b75dcdd0584adca912',
              'quality_auditor_generation_id':'gen-1791914159-dtoO3Lu2P42j1a5qHDun',
              'one_model_post_max':1,
              'stage_maximum_usd':'0.050',
              'total_user_approved_usd':'10.00',
              'previous_reserved_spend_usd':'1.218350',
              'no_automatic_retries':True,
              'read_only':True,
              'production_change':False,
          }, 'Q25 scope or budget changed without a new reviewed workflow'
          assert Decimal(manifest['previous_reserved_spend_usd']) + Decimal('0.050') <= Decimal('10.00')
          root=Path(os.environ['RUNNER_WORKSPACE'])
          b=load_pilot_source(
              '.',root/'_lumi_p417_durable_claims',
              root/'_lumi_p422_quality_claims',
              root/'_lumi_p423_master_claims')
          assert b['source']['pack']['pack_sha256']==manifest['source_pack_sha256']
          assert b['source']['spine']['spine_sha256']==manifest['spine_sha256']
          assert b['source']['story']['story_sha256']==manifest['pilot_english_master_sha256']
          assert b['audit']['auditor_generation_id']==manifest['quality_auditor_generation_id']
          assert b['audit']['quality_initial_verdict']=='ACCEPT'
          print('P424_IMMUTABLE_516_WORD_MASTER_AND_AUDIT_VERIFIED')
          PY
      - name: Confirm existing OpenRouter key has available credit without story POST
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from decimal import Decimal
          from src.story_harness_p414 import read_current_key
          d=read_current_key(api_key=os.getenv('OPENROUTER_API_KEY',''))['data']
          remaining=d.get('limit_remaining')
          if remaining is not None:
              assert Decimal(str(remaining))>=Decimal('0.050')
          assert d.get('is_free_tier') is not True
          assert d.get('is_management_key') is not True
          print('P424_EXISTING_OPENROUTER_INFERENCE_KEY_CHECKED')
          PY
      - name: Extract one real evidence-only Q25 candidate from original sealed Master
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LUMI_P424_Q25_ENABLE: ONE_EVIDENCE_ONLY_B01_Q25
        run: |
          set -euo pipefail
          root="${RUNNER_WORKSPACE}"
          mkdir -p "$root/_lumi_p424_q25_claims"
          chmod 700 "$root/_lumi_p424_q25_claims"
          python -m src.story_harness_p424_q25_evidence --repo-root . \
             --producer-claims "$root/_lumi_p417_durable_claims" \
             --quality-claims "$root/_lumi_p422_quality_claims" \
             --master-root "$root/_lumi_p423_master_claims" \
             --evidence-root "$root/_lumi_p424_q25_claims" --paid-once \
             > /tmp/lumi-p424-q25-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/lumi-p424-q25-result.json').read_text())
          assert r['production_state_write_authorized'] is False
          assert r['semantic_state_fully_certified'] is False
          assert r['evidence_quote_matching_verified'] is True
          print('P424_REAL_Q25_EVIDENCE_RECEIVED')
          print('P424_Q25_STORY_SHA='+r['story_sha256'])
          print('P424_Q25_OBSERVED_OBJECTS='+str(r['q25_evidence_observations']))
          print('P424_Q25_ACTUAL_USD='+r['cost_usd'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumi-p424-r06-real-q25-evidence-one-shot
          path: ${{ runner.workspace }}/_lumi_p424_q25_claims/p424-b01-r06-q25-evidence-v01/
          if-no-files-found: warn
          retention-days: 30
