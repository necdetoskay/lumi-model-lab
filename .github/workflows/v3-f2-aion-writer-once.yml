name: Final V3 Aion Mini F2 Single Attempt
on:
  push:
    branches: [experiment/v3-f2-aion-writer-20261015]
    paths:
      - experiments/triggers/v3-f2-aion-writer-offline-20261015.json
      - experiments/triggers/v3-f2-aion-writer-once-20261015.json
permissions:
  contents: read
concurrency:
  group: lumi-v3-f2-aion-20261015
  cancel-in-progress: false

jobs:
  offline:
    if: >-
      github.ref == 'refs/heads/experiment/v3-f2-aion-writer-20261015' &&
      contains(github.event.head_commit.message, '[V3-AION-F2-OFFLINE-CHECK]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 78a0fcb0f99383e6b96f3a6de7b49ccf9b5b2900
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: F2 Writer frozen-code and one-call mock checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q tests/test_v3_aion_f2_writer_single_attempt_probe.py tests/test_v3_single_attempt_aion_writer_guard.py tests/test_v3_single_attempt_guard.py tests/test_age18_frozen_lane_v1.py tests/test_frozen_lane_generic_spine_runtime.py tests/test_age18_lane_stabilization_matrix.py tests/test_sonnet55_cross_age_matrix.py tests/test_story_lane_qualification_policy.py tests/test_frozen_lane_authority_gate.py tests/test_frozen_lane_repair_runtime.py tests/test_frozen_lane_translation_runtime.py
      - name: Verify GitHub read-only API works
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/experiments/v3_aion_f2_writer_single_attempt_probe.py?ref=experiment/v3-f2-aion-writer-20261015" --jq .sha >/dev/null
          echo F2_WRITER_GITHUB_CLAIM_READ_PASS

  single-writer:
    if: >-
      github.ref == 'refs/heads/experiment/v3-f2-aion-writer-20261015' &&
      contains(github.event.head_commit.message, '[V3-AION-F2-PAID-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact F2 approval and pinned guard preflight
        shell: bash
        env:
          GUARD_SHA: 78a0fcb0f99383e6b96f3a6de7b49ccf9b5b2900
          GRANT_PATH: experiments/triggers/v3-f2-aion-writer-once-20261015.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f2-aion-one"
          export GRANT_COPY="$RUNNER_TEMP/f2-aion-one/grant.json"
          python3 - <<'PY'
          import json,os,pathlib,re,shutil
          grant=json.loads(pathlib.Path(os.environ["GRANT_PATH"]).read_text())
          exact={
              "schema":"lumi.v3-aion-f2-writer-paid-grant.v1",
              "authorized":True,
              "stage":"WRITER",
              "case_id":"age18.forbidden-cartographer.fantasy.frozen-01",
              "model":"aion-labs/aion-3.5-mini",
              "source_spine_run_id":38700326961,
              "frozen_runtime_sha":"63e1e3ce82c244bc5bb02b0463a9a1a6715c941b",
              "approved_spine_sha256":"21f1e4e0c9f25cd1c970cccc2df8d09a0f236c9102321df7da086f85a3dac1a0",
              "guard_commit_sha":os.environ["GUARD_SHA"],
              "max_total_usd":"0.10",
          }
          if any(grant.get(k)!=v for k,v in exact.items()):
              raise SystemExit("F2_WRITER_PAID_SCOPE_MISMATCH")
          gid=grant.get("grant_id")
          if not isinstance(gid,str) or re.fullmatch("[A-Za-z0-9][A-Za-z0-9_-]{7,79}",gid) is None:
              raise SystemExit("F2_WRITER_GRANT_ID_INVALID")
          if not isinstance(grant.get("human_paid_authorization_reference"),str) or not grant["human_paid_authorization_reference"].strip():
              raise SystemExit("F2_WRITER_HUMAN_APPROVAL_MISSING")
          shutil.copyfile(os.environ["GRANT_PATH"],os.environ["GRANT_COPY"])
          os.chmod(os.environ["GRANT_COPY"],0o600)
          print("F2_WRITER_GRANT_PREFLIGHT_PASS")
          PY
          git cat-file -e "${GUARD_SHA}^{commit}"
          git checkout --detach "$GUARD_SHA"
          test "$(git rev-parse HEAD)" = "$GUARD_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Check one-post guard before spend
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q tests/test_v3_aion_f2_writer_single_attempt_probe.py tests/test_v3_single_attempt_aion_writer_guard.py tests/test_v3_single_attempt_guard.py
      - name: Verify one-use run-bound GitHub claim read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GRANT_COPY: ${{ runner.temp }}/f2-aion-one/grant.json
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1" || { echo "::error::WRITER_REPLAY_DENIED"; exit 1; }
          python3 - <<'PY'
          import base64,json,os,subprocess,time
          gid=json.load(open(os.environ["GRANT_COPY"]))["grant_id"]
          branch="evidence/v3-paid-claim-aion-f2-"+gid
          url="repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/claims/"+gid+".json?ref="+branch
          expected={
              "schema":"lumi.v3-global-run-claim.v1",
              "authorized":True,
              "grant_id":gid,
              "stage":"WRITER",
              "model":"aion-labs/aion-3.5-mini",
              "case_id":"age18.forbidden-cartographer.fantasy.frozen-01",
              "source_spine_run_id":38700326961,
              "approved_spine_sha256":"21f1e4e0c9f25cd1c970cccc2df8d09a0f236c9102321df7da086f85a3dac1a0",
              "source_commit":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "guard_commit_sha":"78a0fcb0f99383e6b96f3a6de7b49ccf9b5b2900",
          }
          for _ in range(30):
              res=subprocess.run(["gh","api",url],capture_output=True,text=True)
              if res.returncode:
                  if "HTTP 404" in res.stderr:
                      time.sleep(2)
                      continue
                  raise SystemExit("WRITER_CLAIM_READ_DENIED_NO_MODEL_POST")
              try:
                  claim=json.loads(base64.b64decode(json.loads(res.stdout)["content"]))
              except (ValueError,KeyError,TypeError) as exc:
                  raise SystemExit("WRITER_CLAIM_INVALID") from exc
              if any(claim.get(k)!=v for k,v in expected.items()):
                  raise SystemExit("WRITER_CLAIM_RUN_MISMATCH_NO_MODEL_POST")
              print("F2_WRITER_GLOBAL_RUN_CLAIM_VERIFIED")
              break
          else:
              raise SystemExit("WRITER_CLAIM_NOT_FOUND_NO_MODEL_POST")
          PY
      - name: Aion Mini one authorized English Writer call
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GRANT_COPY: ${{ runner.temp }}/f2-aion-one/grant.json
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}" || { echo "::error::OPENROUTER_SECRET_MISSING"; exit 1; }
          PYTHONPATH=. python -B -m experiments.v3_aion_f2_writer_single_attempt_probe \
            --grant "$GRANT_COPY" \
            --claim-dir "$RUNNER_WORKSPACE/../_lumi_v3_aion_claims" \
            --evidence-dir "$RUNNER_TEMP/f2-aion-one/evidence"
          echo "NO_REPAIR_JUDGE_TRANSLATION_OR_COMMIT"
      - name: Archive first-attempt Writer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-final-v3-f2-aion-one-${{ github.run_id }}
          path: ${{ runner.temp }}/f2-aion-one/evidence/
          if-no-files-found: warn
          retention-days: 90
