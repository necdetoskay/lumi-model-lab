name: Aion 3.5 Foundation Architect Qualification 01

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/aion35-foundation-architect-qualification-01.txt

jobs:
  qualification:
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.25
      - name: Run Foundation Architect qualification
        run: PYTHONPATH=. python experiments/prototypes/aion35_foundation_architect_qualification_01_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/aion35-foundation-architect-qualification-01/result.json
          DEST="experiments/results/aion35-foundation-architect-qualification-01/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/aion35-foundation-architect-qualification-01/result.json "$DEST/result.json"
          cp runs/aion35-foundation-architect-qualification-01/foundation.json "$DEST/foundation.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(foundation): Aion 3.5 architect qualification ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/aion35-foundation-architect-qualification-01-${GITHUB_RUN_ID}"
