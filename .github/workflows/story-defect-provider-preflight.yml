name: Story Defect Provider Preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: OpenRouter provider preflight
        run: python -m src.openrouter_preflight --json
