name: Sonnet 5.5 Age12 Aion Writer Qualification

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-writer-age12.txt'

permissions:
  contents: write

jobs:
  write:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Write Sonnet 5.5 approved spine with Aion 3.5 Mini
        run: >-
          PYTHONPATH=. python -m src.episode_writer_v2_generate
          --approved data/specifications/story_lab/age12_episode1_sonnet55_p27_approved.json
          --out runs/sonnet55-writer-age12/result.json
          --story-out runs/sonnet55-writer-age12/story.txt
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-writer-age12/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-writer-age12/result.json "$TMP/result.json"
          if test -s runs/sonnet55-writer-age12/story.txt; then cp runs/sonnet55-writer-age12/story.txt "$TMP/story.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-writer-age12-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-writer-age12/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          if test -s "$TMP/story.txt"; then cp "$TMP/story.txt" "$DEST/story.txt"; fi
          git add "$DEST"
          git commit -m "evidence(qual): archive Sonnet 5.5 Aion writer ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
