name: Story Defect Response Supplement Build

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-defect-response-supplement-build.txt

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python experiments/prototypes/story_defect_response_supplement_build_20260926.py
      - name: Commit supplement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/fixtures/story_defect_response_supplement.tr-age4.v1.json
          if git diff --cached --quiet; then
            echo "No supplement changes."
          else
            git commit -m "data(story): build response-causality supplement"
            git push origin HEAD:experiment/story-v5-whole-draft-prototype-20260924
          fi
