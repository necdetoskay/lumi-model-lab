name: Story Defect Paid Validator Pilot

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-defect-paid-validator-pilot.txt

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compile validator
        run: python -m py_compile experiments/prototypes/story_defect_paid_validator_pilot_20260926.py
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.50
      - name: Run blind 15-case validator pilot
        run: PYTHONPATH=. python experiments/prototypes/story_defect_paid_validator_pilot_20260926.py
      - name: Archive evidence
        run: |
          test -s runs/story-defect-paid-validator-pilot/result.json
          DEST="experiments/results/story-defect-paid-validator-pilot/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-defect-paid-validator-pilot/result.json "$DEST/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): paid defect validator pilot ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-defect-paid-validator-pilot-${GITHUB_RUN_ID}"
