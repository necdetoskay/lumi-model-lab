name: Visual Generation Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/visual-generation-contract.yml'
      - 'configs/visual_model_profiles.yaml'
      - 'configs/visual_style_profiles.yaml'
      - 'docs/canonical/VISUAL_GENERATION_ARCHITECTURE_V1.md'
      - 'src/visual_*.py'
      - 'tests/test_visual_*.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt

      - name: Run visual generation contract suite
        run: >-
          python -m unittest
          tests.test_visual_contracts
          tests.test_visual_registries
          tests.test_visual_prompt_compiler
          tests.test_visual_generation
          tests.test_visual_provider
          tests.test_visual_onboarding
          tests.test_visual_qualification
          tests.test_visual_retry
          tests.test_visual_semantic_evaluator
          tests.test_visual_qualification_runner
          tests.test_visual_screening
          tests.test_visual_workflow_contract
          -v
