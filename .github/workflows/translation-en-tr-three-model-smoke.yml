name: EN-TR Three Model Translation Smoke

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/translation-en-tr-three-model-smoke.txt

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.25
      - name: Run EN-TR translation smoke
        run: PYTHONPATH=. python experiments/prototypes/translation_en_tr_three_model_smoke_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/translation-en-tr-three-model-smoke/result.json
          DEST="experiments/results/translation-en-tr-three-model-smoke/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/translation-en-tr-three-model-smoke/result.json "$DEST/result.json"
          cp runs/translation-en-tr-three-model-smoke/translation_A.txt "$DEST/translation_A.txt"
          cp runs/translation-en-tr-three-model-smoke/translation_B.txt "$DEST/translation_B.txt"
          cp runs/translation-en-tr-three-model-smoke/translation_C.txt "$DEST/translation_C.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): EN-TR three-model translation smoke ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/translation-en-tr-three-model-smoke-${GITHUB_RUN_ID}"
