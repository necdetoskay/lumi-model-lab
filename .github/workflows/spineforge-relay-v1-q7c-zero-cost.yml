name: SFR v1 Q7C Isolated Zero-Cost Gate
on:
  push:
    branches: [experiment/spineforge-relay-v1]
    paths:
      - 'src/spineforge_relay_v1_q7c.py'
      - 'tests/test_spineforge_relay_v1_q7c.py'
      - '.github/workflows/spineforge-relay-v1-q7c-zero-cost.yml'
permissions:
  contents: read
jobs:
  q7c-zero-cost:
    runs-on: [self-hosted, local-runner-pool, sfr-q7c-ci]
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact head without external action
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Bootstrap Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip --version >/dev/null 2>&1 || {
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
            python3 /tmp/get-pip.py --user --break-system-packages
          }
          python3 -m pip install --user --break-system-packages -r requirements.txt pytest

      - name: SFR-v1 zero-cost qualification
        run: python3 -m pytest -q tests/test_spineforge_relay_v1_*.py

      - name: Verify frozen Q6 preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from src.spineforge_relay_v1_q6 import prepare, authorization_for
          p = json.loads(Path("evidence/spineforge-relay/SFR-V1-Q6-PREFLIGHT-20261007/preflight.json").read_text())
          a = json.loads(Path("evidence/spineforge-relay/SFR-V1-Q6-PREFLIGHT-20261007/authorization.json").read_text())
          assert p == prepare()
          assert a == authorization_for(p)
          print(a["preflight_sha256"])
          PY
