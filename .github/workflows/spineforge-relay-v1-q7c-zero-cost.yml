name: SFR v1 Q7C Isolated Zero-Cost Gate
on:
  push:
    branches: [experiment/spineforge-relay-v1]
    paths:
      - 'src/spineforge_relay_v1_q7c.py'
      - 'tests/test_spineforge_relay_v1_q7c.py'
      - '.github/workflows/spineforge-relay-v1-q7c-zero-cost.yml'
permissions:
  contents: read
jobs:
  q7c-zero-cost:
    runs-on: [self-hosted, local-runner-pool, sfr-q7c-ci]
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact head without external action
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/q7c-venv"
          "${RUNNER_TEMP}/q7c-venv/bin/python" -m pip install -r requirements.txt pytest
      - name: SFR-v1 zero-cost qualification
        shell: bash
        run: '"${RUNNER_TEMP}/q7c-venv/bin/python" -m pytest -q tests/test_spineforge_relay_v1_*.py'
