name: SERA State Engine Offline Tests

on:
  push:
    branches:
      - "experiment/sera-*"
    paths:
      - "experiments/sera/**"
      - ".github/workflows/sera-state-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sera-m1-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q experiments/sera
      - name: Run deterministic SERA unit tests
        run: python -m unittest discover -s experiments/sera/tests -v
      - name: Verify immutable source Spine compilation
        run: >-
          python -m experiments.sera.spine_contracts
          evidence/v4-2-mara-run-38794774463/sonnet-original-spine-pre-haiku.json
      - name: Score synthetic gold extraction corpus
        run: python -m experiments.sera.gold_calibration
      - name: Audit real Mara first-scene HOLD without state writes
        run: |
          python - <<'PY'
          from experiments.sera.mara_s1_v04_audit import audit_real_mara
          audit=audit_real_mara()
          assert audit["candidate_count"] == 9
          assert audit["candidate_statuses"] == {"HOLD": 9}
          assert audit["unregistered_physical_candidates"] == ["new:bench","new:pencil"]
          assert audit["commit_authorized"] is False
          print("MARA_LIVE_SOURCE_AUDIT",audit["candidate_statuses"])
          print("UNREGISTERED_PHYSICAL_OBJECTS",audit["unregistered_physical_candidates"])
          print("REAL_MARA_CANONICAL_COMMITS",audit["eventgraph_committed_count"])
          PY
