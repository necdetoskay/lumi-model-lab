name: SERA State Engine Offline Tests

on:
  push:
    branches:
      - "experiment/sera-*"
    paths:
      - "experiments/sera/**"
      - ".github/workflows/sera-state-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sera-m1-offline:
    runs-on: [self-hosted, linux]
    timeout-minutes: 7
    defaults:
      run:
        working-directory: sera-v021-offline-source
    steps:
      - uses: actions/checkout@v4
        with:
          path: sera-v021-offline-source
          clean: false
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ed25519 trust verifier for G2 tests
        run: python -m pip install cryptography==46.0.4
      - name: Check Python syntax
        run: python -m compileall -q experiments/sera
      - name: Enforce no user-forbidden model output token ceilings
        run: python -m experiments.sera.request_policy
      - name: Run deterministic SERA unit tests
        run: python -m unittest discover -s experiments/sera/tests -v
      - name: Run root-level v0.52 provider and Mara adversarial tests (NO NETWORK)
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          path = Path("experiments/sera")
          files = sorted(path.glob("test_*_v052.py"))
          tests = unittest.TestLoader().discover(str(path), pattern="test_*_v052.py")
          count = tests.countTestCases()
          assert len(files) >= 11, f"V052_TEST_MODULE_COVERAGE_REGRESSION:{len(files)}"
          assert count >= 114, f"V052_TEST_DISCOVERY_REGRESSION:{count}"
          print(f"SERA_V052_TEST_DISCOVERY_VERIFIED modules={len(files)} cases={count}")
          PY
          python -m unittest discover -s experiments/sera -p 'test_*_v052.py' -v
      - name: Verify signed physical entry versus unverified story events (OFFLINE)
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          folder=Path("experiments/sera")
          modules=sorted(folder.glob("test_*_v053.py"))
          tests=unittest.TestLoader().discover(str(folder),pattern="test_*_v053.py")
          count=tests.countTestCases()
          assert len(modules)==3, f"V053_MODULE_COVERAGE_REGRESSION:{len(modules)}"
          assert count==28, f"V053_TEST_COVERAGE_REGRESSION_OR_IMPORT_LEAK:{count}"
          print(f"SERA_V053_TEST_DISCOVERY_VERIFIED modules={len(modules)} cases={count}")
          PY
          python -m unittest discover -s experiments/sera -p 'test_*_v053.py' -v
      - name: Verify two-scene multi-character synthetic story handoff
        run: |
          python -m experiments.sera.ensemble_story_smoke_v038 \
            --output "$RUNNER_TEMP/sera-v038-two-scene-smoke.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "sera-v038-two-scene-smoke.json"
          proof = json.loads(p.read_text(encoding="utf-8"))
          assert proof["status"] == "SYNTHETIC_TWO_SCENE_SQLITE_REPLAY_PASS"
          assert proof["characters"] == ["elin", "mara", "rho"]
          assert proof["final_revision"] == 2
          assert proof["sqlite_hash_chain_replay"] is True
          assert proof["final_watch"] == {
              "owner": "mara", "holder": "elin", "location": "hallway",
          }
          assert proof["provider_calls"] == 0
          assert proof["production_db_writes"] == 0
          assert proof["canonical_commit_authorized"] is False
          assert proof["independent_semantic_qualification"] is False
          assert all(s["scene_assurance_status"] == "HOLD"
                     for s in proof["scenes"])
          print("SERA_V038_STORY_SCENE_HANDOFF_VERIFIED_NONCANONICAL")
          PY
      - name: Archive synthetic two-scene story proof (not G2 canon)
        uses: actions/upload-artifact@v4
        with:
          name: sera-v038-two-scene-synthetic-${{ github.run_id }}
          path: ${{ runner.temp }}/sera-v038-two-scene-smoke.json
          retention-days: 90
          if-no-files-found: error
      - name: Verify blind provider-double recovery across two SQLite story scenes
        run: |
          python -m experiments.sera.blind_ensemble_smoke_v039 \
            --output "$RUNNER_TEMP/sera-v039-blind-story-proof.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "sera-v039-blind-story-proof.json"
          proof = json.loads(p.read_text(encoding="utf-8"))
          assert proof["status"] == "SYNTHETIC_BLIND_RECOVERY_TWO_SCENE_PASS"
          assert proof["fixture_character_count"] == 3
          assert proof["final_revision"] == 2
          assert proof["final_watch"] == {
              "owner": "mara", "holder": "elin", "location": "hallway",
          }
          assert proof["sqlite_hash_chain_replay"] is True
          assert proof["model_call_count"] == 0
          assert proof["production_db_writes"] == 0
          assert proof["canonical_commit_authorized"] is False
          assert proof["semantic_completeness_proven"] is False
          assert all([row["status"] for row in scene["source_only_attempts"]] ==
                     ["REEXTRACTION_REQUIRED", "SOURCE_BOUND_CANDIDATE"]
                     for scene in proof["scenes"])
          assert all(scene["assurance_status"] == "HOLD"
                     for scene in proof["scenes"])
          print("SERA_V039_BLIND_STORY_RECOVERY_NONCANONICAL_PASS")
          PY
      - name: Archive offline blind synthetic recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: sera-v039-blind-synthetic-story-${{ github.run_id }}
          path: ${{ runner.temp }}/sera-v039-blind-story-proof.json
          retention-days: 90
          if-no-files-found: error
      - name: Verify immutable source Spine compilation
        run: >-
          python -m experiments.sera.spine_contracts
          evidence/v4-2-mara-run-38794774463/sonnet-original-spine-pre-haiku.json
      - name: Score synthetic gold extraction corpus
        run: python -m experiments.sera.gold_calibration
      - name: Verify all-sentence v0.6 Mara coverage without model calls
        run: |
          python -m experiments.sera.mara_s1_v06_audit
          python - <<'PY'
          from experiments.sera.mara_s1_v06_audit import run
          report = run()
          assert report["sentence_count"] == report["accounted_sentence_count"]
          assert report["review_status"] == "HOLD"
          assert report["model_calls"] == 0
          assert report["canonical_db_writes"] == 0
          assert report["canonical_commit_authorized"] is False
          assert "candidate:bench" in report["candidate_refs"]
          assert "candidate:pencil" in report["candidate_refs"]
          assert report["watch_case_cue_found"]
          assert report["notebook_writing_cue_found"]
          PY
      - name: Generate Mara 28-sentence review worksheet (not gold)
        run: |
          python -m experiments.sera.sentence_review_packet_v07 \
            --output "$RUNNER_TEMP/sera-mara-review/mara-s1-28-sentence-unreviewed.json"
          python - <<'PY'
          from experiments.sera.sentence_review_packet_v07 import generate_mara_packet
          from experiments.sera.offline_benchmark_v07 import summarize_unreviewed_packet
          packet = generate_mara_packet()
          metrics = summarize_unreviewed_packet(packet)
          assert metrics["sentence_count"] == 28
          assert metrics["analyst_candidate_count"] == 9
          assert metrics["event_recall"] is None
          assert metrics["entity_precision"] is None
          assert packet["canonical_commit_authorized"] is False
          print("MARA_GOLD_QUALIFICATION", metrics["reason"])
          print("MARA_REFERENCE_SENTENCES", metrics["sentence_count"])
          print("MARA_CANDIDATES_NOT_GOLD", metrics["analyst_candidate_count"])
          PY
      - name: Archive review worksheet for human annotation
        uses: actions/upload-artifact@v4
        with:
          name: sera-mara-s1-unreviewed-worksheet-${{ github.run_id }}
          path: ${{ runner.temp }}/sera-mara-review/mara-s1-28-sentence-unreviewed.json
          retention-days: 90
          if-no-files-found: error
      - name: Export two blinded Mara S1 review forms
        run: |
          python -m experiments.sera.review_forms_cli_v08 export \
            --output-dir "$RUNNER_TEMP/sera-mara-blind-review"
          python - <<'PY'
          from pathlib import Path
          from experiments.sera.review_forms_cli_v08 import compare_files
          import os
          p = Path(os.environ["RUNNER_TEMP"]) / "sera-mara-blind-review"
          result = compare_files(
              review_a=p / "reviewer_A_unverified.json",
              review_b=p / "reviewer_B_unverified.json",
          )
          assert len(result["disagreements"]) == 28
          assert result["agreed_sentence_ids"] == []
          assert result["status"] == "NOT_GOLD_HUMAN_ADJUDICATION_REQUIRED"
          assert result["production_db_writes"] == 0
          print("MARA_BLIND_REVIEW_FORMS", 2)
          print("MARA_UNREVIEWED_SENTENCES", len(result["disagreements"]))
          print("MARA_HUMAN_GOLD_QUALIFIED", False)
          PY
      - name: Archive blinded reviewer forms and instructions
        uses: actions/upload-artifact@v4
        with:
          name: sera-mara-s1-blind-review-forms-${{ github.run_id }}
          path: ${{ runner.temp }}/sera-mara-blind-review/
          retention-days: 90
          if-no-files-found: error
      - name: Generate independent offline browser review pages
        run: |
          python -m experiments.sera.reviewer_ui_v09 \
            --output-dir "$RUNNER_TEMP/sera-mara-blind-review-ui"
          python - <<'PY'
          import os
          from pathlib import Path
          from experiments.sera.review_forms_cli_v08 import emit_forms, validate_file
          target = Path(os.environ["RUNNER_TEMP"]) / "sera-mara-blind-review-ui"
          emit_forms(target)
          for alias in ("reviewer_A_unverified", "reviewer_B_unverified"):
              report = validate_file(review=target / (alias + ".json"))
              assert report["reviewed_sentence_count"] == 0
              assert report["gold_qualified"] is False
              assert report["canonical_commit_authorized"] is False
          print("MARA_OFFLINE_BROWSER_PAGES", 2)
          print("MARA_REVIEW_SOURCE_STATUS", "NOT_GOLD")
          PY
      - name: JavaScript syntax gate for offline review UI
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"]) / "sera-mara-blind-review-ui"
          html = (base / "reviewer_A_unverified.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert len(scripts) == 1
          (base / "reviewer-ui-validated.js").write_text(
              scripts[0], encoding="utf-8"
          )
          PY
          node --check "$RUNNER_TEMP/sera-mara-blind-review-ui/reviewer-ui-validated.js"
      - name: Archive browser review pages and blinded JSON
        uses: actions/upload-artifact@v4
        with:
          name: sera-mara-s1-browser-review-v09-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sera-mara-blind-review-ui/*.html
            ${{ runner.temp }}/sera-mara-blind-review-ui/*.json
            ${{ runner.temp }}/sera-mara-blind-review-ui/REVIEW_INSTRUCTIONS.md
          retention-days: 90
          if-no-files-found: error
      - name: Audit real Mara first-scene HOLD without state writes
        run: |
          python - <<'PY'
          from experiments.sera.mara_s1_v04_audit import audit_real_mara
          audit=audit_real_mara()
          assert audit["candidate_count"] == 9
          assert audit["candidate_statuses"] == {"HOLD": 9}
          assert audit["unregistered_physical_candidates"] == ["new:bench","new:pencil"]
          assert audit["commit_authorized"] is False
          print("MARA_LIVE_SOURCE_AUDIT",audit["candidate_statuses"])
          print("UNREGISTERED_PHYSICAL_OBJECTS",audit["unregistered_physical_candidates"])
          print("REAL_MARA_CANONICAL_COMMITS",audit["eventgraph_committed_count"])
          PY

  sera-browser-e2e:
    needs: sera-m1-offline
    runs-on: [self-hosted, linux]
    timeout-minutes: 16
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sera-v021-browser-source
    steps:
      - uses: actions/checkout@v4
        with:
          path: sera-v021-browser-source
          clean: false
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium browser test dependency (no model/provider calls)
        run: |
          python -m pip install playwright==1.56.0
          # Self-hosted restricted runner forbids sudo via no-new-privileges.
          # Install browser binaries into the user cache without system apt.
          python -m playwright install chromium
      - name: Real Chromium Mara blind reviewer end-to-end
        run: |
          set -euo pipefail
          python -m experiments.sera.browser_e2e_v09 \
            | tee "$RUNNER_TEMP/sera-browser-e2e-summary.json"
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "sera-browser-e2e-summary.json")
          proof=json.load(open(path, encoding="utf-8"))
          for field in (
              "source_bound_object_added", "fabricated_event_blocked",
              "source_claim_kept_reported", "download_python_validated",
              "json_roundtrip_exact", "cross_reviewer_import_blocked",
              "mobile_navigation_passed",
          ):
              assert proof[field] is True, f"BROWSER_E2E_FAILURE:{field}"
          assert proof["sentence_count"] == 28
          assert proof["real_human_reviews_performed"] == 0
          assert proof["real_gold_qualified"] is False
          assert proof["paid_model_calls"] == 0
          assert proof["canonical_world_writes"] == 0
          print("SERA_BROWSER_E2E_VERIFIED_GREEN")
          PY
      - name: Preserve noncanonical browser E2E diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-browser-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/sera-browser-e2e-summary.json
          retention-days: 30
          if-no-files-found: warn
