name: Story Judge Quota Neutral
permissions:
  contents: write
on:
  push:
    paths:
      - experiments/triggers/story-judge-quota-neutral.txt
      - experiments/prototypes/story_judge_quota_neutral_20260925.py
  workflow_dispatch:
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=.:experiments/prototypes python experiments/prototypes/story_judge_quota_neutral_20260925.py
      - name: Archive evidence
        run: |
          test -s runs/story-judge-quota-neutral/result.json
          DEST="experiments/results/story-judge-quota-neutral/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-judge-quota-neutral/result.json "$DEST/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): quota-neutral judge ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-judge-quota-neutral-${GITHUB_RUN_ID}"
