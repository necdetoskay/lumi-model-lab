name: LSF Spine Planner Qualification 02 Garden Gate

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/lsf-spine-planner-qualification-02-garden-gate.txt

jobs:
  qualification:
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.25
      - name: Run garden-gate planner qualification
        run: PYTHONPATH=. python experiments/prototypes/lsf_spine_planner_qualification_02_garden_gate_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/lsf-spine-planner-qualification-02-garden-gate/result.json
          DEST="experiments/results/lsf-spine-planner-qualification-02-garden-gate/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/lsf-spine-planner-qualification-02-garden-gate/result.json "$DEST/result.json"
          cp runs/lsf-spine-planner-qualification-02-garden-gate/plan.json "$DEST/plan.json"
          if test -s runs/lsf-spine-planner-qualification-02-garden-gate/english.txt; then cp runs/lsf-spine-planner-qualification-02-garden-gate/english.txt "$DEST/english.txt"; fi
          if test -s runs/lsf-spine-planner-qualification-02-garden-gate/turkish.txt; then cp runs/lsf-spine-planner-qualification-02-garden-gate/turkish.txt "$DEST/turkish.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): LSF garden-gate planner qualification ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/lsf-spine-planner-qualification-02-garden-gate-${GITHUB_RUN_ID}"
