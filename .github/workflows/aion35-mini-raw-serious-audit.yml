name: Aion 3.5 Mini Raw Serious Audit

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/aion35-mini-raw-serious-audit.txt

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.25
      - name: Run serious-defect audit
        run: PYTHONPATH=. python experiments/prototypes/aion35_mini_raw_serious_audit_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/aion35-mini-raw-serious-audit/result.json
          DEST="experiments/results/aion35-mini-raw-serious-audit/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/aion35-mini-raw-serious-audit/result.json "$DEST/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): Aion Mini raw serious audit ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/aion35-mini-raw-serious-audit-${GITHUB_RUN_ID}"
