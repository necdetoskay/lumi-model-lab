name: SERA Haiku v0.11.1 Missing Two Independent Reviews
on:
  push:
    branches:
      - experiment/sera-scene-state-v0-1-20261015
    paths:
      - experiments/sera/launch/mara-s1-haiku-two-once-20261016.json
permissions:
  contents: read
  actions: read
concurrency:
  group: sera-v0111-two-only-20261016
  cancel-in-progress: false
jobs:
  two-remaining:
    if: >-
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[SERA-V0111-TWO-ONLY]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify one-use pinned grant and output-token safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from experiments.sera.haiku_remaining_two_v011 import MAX_NEW_CALLS,OBSERVED_SPEND_STOP_USD,TASKS
          from experiments.sera.request_policy import verify_current_sera_clients
          p=Path("experiments/sera/launch/mara-s1-haiku-two-once-20261016.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          expected={
            "schema":"sera.haiku-two-remaining-grant.v0.11.1",
            "authorized":True,
            "scope":"ONLY_TASK_002_AND_003_AND_REUSE_PAID_001",
            "source_prose_sha256":"80304dbab7a8ed66501e5f3b1f773719f4f6a624a14c2eb03ef39160df686a03",
            "risk_evidence_run_id":38862521913,
            "reused_haiku_run_id":38863339302,
            "model":"anthropic/claude-haiku-4.5",
            "max_new_provider_calls":2,
            "observed_spend_stop_usd":"0.04",
            "output_token_cap_set":False,
            "no_retries":True,
            "no_writer_regeneration":True,
            "no_jev":True,
            "no_canonical_commit":True,
            "no_world_db_write":True,
            "no_reruns":True,
            "launch_id":"sera-mara-v0111-haiku-two-once-20261016"
          }
          assert set(obj)==set(expected)|{"approved_code_sha"},"GRANT_FIELDS_INVALID"
          assert all(obj[k]==v for k,v in expected.items()),"GRANT_VALUES_INVALID"
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          assert parent==obj["approved_code_sha"],"GRANT_CODE_SHA_MISMATCH"
          files=subprocess.check_output([
            "git","diff-tree","--no-commit-id","--name-only","-r","HEAD"
          ],text=True).splitlines()
          assert files==[str(p)],"GRANT_NOT_ISOLATED_ONE_FILE"
          assert MAX_NEW_CALLS==2 and str(OBSERVED_SPEND_STOP_USD)=="0.04"
          assert TASKS==("task_002","task_003")
          verify_current_sera_clients()
          print("SERA_HAIKU_TWO_ONLY_PINNED_GRANT_GREEN")
          PY
          python -m unittest discover -s experiments/sera/tests -q
      - name: Install preflight library
        run: python -m pip install requests
      - name: Download historical risk and first Haiku model response
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sera-old-haiku" "$RUNNER_TEMP/sera-old-risk"
          gh run download 38862521913 --repo "$GITHUB_REPOSITORY" \
            --name sera-v011-real-mara-risk-report-38862521913 \
            --dir "$RUNNER_TEMP/sera-old-risk"
          gh run download 38863339302 --repo "$GITHUB_REPOSITORY" \
            --name sera-mara-v011-haiku-targeted-38863339302 \
            --dir "$RUNNER_TEMP/sera-old-haiku"
          python -m experiments.sera.haiku_remaining_two_v011 \
            --risks "$RUNNER_TEMP/sera-old-risk/risks.json" \
            --historical-dir "$RUNNER_TEMP/sera-old-haiku"
      - name: Request only tasks 002 and 003; preserve source evidence
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "SERA_MISSING_OPENROUTER_KEY_NO_PAID_CALL"
            exit 1
          fi
          python -m experiments.sera.haiku_remaining_two_v011 \
            --live \
            --risks "$RUNNER_TEMP/sera-old-risk/risks.json" \
            --historical-dir "$RUNNER_TEMP/sera-old-haiku" \
            --output-dir "$RUNNER_TEMP/sera-haiku-two" \
            --launch-id "sera-haiku-two-$GITHUB_RUN_ID"
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"sera-haiku-two"/"manifest.json"
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["new_provider_calls"]<=2
          assert d["model_output_token_cap_configured"] is False
          assert d["canonical_commit_authorized"] is False
          assert d["world_db_writes"]==0
          print("SERA_HAIKU_TWO_STATUS",d["status"])
          print("SERA_HAIKU_TWO_CALLS",d["new_provider_calls"])
          print("SERA_HAIKU_TWO_COST",d["new_provider_reported_cost_usd"])
          print("SERA_HAIKU_TWO_COMPLETE",d["completed_tasks"])
          print("SERA_HAIKU_TWO_PENDING",d["pending_tasks"])
          print("SERA_HAIKU_TWO_ERROR",d["error_code"])
          PY
      - name: Archive raw model responses and pending task manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-haiku-v0111-two-${{ github.run_id }}
          path: ${{ runner.temp }}/sera-haiku-two/
          retention-days: 90
          if-no-files-found: warn
