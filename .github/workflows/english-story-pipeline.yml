name: English Story Pipeline

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Exact OpenRouter generator model id'
        required: true
        default: 'openai/gpt-5.6-luna'
        type: string
      continuity_evaluator_model:
        description: 'Exact OpenRouter continuity evaluator model id'
        required: true
        default: 'typesafe/jev-1.13'
        type: string
      semantic_judge_model:
        description: 'Exact OpenRouter semantic quality judge model id'
        required: true
        default: 'anthropic/claude-haiku-4.5'
        type: string
      jev_model:
        description: 'Deprecated compatibility alias for continuity evaluator'
        required: false
        default: ''
        type: string
      judge_model:
        description: 'Deprecated compatibility alias for semantic quality judge'
        required: false
        default: ''
        type: string
      spec:
        description: 'English benchmark spec'
        required: true
        default: 'data/specifications/benchmark_en/01_exploration_mystery.yaml'
        type: string

permissions:
  contents: read

jobs:
  produce:
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify OpenRouter credential
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Repository secret OPENROUTER_API_KEY is not configured.'
            exit 1
          fi
      - name: Run English story pipeline
        shell: bash
        env:
          MODEL_ID: ${{ inputs.model }}
          CONTINUITY_EVALUATOR_MODEL: ${{ inputs.continuity_evaluator_model }}
          SEMANTIC_JUDGE_MODEL: ${{ inputs.semantic_judge_model }}
          LEGACY_JEV_MODEL: ${{ inputs.jev_model }}
          LEGACY_JUDGE_MODEL: ${{ inputs.judge_model }}
          SPEC_PATH: ${{ inputs.spec }}
        run: |
          CONTINUITY_MODEL="${LEGACY_JEV_MODEL:-$CONTINUITY_EVALUATOR_MODEL}"
          SEMANTIC_JUDGE="${LEGACY_JUDGE_MODEL:-$SEMANTIC_JUDGE_MODEL}"
          python -m src.english_story_pipeline \
            --model "$MODEL_ID" \
            --continuity-evaluator-model "$CONTINUITY_MODEL" \
            --semantic-judge-model "$SEMANTIC_JUDGE" \
            --spec "$SPEC_PATH"
      - name: Build immutable qualification evidence pack
        if: always()
        shell: bash
        env:
          SPEC_PATH: ${{ inputs.spec }}
        run: |
          EVIDENCE_SOURCE=""
          if [ -f runs/english_story_pipeline/result.json ]; then
            EVIDENCE_SOURCE="runs/english_story_pipeline/result.json"
          elif [ -f runs/english_story_pipeline/failure.json ]; then
            EVIDENCE_SOURCE="runs/english_story_pipeline/failure.json"
          fi
          if [ -n "$EVIDENCE_SOURCE" ]; then
            python -m src.capability_cube pack \
              --result "$EVIDENCE_SOURCE" \
              --spec "$SPEC_PATH" \
              --run-id "$GITHUB_RUN_ID" \
              --output-root runs/english_story_pipeline/evidence-pack
            python -m src.capability_cube verify \
              --evidence-root runs/english_story_pipeline/evidence-pack
          fi
      - name: Print accepted English master
        if: success()
        shell: bash
        run: |
          echo '===== ENGLISH MASTER STORY BEGIN ====='
          cat runs/english_story_pipeline/result.story.txt
          echo
          echo '===== ENGLISH MASTER STORY END ====='
      - name: Upload pipeline evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: english-story-pipeline-${{ github.run_id }}
          path: runs/english_story_pipeline/
          if-no-files-found: warn
          retention-days: 14
