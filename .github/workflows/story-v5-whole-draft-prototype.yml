name: Story v5 Whole Draft Prototype

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-v5-whole-draft-prototype.txt

permissions:
  contents: write

jobs:
  prototype:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile prototype
        run: python -m py_compile experiments/prototypes/story_v5_whole_draft_prototype.py

      - name: Provider preflight
        run: python -m src.openrouter_preflight --json

      - name: Run v5 prototype
        id: run
        continue-on-error: true
        run: |
          PYTHONPATH=. python experiments/prototypes/story_v5_whole_draft_prototype.py \
            --output runs/story_v5_prototype/result.json

      - name: Archive prototype evidence
        if: always()
        shell: bash
        run: |
          DEST="experiments/results/story-v5-whole-draft/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          for FILE in result.json result.story.txt result.outcome.json; do
            if [ -f "runs/story_v5_prototype/$FILE" ]; then
              cp "runs/story_v5_prototype/$FILE" "$DEST/$FILE"
            fi
          done
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "english-story-production.v5-whole-draft-prototype"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -s "$DEST/result.json" ] || [ ! -s "$DEST/result.story.txt" ] || [ ! -s "$DEST/result.outcome.json" ]; then
            echo "::error::Prototype evidence incomplete: result.json, result.story.txt and result.outcome.json are required"
            find "$DEST" -maxdepth 1 -type f -printf '%f %s bytes\\n' || true
            exit 1
          fi
          git add "$DEST"
          git commit -m "evidence(experiment): story v5 whole-draft prototype ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-whole-draft-${GITHUB_RUN_ID}"

      - name: Preserve outcome
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          echo "prototype outcome=$RUN_OUTCOME"
          if [ "$RUN_OUTCOME" != "success" ]; then
            echo "::error::Prototype execution failed"
            exit 1
          fi
