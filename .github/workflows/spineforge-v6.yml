name: SpineForge v6 Blueprint Strict Transport Frozen Attempt

on:
  push:
    branches:
      - experiment/spineforge-v6-blueprint-strict-transport
    paths:
      - experiments/triggers/spineforge-v6.json

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen v6 runtime and run one authorized attempt
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf runs/spineforge-v6
          PYTHONPATH=. python -m src.spineforge_v6_stage \
            --trigger experiments/triggers/spineforge-v6.json \
            --out-dir runs/spineforge-v6
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d runs/spineforge-v6 ]; then exit 0; fi
          run_id="${GITHUB_RUN_ID}"
          target="experiments/results/spineforge-v6/${run_id}"
          mkdir -p "${target}"
          cp -a runs/spineforge-v6/. "${target}/"
          cp experiments/triggers/spineforge-v6.json "${target}/trigger.json"
          branch="evidence/spineforge-v6-${run_id}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add "${target}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(spineforge): archive v6 run ${run_id}"
          git push origin "${branch}"
