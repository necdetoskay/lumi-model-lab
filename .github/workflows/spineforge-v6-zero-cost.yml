name: SpineForge v6 Zero-Cost Qualification

on:
  push:
    branches:
      - experiment/spineforge-v6-blueprint-strict-transport

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: v6 strict-transport proof
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spineforge_v5_contract.py
          tests/test_spineforge_v6_runtime.py
          tests/test_spineforge_v6_strict_transport.py
          tests/test_spineforge_v6_stage.py
      - name: v1-v5 historical freeze regression
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spineforge_contract.py
          tests/test_spineforge_freeze_runtime.py
          tests/test_spineforge_frozen_v1.py
          tests/test_spineforge_revision.py
          tests/test_spineforge_runtime.py
          tests/test_spine_context_pack_v1.py
          tests/test_spineforge_v2_context_runtime.py
          tests/test_spineforge_v2_stage.py
          tests/test_spineforge_v2_frozen.py
          tests/test_spineforge_v3_context_runtime.py
          tests/test_spineforge_v3_stage.py
          tests/test_spineforge_v3_frozen.py
          tests/test_spineforge_v4_context_runtime.py
          tests/test_spineforge_v4_stage.py
          tests/test_spineforge_v4_frozen.py
          tests/test_spineforge_v5_frozen.py
          -k "not starts_zero_spend_and_without_paid_trigger"
