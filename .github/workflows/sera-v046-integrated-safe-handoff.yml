name: SERA v0.46 Real Mara SceneTrace to v0.18 and v0.22 Safe Handoff
on:
  push:
    branches:
      - experiment/sera-scene-state-v0-1-20261015
    paths:
      - experiments/sera/scene_trace_integrated_lab_v046.py
      - experiments/sera/scene_trace_integrated_smoke_v046.py
      - experiments/sera/tests/test_scene_trace_integrated_lab_v046.py
      - .github/workflows/sera-v046-integrated-safe-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-to-full-gate-offline:
    runs-on: [self-hosted, linux]
    timeout-minutes: 12
    defaults:
      run:
        working-directory: sera-v046-source
    steps:
      - uses: actions/checkout@v4
        with:
          path: sera-v046-source
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce no model output ceiling and run complete SERA suite
        run: |
          set -euo pipefail
          python -m experiments.sera.request_policy
          python -m unittest discover -s experiments/sera/tests -q
      - name: Retrieve exact historical real model receipts with no model key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sera-v046/bench" "$RUNNER_TEMP/sera-v046/pencil"
          gh run download 38936451931 --repo "$GITHUB_REPOSITORY" \
            --name sera-v040-real-blind-once-38936451931 \
            --dir "$RUNNER_TEMP/sera-v046/bench"
          gh run download 38938438488 --repo "$GITHUB_REPOSITORY" \
            --name sera-v041-real-pencil-once-38938438488 \
            --dir "$RUNNER_TEMP/sera-v046/pencil"
      - name: Run real-source synthetic v045 -> v018 -> v022 sequence twice
        run: |
          set -euo pipefail
          python -m experiments.sera.scene_trace_integrated_smoke_v046 \
            --bench-receipt-dir "$RUNNER_TEMP/sera-v046/bench" \
            --pencil-receipt-dir "$RUNNER_TEMP/sera-v046/pencil" \
            --output-root "$RUNNER_TEMP/sera-v046/worker"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/
              "sera-v046/worker/v046-proof.json").read_text(encoding="utf-8"))
          r=report["result"]
          assert r["status"]=="FAILED_SAFE_FINAL"
          assert r["repair_stage_status"]=="SOURCE_BOUND_REPAIR_ADVISORIES_ONLY"
          assert r["targeted_semantic_stage_status"]==                 "TWO_SOURCE_BOUND_ADVISORIES_NONCANONICAL"
          assert r["full_fresh_v022_stage_status"]=="FAILED_SAFE_FINAL"
          assert report["synthetic_semantic_calls_this_execution"]==2
          assert report["synthetic_full_sweep_calls_this_execution"]>=1
          assert report["repeat_read_only_result_identical"] is True
          assert report["repeat_semantic_scripted_calls"]==0
          assert report["repeat_full_sweep_scripted_calls"]==0
          assert r["paid_provider_calls_new"]==0
          assert r["production_db_writes"]==0
          assert r["sqlite_lab_writes"]==0
          assert r["requires_manual_intervention"] is False
          assert r["canonical_commit_authorized"] is False
          assert r["independent_semantic_qualification"] is False
          print("SERA_V046_V018_V022_REAL_MARA_FAIL_SAFE_HANDOFF_PASS")
          PY
      - name: Archive checkpoint and real source safe-stop audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-v046-real-mara-gated-safe-stop-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sera-v046/worker/v046-proof.json
            ${{ runner.temp }}/sera-v046/worker/repair/
            ${{ runner.temp }}/sera-v046/worker/semantic/
            ${{ runner.temp }}/sera-v046/worker/full-worker/
          retention-days: 90
          if-no-files-found: warn
