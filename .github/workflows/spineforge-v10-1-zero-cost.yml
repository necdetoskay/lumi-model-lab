name: SpineForge v10.1 Beat-Set Parity Zero-Cost
# verification-retrigger-after-actions-state-stall

on:
  push:
    branches:
      - experiment/spineforge-v10-1-beat-set-parity

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: v10.1 exact-failure replay and owner classification
        run: PYTHONPATH=. python -m pytest -q tests/test_spineforge_v10_1_beat_set_parity.py tests/test_spineforge_v10_1_frozen.py
      - name: inherited v10 partition runtime regression
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spineforge_v10_contract_parity.py
          tests/test_spineforge_v10_strict_transport.py
          tests/test_spineforge_v10_runtime.py
          tests/test_spineforge_v10_stage.py
      - name: historical v1-v9 regression
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spineforge_contract.py
          tests/test_spineforge_freeze_runtime.py
          tests/test_spineforge_frozen_v1.py
          tests/test_spineforge_revision.py
          tests/test_spineforge_runtime.py
          tests/test_spine_context_pack_v1.py
          tests/test_spineforge_v2_context_runtime.py
          tests/test_spineforge_v2_stage.py
          tests/test_spineforge_v2_frozen.py
          tests/test_spineforge_v3_context_runtime.py
          tests/test_spineforge_v3_stage.py
          tests/test_spineforge_v3_frozen.py
          tests/test_spineforge_v4_context_runtime.py
          tests/test_spineforge_v4_stage.py
          tests/test_spineforge_v4_frozen.py
          tests/test_spineforge_v5_frozen.py
          tests/test_spineforge_v6_frozen.py
          tests/test_spineforge_v7_frozen.py
          tests/test_spineforge_v8_frozen.py
          tests/test_spineforge_v9_frozen.py
          -k "not starts_zero_spend_and_without_paid_trigger and not case_ready_zero_spend_and_no_paid_trigger and not case_ready_zero_spend_and_without_paid_trigger and not case_zero_spend_without_paid_trigger_before_authorization"
