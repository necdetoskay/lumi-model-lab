name: Story Defect Natural v1.1 Replacement Hunt

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-defect-natural-v11-replacement-hunt.txt

jobs:
  hunt:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compile hunt
        run: python -m py_compile experiments/prototypes/story_defect_natural_v11_replacement_hunt_20260926.py
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.50
      - name: Run bounded replacement hunt
        run: PYTHONPATH=. python experiments/prototypes/story_defect_natural_v11_replacement_hunt_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/story-defect-natural-v11-replacement-hunt/result.json
          DEST="experiments/results/story-defect-natural-v11-replacement-hunt/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-defect-natural-v11-replacement-hunt/result.json "$DEST/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): natural v1.1 replacement hunt ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-defect-natural-v11-replacement-hunt-${GITHUB_RUN_ID}"
