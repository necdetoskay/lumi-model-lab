name: SpineForge v17 Audit-Only Freeze Builder

on:
  push:
    branches:
      - experiment/spineforge-v17-audit-only-recovery
    paths:
      - experiments/freeze/spineforge-v17.request

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build v17 audit-only freeze profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          paths = [
              ".github/workflows/spineforge-v17.yml",
              "requirements.txt",
              "configs/model_runtime_profiles.yaml",
              "src/spineforge_freeze_verify.py",
              "src/spineforge_v17.py",
              "src/spineforge_v17_case_manifest.py",
              "src/spineforge_v17_stage.py",
              "src/spineforge_v17_evidence_summary.py",
              "data/specifications/story_lab/spineforge_v17_age18_forbidden_cartographer_case_v1.json",
              "prompts/spineforge_compact_complete_auditor_v17.md",
              "experiments/results/spineforge-v16/36760550050/result.json",
              "src/spineforge_v13_audit_normalizer.py",
              "src/spineforge_v11.py",
              "src/spineforge_v11_contract.py",
              "src/spine_context_pack_v1.py",
              "src/episode_spine_v3_contract.py",
              "src/premise_architect_v2_contract.py",
              "src/reader_profile_v2.py",
              "src/saga_blueprint_contract.py",
              "src/saga_spine_v2_contract.py",
              "src/english_story_pipeline.py",
              "src/generate.py",
              "src/schemas.py",
              "src/model_registry.py",
              "src/model_usage_rollup.py",
          ]

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          profile = {
              "schema_version": "spineforge-runtime-profile.v1",
              "runtime_id": "spineforge.contextpack.v17.audit",
              "status": "FROZEN_QUALIFICATION_CANDIDATE",
              "purpose": "One-call compact complete Sonnet audit of the already validated v16 repaired Spine, with structured-failure usage/cost checkpointing.",
              "runtime": {
                  "audit_runtime": "src/spineforge_v17.py",
                  "audit_model": "anthropic/claude-sonnet-5.5",
                  "audit_prompt": "prompts/spineforge_compact_complete_auditor_v17.md",
                  "source_evidence": "experiments/results/spineforge-v16/36760550050/result.json",
                  "audit_max_tokens": 8000,
                  "max_calls_per_attempt": 1,
                  "repair_called": False,
                  "architect_recall": False,
                  "writer_authorized": False
              },
              "audit_policy": {
                  "all_18_dimensions_required": True,
                  "freshness_required": True,
                  "compact_output_required": True,
                  "structured_failure_usage_checkpoint_required": True,
                  "accept_requires_complete_typed_audit": True
              },
              "evidence_policy": {
                  "full_repo_evidence_required": True,
                  "repo_evidence_path": "experiments/results/spineforge-v17/<run_id>",
                  "artifact_upload": "best_effort_only",
                  "exact_token_cost_latency_required": True
              },
              "paid_boundary_policy": {
                  "explicit_authorization_required_for_attempt_1": True,
                  "no_automatic_paid_retry": True,
                  "no_repair_call_inside_v17": True,
                  "no_writer_call_inside_spineforge": True
              },
              "runtime_freeze": {
                  "enabled": True,
                  "runtime_revision": "SPINEFORGE-AUDIT-ONLY-RECOVERY-FROZEN-v17",
                  "runtime_source_commit": os.environ["GITHUB_SHA"],
                  "files": [{"path": p, "sha256": sha256(p)} for p in paths]
              }
          }

          out = Path("data/specifications/story_lab/spineforge_runtime_profile_v17_audit_only_frozen.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(profile, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "runtime_revision": profile["runtime_freeze"]["runtime_revision"],
              "runtime_source_commit": profile["runtime_freeze"]["runtime_source_commit"],
              "frozen_files": len(paths)
          }, indent=2))
          PY
      - name: Commit freeze profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/specifications/story_lab/spineforge_runtime_profile_v17_audit_only_frozen.json
          git commit -m "canon(spineforge-v17): freeze audit-only recovery runtime"
          git fetch origin experiment/spineforge-v17-audit-only-recovery
          git rebase origin/experiment/spineforge-v17-audit-only-recovery
          git push origin HEAD:experiment/spineforge-v17-audit-only-recovery
