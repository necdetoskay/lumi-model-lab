name: Story Harness P4.18 Tiny Sonnet Compatibility Once

on:
  pull_request:
    paths:
      - configs/story_harness_p418_probe_trigger.json

permissions:
  contents: read

concurrency:
  group: lumi-p418-sonnet-compat-once
  cancel-in-progress: false

jobs:
  tiny-compatibility:
    if: ${{ github.event.pull_request.number == 275 && github.event.pull_request.head.repo.full_name == 'necdetoskay/lumi-model-lab' && github.head_ref == 'experiment/story-harness-control-plane-v1' }}
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Reject any commit except the exact separate compatibility trigger
        run: |
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(
            ['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],
            text=True).splitlines()
          assert changed==['configs/story_harness_p418_probe_trigger.json'], (
              'No new reviewed compatibility probe trigger in HEAD; no paid request')
          print('P418_UNIQUE_TRIGGER_COMMIT_GREEN')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact tiny public-only scope and offline negative tests
        run: |
          python -m unittest discover -s tests -p 'test_story_harness_p418_compat_probe.py' -q
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('configs/story_harness_p418_probe_trigger.json').read_text())
          assert manifest=={
              'schema':'lumi.story-harness-p418-probe-once-grant.v1',
              'probe_id':'sonnet55-compat-v01',
              'synthetic_prompt_only':True,
              'maximum_provider_posts':2,
              'maximum_probe_exposure_usd':'0.06',
              'previous_uncertain_story_exposure_usd':'1.05',
              'remaining_aggregate_budget_before_usd':'8.95',
              'total_user_approved_budget_usd':'10.00',
              'automatic_retries':False,
              'production_write':False,
          }, 'Malformed grant or budget; paid probe denied'
          print('P418_PAIRED_MICROPROBE_SCOPE_GREEN')
          PY
      - name: Confirm existing OpenRouter inference key read-only access
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from decimal import Decimal, InvalidOperation
          from src.story_harness_p414 import read_current_key
          from src.story_harness_v1 import HarnessStop
          data=read_current_key(api_key=os.getenv('OPENROUTER_API_KEY',''))['data']
          remaining=data.get('limit_remaining')
          if remaining is not None:
              try: n=Decimal(str(remaining))
              except (InvalidOperation,ValueError):
                  raise HarnessStop('Invalid key remaining balance')
              if not n.is_finite() or n<Decimal('0.06'):
                  raise HarnessStop('Not enough credit for tiny compatibility probe')
          if data.get('is_free_tier') is True or data.get('is_management_key') is True:
              raise HarnessStop('Not an authorized paid inference key')
          print('P418_EXISTING_KEY_READ_ONLY_PRECHECK_GREEN')
          PY
      - name: Execute up to two tiny public synthetic provider compatibility requests ONCE
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LUMI_P418_ENABLE: APPROVED_AGGREGATE_10_USD
        run: |
          set -euo pipefail
          export PROBE_ROOT="${RUNNER_WORKSPACE}/_lumi_p418_claims"
          mkdir -p "$PROBE_ROOT"
          chmod 700 "$PROBE_ROOT"
          python -m src.story_harness_p418_compat_probe \
            --paid-one-shot --run-root "$PROBE_ROOT" > /tmp/lumi-p418-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/lumi-p418-summary.json').read_text())
          assert r['quality_accepted'] is False
          assert r['production_state_write_authorized'] is False
          print('P418_STAGES_ATTEMPTED='+str(len(r['stage_results'])))
          print('P418_KNOWN_PROVIDER_SPEND_USD='+r['known_provider_billed_cost_usd'])
          for row in r['stage_results']:
              print('P418_STAGE_'+row['stage']+'_HTTP='+str(row['http_status']))
              if row['error'] is not None:
                  print('P418_SAFE_PROVIDER_HINT='+row['error']['message'])
          if not r['two_stage_wire_compatible']:
              raise SystemExit('P418_COMPATIBILITY_NOT_YET_PROVEN_NO_RETRY')
          print('P418_MINIMAL_AND_STRICT_PROVIDER_COMPATIBILITY_GREEN')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumi-p418-once-safe-public-compat-result
          path: ${{ runner.workspace }}/_lumi_p418_claims/p418-sonnet55-compat-v01/
          if-no-files-found: warn
          retention-days: 30
