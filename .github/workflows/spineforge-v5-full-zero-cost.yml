name: SpineForge v5 Full Zero-Cost Qualification
# strict-transport-isolated

on:
  push:
    branches:
      - experiment/spineforge-v5-creative-structural-split
    paths:
      - '.github/workflows/spineforge-v5-full-zero-cost.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run complete v5 zero-cost suite
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_openrouter_json_schema.py
          tests/test_generate_explicit_response_format.py
          tests/test_spineforge_v5_contract_boundary.py
          tests/test_spineforge_v5_runtime.py
          tests/test_spineforge_v5_stage.py
      - name: Run v1-v4 historical regression
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spineforge_contract.py
          tests/test_spineforge_freeze_runtime.py
          tests/test_spineforge_frozen_v1.py
          tests/test_spineforge_revision.py
          tests/test_spineforge_runtime.py
          tests/test_spine_context_pack_v1.py
          tests/test_spineforge_v2_context_runtime.py
          tests/test_spineforge_v2_stage.py
          tests/test_spineforge_v2_frozen.py
          tests/test_spineforge_v3_context_runtime.py
          tests/test_spineforge_v3_stage.py
          tests/test_spineforge_v3_frozen.py
          tests/test_spineforge_v4_context_runtime.py
          tests/test_spineforge_v4_stage.py
          tests/test_spineforge_v4_frozen.py
          -k "not starts_zero_spend_and_without_paid_trigger"
