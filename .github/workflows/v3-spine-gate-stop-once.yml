# INSTALL ONLY after owner review in:
# .github/workflows/v3-spine-gate-stop-once.yml
# on branch experiment/v3-spine-gate-stop-20261015.
# Adding this workflow file alone DOES NOT run a paid test.
# A later explicit push of the grant with commit marker is required.
name: Final V3 Strict-Gate Single Attempt

on:
  push:
    branches:
      - experiment/v3-spine-gate-stop-20261015
    paths:
      - experiments/triggers/v3-spine-once-20261015.json
      - experiments/triggers/v3-spine-offline-check-20261015.json

permissions:
  contents: write

concurrency:
  group: lumi-final-v3-single-spine-paid-20261015
  cancel-in-progress: false

jobs:
  offline-qualification:
    if: >-
      contains(github.event.head_commit.message, '[V3-SPINE-OFFLINE-CHECK]') &&
      github.ref == 'refs/heads/experiment/v3-spine-gate-stop-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8de824cede7dcb6be1a8a144ec051691bed6538c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Zero-provider frozen Spine replay and regression
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q             tests/test_v3_single_attempt_guard.py             tests/test_age18_frozen_lane_v1.py             tests/test_frozen_lane_generic_spine_runtime.py             tests/test_age18_lane_stabilization_matrix.py             tests/test_sonnet55_cross_age_matrix.py             tests/test_story_lane_qualification_policy.py             tests/test_frozen_lane_authority_gate.py             tests/test_frozen_lane_repair_runtime.py             tests/test_frozen_lane_translation_runtime.py
  single-spine:
    if: >-
      github.ref == 'refs/heads/experiment/v3-spine-gate-stop-20261015' &&
      contains(github.event.head_commit.message, '[V3-SPINE-PAID-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate grant and freeze exact known guard commit
        shell: bash
        env:
          APPROVED_GUARD_SHA: 8de824cede7dcb6be1a8a144ec051691bed6538c
          GRANT_PATH: experiments/triggers/v3-spine-once-20261015.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3-spine-one"
          export GRANT_COPY="$RUNNER_TEMP/v3-spine-one/grant.json"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          source=pathlib.Path(os.environ["GRANT_PATH"])
          grant=json.loads(source.read_text(encoding="utf-8"))
          required={
              "schema": "lumi.v3-single-attempt-paid-grant.v1",
              "authorized": True,
              "stage": "SPINE",
              "case_id": "age18.forbidden-cartographer.fantasy.frozen-01",
              "frozen_runtime_sha": "63e1e3ce82c244bc5bb02b0463a9a1a6715c941b",
              "models": ["anthropic/claude-sonnet-5.5","openai/gpt-5.6-luna"],
              "guard_commit_sha": os.environ["APPROVED_GUARD_SHA"],
              "max_total_usd": "0.50",
          }
          if any(grant.get(k)!=v for k,v in required.items()):
              raise SystemExit("UNAUTHORIZED_OR_MISMATCHED_GRANT")
          if not isinstance(grant.get("human_approval_reference"),str):
              raise SystemExit("HUMAN_APPROVAL_REFERENCE_REQUIRED")
          import re
          gid=grant.get("grant_id")
          if not isinstance(gid,str) or re.fullmatch("[A-Za-z0-9][A-Za-z0-9_-]{7,79}",gid) is None:
              raise SystemExit("INVALID_GRANT_ID")
          shutil.copyfile(source,os.environ["GRANT_COPY"])
          os.chmod(os.environ["GRANT_COPY"],0o600)
          print("GRANT_PREFLIGHT_PASS_NO_PROVIDER_CALL")
          PY
          git cat-file -e "${APPROVED_GUARD_SHA}^{commit}"
          git checkout --detach "$APPROVED_GUARD_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_GUARD_SHA"
          test -z "$(git status --porcelain)"
          echo "FROZEN_GUARD_SHA=$APPROVED_GUARD_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify frozen code and retry guard without provider access
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify \
            --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q \
            tests/test_v3_single_attempt_guard.py \
            tests/test_age18_frozen_lane_v1.py \
            tests/test_frozen_lane_generic_spine_runtime.py

      - name: Consume one-use authorization in GitHub atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GRANT_COPY: ${{ runner.temp }}/v3-spine-one/grant.json
        run: |
          set -euo pipefail
          grant_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["grant_id"])' "$GRANT_COPY")"
          ref="refs/heads/evidence/v3-paid-claim-${grant_id}"
          if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="$ref" -f sha="$GITHUB_SHA" >/dev/null; then
            echo "::error::Authorization already consumed or claim operation denied. No provider call."
            exit 1
          fi
          echo "GLOBAL_ONCE_CLAIM_CREATED"

      - name: Execute one authorized Spine (Sonnet, then Luna only if eligible)
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GRANT_COPY: ${{ runner.temp }}/v3-spine-one/grant.json
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::GitHub Actions OpenRouter secret missing in this job"
            exit 1
          fi
          PYTHONPATH=. python -B -m experiments.v3_single_attempt_spine_probe \
            --grant "$GRANT_COPY" \
            --claim-dir "$RUNNER_WORKSPACE/../_lumi_v3_claims" \
            --evidence-dir "$RUNNER_TEMP/v3-spine-one/evidence"
          echo "NO_WRITER_DISPATCHED"

      - name: Archive evidence even when the model fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-final-v3-spine-single-attempt-${{ github.run_id }}
          path: ${{ runner.temp }}/v3-spine-one/evidence/
          if-no-files-found: warn
          retention-days: 90
