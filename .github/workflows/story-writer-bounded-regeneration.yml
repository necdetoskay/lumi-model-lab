name: Story Writer Bounded Regeneration
permissions:
  contents: write
on:
  push:
    paths:
      - experiments/triggers/story-writer-bounded-regeneration.txt
      - experiments/prototypes/story_writer_bounded_regeneration_20260926.py
  workflow_dispatch:
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python experiments/prototypes/story_writer_bounded_regeneration_20260926.py
      - name: Archive evidence
        run: |
          test -s runs/story-writer-bounded-regeneration/result.json
          DEST="experiments/results/story-writer-bounded-regeneration/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-writer-bounded-regeneration/result.json "$DEST/result.json"
          cp runs/story-writer-bounded-regeneration/attempt-*.txt "$DEST/"
          if [ -f runs/story-writer-bounded-regeneration/final.txt ]; then
            cp runs/story-writer-bounded-regeneration/final.txt "$DEST/final.txt"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): writer bounded regeneration ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-writer-bounded-regeneration-${GITHUB_RUN_ID}"
