name: Final V3 F2 Real-Model Repair Final Luna Recheck

on:
  push:
    branches: [experiment/v3-f2-quality-verified-model-repair-20261015]
    paths:
      - experiments/triggers/v3-f2-quality-recheck-offline-20261015.json
      - experiments/triggers/v3-f2-quality-recheck-once-20261015.json

permissions:
  contents: read

concurrency:
  group: lumi-f2-final-luna-one-recheck-20261015
  cancel-in-progress: false

jobs:
  offline:
    if: >-
      github.ref == 'refs/heads/experiment/v3-f2-quality-verified-model-repair-20261015' &&
      contains(github.event.head_commit.message, '[V3-F2-RECHECK-OFFLINE]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 98851f0dc102d352e4bc88e5803b4a1d8514ae2f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify frozen V3 and real archived evidence one-Luna recheck
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q tests/test_v3_f2_quality_luna_recheck_probe.py tests/test_v3_real_model_repair_evidence.py tests/test_v3_f2_autonomous_quality_probe.py tests/test_v3_unattended_quality_model_adapter.py tests/test_v3_unattended_story_quality.py tests/test_v3_aion_f2_writer_single_attempt_probe.py tests/test_v3_single_attempt_aion_writer_guard.py tests/test_v3_single_attempt_guard.py tests/test_age18_frozen_lane_v1.py tests/test_frozen_lane_generic_spine_runtime.py tests/test_age18_lane_stabilization_matrix.py tests/test_sonnet55_cross_age_matrix.py tests/test_story_lane_qualification_policy.py tests/test_frozen_lane_authority_gate.py tests/test_frozen_lane_repair_runtime.py tests/test_frozen_lane_translation_runtime.py
      - name: Validate read-only GitHub claim interface
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/experiments/v3_f2_quality_luna_recheck_probe.py?ref=experiment/v3-f2-quality-verified-model-repair-20261015" --jq .sha >/dev/null
          echo "RECHECK_GITHUB_READONLY_PROOF_PASS"

  single-luna-recheck:
    if: >-
      github.ref == 'refs/heads/experiment/v3-f2-quality-verified-model-repair-20261015' &&
      contains(github.event.head_commit.message, '[V3-F2-RECHECK-PAID-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize one new Luna recheck with separate human grant
        shell: bash
        env:
          GUARD_SHA: 98851f0dc102d352e4bc88e5803b4a1d8514ae2f
          GRANT_PATH: experiments/triggers/v3-f2-quality-recheck-once-20261015.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f2-luna-recheck"
          export GRANT_COPY="$RUNNER_TEMP/f2-luna-recheck/grant.json"
          python3 - <<'PY'
          import json,os,pathlib,re,shutil
          from decimal import Decimal
          grant=json.loads(pathlib.Path(os.environ["GRANT_PATH"]).read_text(encoding="utf-8"))
          required={
              "schema":"lumi.v3-f2-final-luna-recheck-grant.v1",
              "authorized":True,
              "stage":"ENGLISH_QUALITY_RECHECK",
              "case_id":"age18.forbidden-cartographer.fantasy.frozen-01",
              "source_writer_run_id":38703469212,
              "source_quality_run_id":38709109136,
              "original_story_sha256":"eb38aea3c43a9e59d748ee0cf6f53475bfaf1d4c412c46e0893c78ccc3874eeb",
              "archived_luna_sha256":"7d2a67f89372fe1c65868b8f3dd64dea946685c161536e0af2cc45af958ac189",
              "archived_sol_sha256":"3865c48f43929da6f10b577a72a00d2d81cc0d7a4bee3219c74b3e775946d0b3",
              "model":"openai/gpt-5.6-luna",
              "frozen_runtime_sha":"63e1e3ce82c244bc5bb02b0463a9a1a6715c941b",
              "guard_commit_sha":os.environ["GUARD_SHA"],
          }
          if any(grant.get(k)!=v for k,v in required.items()):
              raise SystemExit("LUNA_RECHECK_SCOPE_INVALID")
          gid=grant.get("grant_id")
          if not isinstance(gid,str) or not re.fullmatch("[A-Za-z0-9][A-Za-z0-9_-]{7,79}",gid):
              raise SystemExit("LUNA_RECHECK_GRANT_ID_INVALID")
          if not isinstance(grant.get("human_paid_authorization_reference"),str) or not grant["human_paid_authorization_reference"].strip():
              raise SystemExit("LUNA_RECHECK_SEPARATE_APPROVAL_MISSING")
          try: cap=Decimal(str(grant["max_total_usd"]))
          except Exception as exc: raise SystemExit("LUNA_RECHECK_BUDGET_INVALID") from exc
          if not cap.is_finite() or not Decimal("0") < cap <= Decimal("0.03"):
              raise SystemExit("LUNA_RECHECK_BUDGET_INVALID")
          shutil.copyfile(os.environ["GRANT_PATH"],os.environ["GRANT_COPY"])
          os.chmod(os.environ["GRANT_COPY"],0o600)
          print("LUNA_RECHECK_SCOPE_PREFLIGHT_PASS")
          PY
          git cat-file -e "${GUARD_SHA}^{commit}"
          git checkout --detach "$GUARD_SHA"
          test "$(git rev-parse HEAD)" = "$GUARD_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Prove archived Luna and Sol safe without provider access
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q tests/test_v3_f2_quality_luna_recheck_probe.py tests/test_v3_real_model_repair_evidence.py tests/test_v3_unattended_story_quality.py
      - name: Verify GitHub-global one-use claim tied to exact run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GRANT_COPY: ${{ runner.temp }}/f2-luna-recheck/grant.json
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1" || { echo "::error::NO_RECHECK_REPLAY"; exit 1; }
          python3 - <<'PY'
          import base64,json,os,subprocess,time
          grant=json.load(open(os.environ["GRANT_COPY"],encoding="utf-8"))
          gid=grant["grant_id"]
          branch="evidence/v3-f2-recheck-claim-"+gid
          api="repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/claims/"+gid+".json?ref="+branch
          expected={
              "schema":"lumi.v3-final-recheck-global-claim.v1",
              "authorized":True,
              "stage":"ENGLISH_QUALITY_RECHECK",
              "grant_id":gid,
              "case_id":"age18.forbidden-cartographer.fantasy.frozen-01",
              "model":"openai/gpt-5.6-luna",
              "source_quality_run_id":38709109136,
              "source_commit":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "guard_commit_sha":"98851f0dc102d352e4bc88e5803b4a1d8514ae2f",
              "max_total_usd":grant["max_total_usd"],
          }
          for _ in range(30):
              result=subprocess.run(["gh","api",api],capture_output=True,text=True)
              if result.returncode:
                  if "HTTP 404" in result.stderr:
                      time.sleep(2)
                      continue
                  raise SystemExit("RECHECK_GITHUB_CLAIM_READ_DENIED")
              try:
                  claim=json.loads(base64.b64decode(json.loads(result.stdout)["content"]))
              except (ValueError,KeyError,TypeError) as exc:
                  raise SystemExit("RECHECK_CLAIM_INVALID_JSON") from exc
              if any(claim.get(k)!=v for k,v in expected.items()):
                  raise SystemExit("RECHECK_CLAIM_WRONG_RUN_OR_SOURCE")
              print("RECHECK_GLOBAL_RUN_BOUND_CLAIM_VERIFIED")
              break
          else:
              raise SystemExit("RECHECK_GLOBAL_CLAIM_NOT_FOUND")
          PY
      - name: Exactly one new GPT-5.6 Luna recheck from archived provider evidence
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LUMI_RECHECK_GLOBAL_CLAIM_VERIFIED: "YES"
          GRANT_COPY: ${{ runner.temp }}/f2-luna-recheck/grant.json
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}" || { echo "::error::OPENROUTER_SECRET_UNAVAILABLE"; exit 1; }
          PYTHONPATH=. python -B -m experiments.v3_f2_quality_luna_recheck_probe \
            --grant "$GRANT_COPY" \
            --claim-dir "$RUNNER_WORKSPACE/../_lumi_v3_final_luna_claims" \
            --evidence-dir "$RUNNER_TEMP/f2-luna-recheck/evidence"
          echo "NO_WRITER_NO_SOL_NO_TRANSLATION_NO_WORLD_COMMIT"
      - name: Archive stage outcome whether accepted or stopped
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-final-v3-f2-final-luna-recheck-${{ github.run_id }}
          path: ${{ runner.temp }}/f2-luna-recheck/evidence/
          if-no-files-found: warn
          retention-days: 90
