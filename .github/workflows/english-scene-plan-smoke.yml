name: English Scene Plan Smoke

on:
  workflow_dispatch:
    inputs:
      planner_model:
        description: 'Exact OpenRouter planner model id'
        required: true
        default: 'qwen/qwen3.8-flash'
        type: string
      jev_model:
        description: 'Exact OpenRouter JEV Decisions model id'
        required: true
        default: 'typesafe/jev-1.13'
        type: string
      judge_model:
        description: 'Exact OpenRouter plan judge model id'
        required: true
        default: 'anthropic/claude-haiku-4.5'
        type: string
      spec:
        description: 'English benchmark spec'
        required: true
        default: 'data/specifications/benchmark_en/01_exploration_mystery.yaml'
        type: string

permissions:
  contents: read

jobs:
  plan-smoke:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify OpenRouter credential
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Repository secret OPENROUTER_API_KEY is not configured.'
            exit 1
          fi
      - name: Run English scene-plan smoke
        shell: bash
        env:
          PLANNER_MODEL: ${{ inputs.planner_model }}
          JEV_MODEL: ${{ inputs.jev_model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          SPEC_PATH: ${{ inputs.spec }}
        run: |
          python -m src.english_scene_plan_smoke \
            --planner-model "$PLANNER_MODEL" \
            --jev-model "$JEV_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --spec "$SPEC_PATH"
      - name: Upload smoke evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: english-scene-plan-smoke-${{ github.run_id }}
          path: runs/english_scene_plan_smoke/
          if-no-files-found: warn
          retention-days: 14
