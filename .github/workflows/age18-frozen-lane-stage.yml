name: Age18 Frozen Lane Stage

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/age18-frozen-lane-stage.json'

permissions:
  contents: write

jobs:
  run:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen runtime and run requested stage
        run: >-
          PYTHONPATH=. python -m src.frozen_lane_stage
          --trigger experiments/triggers/age18-frozen-lane-stage.json
          --out-dir runs/age18-frozen-lane-stage
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/evidence"
          cp experiments/triggers/age18-frozen-lane-stage.json "$TMP/evidence/trigger.json"
          if test -d runs/age18-frozen-lane-stage; then
            cp -a runs/age18-frozen-lane-stage/. "$TMP/evidence/"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/age18-frozen-lane-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/age18-frozen-lane/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -a "$TMP/evidence/." "$DEST/"
          git add "$DEST"
          git commit -m "evidence(qual): archive age18 frozen lane ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
