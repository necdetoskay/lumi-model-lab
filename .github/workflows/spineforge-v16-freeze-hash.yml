name: SpineForge v16 Evidence Logic Repair Freeze Builder

on:
  push:
    branches:
      - experiment/spineforge-v16-evidence-logic-repair
    paths:
      - experiments/freeze/spineforge-v16.request

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build v16 evidence-logic repair freeze profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          paths = [
              ".github/workflows/spineforge-v16.yml",
              "requirements.txt",
              "configs/model_runtime_profiles.yaml",
              "src/spineforge_freeze_verify.py",
              "src/spineforge_v16.py",
              "src/spineforge_v16_partial_audit.py",
              "src/spineforge_v16_case_manifest.py",
              "src/spineforge_v16_stage.py",
              "src/spineforge_v16_evidence_summary.py",
              "data/specifications/story_lab/spineforge_v16_age18_forbidden_cartographer_case_v1.json",
              "prompts/spineforge_evidence_logic_repair_v16.md",
              "prompts/spineforge_complete_reauditor_v16.md",
              "experiments/results/spineforge-v15/36757835721/result.json",
              "src/spineforge_v13_audit_normalizer.py",
              "src/spineforge_v12_normalizer.py",
              "src/spineforge_v11.py",
              "src/spineforge_v11_contract.py",
              "src/spine_context_pack_v1.py",
              "src/episode_spine_v3_contract.py",
              "src/premise_architect_v2_contract.py",
              "src/reader_profile_v2.py",
              "src/saga_blueprint_contract.py",
              "src/saga_spine_v2_contract.py",
              "src/english_story_pipeline.py",
              "src/generate.py",
              "src/schemas.py",
              "src/model_registry.py",
              "src/model_usage_rollup.py",
          ]

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          profile = {
              "schema_version": "spineforge-runtime-profile.v1",
              "runtime_id": "spineforge.contextpack.v16.repair",
              "status": "FROZEN_QUALIFICATION_CANDIDATE",
              "purpose": "Narrow Sonnet evidence-logic repair from the validated v15 Spine and partial REPAIR-only audit, followed by a mandatory complete 18-dimension re-audit.",
              "runtime": {
                  "generation_runtime": "src/spineforge_v16.py",
                  "repair_model": "anthropic/claude-sonnet-5.5",
                  "repair_prompt": "prompts/spineforge_evidence_logic_repair_v16.md",
                  "reaudit_model": "anthropic/claude-sonnet-5.5",
                  "audit_prompt": "prompts/spineforge_complete_reauditor_v16.md",
                  "source_evidence": "experiments/results/spineforge-v15/36757835721/result.json",
                  "repair_max_tokens": 10000,
                  "reaudit_max_tokens": 4500,
                  "max_calls_per_attempt": 2,
                  "architect_recall": False,
                  "automatic_repair_loop_enabled": False,
                  "writer_authorized": False
              },
              "repair_policy": {
                  "partial_source_audit_repair_only": True,
                  "partial_source_audit_accept_forbidden": True,
                  "invented_reference_bearings_forbidden": True,
                  "invented_residue_rules_forbidden": True,
                  "arbitrary_peg_order_rule_forbidden": True,
                  "simple_observation_based_replicate_rule_required": True,
                  "middle_scene_external_complication_required": True,
                  "final_reaudit_all_18_dimensions_required": True,
                  "semantic_repair_by_application_forbidden": True
              },
              "evidence_policy": {
                  "full_repo_evidence_required": True,
                  "repo_evidence_path": "experiments/results/spineforge-v16/<run_id>",
                  "artifact_upload": "best_effort_only",
                  "exact_token_cost_latency_required": True
              },
              "paid_boundary_policy": {
                  "explicit_authorization_required_for_attempt_1": True,
                  "no_automatic_paid_retry": True,
                  "no_automatic_repair_loop": True,
                  "no_writer_call_inside_spineforge": True
              },
              "runtime_freeze": {
                  "enabled": True,
                  "runtime_revision": "SPINEFORGE-EVIDENCE-LOGIC-REPAIR-FROZEN-v16",
                  "runtime_source_commit": os.environ["GITHUB_SHA"],
                  "files": [{"path": p, "sha256": sha256(p)} for p in paths]
              }
          }

          out = Path("data/specifications/story_lab/spineforge_runtime_profile_v16_evidence_logic_repair_frozen.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(profile, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "runtime_revision": profile["runtime_freeze"]["runtime_revision"],
              "runtime_source_commit": profile["runtime_freeze"]["runtime_source_commit"],
              "frozen_files": len(paths)
          }, indent=2))
          PY
      - name: Commit freeze profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/specifications/story_lab/spineforge_runtime_profile_v16_evidence_logic_repair_frozen.json
          git commit -m "canon(spineforge-v16): freeze evidence-logic repair runtime"
          git fetch origin experiment/spineforge-v16-evidence-logic-repair
          git rebase origin/experiment/spineforge-v16-evidence-logic-repair
          git push origin HEAD:experiment/spineforge-v16-evidence-logic-repair
