name: Sonnet 5.5 Cross-Age Age18 C5 Translation

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-cross-age-age18-c5.txt'

permissions:
  contents: write

jobs:
  translate:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Translate accepted English master only
        run: >-
          PYTHONPATH=. python -m src.cross_age_age18_c5_translation
          --english data/specifications/story_lab/age18_cross_age_c41_deterministic_recovered_story.txt
          --approved data/specifications/story_lab/age18_cross_age_c11_approved.json
          --c4 data/specifications/story_lab/age18_cross_age_c4_run_36618878723.json
          --c41 data/specifications/story_lab/age18_cross_age_c41_deterministic_recovery_evidence.json
          --out runs/sonnet55-cross-age-age18-c5/result.json
          --tr-out runs/sonnet55-cross-age-age18-c5/story_tr.txt
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-cross-age-age18-c5/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-cross-age-age18-c5/result.json "$TMP/result.json"
          if test -s runs/sonnet55-cross-age-age18-c5/story_tr.txt; then cp runs/sonnet55-cross-age-age18-c5/story_tr.txt "$TMP/story_tr.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-cross-age-age18-c5-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-cross-age-age18-c5/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          if test -s "$TMP/story_tr.txt"; then cp "$TMP/story_tr.txt" "$DEST/story_tr.txt"; fi
          git add "$DEST"
          git commit -m "evidence(qual): archive age18 C5 translation ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
