name: SpineForge v20 Qualification

on:
  push:
    branches:
      - experiment/spineforge-v19-narrative-spine-single-owner
    paths:
      - 'src/spineforge_v20*.py'
      - 'prompts/spineforge_v20_*.md'
      - 'data/specifications/story_lab/age12_island_not_on_any_map_spine_context_pack_v20.json'
      - 'data/specifications/story_lab/spineforge_v20_qualification_cases_v1.json'
      - 'data/specifications/story_lab/spineforge_runtime_profile_v20_story_first_frozen.json'
      - 'tests/test_spineforge_v20_*.py'
      - '.github/workflows/spineforge-v20-zero-cost.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify frozen v20 runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python src/spineforge_freeze_verify.py \
            --profile data/specifications/story_lab/spineforge_runtime_profile_v20_story_first_frozen.json
      - name: v20 story-first qualification
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_spineforge_v20_premise_candidate.py \
            tests/test_spineforge_v20_runtime.py \
            tests/test_spineforge_v20_paid_once.py \
            tests/test_spineforge_v20_local_repair.py \
            tests/test_spineforge_v20_paid_repair_once.py \
            tests/test_spineforge_v20_writer_handoff.py \
            tests/test_spineforge_v20_writer_once.py \
            tests/test_spineforge_v20_paid_writer_once.py \
            tests/test_spineforge_v20_frozen.py \
            tests/test_spineforge_v19_human_review.py

  paid-age12-island-attempt1:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[PAID-V20-AGE12-ISLAND-ATTEMPT1]')
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen v20 runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python src/spineforge_freeze_verify.py \
            --profile data/specifications/story_lab/spineforge_runtime_profile_v20_story_first_frozen.json
      - name: Run exactly one paid v20 island Spine qualification
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          PYTHONPATH=. python src/spineforge_v20_paid_once.py
      - name: Upload paid v20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spineforge-v20-age12-island-attempt1-${{ github.run_id }}
          path: evidence/spineforge-v20-paid/${{ github.run_id }}
          if-no-files-found: error


  paid-age12-island-repair1:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[PAID-V20-AGE12-ISLAND-REPAIR1]')
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen v20 repair runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python src/spineforge_freeze_verify.py \
            --profile data/specifications/story_lab/spineforge_runtime_profile_v20_story_first_frozen.json
      - name: Run exactly one paid v20 local repair and re-gate
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          PYTHONPATH=. python src/spineforge_v20_paid_repair_once.py
      - name: Upload paid v20 repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spineforge-v20-age12-island-repair1-${{ github.run_id }}
          path: evidence/spineforge-v20-paid-repair/${{ github.run_id }}
          if-no-files-found: error


  paid-age12-island-writer2:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[PAID-V20-AGE12-ISLAND-WRITER2]')
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen v20.4 writer runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python src/spineforge_freeze_verify.py \
            --profile data/specifications/story_lab/spineforge_runtime_profile_v20_story_first_frozen.json
      - name: Run exactly one paid Aion Writer call
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          PYTHONPATH=. python src/spineforge_v20_paid_writer_once.py
      - name: Upload paid v20 Writer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spineforge-v20-age12-island-writer2-${{ github.run_id }}
          path: evidence/spineforge-v20-paid-writer/${{ github.run_id }}
          if-no-files-found: error
