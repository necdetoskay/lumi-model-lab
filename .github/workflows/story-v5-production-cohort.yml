name: Story v5 Production-like Cohort

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-v5-production-cohort.txt

permissions:
  contents: write

jobs:
  cohort:
    runs-on: self-hosted
    timeout-minutes: 55
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile prototype
        run: python -m py_compile experiments/prototypes/story_v5_whole_draft_prototype.py

      - name: Fail-closed fixture and snapshot precheck
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util
          from pathlib import Path
          from src.generate import load_yaml
          from src.schemas import StorySpec

          spec = importlib.util.spec_from_file_location(
              "v5",
              Path("experiments/prototypes/story_v5_whole_draft_prototype.py"),
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          cases = [
              (
                  "experiments/specs/v5-production-cohort/age7-900-friendship-boundary.yaml",
                  "experiments/context_packs/v5-cohort/ece-chalk-arrow.json",
                  "experiments/state_authority/cohort-ece-chalk-arrow.json",
              ),
              (
                  "experiments/specs/v5-production-cohort/age13-2300-puzzle-npc-boundary.yaml",
                  "experiments/context_packs/v5-cohort/arda-clock-cards.json",
                  "experiments/state_authority/cohort-arda-clock-cards.json",
              ),
              (
                  "experiments/specs/v5-production-cohort/adult-3600-world-lore-uncertainty.yaml",
                  "experiments/context_packs/v5-cohort/ada-flood-lines.json",
                  "experiments/state_authority/cohort-ada-flood-lines.json",
              ),
          ]
          for spec_path, context_path, authority_path in cases:
              StorySpec.model_validate(load_yaml(Path(spec_path)))
              context, _ = module.load_context_pack(context_path)
              authority, _ = module.load_state_authority(authority_path)
              errors = module.validate_state_authority_context_alignment(context, authority)
              if errors:
                  raise RuntimeError(f"{spec_path}: {errors}")
              print(f"PRECHECK PASS: {spec_path}")
          PY

      - name: Provider preflight before cohort
        run: python -m src.openrouter_preflight --json

      - name: Run three production-like contexts
        shell: bash
        run: |
          set +e
          mkdir -p runs/story_v5_production_cohort

          run_case() {
            CASE="$1"
            SPEC="$2"
            CONTEXT="$3"
            AUTHORITY="$4"
            mkdir -p "runs/story_v5_production_cohort/$CASE"
            echo "===== CASE: $CASE ====="
            PYTHONPATH=. python experiments/prototypes/story_v5_whole_draft_prototype.py               --spec "$SPEC"               --context-pack "$CONTEXT"               --state-authority "$AUTHORITY"               --output "runs/story_v5_production_cohort/$CASE/result.json"
            RC=$?
            echo "$RC" > "runs/story_v5_production_cohort/$CASE/exit-code.txt"
          }

          run_case             "ece-900-friendship"             "experiments/specs/v5-production-cohort/age7-900-friendship-boundary.yaml"             "experiments/context_packs/v5-cohort/ece-chalk-arrow.json"             "experiments/state_authority/cohort-ece-chalk-arrow.json"

          run_case             "arda-2300-puzzle"             "experiments/specs/v5-production-cohort/age13-2300-puzzle-npc-boundary.yaml"             "experiments/context_packs/v5-cohort/arda-clock-cards.json"             "experiments/state_authority/cohort-arda-clock-cards.json"

          run_case             "ada-3600-world-lore"             "experiments/specs/v5-production-cohort/adult-3600-world-lore-uncertainty.yaml"             "experiments/context_packs/v5-cohort/ada-flood-lines.json"             "experiments/state_authority/cohort-ada-flood-lines.json"

      - name: Provider preflight after cohort
        if: always()
        run: python -m src.openrouter_preflight --json

      - name: Archive cohort evidence
        if: always()
        shell: bash
        run: |
          DEST="experiments/results/story-v5-production-cohort/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -R runs/story_v5_production_cohort/. "$DEST/" || true
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "english-story-production.v5-whole-draft-prototype",
            "context_protocol": "story-context-pack.v2-prototype",
            "state_authority_protocol": "state-mutation-authority.v1",
            "cases": [
              "ece-900-friendship",
              "arda-2300-puzzle",
              "ada-3600-world-lore"
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): story v5 production cohort ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-production-cohort-${GITHUB_RUN_ID}"

      - name: Assert all cohort cases passed
        if: always()
        shell: bash
        run: |
          FAIL=0
          for FILE in runs/story_v5_production_cohort/*/exit-code.txt; do
            [ -f "$FILE" ] || { echo "::error::Missing case exit code"; exit 1; }
            RC="$(cat "$FILE")"
            echo "$FILE => $RC"
            if [ "$RC" != "0" ]; then
              FAIL=1
            fi
          done
          exit "$FAIL"
