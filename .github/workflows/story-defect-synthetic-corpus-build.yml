name: Story Defect Synthetic Corpus Build

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-defect-synthetic-corpus-build.txt

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compile builder
        run: python -m py_compile experiments/prototypes/story_defect_synthetic_corpus_build_20260926.py
      - name: Build 210 controlled corrupt stories
        run: PYTHONPATH=. python experiments/prototypes/story_defect_synthetic_corpus_build_20260926.py
      - name: Verify output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("experiments/fixtures/story_defect_corpus.tr-age4.synthetic.v1.json")
          o=json.loads(p.read_text(encoding="utf-8"))
          assert o["summary"]["corrupt_case_count"] == 210
          assert o["qualification_evidence"] is False
          assert all(c["synthetic_status"] == "SYNTHETIC_PENDING_INDEPENDENT_VALIDATION" for c in o["cases"])
          print(o["summary"])
          PY
      - name: Archive synthetic corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/fixtures/story_defect_corpus.tr-age4.synthetic.v1.json
          git commit -m "data(story): build 210-case synthetic defect corpus"
          git push origin "HEAD:refs/heads/evidence/story-defect-synthetic-corpus-${GITHUB_RUN_ID}"
