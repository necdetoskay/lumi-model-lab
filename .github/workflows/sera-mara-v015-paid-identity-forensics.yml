name: SERA v0.15 Original Paid Identity Forensic Recovery
on:
  push:
    branches:
      - experiment/sera-scene-state-v0-1-20261015
    paths:
      - experiments/sera/mara_s1_paid_identity_replay_v015.py
      - .github/workflows/sera-mara-v015-paid-identity-forensics.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  no-cost-forensic-rebind:
    runs-on: [self-hosted, linux]
    timeout-minutes: 8
    defaults:
      run:
        working-directory: sera-v015-forensic-source
    steps:
      - uses: actions/checkout@v4
        with:
          path: sera-v015-forensic-source
          persist-credentials: false
          clean: false
          set-safe-directory: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source and identity forensics unit tests, no provider key
        run: |
          set -euo pipefail
          python -m experiments.sera.request_policy
          python -m unittest discover -s experiments/sera/tests -q
      - name: Download and pin the paid run's raw provider content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sera-paid-forensics"
          gh run download 38872615837 --repo "$GITHUB_REPOSITORY" \
            --name sera-mara-v015c-blind-identity-38872615837 \
            --dir "$RUNNER_TEMP/sera-paid-forensics"
          gh run download 38868633198 --repo "$GITHUB_REPOSITORY" \
            --name sera-v013-mara-all-mentions-38868633198 \
            --dir "$RUNNER_TEMP/sera-paid-forensics"
          test -s "$RUNNER_TEMP/sera-paid-forensics/identity-provider-response.json"
          test -s "$RUNNER_TEMP/sera-paid-forensics/full-mentions.json"
      - name: Recover only safe source-bound model proposals, quarantine others
        run: |
          set -euo pipefail
          python -m experiments.sera.mara_s1_paid_identity_replay_v015 \
            --paid "$RUNNER_TEMP/sera-paid-forensics/identity-provider-response.json" \
            --mentions "$RUNNER_TEMP/sera-paid-forensics/full-mentions.json" \
            --output "$RUNNER_TEMP/sera-paid-forensics/forensic-result.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"sera-paid-forensics"/"forensic-result.json").read_text(encoding="utf-8"))
          assert d["all_original_model_rows_returned"]==16
          assert d["syntax_repair_audit"]["fixed_support_quote_lines"]==3
          assert d["source_bound_count"]+d["quarantine_count"]==16
          assert d["paid_model_calls_during_recovery"]==0
          assert d["new_entity_creations"]==0
          assert d["new_relation_attachments"]==0
          assert d["world_db_writes"]==0
          assert d["human_gold_adjudicated"] is False
          assert d["canonical_commit_authorized"] is False
          print("SERA_V015_REAL_PAID_IDENTITY_FORENSICS_GREEN")
          print("SERA_V015_REAL_BOUND",d["source_bound_count"])
          print("SERA_V015_REAL_QUARANTINED",d["quarantine_count"])
          PY
      - name: Preserve complete original paid-response recovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-v015-paid-identity-forensics-${{ github.run_id }}
          path: ${{ runner.temp }}/sera-paid-forensics/forensic-result.json
          retention-days: 90
          if-no-files-found: warn
