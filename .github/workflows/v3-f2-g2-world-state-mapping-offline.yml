name: Final V3 F2 G2 World State Read-Only Mapping and Rollback Lab
on:
  push:
    branches:
      - experiment/v3-f2-world-state-g2-dry-run-20261015
    paths:
      - experiments/triggers/v3-f2-g2-world-state-offline-20261015.json

permissions:
  contents: read

concurrency:
  group: lumi-f2-g2-world-state-dry-run-20261015
  cancel-in-progress: false

jobs:
  mapping-and-synthetic-transaction:
    if: >-
      github.ref == 'refs/heads/experiment/v3-f2-world-state-g2-dry-run-20261015' &&
      contains(github.event.head_commit.message, '[V3-F2-G2-OFFLINE]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d41b5b5af8d90a583016caace9cf473dc941cc4a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-only dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check frozen runtime and 201 regression tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q \
            tests/test_v3_f2_g2_state_commit_preview.py \
            tests/test_v3_f2_world_outcome_offline_replay.py \
            tests/test_v3_f2_world_outcome_one_judge.py \
            tests/test_v3_f2_world_outcome_evidence_gate.py \
            tests/test_v3_f2_final_delivery_stage.py \
            tests/test_v3_f2_turkish_sol_adjudication_once.py \
            tests/test_v3_f2_turkish_translation_and_fidelity_once.py \
            tests/test_v3_f2_quality_luna_recheck_probe.py \
            tests/test_v3_real_model_repair_evidence.py \
            tests/test_v3_f2_autonomous_quality_probe.py \
            tests/test_v3_unattended_quality_model_adapter.py \
            tests/test_v3_unattended_story_quality.py \
            tests/test_v3_aion_f2_writer_single_attempt_probe.py \
            tests/test_v3_single_attempt_aion_writer_guard.py \
            tests/test_v3_single_attempt_guard.py \
            tests/test_age18_frozen_lane_v1.py \
            tests/test_frozen_lane_generic_spine_runtime.py \
            tests/test_age18_lane_stabilization_matrix.py \
            tests/test_sonnet55_cross_age_matrix.py \
            tests/test_story_lane_qualification_policy.py \
            tests/test_frozen_lane_authority_gate.py \
            tests/test_frozen_lane_repair_runtime.py \
            tests/test_frozen_lane_translation_runtime.py \
            tests/test_deterministic_translation_semantic_guards.py
      - name: Regenerate G2 mapping and memory-only compensation proof
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=. PYTHONDONTWRITEBYTECODE=1
          python -B -m experiments.v3_f2_g2_state_commit_preview --out-dir "$RUNNER_TEMP/f2-g2-dry-run"
          cmp "$RUNNER_TEMP/f2-g2-dry-run/g2-mapping-preview.json" evidence/v3-f2-g2-world-state-dry-run-20261015/g2-mapping-preview.json
          cmp "$RUNNER_TEMP/f2-g2-dry-run/synthetic-transaction-report.json" evidence/v3-f2-g2-world-state-dry-run-20261015/synthetic-transaction-report.json
          export OUT="$RUNNER_TEMP/f2-g2-dry-run"
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["OUT"])
          preview=json.loads((p/"g2-mapping-preview.json").read_text())
          report=json.loads((p/"synthetic-transaction-report.json").read_text())
          assert preview["g2_mapping_status"]=="BLOCKED_PENDING_AUTHORITATIVE_BINDINGS"
          assert preview["model_earned_count"]==5
          assert len(preview["missing_authoritative_bindings"])==16
          assert preview["g2_commit_request"] is None
          assert preview["proposed_executable_operations"]==[]
          assert preview["world_state_committed"] is False
          assert report["is_actual_g2_postgres_test"] is False
          assert report["status"]=="SYNTHETIC_IN_MEMORY_TEST_PASS"
          assert all(report["checks"].values())
          assert report["production_operations_applied"]==0
          print("BLOCKED_PRODUCTION_MAPPING_AND_SEVEN_IN_MEMORY_CHECKS_VERIFIED")
          PY
      - name: Preserve read-only test output
        uses: actions/upload-artifact@v4
        with:
          name: lumi-f2-g2-world-state-mapping-${{ github.run_id }}
          path: ${{ runner.temp }}/f2-g2-dry-run/
          if-no-files-found: error
          retention-days: 90
