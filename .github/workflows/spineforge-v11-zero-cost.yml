name: SpineForge v11 Single-Owner Zero-Cost Qualification

on:
  push:
    branches:
      - experiment/spineforge-v11-single-owner-sonnet
    paths:
      - 'src/spineforge_v11.py'
      - 'src/spineforge_v11_contract.py'
      - 'prompts/spineforge_single_owner_architect_v11.md'
      - 'prompts/spineforge_single_owner_auditor_v11.md'
      - 'tests/test_spineforge_v11_*.py'
      - '.github/workflows/spineforge-v11-zero-cost.yml'

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: v11 single-owner contract and architecture
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q             tests/test_spineforge_v11_contract.py             tests/test_spineforge_v11_architecture.py
      - name: Episode Spine contract regression
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q tests/test_episode_spine_v3_contract.py
