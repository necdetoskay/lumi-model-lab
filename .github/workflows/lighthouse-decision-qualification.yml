name: Lighthouse Audit Decision Qualification
on:
  push:
    branches: [experiment/spineforge-v21-bounded-scene-quality]
    paths:
      - '.github/workflows/lighthouse-decision-qualification.yml'
      - 'evidence/lighthouse-editorial/decision-qualification-authorization.json'
permissions:
  contents: read
concurrency:
  group: lighthouse-single-story-completion
  cancel-in-progress: false
jobs:
  qualify:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[LIGHTHOUSE-DECISION-02]')
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify contracts and frozen qualification inputs
        run: |
          python -m pytest -q tests/test_lighthouse_*.py tests/test_spineforge_v21_*.py
          python -m src.lighthouse_decision_qualification
          git diff --exit-code -- evidence/lighthouse-editorial/decision-qualification-prepared.json
      - name: Audit two recorded versions within the same story budget
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.lighthouse_decision_qualification --execute
      - name: Preserve decision qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-decision-${{ github.run_id }}
          path: evidence/lighthouse-decision-qualification/
          if-no-files-found: error
