name: StoryForge Age12 Probe

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/storyforge-age12-probe.txt

jobs:
  probe:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.25
      - name: Run StoryForge age12 probe
        run: PYTHONPATH=. python experiments/prototypes/storyforge_age12_probe_20260928.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/storyforge-age12-probe/result.json
          DEST="experiments/results/storyforge-age12-probe/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/storyforge-age12-probe/result.json "$DEST/result.json"
          if test -s runs/storyforge-age12-probe/english.txt; then cp runs/storyforge-age12-probe/english.txt "$DEST/english.txt"; fi
          if test -s runs/storyforge-age12-probe/turkish.txt; then cp runs/storyforge-age12-probe/turkish.txt "$DEST/turkish.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(storyforge): age12 probe ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/storyforge-age12-probe-${GITHUB_RUN_ID}"
