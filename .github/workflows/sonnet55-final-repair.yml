name: Sonnet 5.5 Final English Repair

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-final-repair.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bounded final English repair
        run: >-
          PYTHONPATH=. python -m src.sonnet55_final_repair_v1
          --source data/specifications/story_lab/age12_episode1_sonnet55_postprocess_source_36552606045.json
          --approved data/specifications/story_lab/age12_episode1_sonnet55_p27_approved.json
          --p3d1 data/specifications/story_lab/sonnet55_p3d1_compact_authority_result.json
          --out runs/sonnet55-final-repair-v1/result.json
          --story-out runs/sonnet55-final-repair-v1/repaired_story.txt
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-final-repair-v1/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-final-repair-v1/result.json "$TMP/result.json"
          if test -s runs/sonnet55-final-repair-v1/repaired_story.txt; then cp runs/sonnet55-final-repair-v1/repaired_story.txt "$TMP/repaired_story.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-final-repair-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-final-repair/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          if test -s "$TMP/repaired_story.txt"; then cp "$TMP/repaired_story.txt" "$DEST/repaired_story.txt"; fi
          git add "$DEST"
          git commit -m "evidence(qual): archive final English repair ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
