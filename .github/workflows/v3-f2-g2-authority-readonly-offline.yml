name: Final V3 F2 Production G2 Read-Only Authority Gate
on:
  push:
    branches:
      - experiment/v3-f2-g2-authority-readonly-20261015
    paths:
      - experiments/triggers/v3-f2-g2-authority-readonly-offline-20261015.json

permissions:
  contents: read

concurrency:
  group: lumi-v3-f2-g2-authority-readonly-20261015
  cancel-in-progress: false

jobs:
  authority-evidence-without-production-db:
    if: >-
      github.ref == 'refs/heads/experiment/v3-f2-g2-authority-readonly-20261015' &&
      contains(github.event.head_commit.message, '[V3-F2-G2-AUTHORITY-OFFLINE]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4c818da582eab0e6ad01a95bd66a1a353568b05
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify 221 tests and frozen Final V3 files
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q \
            tests/test_v3_f2_g2_readonly_authority_probe.py \
            tests/test_v3_f2_g2_state_commit_preview.py \
            tests/test_v3_f2_world_outcome_offline_replay.py \
            tests/test_v3_f2_world_outcome_one_judge.py \
            tests/test_v3_f2_world_outcome_evidence_gate.py \
            tests/test_v3_f2_final_delivery_stage.py \
            tests/test_v3_f2_turkish_sol_adjudication_once.py \
            tests/test_v3_f2_turkish_translation_and_fidelity_once.py \
            tests/test_v3_f2_quality_luna_recheck_probe.py \
            tests/test_v3_real_model_repair_evidence.py \
            tests/test_v3_f2_autonomous_quality_probe.py \
            tests/test_v3_unattended_quality_model_adapter.py \
            tests/test_v3_unattended_story_quality.py \
            tests/test_v3_aion_f2_writer_single_attempt_probe.py \
            tests/test_v3_single_attempt_aion_writer_guard.py \
            tests/test_v3_single_attempt_guard.py \
            tests/test_age18_frozen_lane_v1.py \
            tests/test_frozen_lane_generic_spine_runtime.py \
            tests/test_age18_lane_stabilization_matrix.py \
            tests/test_sonnet55_cross_age_matrix.py \
            tests/test_story_lane_qualification_policy.py \
            tests/test_frozen_lane_authority_gate.py \
            tests/test_frozen_lane_repair_runtime.py \
            tests/test_frozen_lane_translation_runtime.py \
            tests/test_deterministic_translation_semantic_guards.py
      - name: Recompute missing authoritative bindings and source hashes offline
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=. PYTHONDONTWRITEBYTECODE=1
          python -B -m experiments.v3_f2_g2_readonly_authority_probe --out-dir "$RUNNER_TEMP/f2-authority-proof"
          cmp "$RUNNER_TEMP/f2-authority-proof/authority-resolution.json" evidence/v3-f2-g2-authority-readonly-20261015/authority-resolution.json
          export PROOF="$RUNNER_TEMP/f2-authority-proof/authority-resolution.json"
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ["PROOF"]).read_text())
          assert p["status"]=="AUTHENTICATED_G2_BINDING_NOT_AVAILABLE"
          assert not p["verified_prod_story_contract"]
          assert not p["verified_prod_accepted_artifact"]
          assert len(p["missing_authoritative_bindings"])==16
          assert p["g2_commit_request"] is None
          assert p["operations_applied"]==[]
          assert p["new_paid_model_posts"]==0
          assert not p["world_state_committed"]
          print("G2_SOURCE_AUTHORITY_UNRESOLVED_AND_COMMIT_FORBIDDEN_PASS")
          PY
      - name: Preserve read-only G2 authority proof
        uses: actions/upload-artifact@v4
        with:
          name: lumi-f2-g2-authority-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/f2-authority-proof/
          if-no-files-found: error
          retention-days: 90
