name: Story Harness V1 Offline

on:
  pull_request:
    paths:
      - src/story_harness_v1.py
      - src/story_harness_p1.py
      - src/story_harness_p2.py
      - src/story_harness_p21.py
      - tests/test_story_harness_v1.py
      - tests/test_story_harness_p1.py
      - tests/test_story_harness_p2.py
      - tests/test_story_harness_p21.py
      - tests/fixtures/story_harness_v1/**
      - configs/story_harness_v1_fixture.json
      - configs/story_harness_p1_frozen_import.json
      - evidence/story_harness_p1/**
      - evidence/story_harness_p2/**
      - docs/canonical/STORY_HARNESS_V1.md
      - docs/canonical/STORY_HARNESS_P1_REAL_EVIDENCE.md
      - docs/canonical/STORY_HARNESS_P2_GATE_RECEIPTS.md
      - docs/canonical/STORY_HARNESS_P21_REAL_Q25_GATE.md
      - README.md
      - .github/workflows/story-harness-v1-offline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-harness-v1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline:
    # Reuse dedicated offline-only LUMI runner. No provider secrets or model calls.
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed harness tests (stdlib, no pip install)
        run: python -m unittest discover -s tests -p 'test_story_harness*.py' -q
      - name: Deterministic zero-cost four-stage replay
        run: |
          python -m src.story_harness_v1 \
            --plan configs/story_harness_v1_fixture.json \
            --repo-root . > /tmp/story-harness-fixture-first.json
          python -m src.story_harness_v1 \
            --plan configs/story_harness_v1_fixture.json \
            --repo-root . > /tmp/story-harness-fixture-second.json
          cmp /tmp/story-harness-fixture-first.json /tmp/story-harness-fixture-second.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/story-harness-fixture-first.json'))
          assert result['stage_count_inspected'] == 4
          assert result['status'] == 'REPLAYED_REPORTED_CHAIN_ONLY'
          for name in ('state_commit_authorized', 'semantic_support_certified',
                       'production_write_performed', 'model_execution_performed'):
              assert result[name] is False
          assert result['provider_calls'] == 0
          assert result['provider_cost_usd'] == '0'
          print('STORY_HARNESS_V1_OFFLINE_GREEN')
          PY

      - name: Re-evaluate frozen real SpineForge and Q25 historical evidence (no providers)
        run: |
          python -m src.story_harness_p1 \
            --manifest configs/story_harness_p1_frozen_import.json \
            --repo-root . > /tmp/story-harness-p1-a.json
          python -m src.story_harness_p1 \
            --manifest configs/story_harness_p1_frozen_import.json \
            --repo-root . > /tmp/story-harness-p1-b.json
          cmp /tmp/story-harness-p1-a.json /tmp/story-harness-p1-b.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/story-harness-p1-a.json'))
          assert x['case_count'] == 4
          assert x['sum_historical_provider_reported_cost_usd_for_q25_subset'] == '0.085152'
          assert x['new_provider_calls'] == 0
          assert x['state_commit_authorized'] is False
          assert x['historical_verdicts_rewritten'] is False
          assert x['spine_and_q25_story_chain_claimed'] is False
          assert [c['inspection']['historical_original_outcome'] for c in x['historical_cases']] == [
            'ACCEPT', 'FAIL_KNOWN_DEFECT_MISSED',
            'SOURCE_BOUND_CANDIDATES_ONLY', 'REJECTED_BY_OFFLINE_GATE']
          print('STORY_HARNESS_P1_HISTORICAL_GREEN')
          PY

      - name: Verify typed StageResults and actual local integrity-gate receipts
        run: |
          python -m src.story_harness_p2 \
            --manifest configs/story_harness_p1_frozen_import.json \
            --repo-root . > /tmp/story-harness-p2-first.json
          python -m src.story_harness_p2 \
            --manifest configs/story_harness_p1_frozen_import.json \
            --repo-root . > /tmp/story-harness-p2-second.json
          cmp /tmp/story-harness-p2-first.json /tmp/story-harness-p2-second.json
          python -m src.story_harness_p2 --repo-root . --verify-report evidence/story_harness_p2/pinned-local-integrity-receipts.json > /tmp/story-harness-p2-verified.json
          cmp /tmp/story-harness-p2-first.json /tmp/story-harness-p2-verified.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/story-harness-p2-first.json'))
          assert x['case_count'] == 4
          assert x['actual_local_integrity_checks_executed'] == 4
          assert all(r['local_integrity_result'] == 'PASS' for r in x['gate_receipts'])
          assert x['original_spine_or_q25_gates_reexecuted'] is False
          assert x['original_human_review_authenticated'] is False
          assert x['semantic_support_certified'] is False
          assert x['state_commit_authorized'] is False
          assert x['downstream_stage_executions_authorized'] == 0
          assert x['model_execution_performed'] is False
          assert x['provider_calls'] == 0
          assert x['provider_cost_usd'] == '0'
          assert [r['original_historical_outcome'] for r in x['stage_results']] == [
             'ACCEPT','FAIL_KNOWN_DEFECT_MISSED',
             'SOURCE_BOUND_CANDIDATES_ONLY','REJECTED_BY_OFFLINE_GATE']
          print('STORY_HARNESS_P2_LOCAL_GATE_GREEN')
          PY

      - name: Checkout exact frozen Q25 validator code (no historical edits)
        uses: actions/checkout@v4
        with:
          ref: 2eb3d825b5baf8f0f16ccb23805f619d433c7236
          path: _pinned_q25_source
          persist-credentials: false
      - name: Install pinned Q25 offline validator dependency
        run: python -m pip install "pydantic>=2.8,<3"
      - name: Execute real frozen Q25 source-bound validators and negative tests
        env:
          STORY_HARNESS_PINNED_Q25_ROOT: ${{ github.workspace }}/_pinned_q25_source
        run: |
          test -d "$STORY_HARNESS_PINNED_Q25_ROOT/.git"
          python -m unittest discover -s tests -p 'test_story_harness_p21.py' -v
          python -m src.story_harness_p21 \
            --repo-root . --pinned-q25-root "$STORY_HARNESS_PINNED_Q25_ROOT" > /tmp/story-harness-p21-gates.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/story-harness-p21-gates.json'))
          assert x['actual_q25_offline_gate_invocations'] == 2
          assert x['cases'][0]['replay_status'] == 'SOURCE_BOUND_CANDIDATES_ONLY'
          assert x['cases'][1]['original_paid_outcome_immutable'] == 'REJECTED_BY_OFFLINE_GATE'
          assert x['cases'][1]['replay_status'] == 'SOURCE_BOUND_CANDIDATES_ONLY'
          assert x['spineforge_gate_invocations'] == 0
          assert x['state_commit_authorized'] is False
          assert x['provider_calls'] == 0
          print('STORY_HARNESS_P21_ACTUAL_Q25_OFFLINE_GATE_GREEN')
          PY
