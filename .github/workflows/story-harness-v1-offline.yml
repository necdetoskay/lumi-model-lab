      - docs/canonical/STORY_HARNESS_P42_REDACTED_FINAL_AUDIT_DIAGNOSTICS.md
      - docs/canonical/STORY_HARNESS_P43_OFFLINE_V21_5_RUNNER.md
      - docs/canonical/STORY_HARNESS_P44_STORY_FORENSIC_AND_BUDGET.md
      - docs/canonical/STORY_HARNESS_P45_ACTUAL_SCENE_EDITORIAL_REWRITE.md
      - docs/canonical/STORY_HARNESS_P46_FULL_STORY_EDITORIAL.md
      - docs/canonical/STORY_HARNESS_P47_ROUTE_TRUTH_AND_QUALITY_HANDOFF.md
      - docs/canonical/STORY_HARNESS_P48_NEW_STORY_OFFLINE_ADAPTER.md
      - docs/canonical/STORY_HARNESS_P49_PAID_READINESS_PACKET.md
      - docs/canonical/STORY_HARNESS_P410_PROVIDER_ROUTING_OFFLINE.md
      - docs/canonical/STORY_HARNESS_P411_SIGNED_GRANT_TRANSPORT.md
      - README.md
      - .github/workflows/story-harness-v1-offline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-harness-v1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline:
    # Reuse dedicated offline-only LUMI runner. No provider secrets or model calls.
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline signature-verification dependency
        run: python -m pip install "cryptography>=44,<48"
      - name: Verify pre-existing GitHub OpenRouter secret presence without revealing it
        env:
          EXISTING_OPENROUTER_SECRET: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$EXISTING_OPENROUTER_SECRET" ]; then
            echo 'REPO_OPENROUTER_SECRET_AVAILABLE=YES'
          else
            echo 'REPO_OPENROUTER_SECRET_AVAILABLE=NO'
          fi
          echo 'NO_PROVIDER_REQUESTS_IN_THIS_STEP'
      - name: Run fail-closed harness tests (stdlib, no pip install)
        run: python -m unittest discover -s tests -p 'test_story_harness*.py' -q
      - name: Deterministic zero-cost four-stage replay
        run: |
          python -m src.story_harness_v1 \
            --plan configs/story_harness_v1_fixture.json \
            --repo-root . > /tmp/story-harness-fixture-first.json
          python -m src.story_harness_v1 \
            --plan configs/story_harness_v1_fixture.json \
            --repo-root . > /tmp/story-harness-fixture-second.json
          cmp /tmp/story-harness-fixture-first.json /tmp/story-harness-fixture-second.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/story-harness-fixture-first.json'))
          assert result['stage_count_inspected'] == 4
          assert result['status'] == 'REPLAYED_REPORTED_CHAIN_ONLY'
          for name in ('state_commit_authorized', 'semantic_support_certified',
                       'production_write_performed', 'model_execution_performed'):
              assert result[name] is False
          assert result['provider_calls'] == 0
          assert result['provider_cost_usd'] == '0'
          print('STORY_HARNESS_V1_OFFLINE_GREEN')
          PY

      - name: Re-evaluate frozen real SpineForge and Q25 historical evidence (no providers)
        run: |
          python -m src.story_harness_p1 \
            --manifest configs/story_harness_p1_frozen_import.json \
            --repo-root . > /tmp/story-harness-p1-a.json
          python -m src.story_harness_p1 \
            --manifest configs/story_harness_p1_frozen_import.json \
            --repo-root . > /tmp/story-harness-p1-b.json
          cmp /tmp/story-harness-p1-a.json /tmp/story-harness-p1-b.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/story-harness-p1-a.json'))
          assert x['case_count'] == 4
          assert x['sum_historical_provider_reported_cost_usd_for_q25_subset'] == '0.085152'
          assert x['new_provider_calls'] == 0
          assert x['state_commit_authorized'] is False
          assert x['historical_verdicts_rewritten'] is False
          assert x['spine_and_q25_story_chain_claimed'] is False
          assert [c['inspection']['historical_original_outcome'] for c in x['historical_cases']] == [
            'ACCEPT', 'FAIL_KNOWN_DEFECT_MISSED',
            'SOURCE_BOUND_CANDIDATES_ONLY', 'REJECTED_BY_OFFLINE_GATE']
          print('STORY_HARNESS_P1_HISTORICAL_GREEN')
          PY

      - name: Verify typed StageResults and actual local integrity-gate receipts
        run: |
          python -m src.story_harness_p2 \
            --manifest configs/story_harness_p1_frozen_import.json \
            --repo-root . > /tmp/story-harness-p2-first.json
          python -m src.story_harness_p2 \
            --manifest configs/story_harness_p1_frozen_import.json \
            --repo-root . > /tmp/story-harness-p2-second.json
          cmp /tmp/story-harness-p2-first.json /tmp/story-harness-p2-second.json
          python -m src.story_harness_p2 --repo-root . --verify-report evidence/story_harness_p2/pinned-local-integrity-receipts.json > /tmp/story-harness-p2-verified.json
          cmp /tmp/story-harness-p2-first.json /tmp/story-harness-p2-verified.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/story-harness-p2-first.json'))
          assert x['case_count'] == 4
          assert x['actual_local_integrity_checks_executed'] == 4
          assert all(r['local_integrity_result'] == 'PASS' for r in x['gate_receipts'])
          assert x['original_spine_or_q25_gates_reexecuted'] is False
          assert x['original_human_review_authenticated'] is False
          assert x['semantic_support_certified'] is False
          assert x['state_commit_authorized'] is False
          assert x['downstream_stage_executions_authorized'] == 0
          assert x['model_execution_performed'] is False
          assert x['provider_calls'] == 0
          assert x['provider_cost_usd'] == '0'
          assert [r['original_historical_outcome'] for r in x['stage_results']] == [
             'ACCEPT','FAIL_KNOWN_DEFECT_MISSED',
             'SOURCE_BOUND_CANDIDATES_ONLY','REJECTED_BY_OFFLINE_GATE']
          print('STORY_HARNESS_P2_LOCAL_GATE_GREEN')
          PY

      - name: Checkout exact frozen Q25 validator code (no historical edits)
        uses: actions/checkout@v4
        with:
          ref: 2eb3d825b5baf8f0f16ccb23805f619d433c7236
          path: _pinned_q25_source
          persist-credentials: false
      - name: Install pinned offline validator dependencies
        run: python -m pip install "pydantic>=2.8,<3" "PyYAML>=6,<7" "requests>=2.31,<3" "python-dotenv>=1.0,<2" "rich>=13,<15" "httpx>=0.27,<1" "cryptography>=44,<48"
      - name: Execute real frozen Q25 source-bound validators and negative tests
        env:
          STORY_HARNESS_PINNED_Q25_ROOT: ${{ github.workspace }}/_pinned_q25_source
        run: |
          test -d "$STORY_HARNESS_PINNED_Q25_ROOT/.git"
          python -m unittest discover -s tests -p 'test_story_harness_p21.py' -v
          python -m src.story_harness_p21 \
            --repo-root . --pinned-q25-root "$STORY_HARNESS_PINNED_Q25_ROOT" > /tmp/story-harness-p21-gates.json
          python -m src.story_harness_p21 \
            --repo-root . --pinned-q25-root "$STORY_HARNESS_PINNED_Q25_ROOT" \
            --verify-report evidence/story_harness_p21/pinned-real-q25-offline-replay.json > /tmp/story-harness-p21-verified.json
          cmp /tmp/story-harness-p21-gates.json /tmp/story-harness-p21-verified.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/story-harness-p21-gates.json'))
          assert x['actual_q25_offline_gate_invocations'] == 2
          assert x['cases'][0]['replay_status'] == 'SOURCE_BOUND_CANDIDATES_ONLY'
          assert x['cases'][1]['original_paid_outcome_immutable'] == 'REJECTED_BY_OFFLINE_GATE'
          assert x['cases'][1]['replay_status'] == 'SOURCE_BOUND_CANDIDATES_ONLY'
          assert x['spineforge_gate_invocations'] == 0
          assert x['state_commit_authorized'] is False
          assert x['provider_calls'] == 0
          print('STORY_HARNESS_P21_ACTUAL_Q25_OFFLINE_GATE_GREEN')
          PY

      - name: Execute genuine pinned SpineForge deterministic validator and negative tests
        env:
          STORY_HARNESS_PINNED_SPINE_ROOT: ${{ github.workspace }}/_pinned_q25_source
        run: |
          python -m unittest discover -s tests -p 'test_story_harness_p22.py' -v
          python -m src.story_harness_p22 \
            --repo-root . --pinned-spine-root "$STORY_HARNESS_PINNED_SPINE_ROOT" > /tmp/story-harness-p22-replay.json
          python -m src.story_harness_p22 \
            --repo-root . --pinned-spine-root "$STORY_HARNESS_PINNED_SPINE_ROOT" \
            --verify-report evidence/story_harness_p22/pinned-real-spine-offline-replay.json > /tmp/story-harness-p22-verified.json
          cmp /tmp/story-harness-p22-replay.json /tmp/story-harness-p22-verified.json
          python - <<'PY2'
          import json
          x = json.load(open('/tmp/story-harness-p22-replay.json'))
          assert x['actual_spine_deterministic_validator_invocations'] == 1
          assert x['original_historical_gate_claim_immutable'] == 'ACCEPT'
          assert x['real_validator_report']['discovery_turns'] == 8
          assert x['real_validator_report']['real_choice_count'] == 2
          assert x['original_human_review_authenticated'] is False
          assert x['original_model_product_gate_reexecuted'] is False
          assert x['spine_writer_q25_same_story_handoff_verified'] is False
          assert x['downstream_execution_authorized'] is False
          assert x['state_commit_authorized'] is False
          assert x['provider_calls'] == 0 and x['provider_cost_usd'] == '0'
          print('STORY_HARNESS_P22_ACTUAL_SPINEFORGE_OFFLINE_GATE_GREEN')
          PY2

      - name: Verify frozen same-story SpineForge to Writer lineage and missing-Q25 STOP
        env:
          STORY_HARNESS_PINNED_P3_ROOT: ${{ github.workspace }}/_pinned_q25_source
        run: |
          python -m unittest discover -s tests -p 'test_story_harness_p30.py' -v
          python -m src.story_harness_p30 \
            --repo-root . --pinned-source-root "$STORY_HARNESS_PINNED_P3_ROOT" > /tmp/story-harness-p30-lineage.json
          python -m src.story_harness_p30 \
            --repo-root . --pinned-source-root "$STORY_HARNESS_PINNED_P3_ROOT" \
            --verify-report evidence/story_harness_p30/pinned-same-story-lineage-receipt.json > /tmp/story-harness-p30-verified.json
          cmp /tmp/story-harness-p30-lineage.json /tmp/story-harness-p30-verified.json
          python - <<'PY3'
          import json
          x = json.load(open('/tmp/story-harness-p30-lineage.json'))
          assert x['same_story_spine_to_writer_confirmed'] is True
          assert x['writer_original_validator_executed'] is True
          assert x['writer_word_count'] == 2324
          assert x['original_story_audit_qualification'] == 'FAIL_KNOWN_DEFECT_MISSED'
          assert x['original_story_audit_qualification_pass'] is False
          assert x['stop_reason'] == 'MISSING_SAME_STORY_Q25_ARTIFACT'
          assert x['same_story_q25_handoff_verified'] is False
          assert x['q25_execution_authorized'] is False
          assert x['state_commit_authorized'] is False
          assert x['provider_calls'] == 0 and x['provider_cost_usd'] == '0'
          print('STORY_HARNESS_P30_SAME_STORY_GREEN')
          PY3

      - name: Verify immutable same-story quality lineage and fail-closed quality STOP
        env:
          STORY_HARNESS_PINNED_P31_ROOT: ${{ github.workspace }}/_pinned_q25_source
        run: |
          python -m unittest discover -s tests -p 'test_story_harness_p31.py' -v
          python -m src.story_harness_p31 \
            --repo-root . --pinned-source-root "$STORY_HARNESS_PINNED_P31_ROOT" > /tmp/story-harness-p31-quality.json
          python -m src.story_harness_p31 \
            --repo-root . --pinned-source-root "$STORY_HARNESS_PINNED_P31_ROOT" \
            --verify-report evidence/story_harness_p31/pinned-quality-chain-receipt.json > /tmp/story-harness-p31-verified.json
          cmp /tmp/story-harness-p31-quality.json /tmp/story-harness-p31-verified.json
          python - <<'PY4'
          import json
          x = json.load(open('/tmp/story-harness-p31-quality.json'))
          assert x['original_audit_records'][0]['qualification'] == 'FAIL_KNOWN_DEFECT_MISSED'
          assert x['original_audit_records'][1]['qualification'] == 'PASS'
          assert x['original_audit_records'][1]['story_audit_decision'] == 'LOCAL_REPAIR_REQUIRED'
          assert x['full_cycle3_to_cycle10_lineage_ids_and_hashes_verified'] is True
          assert x['last_completed_reaudit_cycle'] == 9
          assert x['unreviewed_cycle10_story_pending_reaudit'] is True
          assert x['stop_reason'] == 'STORY_QUALITY_NOT_ACCEPTED'
          assert x['q25_execution_authorized'] is False
          assert x['state_commit_authorized'] is False
          assert x['provider_calls'] == 0 and x['provider_cost_usd'] == '0'
          print('STORY_HARNESS_P31_HISTORICAL_QUALITY_GREEN')
          PY4

      - name: Verify frozen English Master admission denial and cross-story isolation
        env:
          STORY_HARNESS_PINNED_P32_ROOT: ${{ github.workspace }}/_pinned_q25_source
        run: |
          python -m unittest discover -s tests -p 'test_story_harness_p32.py' -v
          python -m src.story_harness_p32 \
            --repo-root . --pinned-source-root "$STORY_HARNESS_PINNED_P32_ROOT" > /tmp/story-harness-p32-denied.json
          python -m src.story_harness_p32 \
            --repo-root . --pinned-source-root "$STORY_HARNESS_PINNED_P32_ROOT" \
            --verify-report evidence/story_harness_p32/pinned-english-master-denial-receipt.json > /tmp/story-harness-p32-verified.json
          cmp /tmp/story-harness-p32-denied.json /tmp/story-harness-p32-verified.json
          python - <<'PY5'
          import json
          x = json.load(open('/tmp/story-harness-p32-denied.json'))
          assert x['stop_reason'] == 'ENGLISH_MASTER_NOT_ADMISSIBLE'
          assert x['state'] == 'STOPPED_UNSEALED_UNACCEPTED_STORY'
          assert x['historical_island_tracked_source_file_count'] == 152
          assert x['historical_english_master_artifact_found'] is False
          assert x['historical_policy']['accept_branch_is_actual_history'] is False
          assert x['terminal_candidate']['next_state_action'] == 'REAUDIT'
          assert x['terminal_candidate']['last_qualified_cycle'] == 9
          assert x['unrelated_accepted_story_reference']['accepted_as_island_english_master'] is False
          assert x['english_master_story_accepted'] is False
          assert x['english_master_seal_execution_authorized'] is False
          assert x['q25_extraction_authorized'] is False
          assert x['state_commit_authorized'] is False
          assert x['provider_calls'] == 0 and x['provider_cost_usd'] == '0'
          print('STORY_HARNESS_P32_ENGLISH_MASTER_FAIL_CLOSED_GREEN')
          PY5

      - name: Run authentic frozen v21 quality producer simulations, seal stays denied
        env:
          STORY_HARNESS_PINNED_P40_ROOT: ${{ github.workspace }}/_pinned_q25_source
        run: |
          python -m unittest discover -s tests -p 'test_story_harness_p40.py' -v
          python -m src.story_harness_p40 \
            --repo-root . --pinned-source-root "$STORY_HARNESS_PINNED_P40_ROOT" > /tmp/story-harness-p40.json
          python -m src.story_harness_p40 \
            --repo-root . --pinned-source-root "$STORY_HARNESS_PINNED_P40_ROOT" \
            --verify-report evidence/story_harness_p40/pinned-v21-producer-preflight.json > /tmp/story-harness-p40-verified.json
          cmp /tmp/story-harness-p40.json /tmp/story-harness-p40-verified.json
          python - <<'PY6'
          import json
          x = json.load(open('/tmp/story-harness-p40.json'))
          assert x['real_frozen_v21_engine_executed_with_mock_transport'] is True
          assert x['real_frozen_v21_profile_verified'] is True
          assert x['simulated_case_count'] == 6
          assert x['historical_paid_quality_failure']['historical_quality_status'] == 'REJECT_PROVIDER_FAILURE'
          assert x['historical_paid_quality_failure']['historical_calls'] == 3
          assert x['stop_reason'] == 'REAL_BOUNDED_QUALITY_ACCEPT_MISSING'
          assert x['synthetic_ACCEPT_is_genuine_story_quality'] is False
          assert x['english_master_seal_emitted'] is False
          assert x['q25_handoff_emitted'] is False
          assert x['bounded_paid_attempt_authorized'] is False
          assert x['state_commit_authorized'] is False
          assert x['provider_calls'] == 0 and x['provider_cost_usd'] == '0'
          print('STORY_HARNESS_P40_BOUNDED_PRODUCER_PRECHECK_GREEN')
          PY6

      - name: Verify English Master positive mechanics and deny untrusted Q25 admission
        env:
          STORY_HARNESS_PINNED_P41_ROOT: ${{ github.workspace }}/_pinned_q25_source
        run: |
          python -m unittest discover -s tests -p 'test_story_harness_p41.py' -v
          python -m src.story_harness_p41 \
            --repo-root . --pinned-source-root "$STORY_HARNESS_PINNED_P41_ROOT" > /tmp/story-harness-p41-proof.json
