name: SpineForge v8 Durable Evidence Zero-Cost

on:
  push:
    branches:
      - experiment/spineforge-v8-durable-evidence

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: v8 evidence hardening proof
        run: PYTHONPATH=. python -m pytest -q tests/test_spineforge_v8_evidence.py tests/test_spineforge_v8_frozen.py
      - name: v7 generation topology regression
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spineforge_v7_contract.py
          tests/test_spineforge_v7_strict_transport.py
          tests/test_spineforge_v7_runtime.py
          tests/test_spineforge_v7_stage.py
          -k "not case_ready_zero_spend_and_no_paid_trigger"
      - name: v1-v7 historical freeze regression
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_spineforge_contract.py
          tests/test_spineforge_freeze_runtime.py
          tests/test_spineforge_frozen_v1.py
          tests/test_spineforge_revision.py
          tests/test_spineforge_runtime.py
          tests/test_spine_context_pack_v1.py
          tests/test_spineforge_v2_context_runtime.py
          tests/test_spineforge_v2_stage.py
          tests/test_spineforge_v2_frozen.py
          tests/test_spineforge_v3_context_runtime.py
          tests/test_spineforge_v3_stage.py
          tests/test_spineforge_v3_frozen.py
          tests/test_spineforge_v4_context_runtime.py
          tests/test_spineforge_v4_stage.py
          tests/test_spineforge_v4_frozen.py
          tests/test_spineforge_v5_frozen.py
          tests/test_spineforge_v6_frozen.py
          tests/test_spineforge_v7_frozen.py
          -k "not starts_zero_spend_and_without_paid_trigger and not case_ready_zero_spend_and_no_paid_trigger"
