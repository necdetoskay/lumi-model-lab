name: Sonnet 5.5 Final Turkish Delivery

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-final-delivery.txt'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Translate and fidelity-check final delivery
        run: >-
          PYTHONPATH=. python -m src.sonnet55_final_delivery_v1
          --source data/specifications/story_lab/age12_episode1_sonnet55_final_english_source_v4.json
          --approved data/specifications/story_lab/age12_episode1_sonnet55_p27_approved.json
          --clean-gate data/specifications/story_lab/sonnet55_final_compact_authority_gate_run_36566995937.json
          --out runs/sonnet55-final-delivery-v1/result.json
          --en-out runs/sonnet55-final-delivery-v1/final_en.txt
          --tr-out runs/sonnet55-final-delivery-v1/final_tr.txt
      - name: Archive delivery evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-final-delivery-v1/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-final-delivery-v1/result.json "$TMP/result.json"
          test -s runs/sonnet55-final-delivery-v1/final_en.txt && cp runs/sonnet55-final-delivery-v1/final_en.txt "$TMP/final_en.txt" || true
          test -s runs/sonnet55-final-delivery-v1/final_tr.txt && cp runs/sonnet55-final-delivery-v1/final_tr.txt "$TMP/final_tr.txt" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-final-delivery-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-final-delivery/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          test -s "$TMP/final_en.txt" && cp "$TMP/final_en.txt" "$DEST/final_en.txt" || true
          test -s "$TMP/final_tr.txt" && cp "$TMP/final_tr.txt" "$DEST/final_tr.txt" || true
          git add "$DEST"
          git commit -m "evidence(qual): archive final Turkish delivery ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
