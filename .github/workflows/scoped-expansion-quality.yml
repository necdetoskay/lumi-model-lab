name: Scoped Expansion Quality
permissions:
  contents: write
on:
  push:
    paths:
      - experiments/triggers/scoped-expansion-quality.txt
      - experiments/prototypes/scoped_expansion_quality_20260926.py
      - experiments/fixtures/story_spine_expansion_source_36219332570.json
  workflow_dispatch:
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python experiments/prototypes/scoped_expansion_quality_20260926.py
      - name: Archive evidence
        run: |
          test -s runs/scoped-expansion-quality/result.json
          test -s runs/scoped-expansion-quality/final.txt
          DEST="experiments/results/scoped-expansion-quality/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/scoped-expansion-quality/result.json "$DEST/result.json"
          cp runs/scoped-expansion-quality/expanded.txt "$DEST/expanded.txt"
          cp runs/scoped-expansion-quality/final.txt "$DEST/final.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): scoped expansion quality ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/scoped-expansion-quality-${GITHUB_RUN_ID}"
