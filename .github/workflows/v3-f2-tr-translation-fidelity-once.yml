name: Final V3 F2 Turkish Translation and Fidelity One Attempt
on:
  push:
    branches:
      - experiment/v3-f2-tr-translation-20261015
    paths:
      - experiments/triggers/v3-f2-turkish-offline-20261015.json
      - experiments/triggers/v3-f2-turkish-once-20261015.json

permissions:
  contents: read

concurrency:
  group: lumi-v3-f2-tr-translation-one-20261015
  cancel-in-progress: false

jobs:
  offline-qualification:
    if: >-
      github.ref == 'refs/heads/experiment/v3-f2-tr-translation-20261015' &&
      contains(github.event.head_commit.message, '[V3-F2-TR-OFFLINE]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb4e46d7b8efd002bf2a5485cc49d511092eca3b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify translation guard tests and 43 frozen V3 files
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q \
            tests/test_v3_f2_turkish_translation_and_fidelity_once.py \
            tests/test_v3_f2_quality_luna_recheck_probe.py \
            tests/test_v3_real_model_repair_evidence.py \
            tests/test_v3_f2_autonomous_quality_probe.py \
            tests/test_v3_unattended_quality_model_adapter.py \
            tests/test_v3_unattended_story_quality.py \
            tests/test_v3_aion_f2_writer_single_attempt_probe.py \
            tests/test_v3_single_attempt_aion_writer_guard.py \
            tests/test_v3_single_attempt_guard.py \
            tests/test_age18_frozen_lane_v1.py \
            tests/test_frozen_lane_generic_spine_runtime.py \
            tests/test_age18_lane_stabilization_matrix.py \
            tests/test_sonnet55_cross_age_matrix.py \
            tests/test_story_lane_qualification_policy.py \
            tests/test_frozen_lane_authority_gate.py \
            tests/test_frozen_lane_repair_runtime.py \
            tests/test_frozen_lane_translation_runtime.py \
            tests/test_deterministic_translation_semantic_guards.py
      - name: Verify GitHub read-only claim API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/experiments/v3_f2_turkish_translation_and_fidelity_once.py?ref=experiment/v3-f2-tr-translation-20261015" --jq .sha >/dev/null
          echo "TR_GLOBAL_CLAIM_READ_ONLY_PASS"

  one-tr-and-fidelity:
    if: >-
      github.ref == 'refs/heads/experiment/v3-f2-tr-translation-20261015' &&
      contains(github.event.head_commit.message, '[V3-F2-TR-PAID-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact translation and fidelity grant before accessing secrets
        shell: bash
        env:
          GUARD_SHA: bb4e46d7b8efd002bf2a5485cc49d511092eca3b
          GRANT_PATH: experiments/triggers/v3-f2-turkish-once-20261015.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f2-tr-once"
          export GRANT_COPY="$RUNNER_TEMP/f2-tr-once/grant.json"
          python3 - <<'PY'
          import json,os,pathlib,re,shutil
          from decimal import Decimal
          grant=json.loads(pathlib.Path(os.environ["GRANT_PATH"]).read_text(encoding="utf-8"))
          expected={
              "schema":"lumi.v3-f2-english-to-turkish-grant.v1",
              "authorized":True,
              "stage":"TURKISH_TRANSLATION_FIDELITY",
              "case_id":"age18.forbidden-cartographer.fantasy.frozen-01",
              "source_quality_run_id":38712035968,
              "source_english_sha256":"990e6a009aea84aeadd74f9734ae8663ae495bf8d9800d20e4281f248064c5a8",
              "approved_spine_sha256":"21f1e4e0c9f25cd1c970cccc2df8d09a0f236c9102321df7da086f85a3dac1a0",
              "frozen_runtime_sha":"63e1e3ce82c244bc5bb02b0463a9a1a6715c941b",
              "models":["google/gemini-3.8-flash","openai/gpt-5.6-luna"],
              "guard_commit_sha":os.environ["GUARD_SHA"],
          }
          if any(grant.get(k)!=v for k,v in expected.items()):
              raise SystemExit("TRANSLATION_GRANT_SCOPE_MISMATCH_NO_PROVIDER_CALL")
          gid=grant.get("grant_id")
          if not isinstance(gid,str) or re.fullmatch("[A-Za-z0-9][A-Za-z0-9_-]{7,79}",gid) is None:
              raise SystemExit("TRANSLATION_GRANT_ID_INVALID")
          if not isinstance(grant.get("human_paid_authorization_reference"),str) or not grant["human_paid_authorization_reference"].strip():
              raise SystemExit("TRANSLATION_HUMAN_AUTHORIZATION_MISSING")
          try: cap=Decimal(str(grant["max_total_usd"]))
          except Exception as exc: raise SystemExit("TRANSLATION_COST_CEILING_INVALID") from exc
          if not cap.is_finite() or not Decimal("0") < cap <= Decimal("0.15"):
              raise SystemExit("TRANSLATION_COST_CEILING_INVALID")
          shutil.copyfile(os.environ["GRANT_PATH"],os.environ["GRANT_COPY"])
          os.chmod(os.environ["GRANT_COPY"],0o600)
          print("TRANSLATION_GRANT_PREFLIGHT_PASS")
          PY
          git cat-file -e "${GUARD_SHA}^{commit}"
          git checkout --detach "$GUARD_SHA"
          test "$(git rev-parse HEAD)" = "$GUARD_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Offline frozen runtime and translation guard before spending
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q tests/test_v3_f2_turkish_translation_and_fidelity_once.py
      - name: Verify globally unique run-bound single-use claim
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GRANT_COPY: ${{ runner.temp }}/f2-tr-once/grant.json
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1" || { echo "::error::TR_RUN_REPLAY_FORBIDDEN"; exit 1; }
          python3 - <<'PY'
          import base64,json,os,subprocess,time
          grant=json.load(open(os.environ["GRANT_COPY"],encoding="utf-8"))
          gid=grant["grant_id"]
          branch="evidence/v3-f2-translation-claim-"+gid
          url="repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/claims/"+gid+".json?ref="+branch
          expected={
              "schema":"lumi.v3-translation-global-claim.v1",
              "authorized":True,
              "stage":"TURKISH_TRANSLATION_FIDELITY",
              "grant_id":gid,
              "case_id":"age18.forbidden-cartographer.fantasy.frozen-01",
              "models":["google/gemini-3.8-flash","openai/gpt-5.6-luna"],
              "source_english_sha256":"990e6a009aea84aeadd74f9734ae8663ae495bf8d9800d20e4281f248064c5a8",
              "source_commit":os.environ["GITHUB_SHA"],
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "guard_commit_sha":"bb4e46d7b8efd002bf2a5485cc49d511092eca3b",
              "max_total_usd":grant["max_total_usd"],
          }
          for _ in range(30):
              response=subprocess.run(["gh","api",url],capture_output=True,text=True)
              if response.returncode:
                  if "HTTP 404" in response.stderr:
                      time.sleep(2)
                      continue
                  raise SystemExit("TR_GLOBAL_CLAIM_READ_DENIED_NO_PROVIDER")
              try:
                  claim=json.loads(base64.b64decode(json.loads(response.stdout)["content"]))
              except (ValueError,KeyError,TypeError) as exc:
                  raise SystemExit("TR_GLOBAL_CLAIM_FORMAT_INVALID") from exc
              if any(claim.get(k)!=v for k,v in expected.items()):
                  raise SystemExit("TR_GLOBAL_CLAIM_RUN_BINDING_MISMATCH")
              print("TR_GLOBAL_CLAIM_VERIFIED")
              break
          else:
              raise SystemExit("TR_GLOBAL_CLAIM_NOT_AUTHORIZED")
          PY
      - name: Translate with Gemini and verify meaning with Luna
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LUMI_F2_TR_GLOBAL_CLAIM_VERIFIED: "YES"
          GRANT_COPY: ${{ runner.temp }}/f2-tr-once/grant.json
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}" || { echo "::error::EXISTING_OPENROUTER_SECRET_NOT_INJECTED"; exit 1; }
          PYTHONPATH=. python -B -m experiments.v3_f2_turkish_translation_and_fidelity_once \
            --grant "$GRANT_COPY" \
            --claim-dir "$RUNNER_WORKSPACE/../_lumi_v3_f2_tr_claims" \
            --evidence-dir "$RUNNER_TEMP/f2-tr-once/evidence"
          echo "TRANSLATION_ONLY_NO_PUBLICATION_NO_STATE_COMMIT"
      - name: Preserve translation and STOP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-v3-f2-turkish-translation-fidelity-${{ github.run_id }}
          path: ${{ runner.temp }}/f2-tr-once/evidence/
          if-no-files-found: warn
          retention-days: 90
