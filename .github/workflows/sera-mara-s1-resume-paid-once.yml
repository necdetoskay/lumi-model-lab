name: SERA Mara S1 Extractor Resume Paid One-Shot
on:
  push:
    branches:
      - experiment/sera-scene-state-v0-1-20261015
    paths:
      - experiments/sera/launch/resume-first-scene-20261016.json
permissions:
  contents: read
  actions: read
concurrency:
  group: sera-mara-s1-resume-once-20261016
  cancel-in-progress: false
jobs:
  resume:
    if: >-
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[SERA-MARA-S1-RESUME-ONCE]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact one-use trigger and pinned code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          p=pathlib.Path("experiments/sera/launch/resume-first-scene-20261016.json")
          d=json.loads(p.read_text())
          expected={
              "schema":"sera.mara-s1-resume-once.v0.1",
              "authorized":True,
              "scope":"RESUME_MARA_S1_EXTRACTOR_AND_JEV_ONLY",
              "prior_run_id":38808450095,
              "source_result_sha256":"4e287eac417836f15c63c38a4247a56c04eecb1fed8aa0c43f034722d40e456f",
              "independent_model":"google/gemini-3.7-flash",
              "jev_model":"typesafe/jev-1.13",
              "max_logical_model_operations":2,
              "observed_spend_stop_usd":"0.20",
              "no_canonical_commit":True,
              "no_project_lumi_db_write":True,
              "no_reruns":True,
              "launch_id":"sera-mara-s1-resume-20261016-oneuse",
          }
          if set(d)!=set(expected)|{"approved_code_sha"}:
              raise SystemExit("SERA_RESUME_GRANT_SCHEMA_INVALID")
          if any(d.get(k)!=v for k,v in expected.items()):
              raise SystemExit("SERA_RESUME_GRANT_VALUES_INVALID")
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],
                                         text=True).strip()
          if d["approved_code_sha"]!=parent:
              raise SystemExit("SERA_RESUME_CODE_PIN_INVALID")
          changed=subprocess.check_output(
              ["git","diff-tree","--no-commit-id","--name-only","-r","HEAD"],
              text=True).splitlines()
          if changed!=[str(p)]:
              raise SystemExit("SERA_RESUME_TRIGGER_NOT_ISOLATED")
          print("SERA_RESUME_GRANT_VERIFIED")
          PY
          python3 -m compileall -q experiments/sera
          python3 -m unittest discover -s experiments/sera/tests -q
      - name: Install minimal provider dependencies
        run: python -m pip install requests pyyaml
      - name: Fetch and validate immutable prior evidence without regenerating scene
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sera-resume"
          python3 - <<'PY'
          import io,os,pathlib,requests,zipfile
          url=("https://api.github.com/repos/"
               +os.environ["GITHUB_REPOSITORY"]
               +"/actions/artifacts/12007457147/zip")
          resp=requests.get(
              url,
              headers={"Authorization": "Bearer "+os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"},
              timeout=45,
          )
          resp.raise_for_status()
          with zipfile.ZipFile(io.BytesIO(resp.content)) as archive:
              raw=archive.read("result.json")
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"sera-resume"/"source-result.json"
          target.write_bytes(raw)
          print("ORIGINAL_ARTIFACT_OBTAINED",len(raw))
          PY
          python3 -m experiments.sera.mara_s1_resume \
            --source-result "$RUNNER_TEMP/sera-resume/source-result.json" \
            --launch-id source-preflight \
            --output "$RUNNER_TEMP/sera-resume/unused.json"
      - name: Run only independent extraction and JEV with capped spend
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "SERA_RESUME_PROVIDER_KEY_MISSING_NO_PAID_CALL"
            exit 1
          fi
          python3 -m experiments.sera.mara_s1_resume \
            --live \
            --source-result "$RUNNER_TEMP/sera-resume/source-result.json" \
            --launch-id "sera-mara-s1-resume-20261016-oneuse-${GITHUB_RUN_ID}" \
            --output "$RUNNER_TEMP/sera-resume/result.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ["RUNNER_TEMP"]+"/sera-resume/result.json"))
          assert d["canonical_commit"] is False
          assert d["production_db_writes"]==0
          assert d["provider_calls_attempted"]<=2
          print("SERA_RESUME_RESULT",d["status"])
          print("SERA_RESUME_COVERAGE",(d.get("coverage") or {}).get("status"))
          print("SERA_RESUME_JEV",(d.get("jev") or {}).get("next_action"))
          print("SERA_RESUME_SHADOW",(d.get("shadow") or {}).get("status"))
          print("SERA_RESUME_OPERATIONS_ATTEMPTED",d["provider_calls_attempted"])
          PY
      - name: Archive immutable run-scoped diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-mara-s1-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/sera-resume/
          retention-days: 90
          if-no-files-found: warn
