name: Story v5 Production-like Cohort

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-v5-production-like-cohort.txt

permissions:
  contents: write

jobs:
  cohort:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile prototype
        run: python -m py_compile experiments/prototypes/story_v5_whole_draft_prototype.py

      - name: Validate ContextPack and StateAuthority snapshot alignment
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          from experiments.prototypes.story_v5_whole_draft_prototype import (
              load_context_pack,
              load_state_authority,
              validate_state_authority_context_alignment,
          )

          pairs = [
              (
                  "ela",
                  "experiments/context_packs/v5/ela-riverside-sprinkler.json",
                  "experiments/state_authority/age7-700-production-context.json",
              ),
              (
                  "arda",
                  "experiments/context_packs/v5/arda-orbital-sensor.json",
                  "experiments/state_authority/age15-2200-production-context.json",
              ),
              (
                  "ada",
                  "experiments/context_packs/v5/ada-coastal-quay.json",
                  "experiments/state_authority/adult-3000-production-context.json",
              ),
          ]
          for name, context_path, authority_path in pairs:
              context, _ = load_context_pack(context_path)
              authority, _ = load_state_authority(authority_path)
              errors = validate_state_authority_context_alignment(context, authority)
              assert errors == [], (name, errors)
              print(f"{name}: SNAPSHOT_ALIGNMENT_PASS")
          PY

      - name: Provider preflight before cohort
        run: python -m src.openrouter_preflight --json

      - name: Run three production-like cases
        shell: bash
        run: |
          set +e
          ROOT="runs/story_v5_production_like_cohort"
          mkdir -p "$ROOT"

          run_case() {
            CASE="$1"
            SPEC="$2"
            CONTEXT="$3"
            AUTHORITY="$4"
            mkdir -p "$ROOT/$CASE"
            echo "===== CASE: $CASE ====="
            PYTHONPATH=. python experiments/prototypes/story_v5_whole_draft_prototype.py               --spec "$SPEC"               --context-pack "$CONTEXT"               --state-authority "$AUTHORITY"               --output "$ROOT/$CASE/result.json"
            RC=$?
            echo "$RC" > "$ROOT/$CASE/exit-code.txt"
            echo "case=$CASE exit=$RC"
          }

          run_case             "age7-700-fact"             "experiments/specs/v5-whole-draft/age7-700-production-context.yaml"             "experiments/context_packs/v5/ela-riverside-sprinkler.json"             "experiments/state_authority/age7-700-production-context.json"

          run_case             "age15-2200-hypothesis"             "experiments/specs/v5-whole-draft/age15-2200-production-context.yaml"             "experiments/context_packs/v5/arda-orbital-sensor.json"             "experiments/state_authority/age15-2200-production-context.json"

          run_case             "adult-3000-world-lore"             "experiments/specs/v5-whole-draft/adult-3000-production-context.yaml"             "experiments/context_packs/v5/ada-coastal-quay.json"             "experiments/state_authority/adult-3000-production-context.json"

          exit 0

      - name: Provider preflight after cohort
        if: always()
        run: python -m src.openrouter_preflight --json

      - name: Archive cohort evidence
        if: always()
        shell: bash
        run: |
          DEST="experiments/results/story-v5-production-like-cohort/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -R runs/story_v5_production_like_cohort/. "$DEST/" || true
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "english-story-production.v5-whole-draft-prototype",
            "context_protocol": "story-context-pack.v2-prototype",
            "state_authority_protocol": "state-mutation-authority.v1",
            "cases": [
              "age7-700-fact",
              "age15-2200-hypothesis",
              "adult-3000-world-lore"
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): v5 production-like cohort ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-production-like-cohort-${GITHUB_RUN_ID}"
