name: Dynamic Scene Sonnet v4 One Story

on:
  push:
    branches:
      - experiment/dynamic-scene-sonnet-v4-one-story-20260924
    paths:
      - experiments/triggers/dynamic-scene-sonnet-v4-one-story.txt

permissions:
  contents: write

jobs:
  one_story:
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Static import and compile gate
        shell: bash
        run: |
          python -m py_compile src/dynamic_scene_sonnet_experiment.py
          python - <<'PY'
          from src.dynamic_scene_sonnet_experiment import validate_dynamic_plan
          print("dynamic v4 import: PASS")
          PY

      - name: Provider preflight
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Repository secret OPENROUTER_API_KEY is not configured.'
            exit 1
          fi
          python -m src.openrouter_preflight --json

      - name: Run one governed v4 story
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          python -m src.dynamic_scene_sonnet_experiment \
            --spec experiments/specs/dynamic-v4/middle-child--puzzle-problem-solving.yaml \
            --output runs/dynamic_scene_sonnet_v4/result.json

      - name: Archive experiment evidence branch
        if: always()
        shell: bash
        run: |
          DEST="experiments/results/dynamic-scene-sonnet-v4/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          if [ -f runs/dynamic_scene_sonnet_v4/result.json ]; then
            cp runs/dynamic_scene_sonnet_v4/result.json "$DEST/result.json"
          fi
          if [ -f runs/dynamic_scene_sonnet_v4/result.story.txt ]; then
            cp runs/dynamic_scene_sonnet_v4/result.story.txt "$DEST/story.txt"
          fi
          if [ -f runs/dynamic_scene_sonnet_v4/failure.json ]; then
            cp runs/dynamic_scene_sonnet_v4/failure.json "$DEST/failure.json"
          fi
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "planner": "anthropic/claude-sonnet-5",
            "writer": "openai/gpt-5.6-luna",
            "continuity_evaluator": "typesafe/jev-1.13",
            "semantic_judge": "anthropic/claude-haiku-4.5",
            "spec": "middle-child--puzzle-problem-solving",
            "target_words": 2800
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): dynamic Sonnet v4 one-story run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/dynamic-sonnet-v4-${GITHUB_RUN_ID}"
          printf '%s\n' "### Dynamic Sonnet v4 evidence" \
            "- evidence branch: evidence/dynamic-sonnet-v4-${GITHUB_RUN_ID}" \
            "- source SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve experiment outcome
        if: always()
        shell: bash
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          echo "experiment step outcome: $EXPERIMENT_OUTCOME"
