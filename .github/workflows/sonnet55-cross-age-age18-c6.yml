name: Sonnet 5.5 Cross-Age Age18 C6 Luna Fidelity

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-cross-age-age18-c6.txt'

permissions:
  contents: write

jobs:
  fidelity:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run age18 Luna fidelity only
        run: >-
          PYTHONPATH=. python -m src.cross_age_age18_c6_fidelity
          --c5 data/specifications/story_lab/age18_cross_age_c5_run_36620129124.json
          --out runs/sonnet55-cross-age-age18-c6/result.json
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-cross-age-age18-c6/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-cross-age-age18-c6/result.json "$TMP/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-cross-age-age18-c6-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-cross-age-age18-c6/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          git add "$DEST/result.json"
          git commit -m "evidence(qual): archive age18 C6 fidelity ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
