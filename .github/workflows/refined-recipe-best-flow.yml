name: Refined Recipe Best Flow
permissions:
  contents: write
on:
  push:
    paths:
      - experiments/triggers/refined-recipe-best-flow.txt
      - experiments/prototypes/refined_recipe_best_flow_20260926.py
  workflow_dispatch:
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python experiments/prototypes/refined_recipe_best_flow_20260926.py
      - name: Archive evidence
        run: |
          test -s runs/refined-recipe-best-flow/result.json
          test -s runs/refined-recipe-best-flow/final.txt
          DEST="experiments/results/refined-recipe-best-flow/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/refined-recipe-best-flow/result.json "$DEST/result.json"
          cp runs/refined-recipe-best-flow/draft.txt "$DEST/draft.txt"
          cp runs/refined-recipe-best-flow/final.txt "$DEST/final.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): refined recipe best flow ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/refined-recipe-best-flow-${GITHUB_RUN_ID}"
