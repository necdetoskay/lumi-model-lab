name: SpineForge Relay v1 Qualification

on:
  push:
    branches: [experiment/spineforge-relay-v1]
    paths:
      - 'docs/canonical/SPINEFORGE_RELAY_V1.md'
      - 'src/spineforge_relay_v1_*.py'
      - 'tests/test_spineforge_relay_v1_*.py'
      - 'tests/fixtures/spineforge_relay_v1/**'
      - 'evidence/spineforge-relay/SFR-V1-Q5S-PREFLIGHT-20261007/authorization-template.json'
      - '.github/workflows/spineforge-relay-v1-zero-cost.yml'
  pull_request:
    paths:
      - 'docs/canonical/SPINEFORGE_RELAY_V1.md'
      - 'src/spineforge_relay_v1_*.py'
      - 'tests/test_spineforge_relay_v1_*.py'
      - 'tests/fixtures/spineforge_relay_v1/**'
      - 'evidence/spineforge-relay/SFR-V1-Q5S-PREFLIGHT-20261007/**'
      - '.github/workflows/spineforge-relay-v1-zero-cost.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q0-q5s-zero-cost:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: SFR-v1 zero-cost qualification
        run: python -m pytest -q tests/test_spineforge_relay_v1_*.py

  q5s-paid-sol-writer:
    needs: q0-q5s-zero-cost
    if: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && needs.q0-q5s-zero-cost.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check exact Q5S authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from src.spineforge_relay_v1_q5_sol import AUTH_SCOPE, MAX_COST_USD, verify

          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5S-PREFLIGHT-20261007/authorization-template.json"
          ).read_text())
          report = verify()
          approved = (
              auth.get("status") == "AUTHORIZED"
              and auth.get("paid_execution_authorized") is True
              and auth.get("scope") == AUTH_SCOPE
              and auth.get("preflight_sha256") == report["artifact_sha256"]
              and auth.get("max_cost_usd") == MAX_COST_USD
              and auth.get("max_writer_calls") == 1
              and auth.get("automatic_retry") is False
              and auth.get("production_write") is False
              and auth.get("state_application_authorized") is False
              and bool(auth.get("explicit_user_message"))
          )
          print("approved=" + ("true" if approved else "false"))
          if approved:
              print("preflight_sha=" + report["artifact_sha256"])
          PY

      - name: Verify paid credential
        if: ${{ steps.auth.outputs.approved == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo '::error::OPENROUTER_API_KEY missing'; exit 1; }

      - name: Claim frozen Q5S authorization before inference
        if: ${{ steps.auth.outputs.approved == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, requests
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          preflight = "${{ steps.auth.outputs.preflight_sha }}"
          short_sha = preflight[:16]
          claim_path = f"evidence/spineforge-relay/claims/q5s-{short_sha}.json"
          url = f"https://api.github.com/repos/{repo}/contents/{claim_path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          existing = requests.get(url, headers=headers, params={"ref": "experiment/spineforge-relay-v1"}, timeout=30)
          if existing.status_code == 200:
              raise SystemExit(f"Q5S authorization already claimed at {claim_path}")
          if existing.status_code != 404:
              raise SystemExit(f"Cannot verify Q5S claim state: HTTP {existing.status_code}")
          claim = {
              "preflight_sha256": preflight,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "job": os.environ["GITHUB_JOB"],
              "status": "CLAIMED_BEFORE_INFERENCE",
          }
          payload = {
              "message": "claim(sfr-v1): reserve Q5S Sol writer authorization",
              "content": base64.b64encode(json.dumps(claim, separators=(",", ":")).encode()).decode(),
              "branch": "experiment/spineforge-relay-v1",
          }
          created = requests.put(url, headers=headers, json=payload, timeout=30)
          if created.status_code not in (200, 201):
              raise SystemExit(f"Failed to create Q5S claim: HTTP {created.status_code} " + created.text[:500])
          print(claim_path)
          PY

      - name: Execute exactly one paid Q5S Sol writer call
        if: ${{ steps.auth.outputs.approved == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.spineforge_relay_v1_q5_sol import execute_once

          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5S-PREFLIGHT-20261007/authorization-template.json"
          ).read_text())
          out = execute_once(
              api_key=os.environ["OPENROUTER_API_KEY"],
              run_id="github-" + os.environ["GITHUB_RUN_ID"],
              authorization=auth,
          )
          summary = {
              "status": out.get("status"),
              "api_calls": out.get("api_calls"),
              "usage": out.get("usage"),
              "automatic_retry_executed": out.get("automatic_retry_executed"),
              "state_application_authorized": out.get("state_application_authorized"),
              "failure_type": out.get("failure_type"),
              "failure_message": out.get("failure_message"),
          }
          Path("q5s-summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          if out.get("status") != "WRITER_GENERATED_PENDING_SCENE_GUARD":
              raise SystemExit(2)
          PY

      - name: Upload Q5S evidence
        if: ${{ always() && steps.auth.outputs.approved == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sfr-v1-q5s-${{ github.run_id }}
          path: |
            q5s-summary.json
            evidence/spineforge-relay/q5s-runs/github-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
