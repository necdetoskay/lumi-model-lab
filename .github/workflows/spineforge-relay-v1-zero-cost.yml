name: SpineForge Relay v1 Qualification

on:
  push:
    branches: [experiment/spineforge-relay-v1]
    paths:
      - 'docs/canonical/SPINEFORGE_RELAY_V1.md'
      - 'src/spineforge_relay_v1_*.py'
      - 'tests/test_spineforge_relay_v1_*.py'
      - 'tests/fixtures/spineforge_relay_v1/**'
      - 'evidence/spineforge-relay/SFR-V1-Q5SR-PREFLIGHT-20261007/**'
      - '.github/workflows/spineforge-relay-v1-zero-cost.yml'
  pull_request:
    paths:
      - 'docs/canonical/SPINEFORGE_RELAY_V1.md'
      - 'src/spineforge_relay_v1_*.py'
      - 'tests/test_spineforge_relay_v1_*.py'
      - 'tests/fixtures/spineforge_relay_v1/**'
      - 'evidence/spineforge-relay/SFR-V1-Q5SR-PREFLIGHT-20261007/**'
      - '.github/workflows/spineforge-relay-v1-zero-cost.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q0-q5sr-zero-cost:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head without external action
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Bootstrap Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip --version >/dev/null 2>&1 || {
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
            python3 /tmp/get-pip.py --user --break-system-packages
          }
          python3 -m pip install --user --break-system-packages -r requirements.txt pytest

      - name: SFR-v1 zero-cost qualification
        run: python3 -m pytest -q tests/test_spineforge_relay_v1_*.py

  q5sr-paid-sol-rewrite:
    needs: q0-q5sr-zero-cost
    if: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && needs.q0-q5sr-zero-cost.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head without external action
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Bootstrap Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip --version >/dev/null 2>&1 || {
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
            python3 /tmp/get-pip.py --user --break-system-packages
          }
          python3 -m pip install --user --break-system-packages -r requirements.txt

      - name: Check exact Q5SR authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from src.spineforge_relay_v1_q5sr import AUTH_SCOPE, MAX_COST_USD, verify

          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5SR-PREFLIGHT-20261007/authorization-template.json"
          ).read_text())
          report = verify()
          approved = (
              auth.get("status") == "AUTHORIZED"
              and auth.get("paid_execution_authorized") is True
              and auth.get("scope") == AUTH_SCOPE
              and auth.get("preflight_sha256") == report["artifact_sha256"]
              and auth.get("max_cost_usd") == MAX_COST_USD
              and auth.get("max_rewrite_calls") == 1
              and auth.get("automatic_retry") is False
              and auth.get("state_application_authorized") is False
              and bool(auth.get("explicit_user_message"))
          )
          print("approved=" + ("true" if approved else "false"))
          if approved:
              print("preflight_sha=" + report["artifact_sha256"])
          PY

      - name: Verify paid credential
        if: ${{ steps.auth.outputs.approved == 'true' }}
        run: test -n "$OPENROUTER_API_KEY"

      - name: Claim frozen Q5SR authorization before inference
        if: ${{ steps.auth.outputs.approved == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, requests
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          preflight = "${{ steps.auth.outputs.preflight_sha }}"
          claim_path = f"evidence/spineforge-relay/claims/q5sr-{preflight[:16]}.json"
          url = f"https://api.github.com/repos/{repo}/contents/{claim_path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          existing = requests.get(url, headers=headers, params={"ref":"experiment/spineforge-relay-v1"}, timeout=30)
          if existing.status_code == 200:
              raise SystemExit(f"Q5SR authorization already claimed: {claim_path}")
          if existing.status_code != 404:
              raise SystemExit(f"Cannot verify Q5SR claim state: HTTP {existing.status_code}")
          claim = {
              "preflight_sha256": preflight,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "job": os.environ["GITHUB_JOB"],
              "status": "CLAIMED_BEFORE_INFERENCE",
          }
          payload = {
              "message": "claim(sfr-v1): reserve Q5SR Sol rewrite authorization",
              "content": base64.b64encode(json.dumps(claim,separators=(",",":")).encode()).decode(),
              "branch": "experiment/spineforge-relay-v1",
          }
          created = requests.put(url,headers=headers,json=payload,timeout=30)
          if created.status_code not in (200,201):
              raise SystemExit(f"Failed to create Q5SR claim: HTTP {created.status_code} " + created.text[:500])
          PY

      - name: Execute exactly one paid Q5SR rewrite
        if: ${{ steps.auth.outputs.approved == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from src.spineforge_relay_v1_q5sr import execute_once

          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5SR-PREFLIGHT-20261007/authorization-template.json"
          ).read_text())
          out = execute_once(
              api_key=os.environ["OPENROUTER_API_KEY"],
              run_id="github-" + os.environ["GITHUB_RUN_ID"],
              authorization=auth,
          )
          summary = {
              "status": out.get("status"),
              "api_calls": out.get("api_calls"),
              "usage": out.get("usage"),
              "automatic_retry_executed": out.get("automatic_retry_executed"),
              "state_application_authorized": out.get("state_application_authorized"),
              "failure_type": out.get("failure_type"),
              "failure_message": out.get("failure_message"),
          }
          Path("q5sr-summary.json").write_text(json.dumps(summary,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(summary,indent=2))
          if out.get("status") != "REWRITE_GENERATED_PENDING_FINAL_GUARD":
              raise SystemExit(2)
          PY

      - name: Persist Q5SR result to branch
        if: ${{ steps.auth.outputs.approved == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, requests
          from pathlib import Path

          run_id = os.environ["GITHUB_RUN_ID"]
          root = Path("evidence/spineforge-relay/q5sr-runs") / ("github-" + run_id)
          call = json.loads((root / "rewrite-call.json").read_text())
          artifact = json.loads((root / "rewrite-artifact.json").read_text())
          result = {
              "schema": "spineforge-relay.q5sr-paid-result.v1",
              "qualification_id": "SFR-V1-Q5SR-SOL-SC01-TARGETED-REWRITE-20261007",
              "run_id": int(run_id),
              "job": os.environ["GITHUB_JOB"],
              "status": call["status"],
              "preflight_sha256": call["preflight_sha256"],
              "api_calls": call.get("api_calls"),
              "automatic_retry_executed": call.get("automatic_retry_executed"),
              "state_application_authorized": call.get("state_application_authorized"),
              "usage": call.get("usage"),
              "candidate": artifact,
          }
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          path = "evidence/spineforge-relay/SFR-V1-Q5SR-PAID-20261007/result.json"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          payload = {
              "message": "evidence(sfr-v1): freeze Q5SR Sol rewrite result",
              "content": base64.b64encode((json.dumps(result,ensure_ascii=False,indent=2)+"\n").encode()).decode(),
              "branch": "experiment/spineforge-relay-v1",
          }
          existing = requests.get(url,headers=headers,params={"ref":"experiment/spineforge-relay-v1"},timeout=30)
          if existing.status_code == 200:
              payload["sha"] = existing.json()["sha"]
          elif existing.status_code != 404:
              raise SystemExit(f"Cannot inspect Q5SR result path: HTTP {existing.status_code}")
          saved = requests.put(url,headers=headers,json=payload,timeout=30)
          if saved.status_code not in (200,201):
              raise SystemExit(f"Failed to persist Q5SR result: HTTP {saved.status_code} " + saved.text[:500])
          PY
