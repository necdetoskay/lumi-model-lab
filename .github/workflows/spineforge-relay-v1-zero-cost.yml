name: SpineForge Relay v1 Qualification

on:
  push:
    branches: [experiment/spineforge-relay-v1]
    paths:
      - 'docs/canonical/SPINEFORGE_RELAY_V1.md'
      - 'src/spineforge_relay_v1_*.py'
      - 'tests/test_spineforge_relay_v1_*.py'
      - 'tests/fixtures/spineforge_relay_v1/**'
      - 'evidence/spineforge-relay/SFR-V1-Q5-PREFLIGHT-20261006/authorization-template.json'
      - '.github/workflows/spineforge-relay-v1-zero-cost.yml'
  pull_request:
    paths:
      - 'docs/canonical/SPINEFORGE_RELAY_V1.md'
      - 'src/spineforge_relay_v1_*.py'
      - 'tests/test_spineforge_relay_v1_*.py'
      - 'tests/fixtures/spineforge_relay_v1/**'
      - 'evidence/spineforge-relay/SFR-V1-Q5-PREFLIGHT-20261006/authorization-template.json'
      - '.github/workflows/spineforge-relay-v1-zero-cost.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  q0-q4-zero-cost:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: SFR-v1 zero-cost qualification
        run: python -m pytest -q tests/test_spineforge_relay_v1_*.py

  q5-paid-single-scene:
    if: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, sfr-q5-temp]
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check exact Q5 authorization
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from src.spineforge_relay_v1_q5 import MAX_COST_USD, verify

          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5-PREFLIGHT-20261006/authorization-template.json"
          ).read_text())
          report = verify()
          approved = (
              auth.get("status") == "AUTHORIZED"
              and auth.get("paid_execution_authorized") is True
              and auth.get("scope") == "SFR_V1_Q5_SINGLE_SCENE_ONE_CALL"
              and auth.get("preflight_sha256") == report["artifact_sha256"]
              and auth.get("max_cost_usd") == MAX_COST_USD
              and auth.get("max_writer_calls") == 1
              and auth.get("automatic_retry") is False
              and auth.get("production_write") is False
              and auth.get("state_application_authorized") is False
              and bool(auth.get("explicit_user_message"))
          )
          print("approved=" + ("true" if approved else "false"))
          if approved:
              print("preflight_sha=" + report["artifact_sha256"])
          PY

      - name: Verify paid credential
        if: ${{ steps.auth.outputs.approved == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Repository secret OPENROUTER_API_KEY is not configured.'
            exit 1
          fi

      - name: Execute exactly one paid Q5 writer call
        if: ${{ steps.auth.outputs.approved == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.spineforge_relay_v1_q5 import execute_once

          auth = json.loads(Path(
              "evidence/spineforge-relay/SFR-V1-Q5-PREFLIGHT-20261006/authorization-template.json"
          ).read_text())
          out = execute_once(
              api_key=os.environ["OPENROUTER_API_KEY"],
              run_id="github-" + os.environ["GITHUB_RUN_ID"],
              authorization=auth,
          )
          summary = {
              "status": out.get("status"),
              "api_calls": out.get("api_calls"),
              "usage": out.get("usage"),
              "automatic_retry_executed": out.get("automatic_retry_executed"),
              "state_application_authorized": out.get("state_application_authorized"),
              "failure_type": out.get("failure_type"),
              "failure_message": out.get("failure_message"),
          }
          Path("q5-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2))
          if out.get("status") != "WRITER_GENERATED_PENDING_SCENE_REVIEW":
              raise SystemExit(2)
          PY

      - name: Upload Q5 evidence
        if: ${{ always() && steps.auth.outputs.approved == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sfr-v1-q5-${{ github.run_id }}
          path: |
            q5-summary.json
            evidence/spineforge-relay/q5-runs/github-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
