name: Sonnet 5.5 Audit A-B Qualification

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/sonnet55-audit-ab.txt'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Sonnet 5.5 frozen-story audit A-B candidate
        run: >-
          PYTHONPATH=. python -m src.sonnet55_audit_ab
          --source data/specifications/story_lab/age12_episode1_writer_run_36526379349.json
          --approved-spine data/specifications/story_lab/age12_episode1_spine_revision_05_approved.json
          --gold data/specifications/story_lab/sonnet55_audit_gold_age12.json
          --out runs/sonnet55-audit-ab/result.json
      - name: Archive evidence branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s runs/sonnet55-audit-ab/result.json
          TMP="$(mktemp -d)"
          cp runs/sonnet55-audit-ab/result.json "$TMP/result.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVIDENCE_BRANCH="evidence/sonnet55-audit-ab-${GITHUB_RUN_ID}"
          git checkout --orphan "$EVIDENCE_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          DEST="experiments/results/sonnet55-audit-ab/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp "$TMP/result.json" "$DEST/result.json"
          git add "$DEST/result.json"
          git commit -m "evidence(qual): archive Sonnet 5.5 audit A-B ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
