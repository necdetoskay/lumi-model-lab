name: Story v5 Emotional Absolute Tie-Break

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - .github/workflows/story-v5-emotional-absolute-tiebreak.yml
      - experiments/prototypes/story_v5_emotional_absolute_tiebreak_20260926.py
      - experiments/fixtures/story_v5_emotional_absolute_tiebreak_v1.json
      - experiments/triggers/story-v5-emotional-absolute-tiebreak.txt
  workflow_dispatch:

jobs:
  judge:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile tie-break
        run: python -m py_compile experiments/prototypes/story_v5_emotional_absolute_tiebreak_20260926.py
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json
      - name: Run position-independent absolute judging
        run: PYTHONPATH=. python experiments/prototypes/story_v5_emotional_absolute_tiebreak_20260926.py
      - name: Archive evidence
        if: always()
        shell: bash
        run: |
          test -s runs/story-v5-emotional-absolute-tiebreak/result.json
          DEST="experiments/results/story-v5-emotional-absolute-tiebreak/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-v5-emotional-absolute-tiebreak/* "$DEST/"
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "story-v5-emotional-absolute-tiebreak-v1",
            "family": "emotional_development",
            "generation_calls": 0,
            "position_independent": true,
            "judges": ["openai/gpt-5.6-sol", "anthropic/claude-haiku-4.5"],
            "source_runs": [36227676063, 36228645350, 36229244503]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): emotional absolute tiebreak ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-emotional-absolute-tiebreak-${GITHUB_RUN_ID}"
