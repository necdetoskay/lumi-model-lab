name: Story Harness P4.54 B07 Age25 Generation Offline

on:
  pull_request:
    paths:
      - .github/workflows/story-harness-p454-b07-offline.yml
      - src/story_harness_p454_b07_age25.py
      - tests/test_story_harness_p454_b07_age25.py

permissions:
  contents: read

concurrency:
  group: lumi-p454-b07-source-generation-offline
  cancel-in-progress: true

jobs:
  b07-real-source-mock-only:
    if: ${{ github.event.pull_request.number == 275 && github.head_ref == 'experiment/story-harness-control-plane-v1' }}
    runs-on: [self-hosted, Linux, X64, q25-offline]
    timeout-minutes: 8
    defaults:
      run:
        working-directory: p454-b07-offline-isolated
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: p454-b07-offline-isolated
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove original B07 adult Canon and bounded no-retry Spine/Writer OFFLINE
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_story_harness_p454_b07_age25.py' -v
          python -m src.story_harness_p454_b07_age25 > /tmp/lumi-p454-b07-offline.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/lumi-p454-b07-offline.json'))
          assert r['case_id']=='B07' and r['reader_age']==25
          assert r['source_pack_sha256']=='dbe62430a4a06fe82c3216275b04fdee7f340a7bd4718458d47097fa98fde476'
          assert r['word_targets']=={'min':1800,'max':2800}
          assert r['generation_cost_cap_usd']=='0.35'
          assert r['prior_conservative_budget_reserved_usd']=='2.859558'
          assert r['provider_calls']==0 and r['paid_execution_enabled'] is False
          assert r['production_state_write_authorized'] is False
          print('P454_B07_AGE25_CANON_NO_INFERENCE_GREEN')
          PY
