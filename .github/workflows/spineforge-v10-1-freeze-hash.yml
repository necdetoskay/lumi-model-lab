name: SpineForge v10.1 Freeze Builder

on:
  push:
    branches:
      - experiment/spineforge-v10-1-beat-set-parity
    paths:
      - experiments/freeze/spineforge-v10-1.request

permissions:
  contents: write

jobs:
  freeze:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build v10.1 freeze profile from exact checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          paths = [
              ".github/workflows/spineforge-v10-1.yml",
              "requirements.txt",
              "configs/model_runtime_profiles.yaml",
              "src/spine_context_pack_v1.py",
              "src/spineforge_freeze_verify.py",
              "src/spineforge_v5_contract.py",
              "src/spineforge_v10.py",
              "src/spineforge_v10_contract.py",
              "src/spineforge_v10_structured_call.py",
              "src/spineforge_v10_human_approval.py",
              "src/spineforge_v10_1_case_manifest.py",
              "src/spineforge_v10_1_stage.py",
              "src/spineforge_v10_1_evidence_summary.py",
              "src/spineforge_v6_strict_call.py",
              "src/spineforge_v6_json_schema.py",
              "prompts/spineforge_creative_architect_v5_blueprint.md",
              "prompts/spineforge_structural_compiler_v7_partitioned.md",
              "prompts/spineforge_product_gate_v2_context.md",
              "src/spineforge_v3_contract.py",
              "src/spineforge_v7_contract.py",
              "src/episode_spine_v3_contract.py",
              "src/premise_architect_v2_contract.py",
              "src/reader_profile_v2.py",
              "src/saga_blueprint_contract.py",
              "src/saga_spine_v2_contract.py",
              "src/english_story_pipeline.py",
              "src/generate.py",
              "src/schemas.py",
              "src/model_registry.py",
              "src/model_usage_rollup.py",
          ]

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          profile = {
              "schema_version": "spineforge-runtime-profile.v1",
              "runtime_id": "spineforge.contextpack.v10.1",
              "status": "FROZEN_QUALIFICATION_CANDIDATE",
              "purpose": "Preserve v10 partitioned generation while enforcing final beat-set invariants at the Structural Beats boundary and classifying assembly failures to the earliest owning partition.",
              "runtime": {
                  "generation_runtime": "src/spineforge_v10.py",
                  "generation_topology_same_as_v10": True,
                  "creative_architect_model": "aion-labs/aion-3.5-mini",
                  "creative_prompt": "prompts/spineforge_creative_architect_v5_blueprint.md",
                  "structural_compiler_model": "anthropic/claude-sonnet-5.5",
                  "structural_prompt": "prompts/spineforge_structural_compiler_v7_partitioned.md",
                  "product_gate_model": "openai/gpt-5.6-luna",
                  "product_gate_prompt": "prompts/spineforge_product_gate_v2_context.md",
                  "max_attempts": 3,
                  "max_calls_per_attempt": 5,
                  "parse_retry_per_model_call": 0,
                  "human_review_required_before_story_writer": True,
              },
              "beat_set_policy": {
                  "final_required_phases_at_beats_boundary": True,
                  "required_phases": ["HOOK", "COMPLICATION", "REVERSAL", "DECISION", "CLIMAX", "PAYOFF"],
                  "failure_before_resolution_if_missing": True,
              },
              "failure_owner_policy": {
                  "earliest_owning_partition": True,
                  "unclassified_owner_stops_without_revision_retry": True,
                  "beats_retry_preserves_blueprint_and_frame": True,
                  "resolution_retry_preserves_blueprint_frame_and_beats": True,
              },
              "strict_transport_policy": {
                  "path_aware_schema_sanitizer": True,
                  "required_subset_properties_preflight": True,
                  "sonnet_schema_budget_bytes": 4096,
                  "provider_strict_schema": True,
                  "provider_require_parameters": True,
                  "strict_parse_retry": 0,
              },
              "evidence_policy": {
                  "compact_actions_log_summary_required": True,
                  "full_repo_evidence_required": True,
                  "repo_evidence_path": "experiments/results/spineforge-v10-1/<run_id>",
                  "artifact_upload": "best_effort_only",
              },
              "paid_boundary_policy": {
                  "explicit_authorization_required_for_each_attempt": True,
                  "no_automatic_paid_retry": True,
                  "no_writer_call_inside_spineforge": True,
              },
              "no_code_change_qualification_rule": {
                  "enabled": True,
                  "first_paid_case_starts_only_after_runtime_freeze": True,
                  "runtime_hash_mismatch_invalidates_active_case": True,
                  "runtime_or_prompt_change_requires_new_spineforge_revision": True,
                  "scenario_specific_runtime_patch_counts_as_case_failure": True,
              },
              "runtime_freeze": {
                  "enabled": True,
                  "runtime_revision": "SPINEFORGE-CONTEXTPACK-FROZEN-v10.1",
                  "runtime_source_commit": os.environ["GITHUB_SHA"],
                  "files": [{"path": p, "sha256": sha256(p)} for p in paths],
              },
          }
          out = Path("data/specifications/story_lab/spineforge_runtime_profile_v10_1_beat_set_parity_frozen.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(profile, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "runtime_revision": profile["runtime_freeze"]["runtime_revision"],
              "runtime_source_commit": profile["runtime_freeze"]["runtime_source_commit"],
              "frozen_files": len(paths),
          }, indent=2))
          PY
      - name: Commit freeze profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/specifications/story_lab/spineforge_runtime_profile_v10_1_beat_set_parity_frozen.json
          git commit -m "canon(spineforge-v10.1): freeze beat-set parity runtime"
          git push origin HEAD:experiment/spineforge-v10-1-beat-set-parity
