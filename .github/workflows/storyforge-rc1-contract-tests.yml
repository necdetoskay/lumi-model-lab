name: StoryForge RC1 Contract Tests

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/storyforge-rc1-contract-tests.txt

jobs:
  tests:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run StoryForge RC1 contract tests
        run: PYTHONPATH=. python -m unittest tests.test_storyforge_rc1 -v
