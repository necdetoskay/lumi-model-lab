name: Story v5 Whole Draft Length Sweep

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-v5-length-sweep.txt

permissions:
  contents: write

jobs:
  sweep:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile prototype
        run: python -m py_compile experiments/prototypes/story_v5_whole_draft_prototype.py

      - name: Provider preflight before sweep
        run: python -m src.openrouter_preflight --json

      - name: Run four v5 whole-draft fixtures
        shell: bash
        run: |
          set +e
          mkdir -p runs/story_v5_length_sweep
          OVERALL=0
          run_case() {
            CASE="$1"
            SPEC="$2"
            echo "===== CASE: $CASE ====="
            mkdir -p "runs/story_v5_length_sweep/$CASE"
            PYTHONPATH=. python experiments/prototypes/story_v5_whole_draft_prototype.py               --spec "$SPEC"               --output "runs/story_v5_length_sweep/$CASE/result.json"
            RC=$?
            echo "$RC" > "runs/story_v5_length_sweep/$CASE/exit-code.txt"
            if [ "$RC" -ne 0 ]; then
              OVERALL=1
            fi
          }

          run_case "age5-500-nature" "experiments/specs/v5-whole-draft/age5-500-nature.yaml"
          run_case "age9-1500-exploration" "experiments/specs/v5-whole-draft/age9-1500-exploration.yaml"
          run_case "age12-2800-puzzle" "experiments/specs/v5-whole-draft/age12-2800-puzzle.yaml"
          run_case "adult-4200-world-lore" "experiments/specs/v5-whole-draft/adult-4200-world-lore.yaml"

          echo "$OVERALL" > runs/story_v5_length_sweep/overall-exit-code.txt
          exit 0

      - name: Provider preflight after sweep
        if: always()
        run: python -m src.openrouter_preflight --json

      - name: Archive sweep evidence
        if: always()
        shell: bash
        run: |
          DEST="experiments/results/story-v5-length-sweep/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -R runs/story_v5_length_sweep/. "$DEST/" || true
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "english-story-production.v5-whole-draft-prototype",
            "cases": [
              "age5-500-nature",
              "age9-1500-exploration",
              "age12-2800-puzzle",
              "adult-4200-world-lore"
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): story v5 length sweep ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-length-sweep-${GITHUB_RUN_ID}"
