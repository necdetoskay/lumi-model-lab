name: Lighthouse Editorial Offline Preparation

on:
  push:
    branches: [experiment/spineforge-v21-bounded-scene-quality]
    paths:
      - 'src/lighthouse_*.py'
      - 'tests/test_lighthouse_*.py'
      - 'prompts/lighthouse*.md'
      - 'evidence/lighthouse-editorial/**'
      - '.github/workflows/lighthouse-editorial-zero-cost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify approved input and offline routes
        run: |
          python -m pytest -q tests/test_lighthouse_*.py tests/test_spineforge_v21_*.py
          python -m src.lighthouse_writer_once
          python -m src.lighthouse_experiment
          git diff --exit-code -- evidence/lighthouse-editorial/prepared-experiment.json evidence/lighthouse-editorial/writer-input.json
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-offline-${{ github.run_id }}
          path: evidence/lighthouse-editorial/
          if-no-files-found: error
