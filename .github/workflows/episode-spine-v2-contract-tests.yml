name: Episode Spine V2 Contract Tests

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - 'experiments/triggers/episode-spine-v2-contract-tests.txt'

jobs:
  test:
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Episode Spine V2 focused regression
        run: PYTHONPATH=. python -m unittest tests.test_episode_spine_v2
