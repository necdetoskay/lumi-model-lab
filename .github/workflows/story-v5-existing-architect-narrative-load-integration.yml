name: Story v5 Existing Architect Narrative Load Integration

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - .github/workflows/story-v5-existing-architect-narrative-load-integration.yml
      - experiments/prototypes/story_v5_existing_architect_narrative_load_integration_20260926.py
      - experiments/triggers/story-v5-existing-architect-narrative-load-integration.txt
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile integration probe
        run: python -m py_compile experiments/prototypes/story_v5_existing_architect_narrative_load_integration_20260926.py

      - name: Provider preflight
        run: python -m src.openrouter_preflight --json

      - name: Run existing architect narrative-load A/B
        run: PYTHONPATH=. python experiments/prototypes/story_v5_existing_architect_narrative_load_integration_20260926.py

      - name: Archive evidence
        if: always()
        shell: bash
        run: |
          test -s runs/story-v5-existing-architect-narrative-load-integration/result.json
          DEST="experiments/results/story-v5-existing-architect-narrative-load-integration/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-v5-existing-architect-narrative-load-integration/* "$DEST/"
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "story-v5-existing-architect-narrative-load-integration-v1",
            "goal": "fold narrative-load policy into existing Narrative Architect",
            "extra_planner_model_hop": false,
            "architect": "openai/gpt-5.6-sol",
            "writer": "anthropic/claude-sonnet-5",
            "judge": "openai/gpt-5.6-sol",
            "exact_age": 4,
            "target_words": 500,
            "fixtures": 3,
            "order_swapped": true
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): existing architect narrative load ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-existing-architect-narrative-load-${GITHUB_RUN_ID}"
