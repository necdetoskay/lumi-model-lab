name: Mistral Small 4 One Story Smoke

permissions:
  contents: write

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/mistral-small4-one-story-smoke.txt

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Provider preflight
        run: python -m src.openrouter_preflight --json --min-remaining 0.25
      - name: Run one story end to end
        run: PYTHONPATH=. python experiments/prototypes/mistral_small4_one_story_smoke_20260926.py
      - name: Archive evidence
        if: always()
        run: |
          test -s runs/story-spine-refined-recipe/result.json
          DEST="experiments/results/mistral-small4-one-story-smoke/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story-spine-refined-recipe/result.json "$DEST/result.json"
          cp runs/story-spine-refined-recipe/draft.txt "$DEST/draft.txt"
          cp runs/story-spine-refined-recipe/final.txt "$DEST/final.txt"
          cp runs/story-spine-refined-recipe/spine.txt "$DEST/spine.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(story): Mistral Small 4 one-story smoke ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/mistral-small4-one-story-smoke-${GITHUB_RUN_ID}"
