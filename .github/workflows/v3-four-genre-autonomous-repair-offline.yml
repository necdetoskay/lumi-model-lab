name: Final V3 Four-Genre Autonomous Repair Offline Qualification
on:
  push:
    branches: [experiment/v3-four-genre-autonomous-repair-20261015]
    paths: [experiments/triggers/v3-four-genre-autonomy-offline-20261015.json]

permissions:
  contents: read

concurrency:
  group: lumi-final-v3-four-genre-offline-20261015
  cancel-in-progress: false

jobs:
  four-genre-model-only-repair-preflight:
    if: >-
      github.ref == 'refs/heads/experiment/v3-four-genre-autonomous-repair-20261015' &&
      contains(github.event.head_commit.message, '[V3-FOUR-GENRE-OFFLINE]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 676852ed1e6384cb721d12e1ecf9e926fb116242
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-only dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify 43 frozen runtime files and all 241 tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m src.frozen_lane_verify --profile data/specifications/story_lab/age18_story_lane_profile_v2_frozen.json
          PYTHONPATH=. python -B -m pytest -q \
            tests/test_v3_four_genre_autonomy_router.py \
            tests/test_v3_f2_g2_readonly_authority_probe.py \
            tests/test_v3_f2_g2_state_commit_preview.py \
            tests/test_v3_f2_world_outcome_offline_replay.py \
            tests/test_v3_f2_world_outcome_one_judge.py \
            tests/test_v3_f2_world_outcome_evidence_gate.py \
            tests/test_v3_f2_final_delivery_stage.py \
            tests/test_v3_f2_turkish_sol_adjudication_once.py \
            tests/test_v3_f2_turkish_translation_and_fidelity_once.py \
            tests/test_v3_f2_quality_luna_recheck_probe.py \
            tests/test_v3_real_model_repair_evidence.py \
            tests/test_v3_f2_autonomous_quality_probe.py \
            tests/test_v3_unattended_quality_model_adapter.py \
            tests/test_v3_unattended_story_quality.py \
            tests/test_v3_aion_f2_writer_single_attempt_probe.py \
            tests/test_v3_single_attempt_aion_writer_guard.py \
            tests/test_v3_single_attempt_guard.py \
            tests/test_age18_frozen_lane_v1.py \
            tests/test_frozen_lane_generic_spine_runtime.py \
            tests/test_age18_lane_stabilization_matrix.py \
            tests/test_sonnet55_cross_age_matrix.py \
            tests/test_story_lane_qualification_policy.py \
            tests/test_frozen_lane_authority_gate.py \
            tests/test_frozen_lane_repair_runtime.py \
            tests/test_frozen_lane_translation_runtime.py \
            tests/test_deterministic_translation_semantic_guards.py
      - name: Independently regenerate four cases' offline preflight
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=. PYTHONDONTWRITEBYTECODE=1
          python -B -m experiments.v3_four_genre_autonomy_router --out-dir "$RUNNER_TEMP/four-genre-offline"
          cmp "$RUNNER_TEMP/four-genre-offline/qualification-preflight.json" evidence/v3-four-genre-autonomy-preflight-20261015/qualification-preflight.json
          export PROOF="$RUNNER_TEMP/four-genre-offline/qualification-preflight.json"
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ["PROOF"]).read_text())
          assert r["status"]=="DATA_READY_OFFLINE_NO_PROVIDER_RUNS"
          assert r["case_count"]==4
          assert r["new_paid_provider_posts"]==0
          assert r["allowed_manual_prose_repairs"]==0
          assert r["all_repair_model_only"] is True
          assert r["human_spine_approval_is_separate_from_story_repair"] is True
          assert all(not c["actual_story_generated"] for c in r["cases"])
          print("FOUR_CASES_NO_MANUAL_REPAIR_NO_FAKE_STORY_RUNS")
          PY
      - name: Preserve offline preflight proof
        uses: actions/upload-artifact@v4
        with:
          name: lumi-v3-four-genre-autonomy-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/four-genre-offline/
          if-no-files-found: error
          retention-days: 90
