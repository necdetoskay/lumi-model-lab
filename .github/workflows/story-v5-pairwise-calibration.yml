name: Story v5 Pairwise Calibration

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-v5-pairwise-calibration.txt

permissions:
  contents: write

jobs:
  pairwise:
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile pairwise judge
        run: python -m py_compile experiments/prototypes/story_pairwise_judge_v1.py

      - name: Provider preflight
        run: python -m src.openrouter_preflight --json

      - name: Run blind order-swapped pairwise calibration
        run: |
          mkdir -p runs/story_v5_pairwise
          PYTHONPATH=. python experiments/prototypes/story_pairwise_judge_v1.py             --spec experiments/specs/v5-whole-draft/age9-1500-exploration.yaml             --story-a experiments/pairwise_inputs/lantern-map-a-normalized-1410.txt             --story-b experiments/pairwise_inputs/lantern-map-b-first-draft-1783.txt             --output runs/story_v5_pairwise/result.json

      - name: Archive pairwise evidence
        if: always()
        shell: bash
        run: |
          DEST="experiments/results/story-v5-pairwise/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp runs/story_v5_pairwise/result.json "$DEST/result.json" || true
          cat > "$DEST/run-meta.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "protocol": "story-pairwise-judge.v1",
            "judge": "anthropic/claude-sonnet-5"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(experiment): story v5 pairwise calibration ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/story-v5-pairwise-${GITHUB_RUN_ID}"
