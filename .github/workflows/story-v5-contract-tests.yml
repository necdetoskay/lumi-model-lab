name: Story v5 Contract Tests

on:
  push:
    branches:
      - experiment/story-v5-whole-draft-prototype-20260924
    paths:
      - experiments/triggers/story-v5-contract-tests.txt
      - configs/story_acceptance_profiles/tr_age4.v2.candidate.json
      - configs/story_planner_profiles/tr_age4_narrative_load.v1.candidate.json
      - configs/story_planner_profiles/tr_age4_narrative_load.v1.json
      - configs/story_defect_detection/tr_age4.v1.json
      - experiments/fixtures/story_defect_corpus_v1.seed.json
      - experiments/fixtures/story_defect_source_pool.tr-age4.v1.json
      - src/story_publication_acceptance.py
      - src/story_narrative_load_plan.py
      - src/story_defect_detection.py
      - src/story_defect_benchmark.py
      - src/story_defect_corpus.py
      - tests/test_story_publication_acceptance_v2.py
      - tests/test_story_narrative_load_plan.py
      - tests/test_story_defect_detection.py
      - tests/test_story_defect_corpus.py
      - .github/workflows/story-v5-contract-tests.yml

jobs:
  contracts:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run v5 deterministic contract tests
        run: |
          PYTHONPATH=. python -m unittest -v \
            tests.test_story_v5_prototype_contracts \
            tests.test_story_v5_state_commit_simulator \
            tests.test_story_publication_acceptance_v2 \
            tests.test_story_narrative_load_plan \
            tests.test_story_defect_detection \
            tests.test_story_defect_corpus \
            tests.test_model_runtime_profiles
