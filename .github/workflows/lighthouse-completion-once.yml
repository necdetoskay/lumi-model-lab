name: Lighthouse Budgeted Single Story Completion
on:
  push:
    branches: [experiment/spineforge-v21-bounded-scene-quality]
    paths:
      - '.github/workflows/lighthouse-completion-once.yml'
      - 'evidence/lighthouse-editorial/patch-campaign-authorization.json'
permissions:
  contents: read
concurrency:
  group: lighthouse-single-story-completion
  cancel-in-progress: false
jobs:
  complete-story:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[LIGHTHOUSE-COMPLETION-01]')
    runs-on: [self-hosted, local-runner-pool]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify bounded repair and frozen source
        run: |
          python -m pytest -q tests/test_lighthouse_*.py tests/test_spineforge_v21_*.py
          python -m src.lighthouse_patch_campaign
          git diff --exit-code -- evidence/lighthouse-editorial/patch-campaign-prepared.json
      - name: Complete one saved story within authorized total budget
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.lighthouse_patch_campaign --execute
      - name: Preserve all budget and patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-completion-${{ github.run_id }}
          path: evidence/lighthouse-patch-campaign/
          if-no-files-found: warn
